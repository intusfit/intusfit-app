<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0b0f">
<title>CDD Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="cdd.css?v=20261029a">
</head>
<body>
<div id="app"></div>
<script src="cdd.js?v=20261029a"></script>
<script>
(function () {
  var $app = document.getElementById('app');
  var esc = CDD.esc;
  var aba = 'resumo';
  var cache = { conteudo: null, alunas: null };
  CDD.tema();

  function msg(t, tipo) { return t ? '<div class="msg ' + (tipo || 'erro') + '">' + esc(t) + '</div>' : ''; }
  function $(id) { return document.getElementById(id); }

  function modal(html, aoAbrir) {
    var m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = '<div class="caixa">' + html + '</div>';
    m.addEventListener('mousedown', function (e) { if (e.target === m) m._fecharPedido = true; else m._fecharPedido = false; });
    m.addEventListener('click', function (e) { if (e.target === m && m._fecharPedido) m.remove(); });
    document.body.appendChild(m);
    m.fechar = function () { m.remove(); };
    if (aoAbrir) aoAbrir(m);
    return m;
  }

  /* ---------- entrada ---------- */
  function telaEntrar(aviso, instalar) {
    $app.innerHTML = '<div class="login"><div class="logo"><div class="logo-caixa"><img class="logo-escuro" src="marca/logo-cdd-branca.png" alt=""><img class="logo-claro" src="marca/logo-cdd-preta.png" alt=""></div><span>Painel da equipe</span></div><div class="card"><div class="linha" style="justify-content:flex-end"><button class="iconbtn" data-tema-btn aria-label="Alternar tema"></button></div><h2 style="margin-bottom:6px">' + (instalar ? 'Primeiro acesso' : 'Entrar') + '</h2>' +
      (instalar ? '<p class="mut">Crie o administrador do CDD. Só o e-mail do dono pode fazer isto, uma única vez.</p>' : '') +
      '<div id="aviso">' + msg(aviso) + '</div><form id="f">' + (instalar ? '<label for="no">Nome</label><input id="no" required maxlength="160">' : '') +
      '<label for="em">E-mail</label><input id="em" type="email" autocomplete="username" required>' +
      '<label for="se">Senha' + (instalar ? ' (mínimo 8 caracteres)' : '') + '</label><input id="se" type="password" autocomplete="' + (instalar ? 'new-password' : 'current-password') + '" minlength="' + (instalar ? 8 : 1) + '" required>' +
      '<div class="espaco"></div><button class="btn pri" style="width:100%" id="ok">' + (instalar ? 'Criar administrador' : 'Entrar') + '</button></form>' +
      '<p class="sep"><a href="#" id="alt">' + (instalar ? 'Já instalei, quero entrar' : 'Primeiro acesso (instalação)') + '</a></p></div></div>';
    $app.querySelectorAll('[data-tema-btn]').forEach(function (b) { b.onclick = function () { CDD.alternarTema(); }; }); CDD.aplicarMeta();
    $('alt').onclick = function (e) { e.preventDefault(); telaEntrar('', !instalar); };
    $('f').onsubmit = async function (e) {
      e.preventDefault(); $('ok').disabled = true;
      var body = { email: $('em').value, senha: $('se').value }; if (instalar) body.nome = $('no').value;
      var r = await CDD.api(instalar ? 'instalar' : 'login', { body: body });
      $('ok').disabled = false;
      if (!r.ok) { $('aviso').innerHTML = msg(r.data.mensagem); return; }
      if (r.data.usuario.papel !== 'admin') { CDD.guardar(r.data.token); await CDD.api('logout', { body: {} }); CDD.guardar(''); $('aviso').innerHTML = msg('Esta área é só da equipe do CDD.'); return; }
      CDD.guardar(r.data.token); iniciar();
    };
  }

  var CAPAS_PRONTAS = [['comece-por-aqui', 'Comece por aqui'], ['avaliacoes', 'Avaliações e controle de resultados'], ['antes-de-treinar', 'Assista antes de treinar'], ['alongamentos', 'Alongamentos estéticos e funcionais'],
    ['protocolo-1', 'Protocolo #1 Fase adaptativa'], ['protocolo-2', 'Protocolo #2 Ativação metabólica'], ['protocolo-3', 'Protocolo #3 Molécula da Definição'], ['protocolo-4', 'Protocolo #4 Definição Wellness'],
    ['protocolo-5', 'Protocolo #5 Definição Bikini'], ['protocolo-6', 'Protocolo #6 Fase de transição'], ['protocolo-7', 'Protocolo #7 Ativação metabólica 2.0'], ['protocolo-8', 'Protocolo #8 Molécula da Definição 2.0'],
    ['protocolo-9', 'Protocolo #9 Definição Wellness 2.0'], ['protocolo-10', 'Protocolo #10 Definição Fit Model'], ['lives-exclusivas', 'Lives e aulas exclusivas'], ['codigo-alimentacao', 'Código da Alimentação'],
    ['cintura-de-atleta', 'Cintura de Atleta'], ['mente-definida', 'Programa Mente Definida'], ['treinos-em-casa', 'Treinos em casa'], ['marlene-mariano', 'Método Marlene Mariano'], ['treinos-ao-vivo', 'Treinos ao vivo'],
    ['pos-pascoa', 'Desafio Pós Páscoa'], ['21-dias-verao', '21 Dias para o Verão'], ['desafio-carnaval', 'Desafio de Carnaval'], ['ceia-de-natal', 'Ceia de Natal 21 dias'], ['bbb-2024', 'BBB 2024']];

  /* ---------- esqueleto ---------- */
  var ABAS = [['resumo', '📊', 'Resumo'], ['alunas', '👩', 'Alunas'], ['vendas', '💰', 'Vendas'], ['leads', '🎯', 'Leads'], ['atendimento', '💬', 'Atendimento'], ['conteudo', '🎬', 'Conteúdo'], ['exercicios', '🏋️', 'Exercícios'], ['comentarios', '💬', 'Comentários'], ['anamneses', '📝', 'Anamneses'], ['conta', '⚙️', 'Ajustes']];
  function esqueleto() {
    var atual = ABAS.filter(function (x) { return x[0] === aba; })[0];
    $app.innerHTML = '<div class="pn"><aside class="pn-menu" id="menu"><div class="logo-caixa"><img class="logo-escuro" src="marca/logo-cdd-branca.png" alt="CDD"><img class="logo-claro" src="marca/logo-cdd-preta.png" alt="CDD"></div><div class="sub">Painel da equipe</div>' +
      ABAS.map(function (x) { return '<button class="it' + (aba === x[0] ? ' on' : '') + '" data-aba="' + x[0] + '"><span class="e">' + x[1] + '</span>' + x[2] + '</button>'; }).join('') +
      '<div class="rod"><a class="btn" href="index.html" target="_blank" rel="noopener">👀 Ver como aluna</a><a class="btn" href="https://intusfit.com.br/app/painel/index.html">⬅ Painel da Intus</a><button class="btn perigo" id="sai">Sair</button></div></aside>' +
      '<div class="pn-fundo" id="fundo"></div><div class="pn-corpo"><div class="pn-cab"><div class="linha"><button class="iconbtn pn-burger" id="bg" aria-label="Menu">☰</button><h1>' + atual[1] + ' ' + atual[2] + '</h1></div><div class="acoes"><button class="iconbtn" data-tema-btn aria-label="Alternar tema"></button></div></div><div class="pn-cont" id="v"></div></div></div>';
    $app.querySelectorAll('[data-aba]').forEach(function (b) { b.onclick = function () { aba = b.getAttribute('data-aba'); render(); }; });
    $('sai').onclick = async function () { await CDD.api('logout', { body: {} }); CDD.guardar(''); telaEntrar(); };
    function menu(on) { $('menu').classList.toggle('aberto', on); $('fundo').classList.toggle('on', on); }
    $('bg').onclick = function () { menu(true); }; $('fundo').onclick = function () { menu(false); };
    $app.querySelectorAll('[data-tema-btn]').forEach(function (b) { b.onclick = function () { CDD.alternarTema(); }; });
    CDD.aplicarMeta();
  }
  function render() { esqueleto(); ({ resumo: abaResumo, alunas: abaAlunas, vendas: abaVendas, leads: abaLeads, atendimento: abaAtendimento, conteudo: abaConteudo, exercicios: abaExercicios, comentarios: abaComentarios, anamneses: abaAnamneses, conta: abaConta })[aba](); window.scrollTo(0, 0); }

  /* ---------- resumo ---------- */
  async function abaResumo() {
    var v = $('v'); v.innerHTML = '<div class="vazio">Carregando...</div>';
    var r = await CDD.api('a_resumo');
    if (!r.ok) { v.innerHTML = msg(r.data.mensagem); return; }
    var d = r.data;
    function n(rot, val, emoji) { return '<div class="card"><div style="font-size:22px">' + (emoji || '') + '</div><div style="font-size:28px;font-weight:800">' + val + '</div><div class="mut">' + rot + '</div></div>'; }
    v.innerHTML = '<div class="kpis">' + n('alunas', d.alunas, '👩') + n('matrículas ativas', d.matriculas_ativas, '✅') + n('contas sem matrícula', d.sem_matricula, '⏳') +
      n('módulos', d.modulos, '📚') + n('aulas', d.aulas, '🎬') + n('aulas sem vídeo', d.aulas_sem_video, '⚠️') + n('aulas escondidas (rascunho)', d.rascunhos, '🙈') + n('comentários sem resposta', d.comentarios_sem_resposta, '💬') + n('treinos em 7 dias', d.treinos_7_dias, '🏋️') + n('alunas treinando em 7 dias', d.alunas_treinaram_7_dias, '🔥') + '</div>' +
      '<div class="card" style="margin-top:12px"><h3>Cadastro aberto</h3><p class="mut">Quando aberto, qualquer mulher pode criar conta pela página inicial. Ela só vê o conteúdo depois que você liberar a matrícula.</p><div class="espaco"></div>' +
      '<label class="chk"><input type="checkbox" id="ca"' + (d.cadastro_aberto ? ' checked' : '') + '><span>Permitir que novas alunas criem conta sozinhas</span></label></div>' +
      '<div class="card"><h3>Importar conteúdo da Nutror</h3><p class="mut">Cria os módulos, aulas, vídeos, links, fichas de treino, capas e a base de exercícios levantados na Nutror e nas planilhas. Inclui o que está escondido das alunas: módulos e aulas ocultas entram como rascunho e só você vê no painel. Pode rodar de novo sem duplicar nada: só acrescenta o que falta e nunca apaga nem sobrescreve o que você já editou.</p><div class="espaco"></div>' +
      '<button class="btn pri" id="imp">Importar conteúdo</button><div id="impr"></div></div>' +
      '<div class="card"><h3>Como liberar uma aluna</h3><ol class="mut" style="padding-left:20px"><li>Em <b>Alunas</b>, clique em <b>Nova aluna</b>, com a opção de matricular marcada.</li><li>Copie o link de acesso que aparece e mande pelo WhatsApp.</li><li>Ela cria a senha e já entra no conteúdo.</li></ol></div>';
    $('ca').onchange = async function () { await CDD.api('a_config', { body: { cadastro_aberto: this.checked } }); };
    $('imp').onclick = async function () {
      this.disabled = true; $('impr').innerHTML = '<p class="mut">Importando...</p>';
      var x = await CDD.api('a_importar_seed', { body: {} });
      this.disabled = false; cache.conteudo = null;
      $('impr').innerHTML = x.ok ? msg('Pronto: ' + x.data.modulos_novos + ' módulos novos, ' + x.data.aulas_novas + ' aulas novas, ' + x.data.aulas_atualizadas + ' aulas com vídeo preenchido, ' + x.data.fichas_novas + ' fichas de treino e ' + x.data.exercicios_novos + ' exercícios novos na base.', 'ok') : msg(x.data.mensagem);
    };
  }

  /* ---------- vendas (ofertas, cupons, pagamentos e a ligação com o gateway) ---------- */
  function brl(n) { return 'R$ ' + (Number(n) || 0).toFixed(2).replace('.', ','); }
  var RES_TXT = { aluna_criada_email_enviado: 'aluna criada, e-mail enviado', aluna_criada_email_falhou: 'aluna criada, e-mail NÃO saiu (use o link)', liberada_email_enviado: 'liberada, e-mail enviado', liberada_email_falhou: 'liberada, e-mail NÃO saiu (use o link)',
    renovada: 'renovada', duplicado: 'repetido (ignorado)', produto_desconhecido: 'outro produto (ignorado)', oferta_inativa: 'oferta desligada', suspensa_por_reembolso: 'reembolso, acesso suspenso', assinatura_cancelada: 'assinatura cancelada', cobranca_atrasada: 'cobrança atrasada',
    sem_email: 'sem e-mail válido (verificar)', aluna_nao_encontrada: 'aluna não encontrada', ignorado: 'ignorado', recebido: 'recebido' };
  async function abaVendas() {
    var v = $('v'); v.innerHTML = '<div class="vazio">Carregando...</div>';
    var rs = await Promise.all([CDD.api('a_com_painel'), CDD.api('a_com_ofertas'), CDD.api('a_com_cupons'), CDD.api('a_com_pagamentos')]);
    if (!rs[0].ok) { v.innerHTML = msg(rs[0].data.mensagem); return; }
    var p = rs[0].data, ofertas = rs[1].data.ofertas || [], cupons = rs[2].data.cupons || [], pags = rs[3].data.pagamentos || [];
    function n(rot, val, emoji) { return '<div class="card"><div style="font-size:22px">' + emoji + '</div><div style="font-size:26px;font-weight:800">' + val + '</div><div class="mut">' + rot + '</div></div>'; }
    var gw = p.gateways.eduzz3;
    var h = '<div class="kpis">' + n('vendas nos últimos 30 dias', p.vendas_30d, '🛒') + n('receita nos últimos 30 dias', brl(p.receita_30d), '💰') + n('reembolsos (30 dias)', p.reembolsos_30d, '↩️') + n('matrículas ativas', p.matriculas_ativas, '✅') + n('vencem em 7 dias', p.vencendo_7d, '⏰') + '</div>';
    h += '<div class="card" style="margin-top:12px"><h3>Ligação com o Eduzz (cadastro e liberação automáticos)</h3>' +
      '<p class="mut">Quando uma venda é paga, a aluna é cadastrada, a matrícula é liberada e ela recebe o link para criar a senha. Reembolso suspende o acesso. No Eduzz, abra o <b>Developer Hub &gt; Webhooks</b> (o cadastro antigo foi desativado), crie um webhook com o endereço abaixo, marque os eventos de <b>fatura</b> (paga, reembolsada) e de <b>contrato</b> (criado, atualizado), gere uma <b>chave secreta</b> e cole a mesma chave aqui.</p>' +
      '<label>Endereço para o Eduzz chamar</label><div class="copiavel"><input id="gw-url" readonly value="' + esc(location.origin + location.pathname.replace(/\/[^\/]*$/, '') + '/api/api.php?a=webhook&g=eduzz3') + '"><button class="btn" id="gw-cp">Copiar</button></div>' +
      '<div class="espaco"></div><label>Chave secreta do webhook (Eduzz) ' + (gw.segredo_cadastrado ? '<span class="tag ok">cadastrado</span>' : '<span class="tag erro">falta cadastrar</span>') + '</label>' +
      '<div class="linha"><input id="gw-seg" type="password" autocomplete="new-password" placeholder="' + (gw.segredo_cadastrado ? 'Cadastrada (cole uma nova para trocar)' : 'Cole aqui a chave') + '"><button class="btn pri" id="gw-sv">Salvar</button></div><div id="gw-msg"></div></div>';
    h += '<div class="card"><div class="linha" style="justify-content:space-between"><h3>Ofertas (o que se vende)</h3><div class="linha"><button class="btn peq" id="of-pad">Carregar padrão do Eduzz</button><button class="btn peq pri" id="of-nova">Nova oferta</button></div></div>' +
      '<p class="mut">Cada oferta liga um produto do gateway à duração do acesso. Produto que não está aqui é ignorado (o Eduzz avisa de todos os produtos da conta).</p>';
    h += ofertas.length ? '<div class="tbl"><table><thead><tr><th>Oferta</th><th>Código no gateway</th><th>Acesso</th><th>Valor</th><th>Situação</th><th></th></tr></thead><tbody>' + ofertas.map(function (o) {
      return '<tr><td><b>' + esc(o.nome) + '</b>' + (o.link ? '<div class="mut"><a href="' + esc(o.link) + '" target="_blank" rel="noopener">link de venda</a></div>' : '') + '</td><td class="num">' + esc(o.gateway) + ' ' + esc(o.ref_gateway) + '</td><td class="num">' + o.meses + (o.meses === 1 ? ' mês' : ' meses') + '</td><td class="num">' + (o.valor === null ? '' : brl(o.valor)) + '</td><td><span class="tag ' + (o.ativo ? 'ok' : '') + '">' + (o.ativo ? 'vendendo' : 'desligada') + '</span></td><td><button class="btn peq" data-of="' + o.idoferta + '">Editar</button></td></tr>';
    }).join('') + '</tbody></table></div>' : '<div class="vazio">Nenhuma oferta ainda. Use "Carregar padrão do Eduzz".</div>';
    h += '</div>';
    h += '<div class="card"><div class="linha" style="justify-content:space-between"><h3>Cupons de desconto</h3><button class="btn peq pri" id="cp-novo">Novo cupom</button></div>' +
      '<p class="mut">O desconto é aplicado no checkout do gateway: o cupom precisa existir lá com o mesmo código. Aqui ele fica no catálogo e as vendas pagas com ele são contadas.</p>';
    h += cupons.length ? '<div class="tbl"><table><thead><tr><th>Código</th><th>Desconto</th><th>Oferta</th><th>Validade</th><th>Vendas</th><th>Situação</th><th></th></tr></thead><tbody>' + cupons.map(function (c) {
      return '<tr><td><b>' + esc(c.codigo) + '</b>' + (c.obs ? '<div class="mut">' + esc(c.obs) + '</div>' : '') + '</td><td class="num">' + (c.tipo === 'percentual' ? c.valor + '%' : brl(c.valor)) + '</td><td>' + esc(c.oferta || 'todas') + '</td><td class="num">' + (c.validade ? CDD.dataBR(c.validade) : 'sem fim') + '</td><td class="num">' + c.usos + '</td><td><span class="tag ' + (c.ativo ? 'ok' : '') + '">' + (c.ativo ? 'ativo' : 'desligado') + '</span></td><td><button class="btn peq" data-cp="' + c.idcupom + '">Editar</button></td></tr>';
    }).join('') + '</tbody></table></div>' : '<div class="vazio">Nenhum cupom.</div>';
    h += '</div>';
    h += '<div class="card"><h3>Pagamentos recentes</h3>' + (pags.length ? '<div class="tbl"><table><thead><tr><th>Aluna</th><th>Oferta</th><th>Valor</th><th>Forma</th><th>Cupom</th><th>Data</th><th>Situação</th></tr></thead><tbody>' + pags.map(function (x) {
      return '<tr><td><b>' + esc(x.nome || '') + '</b><div class="mut">' + esc(x.email || '') + '</div></td><td>' + esc(x.oferta || '') + '</td><td class="num">' + brl(x.valor) + '</td><td>' + esc(x.forma || '') + '</td><td>' + esc(x.cupom || '') + '</td><td class="num">' + (x.pago_em ? CDD.dataBR(x.pago_em) : '') + '</td><td><span class="tag ' + (x.status === 'pago' ? 'ok' : 'erro') + '">' + esc(x.status) + '</span></td></tr>';
    }).join('') + '</tbody></table></div>' : '<div class="vazio">Nenhum pagamento recebido ainda.</div>') + '</div>';
    h += '<div class="card"><h3>Últimos avisos do gateway</h3>' + (p.eventos.length ? '<div class="tbl"><table><thead><tr><th>Quando</th><th>Tipo</th><th>Resultado</th></tr></thead><tbody>' + p.eventos.map(function (e) {
      return '<tr><td class="num">' + esc(e.criado_em) + '</td><td>' + esc(e.tipo) + ' (' + esc(e.origem) + ')</td><td>' + esc(RES_TXT[e.resultado] || e.resultado || '') + '</td></tr>';
    }).join('') + '</tbody></table></div>' : '<div class="vazio">Nenhum aviso recebido ainda.</div>') + '</div>';
    v.innerHTML = h;

    $('gw-cp').onclick = function () { var i = $('gw-url'); i.select(); try { document.execCommand('copy'); } catch (e) {} this.textContent = 'Copiado'; };
    $('gw-sv').onclick = async function () {
      var x = await CDD.api('a_com_gateway', { body: { gateway: 'eduzz3', segredo: $('gw-seg').value.trim() } });
      $('gw-msg').innerHTML = x.ok ? msg('Chave salva. Ela não aparece mais em nenhum lugar.', 'ok') : msg(x.data.mensagem); if (x.ok) setTimeout(abaVendas, 900);
    };
    $('of-pad').onclick = async function () { var x = await CDD.api('a_com_padroes', { body: {} }); if (x.ok) abaVendas(); else alert(x.data.mensagem); };
    $('of-nova').onclick = function () { editarOferta(null); };
    $('cp-novo').onclick = function () { editarCupom(null, ofertas); };
    var oPorId = {}; ofertas.forEach(function (o) { oPorId[o.idoferta] = o; });
    var cPorId = {}; cupons.forEach(function (c) { cPorId[c.idcupom] = c; });
    v.querySelectorAll('[data-of]').forEach(function (b) { b.onclick = function () { editarOferta(oPorId[b.getAttribute('data-of')]); }; });
    v.querySelectorAll('[data-cp]').forEach(function (b) { b.onclick = function () { editarCupom(cPorId[b.getAttribute('data-cp')], ofertas); }; });
  }
  function editarOferta(o) {
    o = o || { idoferta: 0, nome: '', gateway: 'eduzz', ref_gateway: '', meses: 1, valor: '', link: '', ativo: 1 };
    modal('<h3>' + (o.idoferta ? 'Editar oferta' : 'Nova oferta') + '</h3><label>Nome</label><input id="o-nome" value="' + esc(o.nome) + '">' +
      '<div class="linha"><div style="flex:1"><label>Gateway</label><input id="o-gw" value="' + esc(o.gateway) + '"></div><div style="flex:1"><label>Código do produto no gateway</label><input id="o-ref" value="' + esc(o.ref_gateway) + '"></div></div>' +
      '<div class="linha"><div style="flex:1"><label>Duração do acesso (meses)</label><input id="o-me" type="number" min="1" max="60" value="' + o.meses + '"></div><div style="flex:1"><label>Valor (R$)</label><input id="o-va" value="' + (o.valor === null ? '' : o.valor) + '"></div></div>' +
      '<label>Link de venda</label><input id="o-li" value="' + esc(o.link || '') + '"><label class="chk"><input type="checkbox" id="o-at"' + (o.ativo ? ' checked' : '') + '><span>Oferta ligada (venda paga libera a aluna)</span></label><div id="o-msg"></div>' +
      '<div class="linha" style="margin-top:12px"><button class="btn pri" id="o-ok">Salvar</button><button class="btn" id="o-fx">Cancelar</button></div>', function (m) {
      m.querySelector('#o-fx').onclick = m.fechar;
      m.querySelector('#o-ok').onclick = async function () {
        var x = await CDD.api('a_com_ofertas', { body: { idoferta: o.idoferta, nome: m.querySelector('#o-nome').value, gateway: m.querySelector('#o-gw').value.trim().toLowerCase(), ref_gateway: m.querySelector('#o-ref').value.trim(), meses: parseInt(m.querySelector('#o-me').value, 10), valor: m.querySelector('#o-va').value, link: m.querySelector('#o-li').value, ativo: m.querySelector('#o-at').checked } });
        if (!x.ok) { m.querySelector('#o-msg').innerHTML = msg(x.data.mensagem); return; } m.fechar(); abaVendas();
      };
    });
  }
  function editarCupom(c, ofertas) {

      m.querySelector('#f').onsubmit = async function (ev) {
        ev.preventDefault();
        var r = await CDD.api('a_exercicio_salvar', { body: { idexercicio: e ? e.idexercicio : 0, nome: m.querySelector('#e1').value, grupo: m.querySelector('#e2').value, equipamento: m.querySelector('#e3').value, video: m.querySelector('#e4').value, descricao: m.querySelector('#e5').value } });
        if (!r.ok) { m.querySelector('#aviso').innerHTML = msg(r.data.mensagem); return; }
        cache.exs = null; m.fechar(); depois();
      };
      if (e) m.querySelector('#ex').onclick = async function () {
        if (!confirm('Excluir "' + e.nome + '" da base? As fichas que usam este nome continuam funcionando, só perdem o vídeo da base.')) return;
        await CDD.api('a_exercicio_excluir', { body: { idexercicio: e.idexercicio } }); cache.exs = null; m.fechar(); depois();
      };
    });
  }

  /* ---------- comentários ---------- */
  async function abaComentarios() {
    var v = $('v');
    v.innerHTML = '<div class="linha" style="justify-content:space-between;margin-bottom:10px"><h2>Comentários</h2><div class="linha"><button class="btn peq pri" id="f1">Sem resposta</button><button class="btn peq" id="f2">Todos</button></div></div><div id="lista"><div class="vazio">Carregando...</div></div>';
    var filtro = 'sem_resposta';
    function marca() { $('f1').classList.toggle('pri', filtro === 'sem_resposta'); $('f2').classList.toggle('pri', filtro === 'todos'); }
    $('f1').onclick = function () { filtro = 'sem_resposta'; carregar(); }; $('f2').onclick = function () { filtro = 'todos'; carregar(); };
    async function carregar() {
      marca();
      var r = await CDD.api('a_comentarios', { q: { filtro: filtro } });
      if (!r.ok) { $('lista').innerHTML = msg(r.data.mensagem); return; }
      var l = r.data.comentarios;
      if (!l.length) { $('lista').innerHTML = '<div class="card vazio">' + (filtro === 'sem_resposta' ? 'Nenhum comentário esperando resposta.' : 'Nenhum comentário ainda.') + '</div>'; return; }
      $('lista').innerHTML = l.map(function (c) {
        return '<div class="card"><div class="mut" style="font-size:13px">' + esc(c.modulo) + ' / ' + esc(c.aula) + '</div><div style="margin:4px 0"><b>' + esc(c.nome) + '</b> <span class="mut">' + esc(c.email) + ' · ' + CDD.dataBR(c.criado_em) + '</span>' + (Number(c.oculto) ? ' <span class="tag aviso">oculto</span>' : '') + '</div>' +
          '<div class="texto" style="white-space:pre-wrap;overflow-wrap:anywhere">' + esc(c.texto) + '</div>' +
          c.respostas.map(function (r2) { return '<div style="margin:8px 0 0 14px;padding-left:10px;border-left:2px solid var(--line)"><b>' + (Number(r2.equipe) ? 'Equipe CDD' : esc(r2.nome)) + '</b> <span class="mut">' + CDD.dataBR(r2.criado_em) + '</span>' + (Number(r2.oculto) ? ' <span class="tag aviso">oculto</span>' : '') + '<div style="white-space:pre-wrap;overflow-wrap:anywhere">' + esc(r2.texto) + '</div></div>'; }).join('') +
          '<div class="linha" style="margin-top:10px"><button class="btn peq pri" data-re="' + c.idcomentario + '">Responder</button><button class="btn peq" data-oc="' + c.idcomentario + '" data-v="' + (Number(c.oculto) ? 0 : 1) + '">' + (Number(c.oculto) ? 'Mostrar' : 'Ocultar') + '</button></div><div id="rb-' + c.idcomentario + '"></div></div>';
      }).join('');
      $('lista').querySelectorAll('[data-oc]').forEach(function (b) { b.onclick = async function () { await CDD.api('a_comentario_ocultar', { body: { id: parseInt(b.getAttribute('data-oc'), 10), oculto: b.getAttribute('data-v') === '1' } }); carregar(); }; });
      $('lista').querySelectorAll('[data-re]').forEach(function (b) { b.onclick = function () {
        var id = b.getAttribute('data-re'), box = $('rb-' + id);
        if (box.innerHTML) { box.innerHTML = ''; return; }
        box.innerHTML = '<form><textarea maxlength="1000" placeholder="Sua resposta aparece para a aluna como Equipe CDD" style="margin-top:8px"></textarea><div class="linha" style="margin-top:6px"><button class="btn pri peq">Enviar resposta</button></div><div class="ra"></div></form>';
        box.querySelector('form').onsubmit = async function (e) {
          e.preventDefault();
          var x = await CDD.api('a_comentario_responder', { body: { id: parseInt(id, 10), texto: box.querySelector('textarea').value } });
          if (!x.ok) { box.querySelector('.ra').innerHTML = msg(x.data.mensagem); return; }
          carregar();
        };
      }; });
    }
    carregar();
  }

  /* ---------- anamneses ---------- */
  async function abaAnamneses() {
    var v = $('v'); v.innerHTML = '<div class="vazio">Carregando...</div>';
    var r = await CDD.api('a_anamneses');
    if (!r.ok) { v.innerHTML = msg(r.data.mensagem); return; }
    var l = r.data.anamneses;
    if (!l.length) { v.innerHTML = '<div class="card vazio">Nenhuma aluna começou a anamnese ainda. Ela é respondida direto no app. 📝</div>'; return; }
    v.innerHTML = '<div class="tbl"><table><thead><tr><th>Aluna</th><th>Situação</th><th>Enviada em</th><th></th></tr></thead><tbody>' + l.map(function (a) {
      return '<tr><td><b>' + esc(a.nome) + '</b><div class="mut">' + esc(a.email) + '</div></td><td><span class="tag ' + (a.enviado_em ? 'ok' : 'aviso') + '">' + (a.enviado_em ? 'enviada' : 'em andamento') + '</span></td><td class="num">' + (a.enviado_em ? CDD.dataBR(a.enviado_em) : '—') + '</td><td><button class="btn peq" data-an="' + a.idaluna + '">Ver respostas</button></td></tr>';
    }).join('') + '</tbody></table></div>';
    v.querySelectorAll('[data-an]').forEach(function (b) { b.onclick = async function () {
      var x = await CDD.api('a_anamnese', { q: { id: b.getAttribute('data-an') } });
      if (!x.ok) { alert(x.data.mensagem); return; }
      var d = x.data;
      modal('<h3>📝 ' + esc(d.aluna.nome) + '</h3><div class="mut">' + esc(d.aluna.email) + (d.enviado_em ? ' · enviada em ' + CDD.dataBR(d.enviado_em) : ' · ainda não enviada') + '</div>' +
        d.etapas.map(function (e) { return '<h3 style="margin-top:16px">' + e.emoji + ' ' + esc(e.titulo) + '</h3>' + e.itens.map(function (i) { return '<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="mut" style="font-size:12px">' + esc(i.pergunta) + '</div><div style="white-space:pre-wrap;overflow-wrap:anywhere">' + (i.resposta ? esc(i.resposta) : '<span class="mut">sem resposta</span>') + '</div></div>'; }).join(''); }).join('') +
        '<div class="espaco"></div><button class="btn grande" id="fx">Fechar</button>', function (m) { m.querySelector('#fx').onclick = m.fechar; });
    }; });
  }

  /* ---------- conta ---------- */
  function abaConta() {
    $('v').innerHTML = '<div class="card"><h3>Trocar minha senha</h3><div id="aviso"></div><form id="f"><label for="at">Senha atual</label><input id="at" type="password" autocomplete="current-password" required><label for="nv">Nova senha (mínimo 8 caracteres)</label><input id="nv" type="password" autocomplete="new-password" minlength="8" required><div class="espaco"></div><button class="btn pri">Trocar senha</button></form></div>' +
      '<div class="card linha"><button class="btn" id="tm">Alternar tema claro e escuro</button><button class="btn perigo" id="sai">Sair</button></div>';
    $('tm').onclick = CDD.alternarTema;
    $('sai').onclick = async function () { await CDD.api('logout', { body: {} }); CDD.guardar(''); telaEntrar(); };
    $('f').onsubmit = async function (e) {
      e.preventDefault();
      var r = await CDD.api('trocar_senha', { body: { atual: $('at').value, nova: $('nv').value } });
      $('aviso').innerHTML = msg(r.ok ? 'Senha trocada.' : r.data.mensagem, r.ok ? 'ok' : 'erro'); if (r.ok) $('f').reset();
    };
  }

  async function iniciar() {
    // vindo do painel da Intus: #sso=<bilhete> troca por uma sessão de equipe (7 dias) sem pedir senha
    var mh = /[#&]sso=([A-Za-z0-9_.\-]+)/.exec(location.hash || '');
    if (mh) {
      history.replaceState(null, '', location.pathname + location.search);   // o bilhete não fica na barra de endereço
      var rs = await CDD.api('sso', { body: { bilhete: mh[1] } });
      if (rs.ok) CDD.guardar(rs.data.token);
      else return telaEntrar(rs.data && rs.data.mensagem ? rs.data.mensagem : 'Não consegui entrar pelo painel da Intus.');
    }
    if (!CDD.token()) {
      var s = await CDD.api('saude');
      return telaEntrar('', !!(s.ok && s.data.instalacao_aberta));
    }
    var r = await CDD.api('eu');
    if (!r.ok || r.data.usuario.papel !== 'admin') { CDD.guardar(''); return telaEntrar(r.ok ? 'Esta área é só da equipe do CDD.' : ''); }
    render();
  }
  iniciar();
})();
</script>
</body>
</html>
