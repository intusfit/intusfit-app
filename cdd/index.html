<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d0d10">
<link rel="manifest" href="manifest.webmanifest">
<title>Código da Definição</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="cdd.css?v=20261016a">
</head>
<body>
<div id="app"></div>
<script src="cdd.js?v=20261016a"></script>
<script>
(function () {
  var $app = document.getElementById('app');
  var esc = CDD.esc;
  var estado = { eu: null, matricula: null, acesso: false, modulos: null, treinoHoje: null, treinosSemana: 0, inicio: null };
  CDD.tema();

  var IMG2 = '<img class="logo-escuro" src="marca/logo-cdd-branca.png" alt="Código da Definição"><img class="logo-claro" src="marca/logo-cdd-preta.png" alt="Código da Definição">';
  var LOGO = '<div class="logo"><div class="logo-caixa">' + IMG2 + '</div></div>';
  var MARCA = '<a class="marca" href="#/"><span class="marca-img">' + IMG2 + '</span><span class="marca-txt">Código da <small>Definição</small></span></a>';
  var MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

  function msg(t, tipo) { return t ? '<div class="msg ' + (tipo || 'erro') + '">' + esc(t) + '</div>' : ''; }
  function dm(d) { var p = String(d || '').slice(0, 10).split('-'); return p.length === 3 ? parseInt(p[2], 10) + ' ' + MESES[parseInt(p[1], 10) - 1] : ''; }
  function diasAte(d) { var a = new Date(String(d).slice(0, 10) + 'T00:00:00'), h = new Date(); h.setHours(0, 0, 0, 0); return Math.round((a - h) / 86400000); }
  function hojeISO() { var h = new Date(); return h.getFullYear() + '-' + ('0' + (h.getMonth() + 1)).slice(-2) + '-' + ('0' + h.getDate()).slice(-2); }
  function mmss(s) { s = Math.max(0, Math.floor(s)); return ('0' + Math.floor(s / 60)).slice(-2) + ':' + ('0' + (s % 60)).slice(-2); }
  function num(v) { return String(v).replace('.', ','); }
  function curto(t, n) { return t.length > n ? t.slice(0, n) + '...' : t; }
  function norm(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '').slice(0, 200); }

  /* ---------- entrada ---------- */
  function telaLogin(aviso, tipo) {
    $app.innerHTML = '<div class="login">' + LOGO + '<div class="card"><h2 style="margin-bottom:6px">Entrar</h2>' +
      '<div id="aviso">' + msg(aviso, tipo) + '</div>' +
      '<form id="f"><label for="em">E-mail</label><input id="em" type="email" autocomplete="username" required>' +
      '<label for="se">Senha</label><input id="se" type="password" autocomplete="current-password" required>' +
      '<div class="espaco"></div><button class="btn pri" style="width:100%" id="ok">Entrar</button></form>' +
      '<p class="sep">Ainda não tem conta? <a href="#/cadastro">Criar conta</a></p>' +
      '<p class="sep mut">Esqueceu a senha? Peça um novo link de acesso à equipe do CDD.</p></div></div>';
    document.getElementById('f').onsubmit = async function (e) {
      e.preventDefault();
      var b = document.getElementById('ok'); b.disabled = true;
      var r = await CDD.api('login', { body: { email: document.getElementById('em').value, senha: document.getElementById('se').value } });
      b.disabled = false;
      if (!r.ok) { document.getElementById('aviso').innerHTML = msg(r.data.mensagem); return; }
      CDD.guardar(r.data.token); iniciar();
    };
  }

  function telaCadastro(aviso, extra) {
    $app.innerHTML = '<div class="login">' + LOGO + '<div class="card"><h2 style="margin-bottom:6px">Criar conta</h2>' +
      '<p class="mut">O Código da Definição é um programa exclusivo para mulheres.</p>' +
      '<div id="aviso">' + msg(aviso) + (extra || '') + '</div>' +
      '<form id="f"><label for="no">Nome</label><input id="no" autocomplete="name" required maxlength="160">' +
      '<label for="em">E-mail</label><input id="em" type="email" autocomplete="username" required>' +
      '<label for="se">Senha (mínimo 8 caracteres)</label><input id="se" type="password" autocomplete="new-password" minlength="8" required>' +
      '<label for="sx">Sexo</label><select id="sx" required><option value="">Escolha</option><option value="feminino">Feminino</option><option value="masculino">Masculino</option></select>' +
      '<label class="chk"><input type="checkbox" id="ac"><span>Li e aceito os <a href="termos.html" target="_blank" rel="noopener">termos e a política de privacidade</a>.</span></label>' +
      '<button class="btn pri" style="width:100%" id="ok">Criar conta</button></form>' +
      '<p class="sep">Já tem conta? <a href="#/">Entrar</a></p></div></div>';
    document.getElementById('f').onsubmit = async function (e) {
      e.preventDefault();
      var b = document.getElementById('ok'); b.disabled = true;
      var r = await CDD.api('cadastro', { body: { nome: document.getElementById('no').value, email: document.getElementById('em').value, senha: document.getElementById('se').value, sexo: document.getElementById('sx').value, aceite: document.getElementById('ac').checked } });
      b.disabled = false;
      if (r.status === 403 && r.data.error === 'exclusivo_mulheres') {
        document.getElementById('aviso').innerHTML = '<div class="msg aviso">' + esc(r.data.mensagem) + '<div class="espaco"></div><a class="btn pri" href="' + esc(r.data.intus_url) + '" rel="noopener">Conhecer a Intus Fit</a></div>';
        return;
      }
      if (!r.ok) { document.getElementById('aviso').innerHTML = msg(r.data.mensagem); return; }
      CDD.guardar(r.data.token); location.hash = '#/'; iniciar();
    };
  }

  async function telaAtivar(token) {
    $app.innerHTML = '<div class="login">' + LOGO + '<div class="card" id="c">Conferindo o link...</div></div>';
    var r = await CDD.api('ativar_info', { q: { t: token } });
    var c = document.getElementById('c');
    if (!r.ok) { c.innerHTML = msg(r.data.mensagem) + '<p class="sep"><a href="#/">Ir para o login</a></p>'; return; }
    c.innerHTML = '<h2 style="margin-bottom:6px">Olá, ' + esc(r.data.nome) + '</h2><p class="mut">Crie a sua senha para entrar no Código da Definição.</p><div id="aviso"></div>' +
      '<form id="f"><label for="se">Senha (mínimo 8 caracteres)</label><input id="se" type="password" autocomplete="new-password" minlength="8" required>' +
      '<label class="chk"><input type="checkbox" id="ac"><span>Li e aceito os <a href="termos.html" target="_blank" rel="noopener">termos e a política de privacidade</a>.</span></label>' +
      '<button class="btn pri" style="width:100%" id="ok">Criar senha e entrar</button></form>';
    document.getElementById('f').onsubmit = async function (e) {
      e.preventDefault();
      if (!document.getElementById('ac').checked) { document.getElementById('aviso').innerHTML = msg('É preciso aceitar os termos.'); return; }
      var b = document.getElementById('ok'); b.disabled = true;
      var x = await CDD.api('ativar', { body: { token: token, senha: document.getElementById('se').value } });
      b.disabled = false;
      if (!x.ok) { document.getElementById('aviso').innerHTML = msg(x.data.mensagem); return; }
      CDD.guardar(x.data.token); location.hash = '#/'; iniciar();
    };
  }

  /* ---------- estrutura da área da aluna ---------- */
  function topo() {
    return '<div class="topo">' + MARCA + '<nav><a class="btn peq" href="#/conta">Conta</a></nav></div>';
  }
  function navBaixo(ativa) {
    var t = estado.treinoHoje ? '#/treino/' + estado.treinoHoje.idaula : '#/';
    function it(id, href, ic, rot) { return '<a href="' + href + '" class="' + (ativa === id ? 'ativo' : '') + '"><span class="ic">' + ic + '</span>' + rot + '</a>'; }
    return '<div class="nav-baixo">' + it('inicio', '#/', '&#9679;', 'Início') + it('treino', t, '&#9650;', 'Treino') + it('jornada', '#/jornada', '&#9733;', 'Jornada') + '</div>';
  }
  function tela(ativa, conteudo) {
    $app.innerHTML = topo() + '<div class="wrap" id="v">' + (conteudo || '<div class="vazio">Carregando...</div>') + '</div>' + navBaixo(ativa);
    return document.getElementById('v');
  }
  function semAcesso() {
    var m = estado.matricula || {};
    var texto = m.status === 'expirada' ? 'Seu acesso expirou. Fale com a equipe do CDD para renovar.'
      : m.status === 'sem_matricula' ? 'Sua conta está criada. Assim que a equipe liberar a sua matrícula, o conteúdo aparece aqui.'
      : 'Seu acesso está pausado. Fale com a equipe do CDD.';
    return '<div class="card"><h2 style="margin-bottom:8px">Olá, ' + esc((estado.eu.nome || '').split(' ')[0]) + '</h2><div class="msg aviso">' + esc(texto) + '</div></div>';
  }
  function sessaoExpirou(r) { if (r.status === 401) { CDD.guardar(''); estado = { eu: null }; telaLogin('Sua sessão expirou. Entre de novo.', 'aviso'); return true; } return false; }

  async function carregarModulos() {
    var r = await CDD.api('meus_modulos');
    if (sessaoExpirou(r)) return null;
    if (!r.ok) return null;
    estado.modulos = r.data.modulos; estado.treinoHoje = r.data.treino_hoje; estado.treinosSemana = r.data.treinos_semana; estado.inicio = r.data.inicio;
    return estado.modulos;
  }

  function proximaAula() {
    var ms = estado.modulos || [];
    for (var i = 0; i < ms.length; i++) { if (!ms[i].liberado) continue; for (var j = 0; j < ms[i].aulas.length; j++) if (!ms[i].aulas[j].concluida) return ms[i].aulas[j]; }
    return null;
  }

  function cartaoModulo(m) {
    var p = m.total ? Math.round(m.feitas * 100 / m.total) : 0;
    if (!m.liberado) {
      var n = m.libera_em ? diasAte(m.libera_em) : null;
      return '<div class="card mod trancado"><h3><span class="cad">&#128274;</span> ' + esc(m.titulo) + '</h3><div class="sub">' + (m.libera_em ? 'Libera em ' + dm(m.libera_em) + (n !== null && n > 0 ? ' (em ' + n + ' dia' + (n === 1 ? '' : 's') + ')' : '') : 'Em breve') + '</div></div>';
    }
    return '<a class="card mod" href="#/modulo/' + m.idmodulo + '"><h3>' + esc(m.titulo) + '</h3><div class="sub">' + m.total + ' aula' + (m.total === 1 ? '' : 's') + ' · ' + m.feitas + ' concluída' + (m.feitas === 1 ? '' : 's') + '</div><div class="barra"><i style="width:' + p + '%"></i></div></a>';
  }

  function cartaoTreinoHoje() {
    var t = estado.treinoHoje;
    if (!t) return '';
    return '<div class="card hero"><div class="mut" style="text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:700">Treino de hoje</div>' +
      '<h2 style="margin:6px 0 2px;overflow-wrap:anywhere">' + esc(t.titulo) + '</h2><div class="mut">' + esc(t.modulo) + '</div>' +
      (t.treinou_hoje ? '<div class="msg ok" style="margin:10px 0 0">Treino de hoje registrado. Bom trabalho.</div>' : '') +
      '<div class="linha" style="margin-top:12px"><a class="btn pri" href="#/treino/' + t.idaula + '">' + (t.treinou_hoje ? 'Ver ou editar o treino' : 'Começar treino') + '</a>' +
      (t.alternativas.length > 1 ? '<button class="btn" id="outro">Escolher outro</button>' : '') + '</div>' +
      '<div class="mut" style="margin-top:10px;font-size:13px">' + estado.treinosSemana + ' treino' + (estado.treinosSemana === 1 ? '' : 's') + ' nesta semana</div></div>';
  }

  async function viewHome() {
    var v = tela('inicio');
    if (!estado.acesso) { v.innerHTML = semAcesso(); return; }
    var ms = await carregarModulos();
    if (!ms) { if (estado.eu) v.innerHTML = '<div class="msg erro">Não foi possível carregar o conteúdo. Tente de novo.</div>'; return; }
    var nb = $app.querySelector('.nav-baixo'); if (nb) nb.outerHTML = navBaixo('inicio');
    if (!ms.length) { v.innerHTML = '<div class="card"><div class="vazio">O conteúdo ainda não foi publicado.</div></div>'; return; }
    var total = 0, feitas = 0; ms.forEach(function (m) { if (m.liberado) { total += m.total; feitas += m.feitas; } });
    var pct = total ? Math.round(feitas * 100 / total) : 0;
    var prox = proximaAula();
    var h = '<h2 style="margin:4px 0 12px">Olá, ' + esc((estado.eu.nome || '').split(' ')[0]) + '</h2>' + cartaoTreinoHoje() +
      '<div class="card" style="margin-top:12px"><div class="linha" style="justify-content:space-between"><b>Seu programa</b><span class="mut">' + feitas + ' de ' + total + ' aulas (' + pct + '%)</span></div><div class="barra"><i style="width:' + pct + '%"></i></div>' +
      (prox ? '<div class="espaco"></div><a class="btn" href="#/aula/' + prox.idaula + '">' + (feitas ? 'Continuar: ' : 'Começar: ') + esc(curto(prox.titulo, 40)) + '</a>' : '<p style="margin-top:10px">Você concluiu todas as aulas liberadas. Parabéns.</p>') + '</div>';
    [['curso', 'Programa'], ['protocolo', 'Protocolos de treino'], ['bonus', 'Bônus']].forEach(function (g) {
      var lista = ms.filter(function (m) { return m.grupo === g[0]; });
      if (!lista.length) return;
      h += '<h3 style="margin:22px 0 10px">' + g[1] + '</h3><div class="grid g2">' + lista.map(cartaoModulo).join('') + '</div>';
    });
    v.innerHTML = h;
    var ou = document.getElementById('outro');
    if (ou) ou.onclick = function () {
      var t = estado.treinoHoje;
      var m = document.createElement('div'); m.className = 'modal';
      m.innerHTML = '<div class="caixa"><h3>Escolher treino</h3><p class="mut">' + esc(t.modulo) + '</p><ul class="aulas">' + t.alternativas.map(function (a) { return '<li><a href="#/treino/' + a.idaula + '"><span class="ti">' + esc(a.titulo) + '</span></a></li>'; }).join('') + '</ul><div class="espaco"></div><button class="btn" id="fx">Fechar</button></div>';
      m.onclick = function (e) { if (e.target === m || e.target.id === 'fx' || e.target.closest('a')) m.remove(); };
      document.body.appendChild(m);
    };
  }

  async function viewModulo(id) {
    var v = tela('inicio');
    if (!estado.acesso) { v.innerHTML = semAcesso(); return; }
    var ms = estado.modulos || await carregarModulos();
    if (!ms) return;
    var m = ms.filter(function (x) { return x.idmodulo === id; })[0];
    if (!m) { v.innerHTML = '<div class="msg erro">Módulo não encontrado.</div><a class="btn" href="#/">Voltar</a>'; return; }
    if (!m.liberado) { v.innerHTML = '<div class="miga"><a href="#/">Início</a> / ' + esc(m.titulo) + '</div><div class="card"><h2>' + esc(m.titulo) + '</h2><div class="msg aviso">Este módulo será liberado em ' + esc(dm(m.libera_em)) + '.</div></div>'; return; }
    var h = '<div class="miga"><a href="#/">Início</a> / ' + esc(m.titulo) + '</div><div class="card"><h2 style="margin-bottom:4px">' + esc(m.titulo) + '</h2>' + (m.descricao ? '<p class="mut">' + esc(m.descricao) + '</p>' : '') + '<ul class="aulas" style="margin-top:8px">';
    m.aulas.forEach(function (a) {
      h += '<li class="' + (a.concluida ? 'feita' : '') + '"><a href="#/aula/' + a.idaula + '"><span class="bola">' + (a.concluida ? '&#10003;' : '') + '</span><span class="ti">' + esc(a.titulo) + '</span></a></li>';
    });
    v.innerHTML = h + '</ul></div>';
  }

  /* ---------- aula ---------- */
  function botaoVideo(video) {
    if (CDD.ytId(video)) return '<button class="btn peq" data-yt="' + esc(video) + '">Como fazer</button>';
    if (video) return '<a class="btn peq" href="' + esc(video) + '" target="_blank" rel="noopener">Como fazer</a>';
    return '';
  }
  function fichaHtml(f) {
    if (!f.length) return '';
    var h = '<h3 style="margin:20px 0 8px">Ficha de treino</h3><div class="tbl"><table><thead><tr><th>Exercício</th><th>Séries</th><th>Repetições</th><th>Intervalo</th><th>Método</th><th></th></tr></thead><tbody>';
    var g = null;
    f.forEach(function (i) {
      if ((i.grupo || '') !== g && i.grupo) { g = i.grupo; h += '<tr class="grupo"><td colspan="6">' + esc(g) + '</td></tr>'; }
      h += '<tr><td>' + esc(i.exercicio) + (i.obs ? '<div class="mut">' + esc(i.obs) + '</div>' : '') + '</td><td class="num">' + esc(i.series) + '</td><td class="num">' + esc(i.repeticoes) + '</td><td class="num">' + esc(i.intervalo) + '</td><td>' + esc(i.metodo) + '</td><td>' + botaoVideo(i.video) + '</td></tr>';
    });
    return h + '</tbody></table></div>';
  }
  function ligarVideos(raiz) { raiz.querySelectorAll('[data-yt]').forEach(function (b) { b.onclick = function () { abrirVideo(b.getAttribute('data-yt')); }; }); }
  function abrirVideo(id) {
    var m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = '<div class="caixa"><div class="video"><iframe src="' + esc(CDD.ytEmbed(id)) + '" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div class="espaco"></div><button class="btn" id="fx">Fechar</button></div>';
    m.onclick = function (e) { if (e.target === m || e.target.id === 'fx') m.remove(); };
    document.body.appendChild(m);
  }

  function estrelas(nota) {
    var h = '';
    for (var i = 1; i <= 5; i++) h += '<button class="estrela' + (nota >= i ? ' on' : '') + '" data-n="' + i + '" aria-label="' + i + ' estrela' + (i > 1 ? 's' : '') + '">&#9733;</button>';
    return h;
  }
  function quando(s) {
    var d = new Date(String(s).replace(' ', 'T')); if (isNaN(d)) return '';
    var dias = Math.round((new Date().setHours(0, 0, 0, 0) - new Date(d).setHours(0, 0, 0, 0)) / 86400000);
    return dias <= 0 ? 'hoje' : dias === 1 ? 'ontem' : dias < 30 ? 'há ' + dias + ' dias' : dm(String(s).slice(0, 10));
  }
  function comentarioHtml(c, resposta) {
    return '<div class="coment' + (c.equipe ? ' equipe' : '') + (resposta ? ' resp' : '') + '"><div class="av">' + esc(c.autor.charAt(0)) + '</div><div class="cc"><div class="cn"><b>' + esc(c.autor) + '</b>' + (c.equipe ? ' <span class="tag ok">equipe</span>' : '') + ' <span class="mut">' + quando(c.quando) + '</span></div><div class="texto">' + esc(c.texto) + '</div>' +
      '<div class="cac">' + (!resposta ? '<button class="lk" data-resp="' + c.id + '">Responder</button>' : '') + (c.meu ? '<button class="lk" data-del="' + c.id + '">Apagar</button>' : '') + '</div>' +
      (!resposta ? '<div id="rf-' + c.id + '"></div>' : '') + '</div></div>';
  }
  async function blocoInteracao(a, el) {
    el.innerHTML = '<h3 style="margin:24px 0 8px">O que você achou desta aula?</h3><div class="card"><div class="linha" id="est" style="gap:2px"></div><div class="mut" id="media" style="margin-top:6px;font-size:13px"></div></div>' +
      '<h3 style="margin:20px 0 8px">Comentários</h3><div class="card"><form id="cf"><textarea id="ct" maxlength="1000" placeholder="Compartilhe sua experiência ou tire uma dúvida" style="min-height:70px"></textarea><div class="linha" style="margin-top:8px;justify-content:space-between"><span class="mut" id="ca"></span><button class="btn pri peq">Comentar</button></div></form></div><div id="lc" style="margin-top:12px"></div>';
    var minha = a.minha_nota || 0;
    function pintar(d) {
      document.getElementById('est').innerHTML = estrelas(minha);
      document.getElementById('media').textContent = (d.votos ? 'Média ' + num(d.media) + ' (' + d.votos + (d.votos === 1 ? ' avaliação' : ' avaliações') + ')' : 'Seja a primeira a avaliar') + (minha ? ' · sua nota: ' + minha : '');
      document.querySelectorAll('#est .estrela').forEach(function (b) { b.onclick = async function () {
        var x = await CDD.api('avaliar', { body: { id: a.idaula, nota: parseInt(b.getAttribute('data-n'), 10) } });
        if (x.ok) { minha = x.data.minha_nota; carregar(); } }; });
    }
    function lista(d) {
      var lc = document.getElementById('lc');
      if (!d.comentarios.length) { lc.innerHTML = '<div class="vazio" style="padding:12px">Ainda não há comentários. Comece a conversa.</div>'; return; }
      lc.innerHTML = d.comentarios.map(function (c) { return '<div class="card">' + comentarioHtml(c, false) + c.respostas.map(function (r) { return comentarioHtml(r, true); }).join('') + '</div>'; }).join('');
      lc.querySelectorAll('[data-del]').forEach(function (b) { b.onclick = async function () { if (!confirm('Apagar este comentário?')) return; await CDD.api('comentario_excluir', { body: { id: parseInt(b.getAttribute('data-del'), 10) } }); carregar(); }; });
      lc.querySelectorAll('[data-resp]').forEach(function (b) { b.onclick = function () {
        var id = b.getAttribute('data-resp'), box = document.getElementById('rf-' + id);
        if (box.innerHTML) { box.innerHTML = ''; return; }
        box.innerHTML = '<form class="rf"><textarea maxlength="1000" placeholder="Escreva sua resposta" style="min-height:60px"></textarea><div class="linha" style="margin-top:6px"><button class="btn pri peq">Enviar</button></div><div class="ra"></div></form>';
        box.querySelector('form').onsubmit = async function (e) {
          e.preventDefault();
          var x = await CDD.api('comentar', { body: { id: a.idaula, texto: box.querySelector('textarea').value, parent: parseInt(id, 10) } });
          if (!x.ok) { box.querySelector('.ra').innerHTML = msg(x.data.mensagem); return; }
          carregar();
        };
      }; });
    }
    async function carregar() {
      var r = await CDD.api('comentarios', { q: { id: a.idaula } });
      if (!r.ok) { el.innerHTML = ''; return; }
      pintar(r.data); lista(r.data);
    }
    document.getElementById('cf').onsubmit = async function (e) {
      e.preventDefault();
      var t = document.getElementById('ct');
      var x = await CDD.api('comentar', { body: { id: a.idaula, texto: t.value } });
      document.getElementById('ca').innerHTML = x.ok ? '' : '<span style="color:var(--erro)">' + esc(x.data.mensagem) + '</span>';
      if (x.ok) { t.value = ''; carregar(); }
    };
    carregar();
  }

  async function viewAula(id) {
    var v = tela('inicio');
    if (!estado.acesso) { v.innerHTML = semAcesso(); return; }
    var r = await CDD.api('aula', { q: { id: id } });
    if (sessaoExpirou(r)) return;
    if (!r.ok) { v.innerHTML = '<div class="msg ' + (r.data.error === 'modulo_bloqueado' ? 'aviso' : 'erro') + '">' + esc(r.data.mensagem || 'Aula não encontrada.') + '</div><a class="btn" href="#/">Voltar</a>'; return; }
    var a = r.data.aula;
    var h = '<div class="miga"><a href="#/">Início</a> / <a href="#/modulo/' + a.idmodulo + '">' + esc(a.modulo) + '</a></div><h2 style="margin-bottom:12px;overflow-wrap:anywhere">' + esc(a.titulo) + '</h2>';
    if (CDD.ytId(a.youtube_id)) h += '<div class="video"><iframe src="' + esc(CDD.ytEmbed(a.youtube_id)) + '" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="' + esc(a.titulo) + '"></iframe></div>';
    else if (a.tipo === 'video') h += '<div class="semvideo">O vídeo desta aula ainda não foi publicado.</div>';
    if (a.texto) h += '<div class="card texto" style="margin-top:14px">' + esc(a.texto) + '</div>';
    if (a.ficha.length) h += '<div class="card hero" style="margin-top:14px"><b>Este treino tem ficha.</b><div class="mut" style="margin:2px 0 10px">Anote as cargas e repetições para acompanhar a sua evolução.</div><a class="btn pri" href="#/treino/' + a.idaula + '">Fazer este treino</a></div>';
    if (a.anexos.length) {
      h += '<div class="linha" style="margin-top:14px">';
      a.anexos.forEach(function (x) { h += '<a class="btn" href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.titulo) + '</a>'; });
      h += '</div>';
    }
    h += fichaHtml(a.ficha);
    h += '<div class="nav2"><div>' + (a.anterior ? '<a class="btn" href="#/aula/' + a.anterior + '">&larr; Anterior</a>' : '') + '</div>' +
      '<button class="btn ' + (a.concluida ? '' : 'pri') + '" id="bc">' + (a.concluida ? 'Concluída (desmarcar)' : 'Marcar como concluída') + '</button>' +
      '<div>' + (a.proxima ? '<a class="btn" href="#/aula/' + a.proxima + '">Próxima &rarr;</a>' : '') + '</div></div><div id="inter"></div>';
    v.innerHTML = h;
    ligarVideos(v);
    document.getElementById('bc').onclick = async function () {
      this.disabled = true;
      var x = await CDD.api('concluir', { body: { id: a.idaula, feito: !a.concluida } });
      estado.modulos = null;
      if (x.ok && !a.concluida && a.proxima) location.hash = '#/aula/' + a.proxima; else viewAula(id);
    };
    blocoInteracao(a, document.getElementById('inter'));
  }

  /* ---------- treino do dia ---------- */
  var treinoCron = null;
  function pararCron() { if (treinoCron) { clearInterval(treinoCron); treinoCron = null; } }

  async function viewTreino(id) {
    pararCron();
    var v = tela('treino');
    if (!estado.acesso) { v.innerHTML = semAcesso(); return; }
    var r = await CDD.api('treino', { q: { id: id } });
    if (sessaoExpirou(r)) return;
    if (!r.ok) { v.innerHTML = '<div class="msg ' + (r.data.error === 'modulo_bloqueado' ? 'aviso' : 'erro') + '">' + esc(r.data.mensagem || 'Treino não encontrado.') + '</div><a class="btn" href="#/">Voltar</a>'; return; }
    var a = r.data.aula, hist = r.data.historico || {}, hoje = r.data.hoje;
    var chave = 'cdd-rasc-' + a.idaula + '-' + hojeISO();
    var itens = a.ficha.map(function (f) { return { exercicio: f.exercicio, ficha: f, tarefa: f.grupo === 'TAREFA DE CASA', series: [] }; });
    var rascunho = null;
    try { rascunho = JSON.parse(localStorage.getItem(chave) || 'null'); } catch (e) {}
    var salvos = hoje ? hoje.itens : (rascunho ? rascunho.itens : null), mapa = {};
    (salvos || []).forEach(function (s) { mapa[s.exercicio] = s.series || []; });
    itens.forEach(function (it) {
      if (it.tarefa) return;
      var s = mapa[it.exercicio] || [];
      for (var i = 0; i < Math.max(it.ficha.qtd_series || 3, s.length); i++) it.series.push({ peso: (s[i] && s[i].peso) || '', reps: (s[i] && s[i].reps) || '' });
    });
    var inicio = rascunho && rascunho.inicio ? rascunho.inicio : Date.now();
    var jaSalvo = !!hoje, duracaoSalva = hoje ? hoje.duracao_seg : 0, usaRascunho = !hoje && !!rascunho;
    function guardar() { try { localStorage.setItem(chave, JSON.stringify({ inicio: inicio, itens: itens.filter(function (i) { return !i.tarefa; }).map(function (i) { return { exercicio: i.exercicio, series: i.series }; }) })); } catch (e) {} }
    function dica(it) {
      var h = hist[norm(it.exercicio)] || null;
      if (!h) return '<div class="dica mut">Primeira vez que você anota este exercício.</div>';
      var u = (h.ultimo.series || []).filter(function (s) { return s.peso || s.reps; }).map(function (s) { return (s.peso ? num(s.peso) + ' kg' : '') + (s.peso && s.reps ? ' x ' : '') + (s.reps || ''); }).join(', ');
      return '<div class="dica mut">Última vez (' + esc(dm(h.ultimo.data)) + '): ' + esc(u) + (h.max.peso ? ' · Recorde: ' + num(h.max.peso) + ' kg' : '') + '</div>';
    }
    function placeholderDe(it, i) {
      var h = hist[norm(it.exercicio)]; var s = h && h.ultimo.series && h.ultimo.series[i];
      return { peso: s && s.peso ? s.peso : 'kg', reps: s && s.reps ? s.reps : 'reps' };
    }

    var h = '<div class="miga"><a href="#/">Início</a> / <a href="#/modulo/' + a.idmodulo + '">' + esc(a.modulo) + '</a></div>' +
      '<div class="treino-topo"><div><h2 style="overflow-wrap:anywhere">' + esc(a.titulo) + '</h2><div class="mut">' + (jaSalvo ? 'Treino já registrado hoje. Você pode ajustar as cargas.' : 'Anote carga e repetições de cada série.') + '</div></div><div class="cron" id="cron">00:00</div></div>';
    if (CDD.ytId(a.youtube_id)) h += '<button class="btn" id="vexp" style="margin-bottom:12px">Ver vídeo explicativo do treino</button>';
    if (a.texto) h += '<div class="card texto" style="margin-bottom:12px">' + esc(a.texto) + '</div>';
    var grupoAtual = null;
    itens.forEach(function (it, ix) {
      var f = it.ficha;
      if ((f.grupo || '') !== grupoAtual && f.grupo) { grupoAtual = f.grupo; h += '<h3 class="gtit">' + esc(grupoAtual) + '</h3>'; }
      var presc = [f.series ? f.series + (/^\d+$/.test(f.series) ? ' séries' : '') : '', f.repeticoes ? f.repeticoes + (/^\d+( a \d+)?$/.test(f.repeticoes.trim()) ? ' reps' : '') : '', f.intervalo ? 'intervalo ' + f.intervalo : ''].filter(Boolean).join(' · ');
      if (it.tarefa) {
        h += '<div class="card ex"><div class="exn"><b>' + esc(it.exercicio) + '</b></div>' + (f.obs ? '<div class="mut">' + esc(f.obs) + '</div>' : '') + (f.video ? '<div style="margin-top:8px">' + botaoVideo(f.video) + '</div>' : '') + '</div>';
        return;
      }
      h += '<div class="card ex" data-ex="' + ix + '"><div class="linha" style="justify-content:space-between;align-items:flex-start"><div style="min-width:0"><div class="exn"><b>' + esc(it.exercicio) + '</b></div>' +
        (presc ? '<div class="mut">' + esc(presc) + '</div>' : '') + (f.metodo ? '<div class="mut">' + esc(f.metodo) + '</div>' : '') + (f.obs ? '<div class="mut">' + esc(f.obs) + '</div>' : '') + '</div>' + botaoVideo(f.video) + '</div>' +
        dica(it) + '<div class="series" id="ser-' + ix + '"></div><button class="lk" data-add="' + ix + '">+ série</button></div>';
    });
    h += '<div class="espaco"></div><div class="barra-fim"><button class="btn pri" style="width:100%" id="fim">' + (jaSalvo ? 'Atualizar treino' : 'Concluir treino') + '</button></div>';
    v.innerHTML = h;
    ligarVideos(v);
    var vx = document.getElementById('vexp'); if (vx) vx.onclick = function () { abrirVideo(a.youtube_id); };

    function desenharSeries(ix) {
      var it = itens[ix], box = document.getElementById('ser-' + ix); if (!box) return;
      box.innerHTML = '<div class="slin cab"><span></span><span>Carga (kg)</span><span>Repetições</span></div>' + it.series.map(function (s, i) {
        var ph = placeholderDe(it, i);
        return '<div class="slin"><span class="sn">' + (i + 1) + '</span><input inputmode="decimal" autocomplete="off" data-ex="' + ix + '" data-s="' + i + '" data-k="peso" value="' + esc(s.peso) + '" placeholder="' + esc(ph.peso) + '" aria-label="Carga da série ' + (i + 1) + '">' +
          '<input inputmode="numeric" autocomplete="off" data-ex="' + ix + '" data-s="' + i + '" data-k="reps" value="' + esc(s.reps) + '" placeholder="' + esc(ph.reps) + '" aria-label="Repetições da série ' + (i + 1) + '"></div>';
      }).join('');
      box.querySelectorAll('input').forEach(function (inp) { inp.oninput = function () { itens[parseInt(inp.getAttribute('data-ex'), 10)].series[parseInt(inp.getAttribute('data-s'), 10)][inp.getAttribute('data-k')] = inp.value; guardar(); }; });
    }
    itens.forEach(function (it, ix) { if (!it.tarefa) desenharSeries(ix); });
    v.querySelectorAll('[data-add]').forEach(function (b) { b.onclick = function () { var ix = parseInt(b.getAttribute('data-add'), 10); if (itens[ix].series.length < 12) { itens[ix].series.push({ peso: '', reps: '' }); desenharSeries(ix); guardar(); } }; });

    var cron = document.getElementById('cron');
    function tic() { cron.textContent = mmss(jaSalvo ? duracaoSalva : (Date.now() - inicio) / 1000); }
    tic(); if (!jaSalvo) treinoCron = setInterval(function () { if (!document.getElementById('cron')) { pararCron(); return; } tic(); }, 1000);

    document.getElementById('fim').onclick = function () { confirmarFim(); };
    function confirmarFim() {
      var esf = hoje && hoje.esforco ? parseInt(hoje.esforco, 10) : 0;
      var rot = ['', 'Leve', 'Moderado', 'Forte', 'Muito forte', 'No limite'];
      var m = document.createElement('div'); m.className = 'modal';
      m.innerHTML = '<div class="caixa"><h3>Como foi o treino?</h3><div class="linha esf" id="esf">' + [1, 2, 3, 4, 5].map(function (n) { return '<button class="btn" data-e="' + n + '">' + n + '</button>'; }).join('') + '</div><div class="mut" id="esfr" style="margin-top:6px;min-height:20px"></div>' +
        '<label for="cm">Comentário (opcional)</label><textarea id="cm" maxlength="600" placeholder="Como se sentiu, o que quer ajustar na próxima">' + esc(hoje && hoje.comentario ? hoje.comentario : '') + '</textarea><div id="av"></div>' +
        '<div class="espaco"></div><div class="linha"><button class="btn pri" id="sv">Salvar treino</button><button class="btn" id="fx">Voltar ao treino</button></div></div>';
      document.body.appendChild(m);
      function pintaEsf() { m.querySelectorAll('[data-e]').forEach(function (b) { b.classList.toggle('pri', parseInt(b.getAttribute('data-e'), 10) === esf); }); m.querySelector('#esfr').textContent = esf ? 'Esforço: ' + rot[esf] : 'Esforço percebido, de 1 (leve) a 5 (no limite).'; }
      pintaEsf();
      m.querySelectorAll('[data-e]').forEach(function (b) { b.onclick = function () { esf = parseInt(b.getAttribute('data-e'), 10); pintaEsf(); }; });
      m.querySelector('#fx').onclick = function () { m.remove(); };
      m.querySelector('#sv').onclick = async function () {
        this.disabled = true;
        var dur = jaSalvo ? duracaoSalva : Math.round((Date.now() - inicio) / 1000);
        var x = await CDD.api('treino_salvar', { body: { idaula: a.idaula, itens: itens.filter(function (i) { return !i.tarefa; }).map(function (i) { return { exercicio: i.exercicio, series: i.series }; }), duracao_seg: dur, esforco: esf || null, comentario: m.querySelector('#cm').value, data: hojeISO() } });
        this.disabled = false;
        if (!x.ok) { m.querySelector('#av').innerHTML = msg(x.data.mensagem); return; }
        try { localStorage.removeItem(chave); } catch (e) {}
        m.remove(); pararCron(); estado.modulos = null; resultadoTreino(a, x.data, dur);
      };
    }
  }

  function resultadoTreino(a, d, dur) {
    var v = tela('treino');
    var r = d.resumo;
    v.innerHTML = '<div class="card hero" style="text-align:center"><div class="grande">&#10003;</div><h2>Treino registrado</h2><div class="mut">' + esc(a.titulo) + '</div>' +
      '<div class="grid g4" style="margin-top:14px;text-align:left"><div class="card"><b class="n">' + r.exercicios + '</b><div class="mut">exercícios</div></div><div class="card"><b class="n">' + r.series + '</b><div class="mut">séries</div></div>' +
      '<div class="card"><b class="n">' + (r.volume_kg ? r.volume_kg.toLocaleString('pt-BR') : '0') + '</b><div class="mut">kg de volume</div></div><div class="card"><b class="n">' + mmss(dur) + '</b><div class="mut">de treino</div></div></div></div>' +
      (d.recordes.length ? '<div class="card" style="margin-top:12px"><h3 style="margin-bottom:8px">Novos recordes</h3>' + d.recordes.map(function (x) { return '<div class="rec"><b>' + esc(x.exercicio) + '</b><span>' + num(x.peso) + ' kg' + (x.reps ? ' x ' + x.reps : '') + ' <span class="mut">(antes ' + num(x.anterior) + ' kg)</span></span></div>'; }).join('') + '</div>' : '') +
      '<div class="linha" style="margin-top:14px"><a class="btn pri" href="#/jornada">Ver minha jornada</a><a class="btn" href="#/">Voltar ao início</a></div>';
  }

  /* ---------- jornada ---------- */
  async function viewJornada() {
    pararCron();
    var v = tela('jornada');
    if (!estado.acesso) { v.innerHTML = semAcesso(); return; }
    var r = await CDD.api('jornada');
    if (sessaoExpirou(r)) return;
    if (!r.ok) { v.innerHTML = '<div class="msg erro">' + esc(r.data.mensagem || 'Não foi possível carregar a jornada.') + '</div>'; return; }
    var j = r.data.jornada;
    var pct = j.aulas_total ? Math.round(j.aulas_feitas * 100 / j.aulas_total) : 0;
    var h = '<h2 style="margin:4px 0 12px">Minha jornada</h2><div class="grid g4">' +
      '<div class="card"><b class="n">' + j.dia_do_programa + '</b><div class="mut">dia do programa</div></div><div class="card"><b class="n">' + j.treinos_total + '</b><div class="mut">treinos feitos</div></div>' +
      '<div class="card"><b class="n">' + j.treinos_semana + '</b><div class="mut">nesta semana</div></div><div class="card"><b class="n">' + j.sequencia_semanas + '</b><div class="mut">' + (j.sequencia_semanas === 1 ? 'semana seguida' : 'semanas seguidas') + '</div></div></div>';
    h += '<div class="card" style="margin-top:12px"><div class="linha" style="justify-content:space-between"><b>Aulas</b><span class="mut">' + j.aulas_feitas + ' de ' + j.aulas_total + ' (' + pct + '%)</span></div><div class="barra"><i style="width:' + pct + '%"></i></div></div>';
    var dias = ['S', 'T', 'Q', 'Q', 'S', 'S', 'D'];
    h += '<h3 style="margin:22px 0 10px">Constância nas últimas 8 semanas</h3><div class="card"><div class="cal"><div class="cal-d">' + dias.map(function (d) { return '<span>' + d + '</span>'; }).join('') + '</div>';
    for (var w = 0; w < 8; w++) {
      h += '<div class="cal-s">';
      for (var d = 0; d < 7; d++) { var c = j.calendario[w * 7 + d]; h += '<span class="cel n' + Math.min(c.n, 3) + (c.futuro ? ' fut' : '') + '" title="' + esc(dm(c.d)) + (c.n ? ': ' + c.n + (c.n > 1 ? ' treinos' : ' treino') : '') + '"></span>'; }
      h += '</div>';
    }
    h += '</div></div>';
    h += '<h3 style="margin:22px 0 10px">Seu programa</h3><div class="card"><ul class="tl">' + j.modulos.map(function (m) {
      var p = m.total ? Math.round(m.feitas * 100 / m.total) : 0, st, cls;
      if (!m.liberado) { var n = m.libera_em ? diasAte(m.libera_em) : null; st = 'Libera em ' + dm(m.libera_em) + (n > 0 ? ' (em ' + n + (n === 1 ? ' dia)' : ' dias)') : ''); cls = 'trav'; }
      else if (m.total && m.feitas === m.total) { st = 'Concluído'; cls = 'ok'; } else if (m.feitas) { st = m.feitas + ' de ' + m.total + ' aulas'; cls = 'and'; } else { st = 'Liberado'; cls = 'lib'; }
      return '<li class="' + cls + '"><span class="pt"></span><div class="tc">' + (m.liberado ? '<a href="#/modulo/' + m.idmodulo + '">' + esc(m.titulo) + '</a>' : esc(m.titulo)) + '<div class="mut">' + esc(st) + '</div>' + (m.liberado && m.total ? '<div class="barra"><i style="width:' + p + '%"></i></div>' : '') + '</div></li>';
    }).join('') + '</ul></div>';
    if (j.evolucao.length) {
      h += '<h3 style="margin:22px 0 10px">Evolução das cargas</h3><div class="card">' + j.evolucao.map(function (e) {
        var dif = Math.round((e.atual - e.primeira) * 10) / 10, pc = e.maxima ? Math.round(e.atual * 100 / e.maxima) : 0;
        return '<div class="evo"><div class="linha" style="justify-content:space-between;gap:8px"><b style="min-width:0;overflow-wrap:anywhere">' + esc(e.exercicio) + '</b><span class="' + (dif > 0 ? 'up' : dif < 0 ? 'dn' : 'mut') + '">' + (dif > 0 ? '+' : '') + num(dif) + ' kg</span></div>' +
          '<div class="mut" style="font-size:13px">' + num(e.primeira) + ' kg &rarr; ' + num(e.atual) + ' kg · recorde ' + num(e.maxima) + ' kg · ' + e.sessoes + (e.sessoes === 1 ? ' treino' : ' treinos') + '</div><div class="barra"><i style="width:' + pc + '%"></i></div></div>';
      }).join('') + '</div>';
    }
    if (j.recentes.length) {
      h += '<h3 style="margin:22px 0 10px">Treinos recentes</h3><div class="card"><ul class="aulas">' + j.recentes.map(function (t) {
        return '<li><a href="#/treino/' + t.idaula + '"><span class="ti"><b>' + esc(t.titulo) + '</b><div class="mut" style="font-size:13px">' + esc(dm(t.data)) + ' · ' + t.series + ' séries' + (t.volume_kg ? ' · ' + t.volume_kg.toLocaleString('pt-BR') + ' kg' : '') + (t.duracao_seg ? ' · ' + mmss(t.duracao_seg) : '') + (t.esforco ? ' · esforço ' + t.esforco : '') + '</div></span></a></li>';
      }).join('') + '</ul></div>';
    } else {
      h += '<div class="card vazio" style="margin-top:14px">Quando você anotar o primeiro treino, a sua evolução aparece aqui.</div>';
    }
    v.innerHTML = h;
  }

  function viewConta() {
    var v = tela('conta');
    v.innerHTML = '<div class="card"><h2 style="margin-bottom:4px">Minha conta</h2><p class="mut">' + esc(estado.eu.nome) + ' · ' + esc(estado.eu.email) + '</p>' +
      '<p class="mut" style="margin-top:6px">Acesso: ' + (estado.matricula && estado.matricula.ativa ? 'ativo' + (estado.matricula.expira_em ? ' até ' + CDD.dataBR(estado.matricula.expira_em) : '') : 'sem acesso no momento') + '</p></div>' +
      '<div class="card"><h3>Trocar senha</h3><div id="aviso"></div><form id="f"><label for="at">Senha atual</label><input id="at" type="password" autocomplete="current-password" required>' +
      '<label for="nv">Nova senha (mínimo 8 caracteres)</label><input id="nv" type="password" autocomplete="new-password" minlength="8" required><div class="espaco"></div><button class="btn pri">Trocar senha</button></form></div>' +
      '<div class="card linha"><button class="btn" id="tm">Alternar tema claro e escuro</button><button class="btn perigo" id="sai">Sair</button></div>';
    document.getElementById('tm').onclick = CDD.alternarTema;
    document.getElementById('sai').onclick = async function () { await CDD.api('logout', { body: {} }); CDD.guardar(''); estado = { eu: null }; location.hash = '#/'; telaLogin(); };
    document.getElementById('f').onsubmit = async function (e) {
      e.preventDefault();
      var r = await CDD.api('trocar_senha', { body: { atual: document.getElementById('at').value, nova: document.getElementById('nv').value } });
      document.getElementById('aviso').innerHTML = msg(r.ok ? 'Senha trocada.' : r.data.mensagem, r.ok ? 'ok' : 'erro');
      if (r.ok) document.getElementById('f').reset();
    };
  }

  /* ---------- roteador ---------- */
  function rota() {
    var h = location.hash || '#/';
    var ativ = h.match(/^#ativar=(.+)$/);
    if (ativ) return telaAtivar(ativ[1]);
    if (!estado.eu) { return h === '#/cadastro' ? telaCadastro() : telaLogin(); }
    pararCron();
    window.scrollTo(0, 0);
    var m;
    if ((m = h.match(/^#\/modulo\/(\d+)$/))) return viewModulo(parseInt(m[1], 10));
    if ((m = h.match(/^#\/aula\/(\d+)$/))) return viewAula(parseInt(m[1], 10));
    if ((m = h.match(/^#\/treino\/(\d+)$/))) return viewTreino(parseInt(m[1], 10));
    if (h === '#/jornada') return viewJornada();
    if (h === '#/conta') return viewConta();
    return viewHome();
  }

  async function iniciar() {
    if (/^#ativar=/.test(location.hash)) { estado = { eu: null }; return rota(); }
    if (!CDD.token()) { estado = { eu: null }; return rota(); }
    var r = await CDD.api('eu');
    if (!r.ok) { CDD.guardar(''); estado = { eu: null }; return rota(); }
    estado.eu = r.data.usuario; estado.matricula = r.data.matricula; estado.acesso = r.data.acesso;
    if (estado.acesso && !estado.modulos) { await carregarModulos(); }
    rota();
  }

  window.addEventListener('hashchange', rota);
  iniciar();
})();
