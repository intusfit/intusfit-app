<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="Deixe o seu contato e a equipe do Código da Definição explica como o programa funciona.">

<meta property="og:url" content="https://codigodadefinicao.com.br/app/captura">

<meta name="twitter:title" content="Quero conhecer o Código da Definição">
<meta name="twitter:description" content="Deixe o seu contato e a equipe explica como o programa funciona, sem compromisso.">
<meta name="twitter:image" content="https://codigodadefinicao.com.br/app/marca/lp/og.jpg">
<link rel="icon" href="marca/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="marca/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="marca/icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="marca/icons/apple-touch-icon.png">
<link rel="stylesheet" href="cdd.css?v=20261030a">
<style>
  body{display:grid;place-items:center;padding:20px}
  .cx{width:100%;max-width:440px}
  .cx img{display:block;height:54px;margin:0 auto 14px}
  .cx img.logo-claro{display:none}
  body.tema-claro .cx img.logo-escuro{display:none}
  body.tema-claro .cx img.logo-claro{display:block}
  .cx h1{font-size:26px;font-weight:900;text-align:center;letter-spacing:-.01em}
  .cx p.sub{text-align:center;color:var(--muted);margin:10px 0 18px}
  form{display:grid;gap:10px}
  input,select{width:100%;padding:13px 14px;border-radius:var(--raio-p);border:1px solid var(--line);background:var(--card);min-height:48px}
  .chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted)}
  .chk input{width:auto;min-height:0;margin-top:3px}
  .isca{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .peq{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="cx">
  <img class="logo-escuro" src="marca/logo-cdd-branca.png" alt="Código da Definição">
  <img class="logo-claro" src="marca/logo-cdd-preta.png" alt="Código da Definição">
  <h1>Quer conhecer o Código da Definição?</h1>
  <p class="sub">Programa online de treino e acompanhamento para mulheres. Deixe o seu contato e a equipe explica como funciona, sem compromisso.</p>
  <form id="fl" novalidate>
    <input type="text" name="nome" placeholder="Seu nome" autocomplete="name" required>
    <input type="tel" name="whatsapp" placeholder="WhatsApp com DDD" autocomplete="tel" inputmode="tel">
    <input type="email" name="email" placeholder="E-mail (opcional)" autocomplete="email">
    <select name="objetivo" aria-label="O que você quer melhorar">
      <option value="">O que você quer melhorar?</option>
      <option>Definição muscular</option>
      <option>Perder gordura</option>
      <option>Os dois</option>
      <option>Ainda não sei</option>
    </select>
    <div class="isca" aria-hidden="true"><label>Não preencha <input type="text" name="site" tabindex="-1" autocomplete="off"></label></div>
    <label class="chk"><input type="checkbox" name="aceite"><span>Autorizo a equipe do Código da Definição a entrar em contato comigo por WhatsApp e e-mail sobre o programa.</span></label>
    <button class="btn pri grande" type="submit" id="fb">Quero receber informações</button>
    <div id="fm"></div>
  </form>
  <p class="peq">Seus dados são usados só para este contato. Quer ver os planos agora? <a href="vendas">Veja aqui</a>.</p>
</div>
<script src="cdd.js?v=20261030a"></script>
<script>
(function () {
  CDD.tema();
  var q = new URLSearchParams(location.search);
  var u = { utm_source: (q.get('utm_source') || '').slice(0, 80), utm_medium: (q.get('utm_medium') || '').slice(0, 80), utm_campaign: (q.get('utm_campaign') || '').slice(0, 120) };
  var f = document.getElementById('fl'), m = document.getElementById('fm'), b = document.getElementById('fb');
  f.addEventListener('submit', async function (e) {
    e.preventDefault();
    var d = new FormData(f);
    b.disabled = true; m.innerHTML = '';
    var r = await CDD.api('lead', { body: { nome: d.get('nome'), whatsapp: d.get('whatsapp'), email: d.get('email'), objetivo: d.get('objetivo'), site: d.get('site'), aceite: !!d.get('aceite'), origem: 'captura', utm_source: u.utm_source, utm_medium: u.utm_medium, utm_campaign: u.utm_campaign } });
    b.disabled = false;
    if (!r.ok) { m.innerHTML = '<div class="msg erro">' + CDD.esc((r.data && r.data.mensagem) || 'Não consegui enviar. Tente de novo.') + '</div>'; return; }
    f.innerHTML = '<div class="msg ok">Pronto! Recebemos o seu contato. A equipe responde pelo WhatsApp em breve.</div>' + (r.data.zap ? '<a class="btn pri grande" href="' + CDD.esc(r.data.zap) + '" target="_blank" rel="noopener">Falar agora no WhatsApp</a>' : '') + '<a class="btn grande" href="vendas">Ver os planos</a>';
  });
})();
</script>
</body>
</html>
