<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Central de Atendimento · Intus</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
(function(){
  var t = null; try { t = localStorage.getItem('mx-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  document.documentElement.setAttribute('data-tema', t);
})();
</script>
<style>
:root{
  color-scheme:dark;
  --bg:#0d0d0d; --card:#1a1a1a; --card2:#222; --borda:#2a2a2a; --borda2:#444; --texto:#f0f0f0; --muted:#b4b4b4;
  --accent:#7FFF00; --accent-ink:#0c1a00; --warn:#ffb84d; --erro:#ff6b6b; --ok:#7FFF00; --info:#7cc4ff;
  --accent-bd:#2f4d12; --accent-bg:#16240a; --prev-bg:#0f1a07;
  --warn-bd:#5a4318; --warn-bg:#2a2112; --warn-tx:#ffd9a0;
  --erro-bd:#5c1a1a; --erro-bg:#2b0f0f; --erro-tx:#ffb3b3;
  --info-bd:#1f4864; --campo-bg:#141414; --codigo-bg:#101010; --topo-bg:rgba(13,13,13,.94);
  --toast-bg:#f0f0f0; --toast-tx:#111; --grade:#2a2a2a; --eixo:#b4b4b4;
  --serie1:#7FFF00; --serie2:#7cc4ff; --serie3:#ffb84d;
  --r:12px;
}
:root[data-tema="light"]{
  color-scheme:light;
  --bg:#f4f5f7; --card:#ffffff; --card2:#eef0f3; --borda:#dcdfe4; --borda2:#b8bec8; --texto:#111827; --muted:#4b5563;
  --accent:#2d7a00; --accent-ink:#ffffff; --warn:#8a5200; --erro:#c0262d; --ok:#2d7a00; --info:#0b6aa8;
  --accent-bd:#9ccf72; --accent-bg:#eaf6dc; --prev-bg:#eef8e2;
  --warn-bd:#e3c27a; --warn-bg:#fdf4e0; --warn-tx:#6b4200;
  --erro-bd:#efb3b3; --erro-bg:#fdeaea; --erro-tx:#8f1d1d;
  --info-bd:#9cc7e6; --campo-bg:#f6f7f9; --codigo-bg:#f3f4f6; --topo-bg:rgba(244,245,247,.94);
  --toast-bg:#111827; --toast-tx:#ffffff; --grade:#dcdfe4; --eixo:#4b5563;
  --serie1:#2d7a00; --serie2:#0b6aa8; --serie3:#b36b00;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--texto);font:400 15px/1.55 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
h1,h2,h3,h4,p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}

/* login */
#tela-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:28px}
.login-box img{height:34px;display:block;margin:0 auto 18px}
.login-box h1{font-size:18px;text-align:center;margin-bottom:4px}
.login-box .sub{color:var(--muted);text-align:center;font-size:13px;margin-bottom:18px}
.campo{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.campo label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--borda);border-radius:10px;padding:10px 12px;min-height:42px}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.erro-msg{color:var(--erro);font-size:13px;min-height:18px;margin-top:4px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--borda);background:var(--card2);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;color:var(--texto);text-decoration:none}
.btn:hover{border-color:var(--borda2)}
.btn.primario{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.perigo{color:var(--erro)}
.btn.mini{min-height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linha{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.espaco{flex:1}

/* topo */
.topo{position:sticky;top:0;z-index:20;background:var(--topo-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--borda);margin:0 -16px 20px;padding:12px 16px 0}
.topo-linha{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.topo img{height:26px}
.topo h1{font-size:16px;font-weight:700}
.topo .sub{font-size:12px;color:var(--muted)}
.abas{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.aba{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 14px;font-weight:600;cursor:pointer;font-size:14px}
.aba[aria-selected=true]{color:var(--texto);border-bottom-color:var(--accent)}
.aba .n{display:inline-block;margin-left:6px;font-size:11px;background:var(--card2);border-radius:99px;padding:1px 7px;color:var(--muted)}

/* blocos */
.card{background:var(--card);border:1px solid var(--borda);border-radius:var(--r);padding:16px}
.card + .card{margin-top:14px}
.secao-titulo{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.dica{color:var(--muted);font-size:13px}
.aviso{border-radius:10px;padding:10px 14px;font-size:13px;border:1px solid var(--borda);background:var(--card2)}
.aviso.warn{border-color:var(--warn-bd);background:var(--warn-bg);color:var(--warn-tx)}
.aviso.erro{border-color:var(--erro-bd);background:var(--erro-bg);color:var(--erro-tx)}
.aviso.ok{border-color:var(--accent-bd);background:var(--accent-bg)}
.grade{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grade > *{min-width:0}
@media (max-width:760px){.g2,.g3{grid-template-columns:1fr}}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:99px;padding:2px 9px;background:var(--card2);color:var(--muted);border:1px solid var(--borda)}
.badge.verde{color:var(--accent);border-color:var(--accent-bd)}
.badge.ambar{color:var(--warn);border-color:var(--warn-bd)}
.badge.azul{color:var(--info);border-color:var(--info-bd)}
.badge.verm{color:var(--erro);border-color:var(--erro-bd)}

/* painel */
.kpi{background:var(--card);border:1px solid var(--borda);border-radius:var(--r);padding:14px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .v.vazio{font-size:15px;font-weight:600;color:var(--muted);line-height:1.7}
.kpi .l{font-size:12px;color:var(--muted);margin-top:4px}
.kpi .s{font-size:11px;color:var(--muted);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--borda);text-align:left;vertical-align:top}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tabela-rolar{overflow-x:auto}
.barra{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.barra > i{display:block;height:100%;background:var(--accent)}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* funis */
.funis-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.funis-layout{grid-template-columns:1fr}}
.funil-item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--borda);border-radius:var(--r);padding:12px;cursor:pointer;margin-bottom:8px}
.funil-item[aria-current=true]{border-color:var(--accent)}
.funil-item b{display:block;font-size:14px;margin-bottom:3px}
.funil-item span{font-size:12px;color:var(--muted)}
.msg{background:var(--card);border:1px solid var(--borda);border-radius:var(--r);padding:14px;margin-top:12px;position:relative}
.msg-cab{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:8px}
.msg-num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.msg-quando{font-weight:700}
.msg-nome{color:var(--muted);font-size:13px}
.msg textarea{min-height:92px;background:var(--campo-bg)}
.preview{white-space:pre-wrap;background:var(--prev-bg);border:1px solid var(--accent-bd);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px;overflow-wrap:anywhere}
.msg-meta{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;border-radius:8px;padding:3px 9px;border:1px solid var(--borda);background:var(--card2)}
.chip.erro{color:var(--erro);border-color:var(--erro-bd)}
.chip.aviso{color:var(--warn);border-color:var(--warn-bd)}
.chip.info{color:var(--info);border-color:var(--info-bd)}
.chip.ok{color:var(--accent);border-color:var(--accent-bd)}
.nota-score{font-weight:800;font-size:13px}
details.conf{margin-top:8px;border-top:1px dashed var(--borda);padding-top:8px}
details.conf summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600}
.por-que{font-size:13px;color:var(--muted);margin-top:6px}
.barra-salvar{position:sticky;bottom:0;background:var(--topo-bg);border-top:1px solid var(--borda);padding:10px 0;margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* laboratório */
.sub-abas{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.sub-aba{background:var(--card);border:1px solid var(--borda);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.sub-aba[aria-selected=true]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.marcar{display:flex;flex-wrap:wrap;gap:6px}
.marcar label{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--borda);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
.marcar input{accent-color:var(--accent)}
.variante{background:var(--card2);border:1px solid var(--borda);border-radius:var(--r);padding:12px;margin-top:10px}
.variante .t{white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:6px}
.conceito{border:1px solid var(--borda);border-radius:var(--r);background:var(--card);margin-bottom:8px}
.conceito > summary{padding:12px 14px;cursor:pointer;font-weight:700;list-style:none}
.conceito > summary::-webkit-details-marker{display:none}
.conceito > summary::after{content:'+';float:right;color:var(--muted)}
.conceito[open] > summary::after{content:'−'}
.conceito .corpo{padding:0 14px 14px}

/* refs */
.ref{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:12px 0;border-bottom:1px solid var(--borda)}
.ref:last-child{border-bottom:0}
.ref .t{font-weight:700;overflow-wrap:anywhere}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-tx);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:99;max-width:calc(100% - 32px)}
.carregando{color:var(--muted);padding:30px 0;text-align:center}

/* topo: voltar e tema */
.topo-acoes{display:flex;gap:8px;align-items:center}
.topo-linha{flex-wrap:nowrap;min-width:0}
.topo-linha > div:first-of-type{min-width:0}
@media (max-width:560px){.topo .sub{display:none}.so-largo{display:none}.topo h1{font-size:15px;line-height:1.2}.logo-topo{height:22px}.topo-linha{gap:8px}}
.btn-tema{width:40px;padding:0;font-size:16px}
.logo-topo{height:26px}
.etapas{display:flex;flex-wrap:wrap;gap:8px}
.etapa-btn{background:var(--card2);border:1px solid var(--borda);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--texto)}
.etapa-btn b{margin-left:4px;color:var(--accent)}
.etapa-btn.ativa{border-color:var(--accent);background:var(--accent-bg)}
.link-btn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:13px}
.check-pill{display:inline-flex;gap:8px;align-items:center;background:var(--card2);border:1px solid var(--borda);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.check-pill input{accent-color:var(--accent)}
.lead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;padding:14px 0;border-bottom:1px solid var(--borda)}
.lead:last-child{border-bottom:0}
.lead-corpo{min-width:0}
.lead-topo{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:2px}
.lead-nome{font-weight:700;font-size:15px;color:var(--texto);overflow-wrap:anywhere}
a.lead-nome{text-decoration:underline;text-decoration-color:var(--borda2);text-underline-offset:3px}
.lead-acoes{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.lead-acoes .btn{text-decoration:none}
@media (max-width:640px){.lead{grid-template-columns:1fr}.lead-acoes{flex-direction:row;flex-wrap:wrap}}
.codigo{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--codigo-bg);border:1px solid var(--borda);border-radius:10px;padding:10px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="tela-login" hidden>
  <form class="login-box" id="form-login">
    <img class="logo-tema" src="/app/painel/logo-intus-dark.png" alt="Intus Fit" onerror="this.style.display='none'">
    <h1>Central de Atendimento</h1>
    <p class="sub">Área do administrador. Entre com o mesmo login do painel.</p>
    <div class="campo"><label for="login-email">E-mail</label><input type="email" id="login-email" autocomplete="username" required></div>
    <div class="campo"><label for="login-senha">Senha</label><input type="password" id="login-senha" autocomplete="current-password" required></div>
    <button class="btn primario" type="submit" id="btn-login" style="width:100%">Entrar</button>
    <p class="erro-msg" id="login-erro" role="alert"></p>
    <p style="text-align:center;margin-top:10px"><a href="/app/painel/index.html">&larr; Voltar ao painel</a></p>
  </form>
</div>

<!-- ============ APP ============ -->
<div id="app" hidden>
<div class="wrap">
  <div class="topo">
    <div class="topo-linha">
      <img class="logo-topo logo-tema" src="/app/painel/logo-intus-dark.png" alt="Intus Fit" onerror="this.style.display='none'">
      <div><h1>Central de Atendimento</h1><div class="sub">Copys, funis, testes e números do WhatsApp</div></div>
      <span class="espaco"></span>
      <div class="topo-acoes"><button class="btn mini btn-tema" id="btn-tema" type="button" aria-label="Alternar entre tema claro e escuro" title="Alternar tema"></button><a class="btn mini" id="btn-voltar" href="/app/painel/index.html">&larr; <span class="so-largo">Voltar ao </span>painel</a></div>
    </div>
    <div class="abas" role="tablist" id="abas">
      <button class="aba" role="tab" data-aba="painel">Painel</button>
      <button class="aba" role="tab" data-aba="fila">Fila de hoje <span class="n" id="n-fila">0</span></button>
      <button class="aba" role="tab" data-aba="leads">Leads</button>
      <button class="aba" role="tab" data-aba="funis">Funis e copys</button>
      <button class="aba" role="tab" data-aba="lab">Laboratório de copy</button>
      <button class="aba" role="tab" data-aba="refs">Referências <span class="n" id="n-refs">0</span></button>
      <button class="aba" role="tab" data-aba="ab">Testes A/B</button>
      <button class="aba" role="tab" data-aba="auto">Automação</button>
    </div>
  </div>
  <div id="conteudo"><p class="carregando">Carregando...</p></div>
</div>
</div>

<script>
(function(){
'use strict';
var API = '/app/api/atendimento.php';
var S = { tok: 0, aba: 'fila', dados: null, funilSel: null, sujo: {}, labModo: 'gerar', labSub: 'escrever', dias: 30, dash: null, ultimaGeracao: null, vars: { '1': 'Ana', '2': 'https://intusfit.com.br/app', '3': 'Carlos' } };

/* ---------- utilidades ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function $(sel, el){ return (el || document).querySelector(sel); }
function $$(sel, el){ return Array.prototype.slice.call((el || document).querySelectorAll(sel)); }
function toast(msg){ var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2800); }
function guardar(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
function ler(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function copiar(texto, aviso){
  function fim(){ toast(aviso || 'Copiado'); }
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(texto).then(fim, function(){ fallback(); }); return; }
  fallback();
  function fallback(){
    var ta = document.createElement('textarea'); ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); fim(); } catch (e) { toast('Não consegui copiar. Selecione e copie à mão.'); }
    ta.remove();
  }
}
function baixar(nome, texto, tipo){
  var b = new Blob([texto], { type: tipo || 'application/json' }); var a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}
function pct(v){ return v == null ? 'sem dados' : String(v).replace('.', ',') + '%'; }
function num(v){ return Number(v || 0).toLocaleString('pt-BR'); }
function debounce(fn, ms){ var t; return function(){ var a = arguments, c = this; clearTimeout(t); t = setTimeout(function(){ fn.apply(c, a); }, ms); }; }
function render(renderer){ return renderer; }
function usd(v){ return 'US$ ' + Number(v || 0).toFixed(4).replace('.', ','); }

/* ---------- tema (mesma chave do painel: mx-theme) ---------- */
function temaAtual(){ return document.documentElement.getAttribute('data-tema') === 'light' ? 'light' : 'dark'; }
function aplicarTema(t){
  document.documentElement.setAttribute('data-tema', t);
  $$('.logo-tema').forEach(function(i){ i.src = '/app/painel/logo-intus-' + (t === 'light' ? 'light' : 'dark') + '.png'; });
  var b = $('#btn-tema'); if (b) { b.textContent = t === 'light' ? '\u263E' : '\u2600'; b.title = t === 'light' ? 'Mudar para o tema escuro' : 'Mudar para o tema claro'; }
  if (S.dados && S.aba === 'painel' && S.dash) pintarPainel($('#conteudo'));   // o gráfico usa variáveis, mas redesenha por garantia
}
$('#btn-tema').addEventListener('click', function(){ var t = temaAtual() === 'light' ? 'dark' : 'light'; guardar('mx-theme', t); aplicarTema(t); });
window.addEventListener('storage', function(ev){ if (ev.key === 'mx-theme' && (ev.newValue === 'light' || ev.newValue === 'dark')) aplicarTema(ev.newValue); });
if (window.matchMedia) {
  var mq = matchMedia('(prefers-color-scheme: light)'), seguir = function(e){ if (ler('mx-theme') !== 'light' && ler('mx-theme') !== 'dark') aplicarTema(e.matches ? 'light' : 'dark'); };
  if (mq.addEventListener) mq.addEventListener('change', seguir); else if (mq.addListener) mq.addListener(seguir);
}
aplicarTema(temaAtual());

/* ---------- sessão ---------- */
function getToken(){ return ler('mx-token') || ''; }
function limparSessao(){ try { localStorage.removeItem('mx-token'); localStorage.removeItem('mx-user'); } catch (e) {} }
function mostrarLogin(msg){ $('#app').hidden = true; $('#tela-login').hidden = false; $('#login-erro').textContent = msg || ''; }
function mostrarApp(){ $('#tela-login').hidden = true; $('#app').hidden = false; }

function api(action, corpo, qs){
  var url = API + '?action=' + encodeURIComponent(action) + (qs || '');
  var opts = { headers: { 'Authorization': 'Bearer ' + getToken() } };
  if (corpo !== undefined && corpo !== null) { opts.method = 'POST'; opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(corpo); }
  return fetch(url, opts).then(function(r){
    if (r.status === 401) { limparSessao(); mostrarLogin('Sessão expirada. Entre de novo.'); throw new Error('sessão'); }
    return r.json().catch(function(){ throw new Error('Resposta inválida do servidor (HTTP ' + r.status + ').'); }).then(function(j){
      if (!j.ok && r.status >= 400) { var e = new Error(j.erro || ('Erro ' + r.status)); e.status = r.status; throw e; }
      return j;
    });
  });
}
function falha(e){ if (e && e.message !== 'sessão') toast(e.message || 'Algo deu errado.'); }

$('#form-login').addEventListener('submit', function(ev){
  ev.preventDefault();
  var b = $('#btn-login'); b.disabled = true; b.textContent = 'Entrando...';
  fetch('/app/api/usuarios.php?action=validar', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: $('#login-email').value.trim(), senha: $('#login-senha').value }) })
  .then(function(r){ return r.json(); }).then(function(d){
    b.disabled = false; b.textContent = 'Entrar';
    if (!d.ok || !d.usuario || !d.usuario.server_token) { $('#login-erro').textContent = d.erro || 'E-mail ou senha inválidos.'; return; }
    guardar('mx-token', d.usuario.server_token); try { localStorage.setItem('mx-user', JSON.stringify(d.usuario)); } catch (e) {}
    iniciar();
  }).catch(function(){ b.disabled = false; b.textContent = 'Entrar'; $('#login-erro').textContent = 'Falha de conexão. Tente de novo.'; });
});

/* ---------- carga ---------- */
function iniciar(){
  if (!getToken()) { mostrarLogin(''); return; }
  mostrarApp();
  var v = ler('atd-vars'); if (v) { try { S.vars = Object.assign(S.vars, JSON.parse(v)); } catch (e) {} }
  api('resumo').then(function(d){ S.dados = d; if (!S.funilSel && d.funis.length) S.funilSel = d.funis[0].id; pintarAbas(); desenhar(); })
  .catch(function(e){
    if (e.status === 403) { $('#conteudo').innerHTML = '<div class="aviso erro">' + esc(e.message) + '</div>'; return; }
    if (e.message !== 'sessão') $('#conteudo').innerHTML = '<div class="aviso erro">' + esc(e.message) + '</div>';
  });
}
function pintarAbas(){
  $$('.aba').forEach(function(b){ b.setAttribute('aria-selected', String(b.getAttribute('data-aba') === S.aba)); });
  $('#n-refs').textContent = S.dados ? S.dados.refs.length : 0;
}
$('#abas').addEventListener('click', function(ev){
  var b = ev.target.closest('.aba'); if (!b) return;
  S.aba = b.getAttribute('data-aba'); pintarAbas(); desenhar(); window.scrollTo(0, 0);
});
function desenhar(){
  if (!S.dados) return;
  var c = $('#conteudo');
  c.onclick = null; c.onchange = null;
  if (S.aba === 'painel') return telaPainel(c);
  if (S.aba === 'fila') return telaFila(c);
  if (S.aba === 'leads') return telaLeads(c);
  if (S.aba === 'funis') return telaFunis(c);
  if (S.aba === 'lab') return telaLab(c);
  if (S.aba === 'refs') return telaRefs(c);
  if (S.aba === 'ab') return telaAB(c);
  if (S.aba === 'auto') return telaAuto(c);
}
function funilPorId(id){ return (S.dados.funis || []).filter(function(f){ return f.id === id; })[0]; }

var ROTULO_ETAPA = { novo: 'Novo', qualificando: 'Qualificando', teste: 'No teste', convertido: 'Convertido', perdido: 'Perdido', saiu: 'Pediu para sair', humano: 'Com uma pessoa' };

function telaPainel(c){

  var tok = ++S.tok;
  c.innerHTML = '<p class="carregando">Carregando números...</p>';
  api('dashboard', null, '&dias=' + S.dias).then(function(d){ if (tok !== S.tok) return; S.dash = d; pintarPainel(c); }).catch(function(e){ falha(e); if (tok === S.tok) c.innerHTML = '<div class="aviso erro">' + esc(e.message) + '</div>'; });
}
function kpi(v, l, s){ return '<div class="kpi"><div class="v' + (v === 'sem dados' ? ' vazio' : '') + '">' + v + '</div><div class="l">' + esc(l) + '</div>' + (s ? '<div class="s">' + esc(s) + '</div>' : '') + '</div>'; }

    + kpi(pct(k.taxa_entrega), 'Taxa de entrega', num(k.entregues) + ' entregues, ' + num(k.falhas) + ' falhas')
    + kpi(pct(k.taxa_leitura), 'Taxa de leitura', num(k.lidas) + ' lidas')
    + kpi(pct(k.taxa_resposta), 'Taxa de resposta', num(k.templates_respondidos) + ' de ' + num(k.templates_enviados) + ' mensagens de funil, em até 24h')
    + kpi(k.mediana_resposta_min == null ? 'sem dados' : (k.mediana_resposta_min < 60 ? Math.round(k.mediana_resposta_min) + ' min' : (k.mediana_resposta_min / 60).toFixed(1).replace('.', ',') + ' h'), 'Tempo mediano de resposta', 'do lead após a mensagem')
    + kpi(pct(k.taxa_saida), 'Pediram para sair', num(k.sairam) + ' pessoas')
    + kpi(num(k.precisam_humano), 'Precisam de uma pessoa', num(k.em_modo_humano) + ' em modo humano')
    + kpi(num(k.convertidos), 'Convertidos', 'etapa convertido, no total')

  h += '<div class="card" style="margin-top:14px"><div class="secao-titulo">Movimento por dia</div>' + graficoSerie(m.serie) + '</div>';

  h += '<div class="grade g2" style="margin-top:14px"><div class="card"><div class="secao-titulo">Funis</div>' + tabelaFunis(m) + '</div>'
    + '<div class="card"><div class="secao-titulo">Etapas dos contatos</div>' + listaEtapas(m) + '</div></div>';

  h += '<div class="card" style="margin-top:14px"><div class="secao-titulo">Desempenho de cada mensagem de funil (templates)</div>' + tabelaTemplates(m) + '</div>';

  h += '<div class="grade g2" style="margin-top:14px"><div class="card"><div class="secao-titulo">Agenda de envios</div>' + blocoAgenda(m) + '</div>'
    + '<div class="card"><div class="secao-titulo">Horário em que as pessoas respondem</div>' + graficoHoras(m.horas_resposta) + '<p class="dica" style="margin-top:6px">Horário de Brasília. Serve para escolher a hora de envio de cada mensagem.</p></div></div>';

function tabelaFunis(m){
  var ids = Object.keys(m.funis || {});
  if (!ids.length) return '<p class="dica">Nenhum contato entrou em funil neste período.</p>';
  var h = '<div class="tabela-rolar"><table><tr><th>Funil</th><th class="n">Contatos</th><th class="n">Receberam</th><th class="n">Responderam</th><th class="n">Taxa</th><th class="n">Saíram</th></tr>';
  ids.forEach(function(id){
    var f = m.funis[id], cad = funilPorId(id);
    h += '<tr><td>' + esc(cad ? cad.nome : id) + '</td><td class="n">' + f.contatos + '</td><td class="n">' + f.receberam + '</td><td class="n">' + f.responderam + '</td><td class="n"><b>' + pct(f.taxa_resposta) + '</b></td><td class="n">' + f.sairam + '</td></tr>';
  });
  return h + '</table></div><p class="dica" style="margin-top:6px">Taxa = quem respondeu depois de receber a primeira mensagem do funil.</p>';
}
function listaEtapas(m){
  var ids = Object.keys(m.etapas || {}); if (!ids.length) return '<p class="dica">Sem contatos ainda.</p>';
  var total = ids.reduce(function(a, i){ return a + m.etapas[i]; }, 0);
  return ids.map(function(i){
    var n = m.etapas[i];
    return '<div style="margin-bottom:8px"><div class="linha"><span>' + esc(ROTULO_ETAPA[i] || i) + '</span><span class="espaco"></span><b>' + n + '</b></div><div class="barra"><i style="width:' + Math.round(n / total * 100) + '%"></i></div></div>';
  }).join('');
}
function tabelaTemplates(m){
  if (!m.templates.length) return '<p class="dica">Nenhuma mensagem de funil foi enviada neste período.</p>';
  var h = '<div class="tabela-rolar"><table><tr><th>Template</th><th class="n">Enviadas</th><th class="n">Entregues</th><th class="n">Lidas</th><th class="n">Falhas</th><th class="n">Respondidas</th><th class="n">Taxa de resposta</th></tr>';
  m.templates.forEach(function(t){
    h += '<tr><td><code>' + esc(t.template) + '</code></td><td class="n">' + t.enviadas + '</td><td class="n">' + t.entregues + '</td><td class="n">' + t.lidas + '</td><td class="n">' + t.falhas + '</td><td class="n">' + t.respondidas + '</td><td class="n"><b>' + pct(t.enviadas ? Math.round(t.respondidas / t.enviadas * 1000) / 10 : null) + '</b></td></tr>';
  });
  return h + '</table></div>';
}
function blocoAgenda(m){
  var st = m.agenda.status, h = '', ids = Object.keys(st);
  if (!ids.length) return '<p class="dica">Nenhum envio agendado ainda.</p>';
  h += '<div class="chips" style="margin-top:0">' + ids.map(function(i){ return '<span class="chip">' + esc(i) + ': <b>' + st[i] + '</b></span>'; }).join('') + '</div>';
  var mo = m.agenda.motivos, mids = Object.keys(mo);
  if (mids.length) h += '<p class="dica" style="margin-top:10px">Por que não saiu:</p><div class="chips">' + mids.map(function(i){ return '<span class="chip">' + esc(i.replace(/_/g, ' ')) + ': <b>' + mo[i] + '</b></span>'; }).join('') + '</div>';
  return h;
}
function eixo(max){ var passo = Math.pow(10, Math.floor(Math.log10(Math.max(1, max)))); return Math.ceil(Math.max(1, max) / passo) * passo; }
function graficoSerie(serie){
  var W = 700, H = 170, pad = 28, n = serie.length;
  var max = eixo(Math.max.apply(null, serie.map(function(s){ return Math.max(s.novos, s.enviadas, s.recebidas); }).concat([1])));
  function x(i){ return pad + (n <= 1 ? 0 : i * (W - pad - 8) / (n - 1)); }
  function y(v){ return H - 22 - (v / max) * (H - 36); }
  function linha(chave, cor){ return '<polyline fill="none" style="stroke:' + cor + '" stroke-width="2" stroke-linejoin="round" points="' + serie.map(function(s, i){ return x(i).toFixed(1) + ',' + y(s[chave]).toFixed(1); }).join(' ') + '"/>'; }
  var g = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Contatos novos, mensagens enviadas e recebidas por dia">';
  [0, .5, 1].forEach(function(f){ var yy = y(max * f); g += '<line x1="' + pad + '" x2="' + (W - 8) + '" y1="' + yy + '" y2="' + yy + '" style="stroke:var(--grade)"/><text x="2" y="' + (yy + 4) + '" style="fill:var(--eixo)" font-size="10">' + Math.round(max * f) + '</text>'; });
  g += linha('enviadas', 'var(--serie2)') + linha('recebidas', 'var(--serie3)') + linha('novos', 'var(--serie1)');
  [0, Math.floor((n - 1) / 2), n - 1].forEach(function(i){ if (serie[i]) g += '<text x="' + x(i) + '" y="' + (H - 4) + '" style="fill:var(--eixo)" font-size="10" text-anchor="' + (i === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle')) + '">' + serie[i].dia.slice(8, 10) + '/' + serie[i].dia.slice(5, 7) + '</text>'; });
  g += '</svg>';
  return '<div class="legenda"><span><i style="background:var(--serie1)"></i>Contatos novos</span><span><i style="background:var(--serie2)"></i>Enviadas</span><span><i style="background:var(--serie3)"></i>Recebidas</span></div>' + g;
}
function graficoHoras(horas){
  var max = Math.max.apply(null, horas.concat([1])), W = 700, H = 120, bw = (W - 20) / 24;
  var g = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Respostas por hora do dia">';
  horas.forEach(function(v, i){ var hh = v / max * (H - 28); g += '<rect x="' + (10 + i * bw + 2) + '" y="' + (H - 18 - hh) + '" width="' + (bw - 4) + '" height="' + hh + '" rx="2" style="fill:var(--serie1)" opacity="' + (v ? 1 : .15) + '"><title>' + i + 'h: ' + v + '</title></rect>'; if (i % 3 === 0) g += '<text x="' + (10 + i * bw + bw / 2) + '" y="' + (H - 4) + '" style="fill:var(--eixo)" font-size="10" text-anchor="middle">' + i + 'h</text>'; });
  return g + '</svg>';
}

    if (b.getAttribute('data-r-acao') === 'excluir') {
      if (!confirm('Excluir esta referência?')) return;
      api('ref_excluir', { id: id }).then(function(){ S.dados.refs = S.dados.refs.filter(function(x){ return x.id !== id; }); pintarAbas(); telaRefs(c); }).catch(falha);
    } else {
      b.disabled = true; b.textContent = 'Lendo...';
      api('ref_ler', { id: id }).then(function(){ return api('resumo'); }).then(function(d){ S.dados.refs = d.refs; telaRefs(c); }).catch(function(e){ b.disabled = false; b.textContent = 'Ler de novo'; falha(e); });
    }
  };
}

/* ================= TESTES A/B ================= */
var GATILHOS = [['teste-gratis', 'Cadastro no teste grátis'], ['indicacao', 'Cadastro por indicação'], ['reativacao', 'Reativação pós-teste']];
function telaAB(c){
  if (S.aba !== 'ab') return;
  var tok = ++S.tok;
  c.innerHTML = '<p class="carregando">Carregando testes...</p>';
  api('dashboard', null, '&dias=90').then(function(d){ if (tok !== S.tok) return; S.dash = d; S.dados.testes = d.testes; pintarAB(c); }).catch(function(e){ falha(e); });
}
function pintarAB(c){
  var d = S.dados, res = S.dash.resultados || {};
  var fOpt = function(sel){ return d.funis.map(function(f){ return '<option value="' + esc(f.id) + '"' + (f.id === sel ? ' selected' : '') + '>' + esc(f.nome) + '</option>'; }).join(''); };
  var h = '<div class="aviso" style="margin-bottom:12px">Um teste A/B coloca duas versões de funil para competir pelo mesmo tipo de contato. Cada pessoa cai sempre no mesmo lado (sorteio pelo telefone). A taxa de resposta só é comparada depois de 30 contatos por lado; antes disso a tela avisa que a amostra é pequena. Para testar um texto, duplique o funil na aba Funis e mude só uma coisa.</div>';
  h += '<div class="card"><div class="secao-titulo">Novo teste</div><div class="grade g3">'
    + '<div class="campo"><label>Nome</label><input type="text" id="t-nome" placeholder="Ex.: abertura curta contra longa"></div>'
    + '<div class="campo"><label>Gatilho</label><select id="t-gatilho">' + GATILHOS.map(function(g){ return '<option value="' + g[0] + '">' + g[1] + '</option>'; }).join('') + '</select></div>'
    + '<div class="campo"><label>Parte que vai para B: <b id="t-pct-v">50</b>%</label><input type="range" id="t-pct" min="5" max="95" value="50"></div>'
    + '<div class="campo"><label>Funil A (controle)</label><select id="t-a">' + fOpt('teste-gratis') + '</select></div>'
    + '<div class="campo"><label>Funil B (variante)</label><select id="t-b">' + fOpt(d.funis.length > 1 ? d.funis[d.funis.length - 1].id : '') + '</select></div>'
    + '<div class="campo"><label>Hipótese</label><input type="text" id="t-hip" placeholder="O que você espera que mude e por quê"></div></div>'
    + '<div class="linha"><button class="btn primario" id="t-criar">Criar teste (rascunho)</button></div></div>';
  h += '<div class="secao-titulo" style="margin-top:18px">Seus testes</div>';
  if (!d.testes.length) h += '<p class="dica">Nenhum teste criado.</p>';
  d.testes.forEach(function(t){
    var fa = funilPorId(t.funil_a), fb = funilPorId(t.funil_b), r = res[t.id] || {}, cmp = r.comparacao;
    h += '<div class="card" data-tid="' + esc(t.id) + '"><div class="linha"><b>' + esc(t.nome) + '</b><span class="badge ' + (t.status === 'rodando' ? 'verde' : (t.status === 'encerrado' ? '' : 'ambar')) + '">' + esc(t.status) + '</span><span class="dica">gatilho: ' + esc(t.gatilho) + ' · B recebe ' + t.pct_b + '%</span><span class="espaco"></span>'
      + (t.status !== 'rodando' && t.status !== 'encerrado' ? '<button class="btn mini primario" data-t-acao="rodar">Iniciar</button>' : '')
      + (t.status === 'rodando' ? '<button class="btn mini" data-t-acao="encerrar">Encerrar</button>' : '')
      + '<button class="btn mini perigo" data-t-acao="excluir">Excluir</button></div>'
      + (t.hipotese ? '<p class="dica" style="margin-top:4px">Hipótese: ' + esc(t.hipotese) + '</p>' : '')
      + '<div class="grade g2" style="margin-top:10px">' + ladoAB('A', fa, r.a) + ladoAB('B', fb, r.b) + '</div>'
      + (cmp ? '<div class="aviso ' + (cmp.veredito === 'a_vence' || cmp.veredito === 'b_vence' ? 'ok' : '') + '" style="margin-top:10px"><b>' + esc(cmp.texto) + '</b></div>' : (r.sem_inicio ? '<p class="dica" style="margin-top:10px">O teste ainda não começou. Os números aparecem depois de iniciar.</p>' : ''))
      + '</div>';
  });
  h += '<p class="dica" style="margin-top:12px">Importante: o sorteio de lado e a comparação já estão prontos. O envio automático das mensagens por funil ainda será ligado na fase da sequência; até lá os testes registram a definição, mas não mandam mensagens sozinhos.</p>';
  c.innerHTML = h;
  $('#t-pct', c).addEventListener('input', function(){ $('#t-pct-v', c).textContent = this.value; });
  $('#t-criar', c).addEventListener('click', function(){
    api('teste_salvar', { teste: { nome: $('#t-nome', c).value, gatilho: $('#t-gatilho', c).value, funil_a: $('#t-a', c).value, funil_b: $('#t-b', c).value, pct_b: parseInt($('#t-pct', c).value, 10), hipotese: $('#t-hip', c).value, status: 'rascunho' } })
    .then(function(){ toast('Teste criado'); telaAB(c); }).catch(falha);
  });
  c.onclick = function(ev){
    var b = ev.target.closest('[data-t-acao]'); if (!b) return; var id = b.closest('[data-tid]').getAttribute('data-tid'), t = S.dados.testes.filter(function(x){ return x.id === id; })[0], a = b.getAttribute('data-t-acao');
    if (a === 'excluir') { if (!confirm('Excluir este teste?')) return; api('teste_excluir', { id: id }).then(function(){ telaAB(c); }).catch(falha); return; }
    api('teste_salvar', { teste: Object.assign({}, t, { status: a === 'rodar' ? 'rodando' : 'encerrado' }) }).then(function(){ toast(a === 'rodar' ? 'Teste iniciado' : 'Teste encerrado'); telaAB(c); }).catch(falha);
  };
}
function ladoAB(rot, f, m){
  m = m || { receberam: 0, responderam: 0, contatos: 0 };
  return '<div class="kpi"><div class="l"><b>' + rot + '</b> · ' + esc(f ? f.nome : '?') + '</div><div class="v">' + pct(m.taxa_resposta) + '</div><div class="s">' + num(m.responderam) + ' responderam de ' + num(m.receberam) + ' que receberam · ' + num(m.contatos) + ' contatos</div></div>';
}

/* ================= AUTOMAÇÃO ================= */
function telaAuto(c){
  if (S.aba !== 'auto') return;
  var tok = ++S.tok;
  c.innerHTML = '<p class="carregando">Montando o pacote...</p>';
  api('exportar').then(function(r){ if (tok !== S.tok) return; pintarAuto(c, r.pacote); }).catch(function(e){ falha(e); });
}
function sim(b){ return b ? '<span class="badge verde">pronto</span>' : '<span class="badge ambar">pendente</span>'; }
function pintarAuto(c, p){
  var pr = S.dados.prontidao, json = JSON.stringify(p, null, 2);
  var h = '<div class="aviso warn" style="margin-bottom:12px"><b>Estado real da automação:</b> ' + esc(pr.automacao_nota) + ' Esta aba entrega o pacote que a automação vai ler e mostra o que falta ligar.</div>';
  h += '<div class="grade g2" style="align-items:start"><div class="card"><div class="secao-titulo">Prontidão</div><table>'
    + '<tr><td>Chave do Claude</td><td>' + sim(pr.claude_chave) + '</td></tr>'
    + '<tr><td>WhatsApp (Meta) conectado</td><td>' + sim(pr.whatsapp_configurado) + '</td></tr>'
    + '<tr><td>Token do CronJob</td><td>' + sim(pr.cron_token) + '</td></tr>'
    + '<tr><td>Modelo do robô</td><td><code>' + esc(pr.modelo) + '</code></td></tr>'
    + '<tr><td>Nome do atendente</td><td>' + esc(pr.atendente) + '</td></tr>'
    + '<tr><td>Envio automático por funil</td><td><span class="badge ambar">não ligado</span></td></tr></table>'
    + '<p class="dica" style="margin-top:8px">Chaves e tokens são cadastrados em <a href="/admin/whatsapp-keys.php" target="_blank" rel="noopener">admin/whatsapp-keys.php</a>. Esta tela nunca mostra os valores.</p></div>'
    + '<div class="card"><div class="secao-titulo">Pacote para a automação</div><p class="dica" style="margin-bottom:8px">Um JSON único com funis, mensagens (com o passo exato que vai na agenda), templates da Meta, regras de horário, testes A/B rodando e conceitos. O robô e a fila de envio leem daqui, então editar nesta tela muda a automação.</p>'
    + '<div class="linha"><button class="btn primario" id="x-copiar">Copiar JSON</button><button class="btn" id="x-baixar">Baixar JSON</button></div></div></div>';
  h += '<div class="card" style="margin-top:14px"><div class="secao-titulo">Templates para cadastrar na Meta (' + p.templates_meta.length + ')</div>'
    + '<p class="dica" style="margin-bottom:8px">No WhatsApp Manager, crie cada um com idioma pt_BR. Fora da janela de 24 horas a Meta só aceita template aprovado. Os avisos de variável no começo ou no fim vêm do analisador: a Meta costuma recusar.</p><div class="tabela-rolar"><table><tr><th>Nome</th><th>Categoria</th><th>Funil</th><th>Texto aprovado?</th><th></th></tr>';
  p.templates_meta.forEach(function(t, i){
    h += '<tr><td><code>' + esc(t.nome) + '</code></td><td>' + esc(t.categoria) + '</td><td>' + esc(t.funil) + '</td><td>' + (t.aprovada_pelo_luiz ? '<span class="badge verde">sim</span>' : '<span class="badge ambar">não</span>') + '</td>'
      + '<td><button class="btn mini" data-tpl="' + i + '">Copiar corpo</button></td></tr>';
  });
  h += '</table></div></div>';
  h += '<div class="card" style="margin-top:14px"><div class="secao-titulo">Como a automação vai usar isto</div><ol style="margin:0;padding-left:20px;color:var(--muted)">'
    + '<li>No cadastro do teste grátis (com consentimento), a fila escolhe o funil do gatilho. Se houver teste A/B rodando, o telefone define o lado.</li>'
    + '<li>A agenda grava um passo por mensagem em <code>intus_wa_agenda</code> (<code>t1..t7</code> no teste grátis, <code>funil:mensagem</code> nos outros).</li>'
    + '<li>O CronJob da KingHost chama o worker; ele só envia dentro de 8h às 21h, no máximo uma mensagem proativa por dia, e respeita SAIR e a condição de cada mensagem.</li>'
    + '<li>Quando a pessoa responde, o robô (Claude) conversa lendo os conceitos e a lista de objeções daqui, e passa para uma pessoa nos casos combinados.</li>'
    + '<li>Este painel mede cada passo e cada funil com os mesmos dados.</li></ol></div>';
  h += '<details class="conceito" style="margin-top:14px"><summary>Ver o JSON</summary><div class="corpo"><div class="codigo">' + esc(json.slice(0, 40000)) + (json.length > 40000 ? '\n... (corte só na tela, o botão copia tudo)' : '') + '</div></div></details>';
  c.innerHTML = h;
  $('#x-copiar', c).addEventListener('click', function(){ copiar(json, 'JSON copiado'); });
  $('#x-baixar', c).addEventListener('click', function(){ baixar('intus-atendimento.json', json); });
  c.onclick = function(ev){ var b = ev.target.closest('[data-tpl]'); if (b) copiar(p.templates_meta[parseInt(b.getAttribute('data-tpl'), 10)].corpo, 'Corpo do template copiado'); };
}

window.addEventListener('beforeunload', function(ev){ if (Object.keys(S.sujo).length) { ev.preventDefault(); ev.returnValue = ''; } });
iniciar();
})();
</script>
</body>
</html>
