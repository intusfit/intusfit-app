workflows:
  ios-testflight:
    name: Intus Fit iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Nome exato da integração criada no Codemagic (Team settings > Integrations > App Store Connect)
      app_store_connect: intus_appstore
    environment:
      xcode: latest
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.intusfit.app
    scripts:
      - name: Instalar dependências do app nativo
        script: |
          cd mobile
          npm ci
      - name: Copiar o app web para dentro do binário e sincronizar o iOS
        script: |
          cd mobile
          npm run build:web
          npx cap sync ios
      - name: Número da versão de build (sobe a cada execução)
        script: |
          cd mobile/ios/App
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $PROJECT_BUILD_NUMBER;/" App.xcodeproj/project.pbxproj
      - name: Aplicar certificado e perfil de assinatura
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "br.com.intusfit.app" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Gerar o .ipa
        script: |
          # Se falhar, mostra na própria página do build as linhas de erro do xcodebuild (o resumo do Codemagic não traz o motivo)
          xcode-project build-ipa --project "mobile/ios/App/App.xcodeproj" --scheme App || {
            echo "=== ERROS DO XCODEBUILD ==="
            grep -h -E "error:|Provisioning profile|entitlement|No profile|requires a provisioning|Signing" /tmp/xcodebuild_logs/*.log | sort -u | head -60
            exit 1
          }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
