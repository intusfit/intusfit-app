<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="icon" href="favicon.ico" type="image/x-icon"/>
  <title>Desafios — Intus</title>
  <script src="_mock.js?v=20260520d"></script>
  <script src="api.js?v=20260520d"></script>
  <style>
    .tabs-bar { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .tab-btn { padding: 12px 20px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; }
    .tab-btn.active { color: var(--brand); border-color: var(--brand); }
    .tab-btn:hover { color: var(--text); }

    .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .d-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 18px; transition: border-color .15s; }
    .d-card:hover { border-color: var(--brand); }
    .d-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .d-card-title { font-size: 15px; font-weight: 700; color: var(--text); }
    .d-card-badge { font-size: 10px; padding: 2px 8px; border-radius: 6px; font-weight: 700; text-transform: uppercase; }
    .d-card-badge.individual { background: rgba(96,165,250,.12); color: #60a5fa; }
    .d-card-badge.desafio { background: rgba(127,255,0,.12); color: var(--brand); }
    .d-card-badge.encerrado { background: rgba(248,113,113,.12); color: #f87171; }
    .d-card-badge.ativo { background: rgba(127,255,0,.12); color: var(--brand); }
    .d-card-info { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .d-card-info b { color: var(--text); }
    .d-card-actions { display: flex; gap: 6px; margin-top: 12px; }
    .d-card-actions .btn { font-size: 11px; padding: 5px 10px; }

    .stat-row { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat-mini { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; min-width: 140px; }
    .stat-mini-label { font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
    .stat-mini-value { font-size: 22px; font-weight: 700; color: var(--text); margin-top: 2px; }

    .participant-list { display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow-y: auto; }
    .participant-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg3); }
    .participant-item .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--brand); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #000; flex-shrink: 0; }
    .participant-item .name { font-size: 13px; font-weight: 500; color: var(--text); flex: 1; }
    .participant-item .rm-btn { background: none; border: none; color: #f87171; cursor: pointer; font-size: 14px; }

    .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; max-height: 250px; overflow-y: auto; }
    .checkbox-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; transition: background .12s; }
    .checkbox-item:hover { background: rgba(127,255,0,.04); }
    .checkbox-item input { accent-color: var(--brand); width: 16px; height: 16px; }
    .checkbox-item label { font-size: 12px; color: var(--text); cursor: pointer; }

    .form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 600px) { .form-2col { grid-template-columns: 1fr; } .grid-cards { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<script>
requireLogin();
renderLayout('Desafios');

const main = document.getElementById('main-content');
const userId = Sessao.atual()?.idusuario || 0;
let activeTab = 'desafios';
let planos = [];
let desafios = [];
let atletas = [];
let usuarios = [];

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function carregar() {
  main.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted);">Carregando...</div>';
  try {
    [planos, desafios, atletas, usuarios] = await Promise.all([
      API.listarPlanosCatalogo(),
      API.listarDesafios(),
      API.listarAtletas(''),
      Promise.resolve(JSON.parse(localStorage.getItem('intus-usuarios') || '[]')),
    ]);
    planos = Array.isArray(planos) ? planos : [];
    desafios = Array.isArray(desafios) ? desafios : [];
    atletas = Array.isArray(atletas) ? atletas : [];
  } catch (e) {
    console.error(e);
  }
  render();
}

function render() {
  main.innerHTML = `
    <div class="tabs-bar">
      <div class="tab-btn ${activeTab==='desafios'?'active':''}" onclick="switchTab('desafios')">🏆 Desafios</div>
      <div class="tab-btn ${activeTab==='planos'?'active':''}" onclick="switchTab('planos')">📋 Catálogo de Planos</div>
    </div>
    ${activeTab === 'desafios' ? renderDesafios() : renderPlanos()}
  `;
}

function switchTab(t) { activeTab = t; render(); }

// ═══════════════ CATÁLOGO DE PLANOS ═══════════════
function renderPlanos() {
  const individuais = planos.filter(p => p.tipo === 'individual');
  const deDesafio = planos.filter(p => p.tipo === 'desafio');
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <h3 style="font-size:16px;font-weight:700;color:var(--text);margin:0;">Catálogo de Planos</h3>
      <button class="btn btn-primary btn-sm" onclick="abrirModalPlano()">+ Novo Plano</button>
    </div>
    <div class="stat-row">
      <div class="stat-mini"><div class="stat-mini-label">Individuais</div><div class="stat-mini-value">${individuais.length}</div></div>
      <div class="stat-mini"><div class="stat-mini-label">De Desafio</div><div class="stat-mini-value">${deDesafio.length}</div></div>
      <div class="stat-mini"><div class="stat-mini-label">Total</div><div class="stat-mini-value">${planos.length}</div></div>
    </div>
    <div class="grid-cards">
      ${planos.length === 0 ? '<div style="padding:40px;text-align:center;color:var(--text-muted);grid-column:1/-1;">Nenhum plano cadastrado. Crie o primeiro!</div>' : ''}
      ${planos.map(p => `
        <div class="d-card">
          <div class="d-card-header">
            <span class="d-card-title">${esc(p.nome)}</span>
            <span class="d-card-badge ${p.tipo}">${p.tipo}</span>
          </div>
          <div class="d-card-info"><b>Duração:</b> ${p.duracao_dias} dias (${Math.round(p.duracao_dias/30)} meses)</div>
          <div class="d-card-info"><b>Valor:</b> R$ ${Number(p.valor).toFixed(2)}</div>
          ${p.descricao ? `<div class="d-card-info">${esc(p.descricao)}</div>` : ''}
          <div class="d-card-actions">
            <button class="btn btn-secondary btn-sm" onclick="abrirModalPlano(${p.idplano})">Editar</button>
            <button class="btn btn-danger btn-sm" onclick="excluirPlano(${p.idplano})">Excluir</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function abrirModalPlano(editId) {
  const p = editId ? planos.find(x => x.idplano === editId) : null;
  openModal(`
    <div class="modal-header">
      <span class="modal-title">${p ? 'Editar Plano' : 'Novo Plano'}</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="label">Nome do Plano</label>
        <input class="input" id="pl-nome" value="${p ? esc(p.nome) : ''}" placeholder="Ex.: Desafio 30 dias, Trimestral treino..."/>
      </div>
      <div class="form-2col">
        <div class="form-group">
          <label class="label">Tipo</label>
          <select class="input" id="pl-tipo">
            <option value="individual" ${!p || p.tipo==='individual'?'selected':''}>Individual</option>
            <option value="desafio" ${p && p.tipo==='desafio'?'selected':''}>Desafio</option>
          </select>
        </div>
        <div class="form-group">
          <label class="label">Duração (dias)</label>
          <input class="input" type="number" id="pl-dias" min="1" value="${p ? p.duracao_dias : 30}"/>
        </div>
      </div>
      <div class="form-group">
        <label class="label">Valor (R$)</label>
        <input class="input" type="number" id="pl-valor" min="0" step="0.01" value="${p ? Number(p.valor).toFixed(2) : ''}"/>
      </div>
      <div class="form-group">
        <label class="label">Descrição (opcional)</label>
        <textarea class="input" id="pl-desc" rows="2" placeholder="Breve descrição do plano...">${p ? esc(p.descricao||'') : ''}</textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarPlano(${editId||0})">Salvar</button>
    </div>
  `);
}

async function salvarPlano(editId) {
  const data = {
    nome: document.getElementById('pl-nome').value.trim(),
    tipo: document.getElementById('pl-tipo').value,
    duracao_dias: parseInt(document.getElementById('pl-dias').value) || 30,
    valor: parseFloat(document.getElementById('pl-valor').value) || 0,
    descricao: document.getElementById('pl-desc').value.trim(),
  };
  if (!data.nome) return showToast('Informe o nome do plano.', 'error');
  try {
    if (editId) await API.editarPlanoCatalogo(editId, data);
    else await API.criarPlanoCatalogo(data);
    closeModal();
    showToast(editId ? 'Plano atualizado!' : 'Plano criado!');
    await carregar();
  } catch (e) { showToast(e.message || 'Erro ao salvar', 'error'); }
}

async function excluirPlano(id) {
  if (!confirm('Excluir este plano do catálogo?')) return;
  try {
    await API.excluirPlanoCatalogo(id);
    showToast('Plano excluído.');
    await carregar();
  } catch (e) { showToast(e.message || 'Erro', 'error'); }
}

// ═══════════════ DESAFIOS ═══════════════
function renderDesafios() {
  const hoje = new Date().toISOString().slice(0,10);
  const ativos = desafios.filter(d => d.ativo && d.dtfim >= hoje);
  const encerrados = desafios.filter(d => !d.ativo || d.dtfim < hoje);

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <h3 style="font-size:16px;font-weight:700;color:var(--text);margin:0;">Desafios</h3>
      <button class="btn btn-primary btn-sm" onclick="abrirModalDesafio()">+ Novo Desafio</button>
    </div>
    <div class="stat-row">
      <div class="stat-mini"><div class="stat-mini-label">Ativos</div><div class="stat-mini-value" style="color:var(--brand);">${ativos.length}</div></div>
      <div class="stat-mini"><div class="stat-mini-label">Encerrados</div><div class="stat-mini-value">${encerrados.length}</div></div>
      <div class="stat-mini"><div class="stat-mini-label">Total Participantes</div><div class="stat-mini-value">${desafios.reduce((s,d) => s + (d.participantes_count||0), 0)}</div></div>
    </div>

    ${ativos.length > 0 ? `<h4 style="font-size:13px;font-weight:700;color:var(--brand);margin:16px 0 10px;">Ativos</h4>` : ''}
    <div class="grid-cards">
      ${ativos.length === 0 && encerrados.length === 0 ? '<div style="padding:40px;text-align:center;color:var(--text-muted);grid-column:1/-1;">Nenhum desafio criado. Monte o primeiro para suas alunas!</div>' : ''}
      ${ativos.map(d => renderDesafioCard(d, hoje)).join('')}
    </div>

    ${encerrados.length > 0 ? `
      <h4 style="font-size:13px;font-weight:700;color:var(--text-muted);margin:24px 0 10px;">Encerrados</h4>
      <div class="grid-cards">
        ${encerrados.map(d => renderDesafioCard(d, hoje)).join('')}
      </div>
    ` : ''}
  `;
}

function renderDesafioCard(d, hoje) {
  const ativo = d.ativo && d.dtfim >= hoje;
  const diasRestantes = ativo ? Math.ceil((new Date(d.dtfim + 'T23:59:59') - new Date()) / (1000*60*60*24)) : 0;
  const plano = planos.find(p => p.idplano === d.idplano);
  return `
    <div class="d-card">
      <div class="d-card-header">
        <span class="d-card-title">${esc(d.nome)}</span>
        <span class="d-card-badge ${ativo?'ativo':'encerrado'}">${ativo ? diasRestantes + 'd restantes' : 'Encerrado'}</span>
      </div>
      <div class="d-card-info"><b>Período:</b> ${fmtDate(d.dtinicio)} — ${fmtDate(d.dtfim)}</div>
      <div class="d-card-info"><b>Participantes:</b> ${d.participantes_count || 0}</div>
      ${plano ? `<div class="d-card-info"><b>Plano:</b> ${esc(plano.nome)}</div>` : ''}
      ${d.descricao ? `<div class="d-card-info">${esc(d.descricao).slice(0,80)}</div>` : ''}
      <div class="d-card-actions">
        <button class="btn btn-primary btn-sm" onclick="abrirDetalheDesafio(${d.iddesafio})">Gerenciar</button>
        <button class="btn btn-secondary btn-sm" onclick="abrirModalDesafio(${d.iddesafio})">Editar</button>
        <button class="btn btn-danger btn-sm" onclick="excluirDesafio(${d.iddesafio})">Excluir</button>
      </div>
    </div>
  `;
}

function fmtDate(dt) {
  if (!dt) return '';
  const [y,m,d] = dt.split('-');
  return `${d}/${m}/${y}`;
}

function abrirModalDesafio(editId) {
  const d = editId ? desafios.find(x => x.iddesafio === editId) : null;
  const planosDesafio = planos.filter(p => p.tipo === 'desafio');
  const hoje = new Date().toISOString().slice(0,10);
  const fim30 = new Date(Date.now() + 30*24*60*60*1000).toISOString().slice(0,10);

  openModal(`
    <div class="modal-header">
      <span class="modal-title">${d ? 'Editar Desafio' : 'Novo Desafio'}</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" style="max-height:70vh;overflow-y:auto;">
      <div class="form-group">
        <label class="label">Nome do Desafio</label>
        <input class="input" id="ds-nome" value="${d ? esc(d.nome) : ''}" placeholder="Ex.: Desafio 30 Dias — Junho"/>
      </div>
      ${planosDesafio.length > 0 ? `
      <div class="form-group">
        <label class="label">Plano vinculado</label>
        <select class="input" id="ds-plano" onchange="aplicarPlanoDesafio(this.value)">
          <option value="">— Nenhum —</option>
          ${planosDesafio.map(p => `<option value="${p.idplano}" ${d && d.idplano===p.idplano?'selected':''}>${esc(p.nome)} (${p.duracao_dias}d — R$${Number(p.valor).toFixed(2)})</option>`).join('')}
        </select>
      </div>` : ''}
      <div class="form-2col">
        <div class="form-group">
          <label class="label">Data Início</label>
          <input class="input" type="date" id="ds-inicio" value="${d ? d.dtinicio : hoje}"/>
        </div>
        <div class="form-group">
          <label class="label">Data Fim</label>
          <input class="input" type="date" id="ds-fim" value="${d ? d.dtfim : fim30}"/>
        </div>
      </div>
      <div class="form-group">
        <label class="label">Descrição (opcional)</label>
        <textarea class="input" id="ds-desc" rows="2" placeholder="Descreva o desafio...">${d ? esc(d.descricao||'') : ''}</textarea>
      </div>
      <div class="form-group">
        <label class="label">Participantes</label>
        <input class="input" placeholder="Buscar aluna..." oninput="filtrarCheckboxes(this.value)" style="margin-bottom:8px;"/>
        <div class="checkbox-grid" id="ds-participantes">
          ${atletas.filter(a => !a.email?.endsWith('@intusfit.local')).map(a => `
            <div class="checkbox-item" data-name="${esc(a.nome).toLowerCase()}">
              <input type="checkbox" id="chk-${a.idatleta}" value="${a.idatleta}" ${d && d.participantes && d.participantes.some(p => Number(p.idatleta||p)===Number(a.idatleta)) ? 'checked' : ''}/>
              <label for="chk-${a.idatleta}">${esc(a.nome)}</label>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="form-group">
        <label class="label">Professores Colaboradores</label>
        <div class="checkbox-grid" id="ds-professores">
          ${usuarios.filter(u => u.ativo !== false).map(u => `
            <div class="checkbox-item">
              <input type="checkbox" id="prof-${u.idusuario}" value="${u.idusuario}" ${d && d.professores && d.professores.includes(Number(u.idusuario)) ? 'checked' : ''}/>
              <label for="prof-${u.idusuario}">${esc(u.nome)}</label>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarDesafio(${editId||0})">Salvar</button>
    </div>
  `);
}

function aplicarPlanoDesafio(idplano) {
  if (!idplano) return;
  const p = planos.find(x => x.idplano === Number(idplano));
  if (!p) return;
  const inicio = document.getElementById('ds-inicio').value || new Date().toISOString().slice(0,10);
  const fimDate = new Date(inicio);
  fimDate.setDate(fimDate.getDate() + p.duracao_dias);
  document.getElementById('ds-fim').value = fimDate.toISOString().slice(0,10);
}

function filtrarCheckboxes(q) {
  q = q.toLowerCase().trim();
  document.querySelectorAll('#ds-participantes .checkbox-item').forEach(el => {
    el.style.display = el.dataset.name.includes(q) ? '' : 'none';
  });
}

async function salvarDesafio(editId) {
  const nome = document.getElementById('ds-nome').value.trim();
  if (!nome) return showToast('Informe o nome do desafio.', 'error');

  const participantes = [...document.querySelectorAll('#ds-participantes input:checked')].map(i => Number(i.value));
  const professores = [...document.querySelectorAll('#ds-professores input:checked')].map(i => Number(i.value));

  const data = {
    nome,
    descricao: document.getElementById('ds-desc').value.trim(),
    idplano: Number(document.getElementById('ds-plano')?.value) || null,
    dtinicio: document.getElementById('ds-inicio').value,
    dtfim: document.getElementById('ds-fim').value,
    participantes,
    professores,
    criado_por: userId,
  };

  try {
    if (editId) await API.editarDesafio(editId, data);
    else await API.criarDesafio(data);
    closeModal();
    showToast(editId ? 'Desafio atualizado!' : 'Desafio criado!');
    await carregar();
  } catch (e) { showToast(e.message || 'Erro ao salvar', 'error'); }
}

async function excluirDesafio(id) {
  if (!confirm('Excluir este desafio e todos os dados vinculados?')) return;
  try {
    await API.excluirDesafio(id);
    showToast('Desafio excluído.');
    await carregar();
  } catch (e) { showToast(e.message || 'Erro', 'error'); }
}

// ═══════════════ DETALHE DO DESAFIO ═══════════════
async function abrirDetalheDesafio(id) {
  let desafio;
  try {
    desafio = await API.obterDesafio(id);
  } catch { desafio = desafios.find(d => d.iddesafio === id); }
  if (!desafio) return showToast('Desafio não encontrado', 'error');

  const hoje = new Date().toISOString().slice(0,10);
  const ativo = desafio.ativo && desafio.dtfim >= hoje;
  const parts = desafio.participantes || [];
  const profs = desafio.professores || [];

  let rankingHTML = '';
  try {
    const ranking = await API.rankingDesafio(id);
    if (Array.isArray(ranking) && ranking.length > 0) {
      const maxSessoes = Math.max(...ranking.map(r => r.sessoes), 1);
      rankingHTML = `
        <h4 style="font-size:13px;font-weight:700;color:var(--brand);margin:16px 0 8px;">🏆 Ranking</h4>
        <div style="display:flex;flex-direction:column;gap:6px;">
          ${ranking.sort((a,b) => b.sessoes - a.sessoes).map((r, i) => {
            const at = atletas.find(a => Number(a.idatleta) === Number(r.idatleta));
            const nome = at ? at.nome : 'Atleta #' + r.idatleta;
            const pct = Math.round((r.sessoes / maxSessoes) * 100);
            const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i+1) + 'º';
            return `<div style="display:flex;align-items:center;gap:10px;">
              <span style="width:28px;text-align:center;font-size:14px;">${medal}</span>
              <span style="flex:1;font-size:12px;font-weight:600;color:var(--text);">${esc(nome)}</span>
              <div style="width:120px;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;">
                <div style="width:${pct}%;height:100%;background:var(--brand);border-radius:4px;"></div>
              </div>
              <span style="font-size:11px;color:var(--text-muted);width:50px;text-align:right;">${r.sessoes} treino${r.sessoes!==1?'s':''}</span>
            </div>`;
          }).join('')}
        </div>
      `;
    }
  } catch {}

  openModal(`
    <div class="modal-header">
      <span class="modal-title">${esc(desafio.nome)}</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" style="max-height:75vh;overflow-y:auto;">
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <span class="d-card-badge ${ativo?'ativo':'encerrado'}">${ativo ? 'Ativo' : 'Encerrado'}</span>
      </div>
      <div class="d-card-info"><b>Período:</b> ${fmtDate(desafio.dtinicio)} — ${fmtDate(desafio.dtfim)}</div>
      ${desafio.descricao ? `<div class="d-card-info" style="margin-top:6px;">${esc(desafio.descricao)}</div>` : ''}

      ${rankingHTML}

      <h4 style="font-size:13px;font-weight:700;color:var(--text);margin:16px 0 8px;">Participantes (${parts.length})</h4>
      <div class="participant-list">
        ${parts.length === 0 ? '<div style="padding:12px;color:var(--text-muted);font-size:12px;">Nenhum participante adicionado.</div>' : ''}
        ${parts.map(p => {
          const at = atletas.find(a => Number(a.idatleta) === Number(p.idatleta || p));
          const nome = at ? at.nome : 'Atleta #' + (p.idatleta || p);
          return `<div class="participant-item">
            <div class="avatar">${nome[0].toUpperCase()}</div>
            <span class="name">${esc(nome)}</span>
            <span style="font-size:10px;color:var(--text-muted);">${p.dtentrada ? fmtDate(p.dtentrada) : ''}</span>
          </div>`;
        }).join('')}
      </div>

      ${profs.length > 0 ? `
        <h4 style="font-size:13px;font-weight:700;color:var(--text);margin:16px 0 8px;">Professores Colaboradores</h4>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${profs.map(uid => {
            const u = usuarios.find(x => Number(x.idusuario) === Number(uid));
            return `<span class="d-card-badge individual">${esc(u ? u.nome : 'Prof #'+uid)}</span>`;
          }).join('')}
        </div>
      ` : ''}
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Fechar</button>
      <button class="btn btn-primary" onclick="closeModal();abrirModalDesafio(${id})">Editar</button>
    </div>
  `);
}

carregar();
</script>
</body>
</html>
