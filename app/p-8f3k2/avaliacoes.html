<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="icon" href="favicon.ico" type="image/x-icon"/>
  <title>Avaliações — Intus</title>
  <script src="_mock.js?v=20260520d"></script>
  <script src="api.js?v=20260520d"></script>
  <style>
    .modal-box.wide { max-width: 680px; }
    .form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-3col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .form-4col { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; }
    .modal-section-title {
      font-size: 10px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.8px;
      padding: 4px 0; border-bottom: 1px solid var(--border); margin: 14px 0 8px;
    }
    .filtros-bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--bg3);
    }
    .filtros-bar select.input { width: auto; min-width: 160px; }
    .empty-state { text-align: center; padding: 48px 20px; color: var(--text-dim); font-size: 13px; }
    .av-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px 20px; margin-bottom: 12px; cursor: pointer; transition: border-color .15s;
    }
    .av-card:hover { border-color: var(--green); }
    .av-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .av-card-name { font-size: 14px; font-weight: 700; color: var(--text); }
    .av-card-date { font-size: 11px; color: var(--text-muted); }
    .av-card-metrics { display: flex; gap: 16px; flex-wrap: wrap; }
    .av-metric { text-align: center; }
    .av-metric-value { font-size: 18px; font-weight: 800; color: var(--green); }
    .av-metric-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
    .av-metric-delta { font-size: 10px; font-weight: 600; margin-top: 2px; }
    .av-metric-delta.up { color: #f87171; }
    .av-metric-delta.down { color: var(--green); }
    .av-metric-delta.neutral { color: var(--text-muted); }
    .imc-badge {
      display: inline-block; padding: 2px 8px; border-radius: 6px;
      font-size: 11px; font-weight: 700;
    }
    .imc-baixo { background: rgba(96,165,250,.15); color: #60a5fa; }
    .imc-normal { background: rgba(127,255,0,.12); color: #7FFF00; }
    .imc-sobrepeso { background: rgba(250,204,21,.12); color: #facc15; }
    .imc-obeso { background: rgba(248,113,113,.12); color: #f87171; }
    .evolucao-container { margin-top: 20px; }
    .evolucao-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .evolucao-header h3 { font-size: 14px; font-weight: 700; color: var(--text); margin: 0; }
    .chart-bar-group { display: flex; align-items: flex-end; gap: 3px; height: 80px; }
    .chart-bar {
      width: 24px; border-radius: 4px 4px 0 0; background: var(--green); opacity: .8;
      transition: opacity .15s; position: relative;
    }
    .chart-bar:hover { opacity: 1; }
    .chart-bar-label { position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); font-size: 9px; color: var(--text-muted); white-space: nowrap; }
    .chart-bar-val { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); font-size: 9px; color: var(--text); font-weight: 600; white-space: nowrap; }
    .medidas-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
    .medida-item { text-align: center; background: var(--bg3); border-radius: 8px; padding: 8px; }
    .medida-item-val { font-size: 16px; font-weight: 700; color: var(--text); }
    .medida-item-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
    .tabs-bar { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .tab-btn { padding: 10px 18px; font-size: 12px; font-weight: 600; color: var(--text-muted); background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; transition: color .15s, border-color .15s; }
    .tab-btn.active { color: var(--green); border-bottom-color: var(--green); }
    .tab-btn:hover { color: var(--text); }
    .method-select { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .method-chip {
      padding: 6px 14px; border-radius: 8px; font-size: 11px; font-weight: 600;
      border: 1px solid var(--border); background: var(--bg3); color: var(--text-muted);
      cursor: pointer; transition: all .15s;
    }
    .method-chip.active { border-color: var(--green); color: var(--green); background: rgba(127,255,0,.08); }
    .method-chip:hover { border-color: var(--green); }
    .dobras-info { font-size: 11px; color: var(--text-muted); margin: 8px 0; font-style: italic; }
    .foto-upload-area {
      border: 2px dashed var(--border); border-radius: 12px; padding: 20px; text-align: center;
      cursor: pointer; transition: border-color .15s;
    }
    .foto-upload-area:hover { border-color: var(--green); }
    .foto-thumb { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; margin: 4px; }
    .anamnese-link {
      display: flex; align-items: center; gap: 10px; padding: 14px 16px;
      background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
      cursor: pointer; transition: border-color .15s; margin-bottom: 12px;
    }
    .anamnese-link:hover { border-color: var(--green); }
  </style>
</head>
<body>
<script>
requireLogin();
renderLayout('Avaliações');

const main = document.getElementById('main-content');

let avaliacoes = [];
let atletas = [];
let filtroAtleta = 0;
let loading = true;
let activeTab = 'lista';

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d) { return d ? new Date(d+'T00:00:00').toLocaleDateString('pt-BR') : '—'; }
function fmtNum(v, dec=1) { return v != null ? Number(v).toFixed(dec).replace('.', ',') : '—'; }

function calcIMC(peso, altura) {
  if (!peso || !altura) return null;
  return peso / (altura * altura);
}

function classIMC(imc) {
  if (imc === null) return { label: '—', cls: '' };
  if (imc < 18.5) return { label: 'Abaixo', cls: 'imc-baixo' };
  if (imc < 25) return { label: 'Normal', cls: 'imc-normal' };
  if (imc < 30) return { label: 'Sobrepeso', cls: 'imc-sobrepeso' };
  return { label: 'Obesidade', cls: 'imc-obeso' };
}

// ═══════════════ POLLOCK / BODY FAT CALCULATIONS ═══════════════
function calcPollock7(dobras, genero, idade) {
  const { subescapular, tricipital, peitoral, axilar, suprailiaca, abdominal, coxa } = dobras;
  const soma = (subescapular||0) + (tricipital||0) + (peitoral||0) + (axilar||0) + (suprailiaca||0) + (abdominal||0) + (coxa||0);
  if (soma <= 0) return null;
  let dc;
  if (genero === 'M') {
    dc = 1.112 - 0.00043499 * soma + 0.00000055 * soma * soma - 0.00028826 * idade;
  } else {
    dc = 1.097 - 0.00046971 * soma + 0.00000056 * soma * soma - 0.00012828 * idade;
  }
  return ((4.95 / dc) - 4.50) * 100;
}

function calcPollock5(dobras, genero, idade) {
  if (genero === 'M') {
    const { peitoral, abdominal, coxa, tricipital, suprailiaca } = dobras;
    const soma = (peitoral||0) + (abdominal||0) + (coxa||0) + (tricipital||0) + (suprailiaca||0);
    if (soma <= 0) return null;
    const dc = 1.112 - 0.00043499 * soma + 0.00000055 * soma * soma - 0.00028826 * idade;
    return ((4.95 / dc) - 4.50) * 100;
  } else {
    const { tricipital, suprailiaca, coxa, abdominal, subescapular } = dobras;
    const soma = (tricipital||0) + (suprailiaca||0) + (coxa||0) + (abdominal||0) + (subescapular||0);
    if (soma <= 0) return null;
    const dc = 1.097 - 0.00046971 * soma + 0.00000056 * soma * soma - 0.00012828 * idade;
    return ((4.95 / dc) - 4.50) * 100;
  }
}

function calcPollock3(dobras, genero, idade) {
  let soma, dc;
  if (genero === 'M') {
    soma = (dobras.peitoral||0) + (dobras.abdominal||0) + (dobras.coxa||0);
    if (soma <= 0) return null;
    dc = 1.10938 - 0.0008267 * soma + 0.0000016 * soma * soma - 0.0002574 * idade;
  } else {
    soma = (dobras.tricipital||0) + (dobras.suprailiaca||0) + (dobras.coxa||0);
    if (soma <= 0) return null;
    dc = 1.0994921 - 0.0009929 * soma + 0.0000023 * soma * soma - 0.0001392 * idade;
  }
  return ((4.95 / dc) - 4.50) * 100;
}

function calcMassaMagra(peso, percGordura) {
  if (!peso || percGordura == null) return null;
  return peso * (1 - percGordura / 100);
}

function calcMassaGorda(peso, percGordura) {
  if (!peso || percGordura == null) return null;
  return peso * (percGordura / 100);
}

async function carregar() {
  loading = true;
  render();
  try {
    const [listaAv, listaAtl] = await Promise.all([
      API.listarAvaliacoes(),
      API.listarAtletas('')
    ]);
    avaliacoes = Array.isArray(listaAv) ? listaAv : [];
    atletas = API.filtrarMeusAtletas(Array.isArray(listaAtl) ? listaAtl : []);
    if (!Sessao.atual()?.admin) {
      const ids = new Set(atletas.map(a => Number(a.idatleta)));
      avaliacoes = avaliacoes.filter(av => ids.has(Number(av.idatleta)));
    }
  } catch (e) {
    console.error('[Avaliações] Erro ao carregar:', e);
  } finally {
    loading = false;
    render();
  }
}

function getNomeAtleta(id) {
  const a = atletas.find(x => Number(x.idatleta) === Number(id));
  return a ? a.nome : 'Aluno #' + id;
}

function getGeneroAtleta(id) {
  const a = atletas.find(x => Number(x.idatleta) === Number(id));
  return a?.genero || 'M';
}

function getIdadeAtleta(id) {
  const a = atletas.find(x => Number(x.idatleta) === Number(id));
  if (!a?.dtnascimento) return 30;
  const birth = new Date(a.dtnascimento + 'T00:00:00');
  const today = new Date();
  let age = today.getFullYear() - birth.getFullYear();
  if (today.getMonth() < birth.getMonth() || (today.getMonth() === birth.getMonth() && today.getDate() < birth.getDate())) age--;
  return age;
}

function getAvaliacoesAtleta(idatleta) {
  return avaliacoes
    .filter(av => Number(av.idatleta) === Number(idatleta))
    .sort((a, b) => (a.dtavaliacao || '').localeCompare(b.dtavaliacao || ''));
}

function getDelta(atual, anterior) {
  if (atual == null || anterior == null) return null;
  return atual - anterior;
}

function renderLista() {
  let lista = [...avaliacoes].sort((a, b) => (b.dtavaliacao || '').localeCompare(a.dtavaliacao || ''));
  if (filtroAtleta > 0) lista = lista.filter(av => Number(av.idatleta) === filtroAtleta);

  if (lista.length === 0) {
    return `<div class="empty-state">
      <div style="font-size:40px;margin-bottom:12px;">📋</div>
      <p>Nenhuma avaliação registrada${filtroAtleta > 0 ? ' para este aluno' : ''}.</p>
      <p style="margin-top:8px;">Clique em <strong>+ Nova Avaliação</strong> para começar.</p>
    </div>`;
  }

  return lista.map(av => {
    const nome = getNomeAtleta(av.idatleta);
    const imc = calcIMC(av.peso, av.altura);
    const imcInfo = classIMC(imc);
    const historico = getAvaliacoesAtleta(av.idatleta);
    const idx = historico.findIndex(x => Number(x.idavaliacao) === Number(av.idavaliacao));
    const prev = idx > 0 ? historico[idx - 1] : null;
    const deltaPeso = getDelta(av.peso, prev?.peso);
    const deltaGord = getDelta(av.percgordura, prev?.percgordura);
    const massaMagra = calcMassaMagra(av.peso, av.percgordura);
    const massaGorda = calcMassaGorda(av.peso, av.percgordura);

    return `
      <div class="av-card" onclick="verAvaliacao(${av.idavaliacao})">
        <div class="av-card-header">
          <span class="av-card-name">${esc(nome)}</span>
          <span class="av-card-date">${fmtDate(av.dtavaliacao)}</span>
        </div>
        <div class="av-card-metrics">
          <div class="av-metric">
            <div class="av-metric-value">${fmtNum(av.peso, 1)}</div>
            <div class="av-metric-label">Peso (kg)</div>
            ${deltaPeso !== null ? `<div class="av-metric-delta ${deltaPeso > 0 ? 'up' : deltaPeso < 0 ? 'down' : 'neutral'}">${deltaPeso > 0 ? '+' : ''}${fmtNum(deltaPeso, 1)} kg</div>` : ''}
          </div>
          ${av.percgordura != null ? `
            <div class="av-metric">
              <div class="av-metric-value">${fmtNum(av.percgordura, 1)}%</div>
              <div class="av-metric-label">Gordura</div>
              ${deltaGord !== null ? `<div class="av-metric-delta ${deltaGord > 0 ? 'up' : deltaGord < 0 ? 'down' : 'neutral'}">${deltaGord > 0 ? '+' : ''}${fmtNum(deltaGord, 1)}%</div>` : ''}
            </div>
            <div class="av-metric">
              <div class="av-metric-value">${fmtNum(massaMagra, 1)}</div>
              <div class="av-metric-label">M. Magra (kg)</div>
            </div>
            <div class="av-metric">
              <div class="av-metric-value">${fmtNum(massaGorda, 1)}</div>
              <div class="av-metric-label">M. Gorda (kg)</div>
            </div>
          ` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function renderEvolucao() {
  if (filtroAtleta <= 0) {
    return `<div class="empty-state">
      <div style="font-size:40px;margin-bottom:12px;">📈</div>
      <p>Selecione um aluno no filtro acima para ver a evolução.</p>
    </div>`;
  }

  const historico = getAvaliacoesAtleta(filtroAtleta);
  if (historico.length === 0) {
    return `<div class="empty-state"><p>Nenhuma avaliação para este aluno.</p></div>`;
  }

  const nome = getNomeAtleta(filtroAtleta);
  const ultima = historico[historico.length - 1];
  const primeira = historico[0];

  const deltaPesoTotal = getDelta(ultima.peso, primeira.peso);
  const deltaGordTotal = getDelta(ultima.percgordura, primeira.percgordura);
  const massaMagra = calcMassaMagra(ultima.peso, ultima.percgordura);
  const massaGorda = calcMassaGorda(ultima.peso, ultima.percgordura);

  let resumoHtml = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px;">
      <div class="av-metric" style="background:var(--bg3);padding:12px;border-radius:10px;">
        <div class="av-metric-value">${historico.length}</div>
        <div class="av-metric-label">Avaliações</div>
      </div>
      <div class="av-metric" style="background:var(--bg3);padding:12px;border-radius:10px;">
        <div class="av-metric-value">${fmtNum(ultima.peso, 1)} kg</div>
        <div class="av-metric-label">Peso Atual</div>
        ${deltaPesoTotal !== null && historico.length > 1 ? `<div class="av-metric-delta ${deltaPesoTotal > 0 ? 'up' : deltaPesoTotal < 0 ? 'down' : 'neutral'}">${deltaPesoTotal > 0 ? '+' : ''}${fmtNum(deltaPesoTotal, 1)} desde início</div>` : ''}
      </div>
      ${ultima.percgordura != null ? `
        <div class="av-metric" style="background:var(--bg3);padding:12px;border-radius:10px;">
          <div class="av-metric-value">${fmtNum(ultima.percgordura, 1)}%</div>
          <div class="av-metric-label">% Gordura Atual</div>
          ${deltaGordTotal !== null && historico.length > 1 ? `<div class="av-metric-delta ${deltaGordTotal > 0 ? 'up' : deltaGordTotal < 0 ? 'down' : 'neutral'}">${deltaGordTotal > 0 ? '+' : ''}${fmtNum(deltaGordTotal, 1)}% desde início</div>` : ''}
        </div>
        <div class="av-metric" style="background:var(--bg3);padding:12px;border-radius:10px;">
          <div class="av-metric-value">${fmtNum(massaMagra, 1)} kg</div>
          <div class="av-metric-label">Massa Magra</div>
        </div>
        <div class="av-metric" style="background:var(--bg3);padding:12px;border-radius:10px;">
          <div class="av-metric-value">${fmtNum(massaGorda, 1)} kg</div>
          <div class="av-metric-label">Massa Gorda</div>
        </div>
      ` : ''}
    </div>
  `;

  // Chart: peso
  const pesoValues = historico.filter(h => h.peso != null).map(h => ({ val: h.peso, dt: h.dtavaliacao }));
  let chartPeso = '';
  if (pesoValues.length > 1) {
    const max = Math.max(...pesoValues.map(p => p.val));
    const min = Math.min(...pesoValues.map(p => p.val));
    const range = max - min || 1;
    chartPeso = `
      <div class="evolucao-header"><h3>Peso (kg)</h3></div>
      <div class="chart-bar-group">
        ${pesoValues.slice(-12).map(p => {
          const h = Math.max(10, ((p.val - min) / range) * 70 + 10);
          return `<div class="chart-bar" style="height:${h}px;">
            <span class="chart-bar-val">${fmtNum(p.val, 1)}</span>
            <span class="chart-bar-label">${p.dt ? p.dt.slice(5).replace('-', '/') : ''}</span>
          </div>`;
        }).join('')}
      </div>
    `;
  }

  // Chart: massa magra
  const magraValues = historico.filter(h => h.percgordura != null && h.peso != null).map(h => ({ val: calcMassaMagra(h.peso, h.percgordura), dt: h.dtavaliacao }));
  let chartMagra = '';
  if (magraValues.length > 1) {
    const max = Math.max(...magraValues.map(p => p.val));
    const min = Math.min(...magraValues.map(p => p.val));
    const range = max - min || 1;
    chartMagra = `
      <div class="evolucao-header" style="margin-top:24px;"><h3>Massa Magra (kg)</h3></div>
      <div class="chart-bar-group">
        ${magraValues.slice(-12).map(p => {
          const h = Math.max(10, ((p.val - min) / range) * 70 + 10);
          return `<div class="chart-bar" style="height:${h}px;background:#60a5fa;">
            <span class="chart-bar-val">${fmtNum(p.val, 1)}</span>
            <span class="chart-bar-label">${p.dt ? p.dt.slice(5).replace('-', '/') : ''}</span>
          </div>`;
        }).join('')}
      </div>
    `;
  }

  // Chart: massa gorda
  const gordaValues = historico.filter(h => h.percgordura != null && h.peso != null).map(h => ({ val: calcMassaGorda(h.peso, h.percgordura), dt: h.dtavaliacao }));
  let chartGorda = '';
  if (gordaValues.length > 1) {
    const max = Math.max(...gordaValues.map(p => p.val));
    const min = Math.min(...gordaValues.map(p => p.val));
    const range = max - min || 1;
    chartGorda = `
      <div class="evolucao-header" style="margin-top:24px;"><h3>Massa Gorda (kg)</h3></div>
      <div class="chart-bar-group">
        ${gordaValues.slice(-12).map(p => {
          const h = Math.max(10, ((p.val - min) / range) * 70 + 10);
          return `<div class="chart-bar" style="height:${h}px;background:#f87171;">
            <span class="chart-bar-val">${fmtNum(p.val, 1)}</span>
            <span class="chart-bar-label">${p.dt ? p.dt.slice(5).replace('-', '/') : ''}</span>
          </div>`;
        }).join('')}
      </div>
    `;
  }

  // Chart: gordura %
  const gordValues = historico.filter(h => h.percgordura != null).map(h => ({ val: h.percgordura, dt: h.dtavaliacao }));
  let chartGord = '';
  if (gordValues.length > 1) {
    const max = Math.max(...gordValues.map(p => p.val));
    const min = Math.min(...gordValues.map(p => p.val));
    const range = max - min || 1;
    chartGord = `
      <div class="evolucao-header" style="margin-top:24px;"><h3>% Gordura</h3></div>
      <div class="chart-bar-group">
        ${gordValues.slice(-12).map(p => {
          const h = Math.max(10, ((p.val - min) / range) * 70 + 10);
          return `<div class="chart-bar" style="height:${h}px;background:#facc15;">
            <span class="chart-bar-val">${fmtNum(p.val, 1)}%</span>
            <span class="chart-bar-label">${p.dt ? p.dt.slice(5).replace('-', '/') : ''}</span>
          </div>`;
        }).join('')}
      </div>
    `;
  }

  // Medidas da última avaliação
  let medidasHtml = '';
  if (ultima.medidas && typeof ultima.medidas === 'object') {
    const entries = Object.entries(ultima.medidas).filter(([k, v]) => v != null && v !== '' && !k.startsWith('dc_'));
    if (entries.length > 0) {
      medidasHtml = `
        <div class="evolucao-header" style="margin-top:24px;"><h3>Medidas Corporais (última avaliação)</h3></div>
        <div class="medidas-grid">
          ${entries.map(([k, v]) => `
            <div class="medida-item">
              <div class="medida-item-val">${esc(String(v))} cm</div>
              <div class="medida-item-label">${esc(MEDIDAS_LABELS[k] || k)}</div>
            </div>
          `).join('')}
        </div>
      `;
    }
  }

  return `
    <div style="margin-bottom:12px;"><span style="font-size:16px;font-weight:700;color:var(--text);">Evolução — ${esc(nome)}</span></div>
    ${resumoHtml}
    ${chartPeso}
    ${chartMagra}
    ${chartGorda}
    ${chartGord}
    ${medidasHtml}
  `;
}

let _anamneseFetched = {};
async function fetchAnamneseRemote(idatleta) {
  if (_anamneseFetched[idatleta]) return;
  _anamneseFetched[idatleta] = true;
  try {
    const data = await API.getAnamnese(idatleta);
    if (data && activeTab === 'anamnese') render();
  } catch {}
}

function renderAnamnese() {
  if (!filtroAtleta) {
    return `<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">Selecione um aluno acima para visualizar a anamnese.</div>`;
  }
  fetchAnamneseRemote(filtroAtleta);
  const nome = getNomeAtleta(filtroAtleta);
  const anamneseKey = 'intus-anamnese-' + filtroAtleta;
  const saved = JSON.parse(localStorage.getItem(anamneseKey) || 'null');

  if (!saved || Object.keys(saved).filter(k => !k.startsWith('_')).length === 0) {
    return `<div style="padding:20px;text-align:center;">
      <p style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:8px;">${esc(nome)}</p>
      <p style="font-size:13px;color:var(--text-muted);">Este aluno ainda não preencheu a anamnese pelo app.</p>
    </div>`;
  }

  const labels = {
    objetivo: 'Objetivo principal', experiencia: 'Experiência com exercícios', frequencia: 'Frequência pretendida',
    patologias: 'Patologias', lesoes: 'Lesões', medicamentos: 'Medicamentos', cirurgias: 'Cirurgias',
    dores: 'Dores ao exercitar', fumante: 'Fumante', etilismo: 'Consumo de álcool', sono: 'Qualidade do sono',
    alimentacao: 'Alimentação', restricao_alimentar: 'Restrições alimentares', nivel_estresse: 'Nível de estresse',
    profissao: 'Profissão/rotina', observacoes: 'Observações',
  };
  const dtResp = saved._timestamp ? new Date(saved._timestamp).toLocaleDateString('pt-BR') : '';

  let html = `<div style="padding:0;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <div>
        <p style="font-size:14px;font-weight:700;color:var(--text);">${esc(nome)}</p>
        ${dtResp ? `<p style="font-size:11px;color:var(--text-muted);">Respondida em ${dtResp}</p>` : ''}
      </div>
    </div>`;

  Object.entries(labels).forEach(([key, label]) => {
    const val = saved[key];
    if (!val) return;
    html += `<div style="margin-bottom:12px;padding:10px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;">
      <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">${label}</div>
      <div style="font-size:13px;color:var(--text);line-height:1.5;">${esc(val)}</div>
    </div>`;
  });

  html += `</div>`;
  return html;
}

const MEDIDAS_LABELS = {
  torax: 'Tórax', cintura: 'Cintura', quadril: 'Quadril',
  braco_d: 'Braço D', braco_e: 'Braço E',
  coxa_d: 'Coxa D', coxa_e: 'Coxa E',
  panturrilha_d: 'Panturrilha D', panturrilha_e: 'Panturrilha E',
  pescoco: 'Pescoço', ombro: 'Ombro', abdomen: 'Abdômen',
};

const DOBRAS_LABELS = {
  dc_subescapular: 'Subescapular', dc_tricipital: 'Tricipital',
  dc_peitoral: 'Peitoral', dc_axilar: 'Axilar Média',
  dc_suprailiaca: 'Suprailíaca', dc_abdominal: 'Abdominal', dc_coxa: 'Coxa',
};

function render() {
  if (loading) {
    main.innerHTML = `<div class="empty-state"><p>Carregando avaliações...</p></div>`;
    return;
  }

  main.innerHTML = `
    <div class="filtros-bar">
      <select class="input" onchange="filtroAtleta=Number(this.value);render();">
        <option value="0">Todos os alunos</option>
        ${atletas.sort((a,b) => (a.nome||'').localeCompare(b.nome||'')).map(a =>
          `<option value="${a.idatleta}" ${Number(a.idatleta)===filtroAtleta?'selected':''}>${esc(a.nome)}</option>`
        ).join('')}
      </select>
      ${hasPerm('av_incluir') ? `<button class="btn btn-primary" onclick="abrirModalNova()">+ Nova Avaliação</button>` : ''}
    </div>

    <div style="padding:20px;">
      <div class="tabs-bar">
        <button class="tab-btn ${activeTab==='lista'?'active':''}" onclick="activeTab='lista';render();">Lista</button>
        <button class="tab-btn ${activeTab==='evolucao'?'active':''}" onclick="activeTab='evolucao';render();">Evolução</button>
        <button class="tab-btn ${activeTab==='anamnese'?'active':''}" onclick="activeTab='anamnese';render();">Anamnese</button>

function abrirModalNova() {
  if (!hasPerm('av_incluir')) return showToast('Sem permissão', 'error');
  abrirModalForm(null);
}

function verAvaliacao(id) {
  const av = avaliacoes.find(x => Number(x.idavaliacao) === Number(id));
  if (!av) return;

  const nome = getNomeAtleta(av.idatleta);
  const imc = calcIMC(av.peso, av.altura);
  const imcInfo = classIMC(imc);
  const massaMagra = calcMassaMagra(av.peso, av.percgordura);
  const massaGorda = calcMassaGorda(av.peso, av.percgordura);

  let medidasHtml = '';
  if (av.medidas && typeof av.medidas === 'object') {
    const periEntries = Object.entries(av.medidas).filter(([k, v]) => v != null && v !== '' && !k.startsWith('dc_'));
    const dobrasEntries = Object.entries(av.medidas).filter(([k, v]) => v != null && v !== '' && k.startsWith('dc_'));

    if (periEntries.length > 0) {
      medidasHtml += `
        <div class="modal-section-title">Perímetros</div>
        <div class="medidas-grid" style="margin-bottom:12px;">
          ${periEntries.map(([k, v]) => `
            <div class="medida-item">
              <div class="medida-item-val">${esc(String(v))} cm</div>
              <div class="medida-item-label">${esc(MEDIDAS_LABELS[k] || k)}</div>
            </div>
          `).join('')}
        </div>
      `;
    }
    if (dobrasEntries.length > 0) {
      medidasHtml += `
        <div class="modal-section-title">Dobras Cutâneas (mm)</div>
        <div class="medidas-grid" style="margin-bottom:12px;">
          ${dobrasEntries.map(([k, v]) => `
            <div class="medida-item">
              <div class="medida-item-val">${esc(String(v))}</div>
              <div class="medida-item-label">${esc(DOBRAS_LABELS[k] || k.replace('dc_',''))}</div>
            </div>
          `).join('')}
        </div>
      `;
    }
  }

  let fotosHtml = '';
  if (av.fotos && Array.isArray(av.fotos) && av.fotos.length > 0) {
    fotosHtml = `
      <div class="modal-section-title">Fotos</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
        ${av.fotos.map(f => `<img src="${esc(f.url || f)}" class="foto-thumb" style="width:80px;height:80px;" onclick="window.open('${esc(f.url || f)}','_blank')"/>`).join('')}
      </div>
    `;
  }

  openModal(`
    <div class="modal-header">
      <div class="modal-title">Avaliação — ${esc(nome)}</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div style="margin-bottom:14px;font-size:12px;color:var(--text-muted);">Data: ${fmtDate(av.dtavaliacao)}${av.metodo ? ' • Método: ' + esc(av.metodo) : ''}</div>

      <div class="form-2col" style="margin-bottom:14px;">
        <div class="av-metric" style="background:var(--bg3);padding:12px;border-radius:10px;">
          <div class="av-metric-value">${fmtNum(av.peso, 1)} kg</div>
          <div class="av-metric-label">Peso</div>
        </div>
        <div class="av-metric" style="background:var(--bg3);padding:12px;border-radius:10px;">
          <div class="av-metric-value">${fmtNum(av.altura, 2)} m</div>
          <div class="av-metric-label">Altura</div>
        </div>
        ${av.percgordura != null ? `
          <div class="av-metric" style="background:var(--bg3);padding:12px;border-radius:10px;">
            <div class="av-metric-value">${fmtNum(av.percgordura, 1)}%</div>
            <div class="av-metric-label">% Gordura</div>
          </div>
        ` : ''}
        ${massaMagra != null ? `
          <div class="av-metric" style="background:var(--bg3);padding:12px;border-radius:10px;">
            <div class="av-metric-value">${fmtNum(massaMagra, 1)} kg</div>
            <div class="av-metric-label">Massa Magra</div>
          </div>
        ` : ''}
        ${massaGorda != null ? `
          <div class="av-metric" style="background:var(--bg3);padding:12px;border-radius:10px;">
            <div class="av-metric-value">${fmtNum(massaGorda, 1)} kg</div>
            <div class="av-metric-label">Massa Gorda</div>
          </div>
        ` : ''}
        ${imc !== null ? `
          <div class="av-metric" style="background:var(--bg3);padding:12px;border-radius:10px;">
            <div class="av-metric-value">${fmtNum(imc, 1)} <span class="imc-badge ${imcInfo.cls}">${imcInfo.label}</span></div>
            <div class="av-metric-label">IMC</div>
          </div>
        ` : ''}
      </div>

      ${medidasHtml}
      ${fotosHtml}

      ${av.observacao ? `
        <div class="modal-section-title">Observação</div>
        <div style="font-size:13px;color:var(--text);white-space:pre-wrap;line-height:1.5;">${esc(av.observacao)}</div>
      ` : ''}
    </div>
    <div class="modal-footer">
      ${hasPerm('av_excluir') ? `<button class="btn btn-danger" onclick="excluirAvaliacao(${av.idavaliacao})">Excluir</button>` : ''}
      ${hasPerm('av_editar') ? `<button class="btn btn-primary" onclick="closeModal();abrirModalForm(${av.idavaliacao})">Editar</button>` : ''}
      <button class="btn btn-secondary" onclick="closeModal()">Fechar</button>
    </div>
  `);
}

  function updateIMC() {
    const p = parseFloat(pesoInput?.value);
    const a = parseFloat(alturaInput?.value);
    const display = document.getElementById('av-imc-display');
    if (!display) return;
    if (p > 0 && a > 0) {
      const imc = p / (a * a);
      const info = classIMC(imc);
      display.innerHTML = `IMC: <strong>${fmtNum(imc, 1)}</strong> <span class="imc-badge ${info.cls}">${info.label}</span>`;
    } else {
      display.innerHTML = '';
    }
  }
  pesoInput?.addEventListener('input', updateIMC);
  alturaInput?.addEventListener('input', updateIMC);
  updateIMC();

function renderDobrasFields(metodo, medidas) {
  if (metodo === 'manual') {
    return `<div class="dobras-info">Informe o % de gordura diretamente no campo acima.</div>`;
  }

  if (metodo === 'bioimpedancia') {
    return `<div class="dobras-info">Bioimpedância: Informe o % de gordura no campo acima conforme resultado do aparelho.</div>
    <div class="form-2col">
      <div class="form-group"><label class="label">Massa Magra (kg)</label><input id="med-bio_massa_magra" type="number" step="0.1" class="input dc-input" value="${medidas.bio_massa_magra ?? ''}"/></div>
      <div class="form-group"><label class="label">Água Corporal (%)</label><input id="med-bio_agua" type="number" step="0.1" class="input dc-input" value="${medidas.bio_agua ?? ''}"/></div>
      <div class="form-group"><label class="label">Gordura Visceral</label><input id="med-bio_visceral" type="number" step="1" class="input dc-input" value="${medidas.bio_visceral ?? ''}"/></div>
      <div class="form-group"><label class="label">Taxa Metabólica (kcal)</label><input id="med-bio_tmb" type="number" step="1" class="input dc-input" value="${medidas.bio_tmb ?? ''}"/></div>
    </div>`;
  }

  if (metodo === 'dexa') {
    return `<div class="dobras-info">DEXA (Densitometria): Informe o % de gordura e dados adicionais do exame.</div>
    <div class="form-2col">
      <div class="form-group"><label class="label">Gordura Android (%)</label><input id="med-dexa_android" type="number" step="0.1" class="input dc-input" value="${medidas.dexa_android ?? ''}"/></div>
      <div class="form-group"><label class="label">Gordura Ginóide (%)</label><input id="med-dexa_ginoide" type="number" step="0.1" class="input dc-input" value="${medidas.dexa_ginoide ?? ''}"/></div>
      <div class="form-group"><label class="label">Massa Óssea (kg)</label><input id="med-dexa_ossea" type="number" step="0.01" class="input dc-input" value="${medidas.dexa_ossea ?? ''}"/></div>
      <div class="form-group"><label class="label">Relação A/G</label><input id="med-dexa_ag" type="number" step="0.01" class="input dc-input" value="${medidas.dexa_ag ?? ''}"/></div>
    </div>`;
  }

  if (metodo === 'ultrassom') {
    return `<div class="dobras-info">Ultrassom: Informe o % de gordura do laudo e espessuras medidas.</div>
    <div class="form-3col">
      <div class="form-group"><label class="label">Abdômen (mm)</label><input id="med-us_abdomen" type="number" step="0.1" class="input dc-input" value="${medidas.us_abdomen ?? ''}"/></div>
      <div class="form-group"><label class="label">Coxa (mm)</label><input id="med-us_coxa" type="number" step="0.1" class="input dc-input" value="${medidas.us_coxa ?? ''}"/></div>
      <div class="form-group"><label class="label">Braço (mm)</label><input id="med-us_braco" type="number" step="0.1" class="input dc-input" value="${medidas.us_braco ?? ''}"/></div>
    </div>`;
  }

  const all7 = ['dc_subescapular','dc_tricipital','dc_peitoral','dc_axilar','dc_suprailiaca','dc_abdominal','dc_coxa'];
  let fields = all7;
  let info = 'Pollock 7 dobras: Subescapular, Tricipital, Peitoral, Axilar Média, Suprailíaca, Abdominal, Coxa';

  if (metodo === 'pollock5') {
    fields = ['dc_tricipital','dc_peitoral','dc_abdominal','dc_suprailiaca','dc_subescapular','dc_coxa'];
    info = 'Pollock 5 dobras (Homem: Peitoral, Abdominal, Coxa, Tricipital, Suprailíaca / Mulher: Tricipital, Suprailíaca, Coxa, Abdominal, Subescapular)';
  } else if (metodo === 'pollock3') {
    fields = ['dc_peitoral','dc_abdominal','dc_coxa','dc_tricipital','dc_suprailiaca'];
    info = 'Pollock 3 dobras (Homem: Peitoral, Abdominal, Coxa / Mulher: Tricipital, Suprailíaca, Coxa)';
  }

  return `
    <div class="dobras-info">${info}</div>
    <div class="form-3col">
      ${fields.map(k => `
        <div class="form-group">
          <label class="label">${DOBRAS_LABELS[k] || k} (mm)</label>
          <input id="med-${k}" type="number" step="0.1" class="input dc-input" value="${medidas[k] ?? ''}" oninput="calcularGorduraAuto()"/>
        </div>
      `).join('')}
    </div>
  `;
}

function selecionarMetodo(metodo) {
  metodoSelecionado = metodo;
  const container = document.getElementById('dobras-container');
  const medidas = {};
  document.querySelectorAll('.dc-input').forEach(el => {
    const key = el.id.replace('med-', '');
    if (el.value) medidas[key] = parseFloat(el.value);
  });
  container.innerHTML = renderDobrasFields(metodo, medidas);
  document.querySelectorAll('.method-chip').forEach(el => el.classList.remove('active'));
  event.target.classList.add('active');
}

function calcularGorduraAuto() {
  if (metodoSelecionado === 'manual' || metodoSelecionado === 'bioimpedancia' || metodoSelecionado === 'dexa' || metodoSelecionado === 'ultrassom') return;
  const idatleta = Number(document.getElementById('av-atleta')?.value);
  if (!idatleta) return;

  const genero = getGeneroAtleta(idatleta);
  const idade = getIdadeAtleta(idatleta);

  const dobras = {};
  ['dc_subescapular','dc_tricipital','dc_peitoral','dc_axilar','dc_suprailiaca','dc_abdominal','dc_coxa'].forEach(k => {
    const el = document.getElementById('med-' + k);
    if (el && el.value) dobras[k.replace('dc_','')] = parseFloat(el.value);
  });

  let perc = null;
  if (metodoSelecionado === 'pollock7') perc = calcPollock7(dobras, genero, idade);
  else if (metodoSelecionado === 'pollock5') perc = calcPollock5(dobras, genero, idade);
  else if (metodoSelecionado === 'pollock3') perc = calcPollock3(dobras, genero, idade);

  if (perc !== null && perc > 0 && perc < 60) {
    document.getElementById('av-gordura').value = perc.toFixed(1);
  }
}

let fotosParaUpload = [];

function previewFotos(input) {
  const container = document.getElementById('fotos-preview');
  fotosParaUpload = Array.from(input.files);
  container.innerHTML = fotosParaUpload.map((f, i) => {
    const url = URL.createObjectURL(f);
    return `<img src="${url}" class="foto-thumb"/>`;
  }).join('');
}

async function salvarAvaliacao(idavaliacao) {
  const idatleta = Number(document.getElementById('av-atleta')?.value);
  const dtavaliacao = document.getElementById('av-data')?.value;
  if (!idatleta) return showToast('Selecione um aluno', 'error');
  if (!dtavaliacao) return showToast('Informe a data', 'error');

  const peso = document.getElementById('av-peso')?.value ? parseFloat(document.getElementById('av-peso').value) : null;
  const altura = document.getElementById('av-altura')?.value ? parseFloat(document.getElementById('av-altura').value) : null;
  const percgordura = document.getElementById('av-gordura')?.value ? parseFloat(document.getElementById('av-gordura').value) : null;
  const observacao = document.getElementById('av-obs')?.value || '';

  const medidaKeys = ['torax','ombro','pescoco','cintura','abdomen','quadril','braco_d','braco_e','coxa_d','coxa_e','panturrilha_d','panturrilha_e'];
  const dobrasKeys = ['dc_subescapular','dc_tricipital','dc_peitoral','dc_axilar','dc_suprailiaca','dc_abdominal','dc_coxa'];
  const medidas = {};
  let hasMedidas = false;
  medidaKeys.forEach(k => {
    const el = document.getElementById('med-' + k);
    if (el && el.value) { medidas[k] = parseFloat(el.value); hasMedidas = true; }
  });
  dobrasKeys.forEach(k => {
    const el = document.getElementById('med-' + k);
    if (el && el.value) { medidas[k] = parseFloat(el.value); hasMedidas = true; }
  });
  document.querySelectorAll('.dc-input').forEach(el => {
    const key = el.id.replace('med-', '');
    if (el.value && !medidas[key]) { medidas[key] = parseFloat(el.value); hasMedidas = true; }
  });

  const data = {
    idatleta, dtavaliacao, peso, altura, percgordura, observacao,
    medidas: hasMedidas ? medidas : null,
    metodo: metodoSelecionado !== 'manual' ? metodoSelecionado : null,
  };

  // Upload fotos ao Drive se houver
  if (fotosParaUpload.length > 0) {
    try {
      const nomeAluno = getNomeAtleta(idatleta).replace(/[^a-zA-ZÀ-ú0-9 ]/g, '').trim();
      const mes = new Date(dtavaliacao).toLocaleString('pt-BR', { month: 'long', year: 'numeric' });
      showToast('Enviando fotos ao Drive...');
      const urls = await uploadFotosDrive(fotosParaUpload, nomeAluno, mes);
      data.fotos = urls;
    } catch (e) {
      console.error('Erro ao enviar fotos:', e);
      showToast('Fotos não enviadas (erro no Drive), salvando avaliação sem fotos', 'error');
    }
  }

  try {
    if (idavaliacao > 0) {
      await API.editarAvaliacao(idavaliacao, data);
      showToast('Avaliação atualizada!');
    } else {
      await API.criarAvaliacao(data);
      showToast('Avaliação criada!');
    }
    fotosParaUpload = [];
    closeModal();
    await carregar();
  } catch (e) {
    showToast('Erro: ' + e.message, 'error');
  }
}

async function uploadFotosDrive(files, nomeAluno, mes) {
  // Google Drive folder: 1ESaxQYnGRwdfYU1q7vBPXaQTCEXf0spw
  // Structure: /{nomeAluno}/{mes}/foto.jpg
  const DRIVE_FOLDER_ID = '1ESaxQYnGRwdfYU1q7vBPXaQTCEXf0spw';
  const urls = [];

  for (const file of files) {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('folder_id', DRIVE_FOLDER_ID);
    formData.append('path', `${nomeAluno}/${mes}`);
    try {
      const resp = await fetch(API_BASE.replace('/api', '/api') + '/upload-drive.php', {
        method: 'POST',
        body: formData,
      });
      const json = await resp.json();
      if (json.url) urls.push({ url: json.url, name: file.name });
    } catch (e) {
      console.error('Upload falhou:', file.name, e);
    }
  }
  return urls;
}

async function excluirAvaliacao(id) {
  if (!hasPerm('av_excluir')) return showToast('Sem permissão para excluir avaliações.', 'error');
  if (!confirm('Excluir esta avaliação? Essa ação não pode ser desfeita.')) return;
  try {
    await API.excluirAvaliacao(id);
    showToast('Avaliação excluída');
    closeModal();
    await carregar();
  } catch (e) {
    showToast('Erro: ' + e.message, 'error');
  }
}

carregar();
</script>
