<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="icon" href="favicon.ico" type="image/x-icon"/>
  <title>Notificações — Intus</title>
  <script src="_mock.js?v=20260520d"></script>
  <script src="api.js?v=20260520d"></script>
  <style>
    .ntf-tabs { display: flex; gap: 4px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
    .ntf-tab {
      padding: 8px 16px; font-size: 12px; font-weight: 600; border-radius: 8px;
      background: var(--bg3); color: var(--text-muted); border: 1px solid var(--border);
      cursor: pointer; white-space: nowrap; transition: .15s;
    }
    .ntf-tab:hover { color: var(--text); background: var(--bg2); }
    .ntf-tab.active { background: rgba(127,255,0,.12); color: #7FFF00; border-color: rgba(127,255,0,.3); }

    .ntf-section { display: none; }
    .ntf-section.active { display: block; }

    .ntf-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
      padding: 20px; margin-bottom: 16px;
    }
    .ntf-card h3 {
      font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 4px;
      display: flex; align-items: center; gap: 8px;
    }
    .ntf-card .ntf-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }

    .ntf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .ntf-row.full { grid-template-columns: 1fr; }
    @media (max-width: 600px) { .ntf-row { grid-template-columns: 1fr; } }

    .ntf-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
    .ntf-input {
      width: 100%; padding: 10px 12px; font-size: 13px; background: var(--bg3);
      border: 1px solid var(--border); border-radius: 8px; color: var(--text);
      font-family: inherit; transition: border-color .15s;
    }
    .ntf-input:focus { outline: none; border-color: #7FFF00; }
    textarea.ntf-input { min-height: 80px; resize: vertical; }
    select.ntf-input { cursor: pointer; }

    .ntf-save {
      padding: 10px 24px; font-size: 13px; font-weight: 700; border-radius: 8px;
      background: #7FFF00; color: #000; border: none; cursor: pointer; transition: .15s;
    }
    .ntf-save:hover { background: #6be600; transform: translateY(-1px); }
    .ntf-save.secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
    .ntf-save.secondary:hover { background: var(--bg2); transform: none; }

    .ntf-occasion {
      display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px;
      background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
      margin-bottom: 10px; transition: border-color .15s;
    }
    .ntf-occasion:hover { border-color: rgba(127,255,0,.25); }
    .ntf-occasion .occ-toggle { flex-shrink: 0; margin-top: 2px; }
    .ntf-occasion .occ-body { flex: 1; }
    .ntf-occasion .occ-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .ntf-occasion .occ-sub { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
    .ntf-occasion textarea {
      width: 100%; padding: 8px 10px; font-size: 12px; background: var(--bg2);
      border: 1px solid var(--border); border-radius: 6px; color: var(--text);
      font-family: inherit; resize: vertical; min-height: 50px;
    }
    .ntf-occasion textarea:focus { outline: none; border-color: #7FFF00; }
    .ntf-occasion .occ-vars { font-size: 10px; color: var(--text-muted); margin-top: 4px; }

    .toggle-sm { position: relative; width: 38px; height: 22px; display: inline-block; }
    .toggle-sm input { opacity: 0; width: 0; height: 0; }
    .toggle-sm .sl {
      position: absolute; inset: 0; background: #444; border-radius: 22px; cursor: pointer; transition: .2s;
    }
    .toggle-sm .sl::before {
      content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%; transition: .2s;
    }
    .toggle-sm input:checked + .sl { background: #7FFF00; }
    .toggle-sm input:checked + .sl::before { transform: translateX(16px); }

    .ntf-hist-list { max-height: 400px; overflow-y: auto; }
    .ntf-hist-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .ntf-hist-item:last-child { border-bottom: none; }
    .ntf-hist-item .hist-icon { font-size: 16px; opacity: .7; }
    .ntf-hist-item .hist-body { flex: 1; }
    .ntf-hist-item .hist-title { font-size: 12px; font-weight: 600; color: var(--text); }
    .ntf-hist-item .hist-meta { font-size: 11px; color: var(--text-muted); }
    .ntf-hist-item .hist-status { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
    .ntf-hist-item .hist-status.sent { background: rgba(127,255,0,.12); color: #7FFF00; }
    .ntf-hist-item .hist-status.pending { background: rgba(255,165,0,.12); color: #ffa500; }
    .ntf-hist-item .hist-status.failed { background: rgba(255,60,60,.12); color: #ff5555; }
  </style>
</head>
<body>
<script>
requireLogin();
renderLayout('Notificações');

const main = document.getElementById('main-content');
const NTF_KEY = 'intus-notificacoes-config';
const NTF_HIST_KEY = 'intus-notificacoes-historico';

function loadNtfConfig() {
  try { return JSON.parse(localStorage.getItem(NTF_KEY) || '{}'); } catch { return {}; }
}
function saveNtfConfig(cfg) { localStorage.setItem(NTF_KEY, JSON.stringify(cfg)); }
function loadHist() {
  try { return JSON.parse(localStorage.getItem(NTF_HIST_KEY) || '[]'); } catch { return []; }
}
function saveHist(h) { localStorage.setItem(NTF_HIST_KEY, JSON.stringify(h)); }

const OCCASIONS = [
  {
    id: 'boas_vindas',
    title: 'Boas-vindas',
    desc: 'Enviada automaticamente quando um novo aluno se cadastra.',
    defaultMsg: 'Bem-vindo(a) ao Intus Fit, {nome}! 🎉 Seu teste grátis de {dias_teste} dias está ativo. Aproveite seus treinos!',
    vars: '{nome}, {email}, {dias_teste}, {plano}',
  },
  {
    id: 'teste_expirando',
    title: 'Teste expirando',
    desc: 'Enviada 1 dia antes do teste grátis vencer.',
    defaultMsg: 'Oi {nome}! Seu teste grátis vence amanhã. Gostou dos treinos? Fale com a gente para continuar! 💪',
    vars: '{nome}, {dias_restantes}, {data_vencimento}',
  },
  {
    id: 'teste_expirado',
    title: 'Teste expirado',
    desc: 'Enviada quando o teste grátis vence.',
    defaultMsg: '{nome}, seu período de teste terminou. Que tal assinar um plano e continuar evoluindo? Entre em contato com o suporte!',
    vars: '{nome}, {data_vencimento}',
  },
  {
    id: 'mensalidade_vencendo',
    title: 'Mensalidade vencendo',
    desc: 'Enviada X dias antes do vencimento da mensalidade.',
    defaultMsg: 'Oi {nome}! Sua mensalidade vence em {dias_restantes} dia(s) ({data_vencimento}). Não esqueça de renovar para não perder o acesso!',
    vars: '{nome}, {dias_restantes}, {data_vencimento}, {valor}',
  },
  {
    id: 'mensalidade_vencida',
    title: 'Mensalidade vencida',
    desc: 'Enviada quando a mensalidade vence (acesso bloqueado).',
    defaultMsg: '{nome}, sua mensalidade venceu. Regularize para voltar a acessar seus treinos. Qualquer dúvida, fale com o suporte!',
    vars: '{nome}, {data_vencimento}, {dias_atraso}',
  },
  {
    id: 'aniversario',
    title: 'Aniversário',
    desc: 'Enviada no dia do aniversário do aluno.',
    defaultMsg: 'Feliz aniversário, {nome}! 🎂🎉 O Intus Fit deseja um dia incrível! Continue firme nos treinos! 💪',
    vars: '{nome}, {idade}',
  },
  {
    id: 'ficha_nova',
    title: 'Nova ficha de treino',
    desc: 'Enviada quando o professor cria/atualiza uma ficha para o aluno.',
    defaultMsg: '{nome}, você tem uma nova ficha de treino! Abra o app para conferir: {nome_ficha} 📋',
    vars: '{nome}, {nome_ficha}, {professor}',
  },
  {
    id: 'inatividade',
    title: 'Inatividade',
    desc: 'Enviada quando o aluno não registra treino há X dias.',
    defaultMsg: 'Oi {nome}! Sentimos sua falta! 😢 Faz {dias_inativo} dias desde seu último treino. Vamos voltar?',
    vars: '{nome}, {dias_inativo}, {ultimo_treino}',
  },
  {
    id: 'avaliacao_disponivel',
    title: 'Avaliação disponível',
    desc: 'Enviada quando uma nova avaliação física é registrada para o aluno.',
    defaultMsg: '{nome}, sua avaliação física foi atualizada! Confira seus resultados no app. 📈',
    vars: '{nome}, {data_avaliacao}',
  },
  {
    id: 'lembrete_treino',
    title: 'Lembrete de treino',
    desc: 'Lembrete diário para treinar (configurável por horário).',
    defaultMsg: 'Bora treinar, {nome}? 💪 Seu treino de hoje está te esperando no app!',
    vars: '{nome}, {treino_hoje}',
  },
];

function getOccasionConfig(id) {
  const cfg = loadNtfConfig();
  const occasions = cfg.occasions || {};
  return occasions[id] || {};
}

function render() {
  const cfg = loadNtfConfig();
  const hist = loadHist();
  const atletas = JSON.parse(localStorage.getItem('intus-atletas') || '[]')
    .filter(a => a.email && !a.email.endsWith('@intusfit.local'));

  main.innerHTML = `
    <div class="ntf-tabs">
      <button class="ntf-tab active" data-tab="automaticas">Automáticas</button>
      <button class="ntf-tab" data-tab="individual">Enviar Individual</button>
      <button class="ntf-tab" data-tab="historico">Histórico</button>
      <button class="ntf-tab" data-tab="config">Configuração</button>
    </div>

    <!-- AUTOMÁTICAS -->
    <div class="ntf-section active" id="sec-automaticas">
      <div class="ntf-card">
        <h3>🔔 Notificações Automáticas</h3>
        <p class="ntf-desc">Configure as mensagens enviadas automaticamente em cada ocasião. Ative/desative individualmente. Variáveis entre {chaves} são substituídas pelos dados do aluno.</p>
      </div>
      ${OCCASIONS.map(occ => {
        const ocfg = getOccasionConfig(occ.id);
        const ativo = ocfg.ativo !== false;
        const msg = ocfg.mensagem || occ.defaultMsg;
        const canal = ocfg.canal || 'whatsapp';
        return `
        <div class="ntf-occasion">
          <div class="occ-toggle">
            <label class="toggle-sm">
              <input type="checkbox" data-occ="${occ.id}" ${ativo ? 'checked' : ''} onchange="toggleOccasion('${occ.id}', this.checked)"/>
              <span class="sl"></span>
            </label>
          </div>
          <div class="occ-body">
            <div class="occ-title">${occ.title}</div>
            <div class="occ-sub">${occ.desc}</div>
            <textarea id="msg-${occ.id}" ${!ativo ? 'disabled style="opacity:.5;"' : ''}>${esc(msg)}</textarea>
            <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
              <select class="ntf-input" id="canal-${occ.id}" style="width:auto;padding:4px 8px;font-size:11px;" ${!ativo ? 'disabled' : ''}>
                <option value="whatsapp" ${canal==='whatsapp'?'selected':''}>WhatsApp</option>
                <option value="email" ${canal==='email'?'selected':''}>E-mail</option>
                <option value="push" ${canal==='push'?'selected':''}>Push (app)</option>
                <option value="todos" ${canal==='todos'?'selected':''}>Todos</option>
              </select>
              <span class="occ-vars">Variáveis: ${occ.vars}</span>
            </div>
          </div>
        </div>`;
      }).join('')}
      <button class="ntf-save" onclick="salvarAutomaticas()">Salvar configurações</button>
    </div>

    <!-- ENVIAR INDIVIDUAL -->
    <div class="ntf-section" id="sec-individual">
      <div class="ntf-card">
        <h3>📤 Notificação Individual</h3>
        <p class="ntf-desc">Envie uma mensagem única para um aluno específico ou para todos.</p>

        <div class="ntf-row">
          <div>
            <div class="ntf-label">Destinatário</div>
            <select class="ntf-input" id="ntf-dest">
              <option value="todos">📢 Todos os alunos ativos</option>
              ${atletas.filter(a => a.stbloqueio !== 'S').map(a => `<option value="${a.idatleta}">${esc(a.nome)} (${esc(a.email||'')})</option>`).join('')}
            </select>
          </div>
          <div>
            <div class="ntf-label">Canal</div>
            <select class="ntf-input" id="ntf-canal-ind">
              <option value="whatsapp">WhatsApp</option>
              <option value="email">E-mail</option>
              <option value="push">Push (app)</option>
            </select>
          </div>
        </div>

        <div class="ntf-row full">
          <div>
            <div class="ntf-label">Assunto (e-mail)</div>
            <input class="ntf-input" id="ntf-assunto" placeholder="Assunto do e-mail (opcional para WhatsApp)"/>
          </div>
        </div>

        <div class="ntf-row full">
          <div>
            <div class="ntf-label">Mensagem</div>
            <textarea class="ntf-input" id="ntf-msg-ind" placeholder="Digite a mensagem...&#10;&#10;Use {nome} para personalizar com o nome do aluno."></textarea>
          </div>
        </div>

        <div style="display:flex;gap:8px;align-items:center;margin-top:4px;">
          <button class="ntf-save" onclick="enviarIndividual()">Enviar agora</button>
          <button class="ntf-save secondary" onclick="agendarIndividual()">Agendar</button>
          <span style="font-size:11px;color:var(--text-muted);" id="ntf-ind-status"></span>
        </div>

        <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border);">
          <div class="ntf-label" style="margin-bottom:8px;">Templates rápidos</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button class="ntf-save secondary" style="font-size:11px;padding:6px 12px;" onclick="usarTemplate('promo')">🏷️ Promoção</button>
            <button class="ntf-save secondary" style="font-size:11px;padding:6px 12px;" onclick="usarTemplate('aviso')">⚠️ Aviso</button>
            <button class="ntf-save secondary" style="font-size:11px;padding:6px 12px;" onclick="usarTemplate('evento')">📅 Evento</button>
            <button class="ntf-save secondary" style="font-size:11px;padding:6px 12px;" onclick="usarTemplate('motivacao')">💪 Motivação</button>
            <button class="ntf-save secondary" style="font-size:11px;padding:6px 12px;" onclick="usarTemplate('retorno')">🔄 Retorno</button>
          </div>
        </div>
      </div>
    </div>

    <!-- HISTÓRICO -->
    <div class="ntf-section" id="sec-historico">
      <div class="ntf-card">
        <h3>📋 Histórico de Envios</h3>
        <p class="ntf-desc">Últimas notificações enviadas pelo sistema.</p>
        <div class="ntf-hist-list">
          ${hist.length === 0 ? '<p style="font-size:12px;color:var(--text-muted);padding:12px;">Nenhuma notificação enviada ainda.</p>' :
            hist.slice(0, 50).map(h => `
              <div class="ntf-hist-item">
                <div class="hist-icon">${h.canal === 'whatsapp' ? '💬' : h.canal === 'email' ? '📧' : '🔔'}</div>
                <div class="hist-body">
                  <div class="hist-title">${esc(h.destNome || h.dest || 'Todos')}</div>
                  <div class="hist-meta">${esc((h.msg||'').slice(0, 80))}${(h.msg||'').length > 80 ? '...' : ''}</div>
                  <div class="hist-meta">${new Date(h.dt).toLocaleString('pt-BR')}</div>
                </div>
                <span class="hist-status ${h.status || 'sent'}">${h.status === 'failed' ? 'Falhou' : h.status === 'pending' ? 'Pendente' : 'Enviado'}</span>
              </div>
            `).join('')}
        </div>
        ${hist.length > 0 ? `<div style="margin-top:12px;"><button class="ntf-save secondary" style="font-size:11px;" onclick="limparHistorico()">Limpar histórico</button></div>` : ''}
      </div>
    </div>

    <!-- CONFIGURAÇÃO -->
    <div class="ntf-section" id="sec-config">
      <div class="ntf-card">
        <h3>⚙️ Configuração de Envio</h3>
        <p class="ntf-desc">Configure os parâmetros gerais das notificações.</p>

        <div class="ntf-row">
          <div>
            <div class="ntf-label">Dias antes do vencimento (mensalidade)</div>
            <input class="ntf-input" id="cfg-dias-antes-venc" type="number" value="${cfg.dias_antes_vencimento || 3}" min="1" max="15"/>
          </div>
          <div>
            <div class="ntf-label">Dias de inatividade para lembrete</div>
            <input class="ntf-input" id="cfg-dias-inatividade" type="number" value="${cfg.dias_inatividade || 7}" min="1" max="30"/>
          </div>
        </div>

        <div class="ntf-row">
          <div>
            <div class="ntf-label">Horário do lembrete de treino</div>
            <input class="ntf-input" id="cfg-horario-lembrete" type="time" value="${cfg.horario_lembrete || '07:00'}"/>
          </div>
          <div>
            <div class="ntf-label">Canal padrão</div>
            <select class="ntf-input" id="cfg-canal-padrao">
              <option value="whatsapp" ${(cfg.canal_padrao||'whatsapp')==='whatsapp'?'selected':''}>WhatsApp</option>
              <option value="email" ${cfg.canal_padrao==='email'?'selected':''}>E-mail</option>
              <option value="push" ${cfg.canal_padrao==='push'?'selected':''}>Push (app)</option>
            </select>
          </div>
        </div>

        <div class="ntf-row full">
          <div>
            <div class="ntf-label">Assinatura das mensagens</div>
            <input class="ntf-input" id="cfg-assinatura" value="${esc(cfg.assinatura || '— Equipe Intus Fit')}" placeholder="— Equipe Intus Fit"/>
          </div>
        </div>

        <div class="ntf-row">
          <div>
            <div class="ntf-label">Limite diário de envios</div>
            <input class="ntf-input" id="cfg-limite-diario" type="number" value="${cfg.limite_diario || 50}" min="1" max="500"/>
          </div>
          <div>
            <div class="ntf-label">Não enviar entre</div>
            <div style="display:flex;gap:6px;align-items:center;">
              <input class="ntf-input" id="cfg-silencio-inicio" type="time" value="${cfg.silencio_inicio || '22:00'}" style="width:auto;"/>
              <span style="color:var(--text-muted);font-size:12px;">e</span>
              <input class="ntf-input" id="cfg-silencio-fim" type="time" value="${cfg.silencio_fim || '07:00'}" style="width:auto;"/>
            </div>
          </div>
        </div>

        <button class="ntf-save" onclick="salvarConfig()" style="margin-top:8px;">Salvar configurações</button>
      </div>
    </div>
  `;

  // Tab switching
  main.querySelectorAll('.ntf-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      main.querySelectorAll('.ntf-tab').forEach(t => t.classList.remove('active'));
      main.querySelectorAll('.ntf-section').forEach(s => s.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('sec-' + tab.dataset.tab).classList.add('active');
    });
  });
}

// ── TOGGLE OCCASION ──
function toggleOccasion(id, checked) {
  const ta = document.getElementById('msg-' + id);
  const sel = document.getElementById('canal-' + id);
  if (ta) { ta.disabled = !checked; ta.style.opacity = checked ? '1' : '.5'; }
  if (sel) { sel.disabled = !checked; }
}

// ── SAVE AUTOMÁTICAS ──
function salvarAutomaticas() {
  const cfg = loadNtfConfig();
  cfg.occasions = cfg.occasions || {};
  OCCASIONS.forEach(occ => {
    const checkbox = document.querySelector(`input[data-occ="${occ.id}"]`);
    const ta = document.getElementById('msg-' + occ.id);
    const canal = document.getElementById('canal-' + occ.id);
    cfg.occasions[occ.id] = {
      ativo: checkbox ? checkbox.checked : true,
      mensagem: ta ? ta.value.trim() : occ.defaultMsg,
      canal: canal ? canal.value : 'whatsapp',
    };
  });
  saveNtfConfig(cfg);
  toast('Notificações automáticas salvas! ✓');
}

// ── SAVE CONFIG ──
function salvarConfig() {
  const cfg = loadNtfConfig();
  cfg.dias_antes_vencimento = parseInt(document.getElementById('cfg-dias-antes-venc').value) || 3;
  cfg.dias_inatividade = parseInt(document.getElementById('cfg-dias-inatividade').value) || 7;
  cfg.horario_lembrete = document.getElementById('cfg-horario-lembrete').value || '07:00';
  cfg.canal_padrao = document.getElementById('cfg-canal-padrao').value || 'whatsapp';
  cfg.assinatura = document.getElementById('cfg-assinatura').value.trim();
  cfg.limite_diario = parseInt(document.getElementById('cfg-limite-diario').value) || 50;
  cfg.silencio_inicio = document.getElementById('cfg-silencio-inicio').value || '22:00';
  cfg.silencio_fim = document.getElementById('cfg-silencio-fim').value || '07:00';
  saveNtfConfig(cfg);
  toast('Configurações salvas! ✓');
}

// ── ENVIAR INDIVIDUAL ──
async function enviarIndividual() {
  const dest = document.getElementById('ntf-dest').value;
  const canal = document.getElementById('ntf-canal-ind').value;
  const assunto = document.getElementById('ntf-assunto').value.trim();
  const msg = document.getElementById('ntf-msg-ind').value.trim();

  if (!msg) { alert('Digite uma mensagem.'); return; }

  const cfg = loadNtfConfig();
  const assinatura = cfg.assinatura || '— Equipe Intus Fit';
  const msgFinal = msg + '\n\n' + assinatura;

  const atletas = JSON.parse(localStorage.getItem('intus-atletas') || '[]')
    .filter(a => a.stbloqueio !== 'S' && a.email && !a.email.endsWith('@intusfit.local'));

  let destinos = [];
  if (dest === 'todos') {
    destinos = atletas;
  } else {
    const a = atletas.find(x => Number(x.idatleta) === Number(dest));
    if (a) destinos = [a];
  }

  if (destinos.length === 0) { alert('Nenhum destinatário encontrado.'); return; }

  const statusEl = document.getElementById('ntf-ind-status');
  statusEl.textContent = `Enviando para ${destinos.length} aluno(s)...`;

  let enviados = 0;
  for (const aluno of destinos) {
    const msgPers = msgFinal.replace(/\{nome\}/g, aluno.nome || '');
    try {
      if (canal === 'email' && aluno.email) {
        await fetch(API_BASE + '/usuarios.php?action=send_reset_notification', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (localStorage.getItem('mx-token') || '') },
          body: JSON.stringify({ email: aluno.email, from: 'contato@intusfit.com.br', assunto: assunto || 'Intus Fit', corpo: msgPers }),
        });
        enviados++;
      } else if (canal === 'whatsapp' && aluno.telefone) {
        const tel = aluno.telefone.replace(/\D/g, '');
        if (tel.length >= 10) {
          window.open(`https://wa.me/55${tel}?text=${encodeURIComponent(msgPers)}`, '_blank');
          enviados++;
        }
      } else if (canal === 'push') {
        enviados++;
      }
    } catch {}
  }

  // Registra no histórico
  const hist = loadHist();
  hist.unshift({
    dt: new Date().toISOString(),
    dest: dest === 'todos' ? 'Todos (' + destinos.length + ')' : destinos[0]?.nome || dest,
    destNome: dest === 'todos' ? 'Todos os alunos' : destinos[0]?.nome || '',
    canal,
    msg: msg.slice(0, 200),
    assunto,
    status: enviados > 0 ? 'sent' : 'failed',
    count: enviados,
  });
  if (hist.length > 200) hist.length = 200;
  saveHist(hist);

  statusEl.textContent = `✓ Enviado para ${enviados} de ${destinos.length} aluno(s)`;
  toast(`Notificação enviada para ${enviados} aluno(s)! ✓`);
  setTimeout(() => { statusEl.textContent = ''; }, 5000);
}

function agendarIndividual() {
  alert('Agendamento de notificações estará disponível em breve! Por enquanto, use "Enviar agora".');
}

// ── TEMPLATES ──
const TEMPLATES = {
  promo: { assunto: 'Promoção especial — Intus Fit', msg: 'Oi {nome}! 🏷️ Temos uma promoção especial para você! [Descreva a promoção aqui]. Aproveite!' },
  aviso: { assunto: 'Aviso importante — Intus Fit', msg: 'Oi {nome}! ⚠️ Informamos que [descreva o aviso]. Qualquer dúvida, estamos à disposição!' },
  evento: { assunto: 'Evento — Intus Fit', msg: 'Oi {nome}! 📅 Temos um evento especial: [nome do evento] no dia [data]. Confirme sua presença!' },
  motivacao: { assunto: 'Motivação — Intus Fit', msg: '{nome}, lembre-se: cada treino te aproxima do seu objetivo! 💪🔥 Não desista! Bora treinar hoje?' },
  retorno: { assunto: 'Sentimos sua falta — Intus Fit', msg: 'Oi {nome}! 🔄 Faz um tempo que não te vemos por aqui. Que tal voltar? Estamos com novidades para você!' },
};

function usarTemplate(tipo) {
  const t = TEMPLATES[tipo];
  if (!t) return;
  document.getElementById('ntf-assunto').value = t.assunto;
  document.getElementById('ntf-msg-ind').value = t.msg;
}

// ── HISTÓRICO ──
function limparHistorico() {
  if (!confirm('Limpar todo o histórico de notificações?')) return;
  saveHist([]);
  render();
}

function toast(msg) {
  let t = document.getElementById('ntf-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'ntf-toast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#7FFF00;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;border:1px solid rgba(127,255,0,.3);opacity:0;transition:opacity .3s;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  setTimeout(() => { t.style.opacity = '0'; }, 2500);
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── INIT ──
render();
</script>
