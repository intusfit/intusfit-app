<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="icon" href="favicon.ico" type="image/x-icon"/>
  <title>Alongamentos — Intus</title>
  <script src="_mock.js?v=20260906f"></script>
  <script src="api.js?v=20260906f"></script>
</head>
<body>
<script>
requireLogin();
renderLayout('Alongamentos');

const main = document.getElementById('main-content');

// Ícones por palavra-chave do nome do grupo (genérico, funciona para grupos novos)
const ICON_KEYWORDS = [
  { re: /pesco|cervic/i,        icon: '🦴' },
  { re: /ombro|trap/i,          icon: '💪' },
  { re: /peito|cost/i,          icon: '🫁' },
  { re: /bra|antebra/i,         icon: '🤸' },
  { re: /lomb|core|abdo/i,      icon: '🧘' },
  { re: /quadril|glute/i,       icon: '🦵' },
  { re: /poster|panturr/i,      icon: '🦶' },
  { re: /quadríceps|quadricep|adutor/i, icon: '🏃' },
];
function iconePara(grupo) {
  const m = ICON_KEYWORDS.find(k => k.re.test(grupo || ''));
  return m ? m.icon : '🧩';
}

let alongamentos = [];
let busca = '';
let loading = true;

window.addEventListener('intus-alongamentos-change', carregar);
window.addEventListener('storage', ev => { if (ev.key === 'intus-alongamentos') carregar(); });

async function carregar() {
  loading = true;
  try { alongamentos = await API.listarAlongamentos() || []; }
  catch { alongamentos = []; }
  loading = false;
  render();
}

function gruposDistintos() {
  // mantém a ordem em que aparecem
  const seen = new Set(); const out = [];
  alongamentos.forEach(a => {
    const g = a.grupo || 'Outros';
    if (!seen.has(g)) { seen.add(g); out.push(g); }
  });
  return out;
}

let ordenacaoAl = 'grupo';
let filtroGrupoAl = '';
let filtroVideoAl = '';

function todosGruposAl() {
  const set = new Set();
  alongamentos.forEach(a => { if (a.grupo) set.add(a.grupo); });
  return [...set].sort((a,b) => a.localeCompare(b, 'pt-BR'));
}

function filtrar(lista) {
  const q = (busca || '').toLowerCase().trim();
  let res = lista;
  if (q) {
    res = res.filter(a =>
      (a.nome || '').toLowerCase().includes(q) ||
      (a.obs || '').toLowerCase().includes(q) ||
      (a.descricao || '').toLowerCase().includes(q) ||
      (a.grupo || '').toLowerCase().includes(q)
    );
  }
  if (filtroGrupoAl) res = res.filter(a => (a.grupo||'') === filtroGrupoAl);
  if (filtroVideoAl === 'com') res = res.filter(a => !!a.videoyoutube);
  else if (filtroVideoAl === 'sem') res = res.filter(a => !a.videoyoutube);

  if (ordenacaoAl === 'alfabetica') {
    res = [...res].sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'));
  }
  return res;
}

function render() {
  const podeIncluir = hasPerm('al_incluir');
  const podeEditar  = hasPerm('al_editar');
  const podeExcluir = hasPerm('al_excluir');

  const lista = filtrar(alongamentos);
  const grupos = [...new Set(lista.map(a => a.grupo || 'Outros'))];

  main.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:20px;">

      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
        <div>
          <h1 style="font-size:22px;font-weight:800;color:var(--text);margin:0;">Alongamentos</h1>
          <p style="font-size:12px;color:var(--text-muted);margin:4px 0 0;">
            Catálogo de alongamentos por grupo muscular. Tudo é editável — adicione, ajuste ou remova como preferir.
          </p>
        </div>
        ${podeIncluir ? `<button class="btn btn-primary" onclick="abrirModalNovo()">+ Novo Alongamento</button>` : ''}
      </div>

      <div class="card" style="padding:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        <input id="inp-busca" class="input"
          placeholder="Buscar por nome, grupo ou descrição..."
          value="${esc(busca)}"
          style="flex:1;min-width:180px;"/>
        <select class="input" id="sel-grupo-al" style="width:auto;">
          <option value="" ${!filtroGrupoAl?'selected':''}>Todos os grupos</option>
          ${todosGruposAl().map(g => `<option value="${g}" ${filtroGrupoAl===g?'selected':''}>${g}</option>`).join('')}
        </select>
        <select class="input" id="sel-video-al" style="width:auto;">
          <option value="" ${!filtroVideoAl?'selected':''}>Vídeo: todos</option>
          <option value="com" ${filtroVideoAl==='com'?'selected':''}>Com vídeo</option>
          <option value="sem" ${filtroVideoAl==='sem'?'selected':''}>Sem vídeo</option>
        </select>
        <select class="input" id="sel-ordem-al" style="width:auto;">
          <option value="grupo" ${ordenacaoAl==='grupo'?'selected':''}>Grupo muscular</option>
          <option value="alfabetica" ${ordenacaoAl==='alfabetica'?'selected':''}>A-Z (nome)</option>
        </select>
        <span style="font-size:12px;color:var(--text-muted);">${lista.length} alongamento${lista.length!==1?'s':''}</span>
      </div>

      ${loading
        ? `<div class="card" style="padding:40px;text-align:center;color:var(--text-muted);">Carregando...</div>`
        : lista.length === 0
        ? `<div class="card" style="padding:40px;text-align:center;color:var(--text-muted);">
            ${busca ? 'Nenhum alongamento encontrado para essa busca.'
                    : (podeIncluir
                        ? 'Nenhum alongamento cadastrado ainda. Clique em <b>+ Novo Alongamento</b> para começar.'
                        : 'Nenhum alongamento cadastrado ainda.')}
          </div>`
        : grupos.map(grupo => {
            const itens = lista.filter(a => (a.grupo || 'Outros') === grupo);
            return `
            <div class="card">
              <div class="card-header">
                <span class="card-title"><span style="font-size:18px;margin-right:8px;">${iconePara(grupo)}</span>${esc(grupo)}</span>
                <span class="card-badge badge-green">${itens.length}</span>
              </div>
              <table class="data-table">
                <thead><tr>
                  <th>Alongamento</th>
                  <th style="width:140px;">Duração</th>
                  <th>Descrição</th>
                  <th style="width:80px;">Vídeo</th>
                  ${(podeEditar || podeExcluir) ? '<th style="width:160px;text-align:right;"></th>' : ''}
                </tr></thead>
                <tbody>
                  ${itens.map(it => `
                    <tr>
                      <td class="td-name">${esc(it.nome)}</td>
                      <td class="td-date">${esc(it.tempo)}</td>
                      <td style="color:var(--text-muted);font-size:13px;max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
                          title="${esc(it.descricao || it.obs || '')}">
                          ${esc(it.descricao || it.obs || '—')}
                      </td>
                      <td>${it.videoyoutube
                        ? `<a href="${esc(it.videoyoutube)}" target="_blank" style="color:#ff6b6b;font-size:12px;font-weight:600;">▶</a>`
                        : `<span style="color:var(--text-muted);font-size:12px;">—</span>`}</td>
                      ${(podeEditar || podeExcluir)
                        ? `<td style="text-align:right;white-space:nowrap;">
                            ${podeEditar  ? `<button class="btn btn-secondary btn-sm" onclick="abrirModalEditar(${it.idalongamento})">Editar</button> ` : ''}
                            ${podeExcluir ? `<button class="btn btn-danger btn-sm" onclick="excluir(${it.idalongamento})" title="Excluir">✕</button>` : ''}
                          </td>` : ''}
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>`;
          }).join('')
      }

      <div style="text-align:center;color:var(--text-muted);font-size:11px;padding:16px 0 8px;">
        Catálogo Intus • Corpo · Mente · Evolução
      </div>

    </div>
  `;

  const inp = document.getElementById('inp-busca');
  if (inp) {
    inp.addEventListener('input', e => {
      busca = e.target.value;
      render();
      const again = document.getElementById('inp-busca');
      if (again) { again.focus(); again.setSelectionRange(busca.length, busca.length); }
    });
  }
  const selOrdemAl = document.getElementById('sel-ordem-al');
  if (selOrdemAl) selOrdemAl.addEventListener('change', e => { ordenacaoAl = e.target.value; render(); });
  document.getElementById('sel-grupo-al')?.addEventListener('change', e => { filtroGrupoAl = e.target.value; render(); });
  document.getElementById('sel-video-al')?.addEventListener('change', e => { filtroVideoAl = e.target.value; render(); });
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function abrirModalNovo() {
  if (!hasPerm('al_incluir')) return showToast('Você não tem permissão para incluir alongamentos.', 'error');
  abrirModal(null);
}
function abrirModalEditar(id) {
  if (!hasPerm('al_editar')) return showToast('Você não tem permissão para editar alongamentos.', 'error');
  const it = alongamentos.find(x => Number(x.idalongamento) === Number(id));
  if (!it) return showToast('Alongamento não encontrado', 'error');
  abrirModal(it);
}

function abrirModal(a) {
  const isEdit = !!a;
  const grupos = gruposDistintos();
  openModal(`
    <div class="modal-header">
      <div class="modal-title">${isEdit ? 'Editar Alongamento' : 'Novo Alongamento'}</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="label">Grupo muscular *</label>
        <input id="f-grupo" class="input" list="dl-grupos-along"
               placeholder="Ex.: Pescoço & Cervical"
               value="${isEdit ? esc(a.grupo || '') : ''}"/>
        <datalist id="dl-grupos-along">
          ${grupos.map(g => `<option value="${esc(g)}"></option>`).join('')}
        </datalist>
        <small style="font-size:11px;color:var(--text-muted);">Pode digitar um grupo novo ou escolher um existente.</small>
      </div>
      <div class="form-group">
        <label class="label">Nome do alongamento *</label>
        <input id="f-nome" class="input" placeholder="Ex.: Ponte de glúteo" autofocus
               value="${isEdit ? esc(a.nome || '') : ''}"/>
      </div>
      <div class="form-group">
        <label class="label">Duração *</label>
        <input id="f-tempo" class="input" placeholder="Ex.: 30s cada lado"
               value="${isEdit ? esc(a.tempo || '') : '30s'}"/>
      </div>
      <div class="form-group">
        <label class="label">Descrição detalhada</label>
        <textarea id="f-desc" class="input" rows="3"
          placeholder="Texto completo que o aluno verá no app.">${isEdit ? esc(a.descricao || '') : ''}</textarea>
      </div>
      <div class="form-group">
        <label class="label">Vídeo do YouTube (URL)</label>
        <input id="f-video" class="input" placeholder="https://www.youtube.com/watch?v=..."
               value="${isEdit ? esc(a.videoyoutube || '') : ''}"/>
      </div>
      <div class="form-group">
        <label class="label">Observação curta (legenda)</label>
        <input id="f-obs" class="input" placeholder="Dica rápida"
               value="${isEdit ? esc(a.obs || '') : ''}"/>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="${isEdit ? 'salvar('+a.idalongamento+')' : 'salvar(null)'}">Salvar</button>
    </div>
  `);
  setTimeout(()=> document.getElementById('f-nome')?.focus(), 50);
}

async function salvar(id) {
  const grupo = document.getElementById('f-grupo').value.trim();
  const nome  = document.getElementById('f-nome').value.trim();
  const tempo = document.getElementById('f-tempo').value.trim();
  const desc  = document.getElementById('f-desc').value.trim();
  const video = document.getElementById('f-video').value.trim();
  const obs   = document.getElementById('f-obs').value.trim();
  if (!grupo) return showToast('Informe o grupo muscular.', 'error');
  if (!nome)  return showToast('Informe o nome.', 'error');
  if (!tempo) return showToast('Informe a duração.', 'error');

  const payload = { grupo, nome, tempo, obs, descricao: desc || null, videoyoutube: video || null };

  try {
    if (id) {
      await API.editarAlongamento(id, payload);
      showToast('Alongamento atualizado!');
    } else {
      await API.criarAlongamento(payload);
      showToast('Alongamento adicionado!');
    }
    closeModal();
    await carregar();
  } catch(e) {
    showToast(e.message || 'Erro ao salvar', 'error');
  }
}

async function excluir(id) {
  if (!hasPerm('al_excluir')) return showToast('Você não tem permissão para excluir.', 'error');
  const it = alongamentos.find(x => Number(x.idalongamento) === Number(id));
  if (!it) return;
  if (!confirm(`Excluir o alongamento "${it.nome}"?`)) return;
  try {
    await API.excluirAlongamento(id);
    showToast('Alongamento excluído.');
    await carregar();
  } catch(e) {
    showToast(e.message || 'Erro ao excluir', 'error');
  }
}

carregar();
</script>
</body>
</html>
