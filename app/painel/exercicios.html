<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="icon" href="favicon.ico" type="image/x-icon"/>
  <title>Exercícios — Intus</title>
  <script src="_mock.js?v=20260906f"></script>
  <script src="api.js?v=20260906f"></script>
  <style>
    /* ─── Tag input para grupos musculares ─── */
    .tags-input-wrap {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      padding: 8px; min-height: 44px;
      background: var(--bg-input, #111);
      border: 1px solid var(--border, #2a2a2a);
      border-radius: 10px;
    }
    .tags-input-wrap:focus-within { border-color: var(--brand, #7FFF00); }
    .tag-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 6px;
      background: rgba(127,255,0,.14);
      color: var(--brand, #7FFF00);
      border: 1px solid rgba(127,255,0,.3);
      font-size: 12px; font-weight: 600;
    }
    .tag-chip button {
      background: none; border: none; padding: 0;
      color: #f87171; cursor: pointer; font-weight: 700;
      font-size: 14px; line-height: 1;
    }
    .tag-chip button:hover { color: #fff; }
    .tags-input {
      flex: 1; min-width: 140px;
      background: transparent; border: none; outline: none;
      color: var(--text, #f0f0f0); font-size: 14px;
      font-family: inherit;
    }
    .tags-suggest {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
    }
    .tags-suggest button {
      background: rgba(255,255,255,.04);
      border: 1px solid #2a2a2a;
      color: var(--text-muted, #888);
      padding: 4px 10px; border-radius: 6px;
      font-size: 12px; cursor: pointer; font-family: inherit;
    }
    .tags-suggest button:hover {
      background: rgba(127,255,0,.1);
      border-color: rgba(127,255,0,.3);
      color: var(--brand, #7FFF00);
    }
    .grupo-pills { display:inline-flex; flex-wrap:wrap; gap:4px; }
    .grupo-pill {
      font-size: 11px; padding: 2px 8px; border-radius: 4px;
      background: rgba(255,255,255,.05);
      border: 1px solid #2a2a2a;
      color: var(--text-muted, #888);
    }
  </style>
</head>
<body>
<script>
requireLogin();
renderLayout('Exercícios');

const main = document.getElementById('main-content');

let exercicios = [];
let busca = '';
let loading = true;
let erro = null;

// Reage a alterações (outras abas) — com debounce para evitar loop
let _carregando = false;
let _debounceTimer = null;
function _debouncedCarregar() {
  if (_debounceTimer) clearTimeout(_debounceTimer);
  _debounceTimer = setTimeout(() => { if (!_carregando) carregar(); }, 300);
}
window.addEventListener('storage', ev => { if (ev.key === 'intus-exercicios') _debouncedCarregar(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) _debouncedCarregar(); });

async function carregar() {
  if (_carregando) return;
  _carregando = true;
  loading = true; erro = null; render();
  try {
    const lista = await API.listarExercicios();
    exercicios = Array.isArray(lista) ? lista : [];
  } catch(e) {
    erro = e.message || 'Erro ao carregar exercícios';
    exercicios = [];
  }
  loading = false;
  _carregando = false;
  render();
}

let ordenacaoEx = 'alfabetica';
let filtroGrupo = '';
let filtroVideo = '';

function todosGrupos() {
  const set = new Set();
  exercicios.forEach(ex => gruposDe(ex).forEach(g => set.add(g)));
  return [...set].sort((a,b) => a.localeCompare(b, 'pt-BR'));
}

function filtrados() {
  const q = (busca || '').toLowerCase().trim();
  let lista = exercicios;
  if (q) {
    lista = lista.filter(ex => {
      const grupos = Array.isArray(ex.grupos) ? ex.grupos.join(' ') : '';
      return (ex.nmexercicio || '').toLowerCase().includes(q) ||
             (ex.observacao  || '').toLowerCase().includes(q) ||
             (ex.grupo       || '').toLowerCase().includes(q) ||
             grupos.toLowerCase().includes(q);
    });
  }
  if (filtroGrupo) {
    lista = lista.filter(ex => gruposDe(ex).some(g => g.toLowerCase() === filtroGrupo.toLowerCase()));
  }
  if (filtroVideo === 'com') lista = lista.filter(ex => !!ex.videoyoutube);
  else if (filtroVideo === 'sem') lista = lista.filter(ex => !ex.videoyoutube);

  lista = [...lista];
  if (ordenacaoEx === 'alfabetica') {
    lista.sort((a, b) => (a.nmexercicio || '').localeCompare(b.nmexercicio || '', 'pt-BR'));
  } else if (ordenacaoEx === 'grupo') {
    lista.sort((a, b) => {
      const ga = gruposDe(a)[0] || 'zzz';
      const gb = gruposDe(b)[0] || 'zzz';
      return ga.localeCompare(gb, 'pt-BR') || (a.nmexercicio || '').localeCompare(b.nmexercicio || '', 'pt-BR');
    });
  } else if (ordenacaoEx === 'recentes') {
    lista.sort((a, b) => Number(b.idexercicio || 0) - Number(a.idexercicio || 0));
  }
  return lista;
}

// Helper: lê grupos do exercício (preferindo array; cai pra string com split)
function gruposDe(ex) {
  if (Array.isArray(ex.grupos) && ex.grupos.length) return ex.grupos.filter(Boolean);
  if (ex.grupo) {
    return String(ex.grupo).split(/[,;]\s*/).map(s => s.trim()).filter(Boolean);
  }
  return [];
}

function nomeExercicio(id) {
  const ex = exercicios.find(e => Number(e.idexercicio) === Number(id));
  return ex ? ex.nmexercicio : '(removido)';
}

function render() {
  const lista = filtrados();
  const podeIncluir = hasPerm('ex_incluir');
  const podeEditar  = hasPerm('ex_editar');
  const podeExcluir = hasPerm('ex_excluir');

  main.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px;">

      <!-- CABEÇALHO -->
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
        <div>
          <h1 style="font-size:22px;font-weight:800;color:var(--text);margin:0;">Catálogo de Exercícios</h1>
          <p style="font-size:12px;color:var(--text-muted);margin:4px 0 0;">Biblioteca usada para montar as fichas de treino.</p>
        </div>
        ${podeIncluir ? `<button class="btn btn-primary" id="btn-novo">+ Novo Exercício</button>` : ''}
      </div>

      <!-- BUSCA + FILTROS -->
      <div class="card" style="padding:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        <input id="inp-busca" class="input"
          placeholder="Buscar por nome, grupo muscular..."
          value="${busca.replace(/"/g,'&quot;')}"
          style="flex:1;min-width:180px;"/>
        <select class="input" id="sel-grupo-ex" style="width:auto;">
          <option value="" ${!filtroGrupo?'selected':''}>Todos os grupos</option>
          ${todosGrupos().map(g => `<option value="${g}" ${filtroGrupo===g?'selected':''}>${g}</option>`).join('')}
        </select>
        <select class="input" id="sel-video-ex" style="width:auto;">
          <option value="" ${!filtroVideo?'selected':''}>Vídeo: todos</option>
          <option value="com" ${filtroVideo==='com'?'selected':''}>Com vídeo</option>
          <option value="sem" ${filtroVideo==='sem'?'selected':''}>Sem vídeo</option>
        </select>
        <select class="input" id="sel-ordem-ex" style="width:auto;">
          <option value="alfabetica" ${ordenacaoEx==='alfabetica'?'selected':''}>A-Z (nome)</option>
          <option value="grupo" ${ordenacaoEx==='grupo'?'selected':''}>Grupo muscular</option>
          <option value="recentes" ${ordenacaoEx==='recentes'?'selected':''}>Mais recentes</option>
        </select>
        <span style="font-size:12px;color:var(--text-muted);">${lista.length} exercício${lista.length!==1?'s':''}</span>
      </div>

      <!-- LISTA -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Exercícios</span>
          <span class="card-badge badge-green">${lista.length}</span>
        </div>

        ${loading
          ? `<div style="padding:40px;text-align:center;color:var(--text-muted);">Carregando...</div>`
          : erro
          ? `<div style="padding:40px;text-align:center;color:#ff6b6b;">${erro}</div>`
          : lista.length === 0
          ? `<div style="padding:40px;text-align:center;color:var(--text-muted);">
               ${busca ? 'Nenhum exercício encontrado para essa busca.'
                       : (podeIncluir
                            ? 'Nenhum exercício cadastrado ainda. Clique em <b>+ Novo Exercício</b> para adicionar o primeiro.'
                            : 'Nenhum exercício cadastrado ainda.')}
             </div>`
          : `<table class="data-table">
              <thead><tr>
                <th style="width:60px;">#</th>
                <th>Nome</th>
                <th style="width:120px;">Grupo</th>
                <th style="width:110px;">Substitutos</th>
                <th style="width:90px;">Vídeo</th>
                ${(podeEditar || podeExcluir) ? '<th style="width:170px;text-align:right;"></th>' : ''}
              </tr></thead>
              <tbody>
                ${lista.map(ex => {
                  const subs = Array.isArray(ex.substitutos) ? ex.substitutos : [];
                  return `
                  <tr>
                    <td class="td-date">${ex.idexercicio}</td>
                    <td class="td-name" title="${escapeAttr(ex.descricao || ex.observacao || '')}">${escapeHtml(ex.nmexercicio || '')}</td>
                    <td>${(() => {
                      const gs = gruposDe(ex);
                      if (gs.length === 0) return `<span style="color:var(--text-muted);font-size:12px;">—</span>`;
                      return `<span class="grupo-pills">${gs.map(g => `<span class="grupo-pill">${escapeHtml(g)}</span>`).join('')}</span>`;
                    })()}</td>
                    <td>${subs.length
                      ? `<span class="pill" style="background:rgba(127,255,0,.12);color:var(--brand);border:1px solid rgba(127,255,0,.3);" title="${escapeAttr(subs.map(nomeExercicio).join(', '))}">${subs.length} opç${subs.length>1?'ões':'ão'}</span>`
                      : `<span style="color:var(--text-muted);font-size:12px;">—</span>`
                    }</td>
                    <td>${ex.videoyoutube
                      ? `<a href="${escapeAttr(ex.videoyoutube)}" target="_blank" style="color:#ff6b6b;font-size:12px;font-weight:600;">▶ YouTube</a>`
                      : `<span style="color:var(--text-muted);font-size:12px;">—</span>`
                    }</td>
                    ${(podeEditar || podeExcluir)
                      ? `<td style="text-align:right;white-space:nowrap;">
                          ${podeEditar  ? `<button class="btn btn-secondary btn-sm" onclick="abrirModalEditar(${ex.idexercicio})">Editar</button> ` : ''}
                          ${podeExcluir ? `<button class="btn btn-danger btn-sm" onclick="excluirEx(${ex.idexercicio})" title="Excluir">✕</button>` : ''}
                        </td>`
                      : ''}
                  </tr>
                `;}).join('')}
              </tbody>
             </table>`
        }
      </div>

    </div>
  `;

  const inp = document.getElementById('inp-busca');
  if (inp) {
    inp.addEventListener('input', e => {
      busca = e.target.value;
      render();
      const again = document.getElementById('inp-busca');
      if (again) { again.focus(); again.setSelectionRange(busca.length, busca.length); }
    });
  }
  const selOrdemEx = document.getElementById('sel-ordem-ex');
  if (selOrdemEx) selOrdemEx.addEventListener('change', e => { ordenacaoEx = e.target.value; render(); });
  const selGrupoEx = document.getElementById('sel-grupo-ex');
  if (selGrupoEx) selGrupoEx.addEventListener('change', e => { filtroGrupo = e.target.value; render(); });
  const selVideoEx = document.getElementById('sel-video-ex');
  if (selVideoEx) selVideoEx.addEventListener('change', e => { filtroVideo = e.target.value; render(); });
  const btn = document.getElementById('btn-novo');
  if (btn) btn.addEventListener('click', abrirModalNovo);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

function _getYTId(url) {
  if (!url) return '';
  const m = url.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : '';
}

function abrirModalNovo() {
  if (!hasPerm('ex_incluir')) return showToast('Você não tem permissão para incluir exercícios.', 'error');
  abrirModal(null);
}
function abrirModalEditar(id) {
  if (!hasPerm('ex_editar')) return showToast('Você não tem permissão para editar exercícios.', 'error');
  const ex = exercicios.find(e => Number(e.idexercicio) === Number(id));
  if (!ex) return showToast('Exercício não encontrado', 'error');
  abrirModal(ex);
}

// guarda os NOMES dos substitutos selecionados no modal atual
let _modalSubs = [];
let _modalSubsBuscaPrev = '';
// Tags de grupos musculares do exercício em edição (formato array).
// Substituiu o antigo input simples de "grupo" — agora um exercício pode ser
// taggeado em vários grupos (ex.: Levantamento Terra → Costas, Glúteos, Coxas).
let _modalGrupos = [];

function abrirModal(ex) {
  const isEdit = !!ex;
  // substitutos agora são nomes (strings); suporte retroativo a IDs inteiros antigos
  _modalSubs = isEdit && Array.isArray(ex.substitutos)
    ? ex.substitutos.map(s => {
        if (typeof s === 'string' && isNaN(Number(s))) return s;
        const found = exercicios.find(e => Number(e.idexercicio) === Number(s));
        return found ? found.nmexercicio : null;
      }).filter(Boolean)
    : [];
  _modalSubsBuscaPrev = '';

  // ─── Estado dos grupos do exercício (formato tag) ──────────────
  // Iniciamos com grupos do exercício (array) ou split do antigo campo grupo (string).
  _modalGrupos = isEdit ? gruposDe(ex) : [];

  // Grupos distintos do catálogo — usados como sugestões clicáveis.
  // Agrega grupos de TODOS os exercícios (somando arrays) para sugerir.
  const gruposCat = [...new Set(
    exercicios.flatMap(e => gruposDe(e))
      .map(g => (g || '').trim()).filter(Boolean)
      .map(g => g.charAt(0).toUpperCase() + g.slice(1))
  )].sort();

  openModal(`
    <div class="modal-header">
      <div class="modal-title">${isEdit ? 'Editar Exercício' : 'Novo Exercício'}</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="label">Nome do exercício *</label>
        <input id="f-nome" class="input" placeholder="Ex.: Supino Reto" autofocus
               value="${isEdit ? escapeAttr(ex.nmexercicio || '') : ''}"/>
      </div>
      <div class="form-group">
        <label class="label">Grupos musculares</label>
        <div id="tags-grupos" class="tags-input-wrap">
          <!-- chips renderizados dinamicamente -->
          <input id="f-grupo-input" class="tags-input"
                 placeholder="Digite e Enter para adicionar (ex: Costas, Glúteos, Coxas)"
                 list="dl-grupos"/>
        </div>
        <datalist id="dl-grupos">
          ${gruposCat.map(g => `<option value="${escapeAttr(g)}"></option>`).join('')}
        </datalist>
        ${gruposCat.length ? `
          <div class="tags-suggest" id="tags-suggest">
            ${gruposCat.slice(0, 12).map(g => `<button type="button" data-grupo="${escapeAttr(g)}">+ ${escapeHtml(g)}</button>`).join('')}
          </div>` : ''}
        <small style="font-size:11px;color:var(--text-muted);display:block;margin-top:6px;">
          Permite múltiplos grupos. Útil para exercícios compostos (ex: terra → Costas, Glúteos, Coxas) e para filtrar por grupo no futuro.
        </small>
      </div>
      <div class="form-group">
        <label class="label">Descrição detalhada</label>
        <textarea id="f-desc" class="input" rows="4"
          placeholder="Explicação completa da execução — o aluno verá este texto no app.">${isEdit ? escapeHtml(ex.descricao || '') : ''}</textarea>
        <small style="font-size:11px;color:var(--text-muted);">Visível para o aluno durante o treino.</small>
      </div>
      <div class="form-group">
        <label class="label">Vídeo do YouTube (URL)</label>
        <div style="display:flex;gap:10px;align-items:flex-start;">
          <input id="f-video" class="input" style="flex:1;"
            placeholder="https://www.youtube.com/watch?v=..."
            value="${isEdit ? escapeAttr(ex.videoyoutube || '') : ''}"/>
          <a id="yt-thumb-link" href="${isEdit && ex.videoyoutube ? escapeAttr(ex.videoyoutube) : '#'}"
             target="_blank" rel="noopener"
             style="display:${isEdit && ex.videoyoutube ? 'block' : 'none'};flex-shrink:0;border-radius:6px;overflow:hidden;border:2px solid #333;width:96px;height:54px;background:#000;">
            <img id="yt-thumb-img"
                 src="${isEdit && ex.videoyoutube ? 'https://img.youtube.com/vi/' + escapeAttr(_getYTId(ex.videoyoutube)) + '/mqdefault.jpg' : ''}"
                 style="width:96px;height:54px;object-fit:cover;display:block;" alt="thumb"/>
          </a>
        </div>
        <small style="font-size:11px;color:var(--text-muted);margin-top:4px;display:block;">Aparece no app do aluno como botão "Ver execução em vídeo".</small>
      </div>
      <div class="form-group">
        <label class="label">Observação curta (legenda)</label>
        <input id="f-obs" class="input"
          placeholder="Ex.: Controle a descida"
          value="${isEdit ? escapeAttr(ex.observacao || '') : ''}"/>
      </div>
      <div class="form-group">
        <label class="label">URL do GIF (opcional)</label>
        <input id="f-gif" class="input" placeholder="https://..." value="${isEdit ? escapeAttr(ex.gifexercicio || '') : ''}"/>
      </div>

      <!-- ============ SUBSTITUTOS ============ -->
      <div class="form-group" style="border-top:1px solid #2a2a2a;padding-top:14px;margin-top:14px;">
        <label class="label" style="display:flex;align-items:center;gap:8px;">
          <span>🔄</span> Exercícios substitutos
        </label>
        <small style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:8px;">
          Quando o aluno não puder fazer este exercício na hora do treino (equipamento ocupado, lesão leve, etc.),
          ele poderá trocar por uma destas opções. O professor pode customizar substitutos por treino também.
        </small>

        <!-- chips dos selecionados -->
        <div id="subs-chips" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;min-height:30px;"></div>

        <!-- busca + lista -->
        <input id="subs-busca" class="input" placeholder="Buscar para adicionar..." style="margin-bottom:8px;"/>
        <div id="subs-lista"
             style="max-height:180px;overflow-y:auto;border:1px solid #2a2a2a;border-radius:8px;background:rgba(0,0,0,.2);">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="${isEdit ? 'salvar('+ex.idexercicio+')' : 'salvar(null)'}">Salvar</button>
    </div>
  `);

  setTimeout(() => {
    document.getElementById('f-nome')?.focus();
    renderGruposChips();
    renderSubsChips();
    renderSubsLista('');

    // Tag input — Enter ou vírgula adiciona tag; Backspace em campo vazio remove última
    const inpGrupo = document.getElementById('f-grupo-input');
    if (inpGrupo) {
      inpGrupo.addEventListener('keydown', ev => {
        if (ev.key === 'Enter' || ev.key === ',' || ev.key === ';') {
          ev.preventDefault();
          const v = inpGrupo.value.trim().replace(/,+$/, '');
          if (v) adicionarGrupo(v);
          inpGrupo.value = '';
        } else if (ev.key === 'Backspace' && !inpGrupo.value && _modalGrupos.length) {
          // remove a última tag
          _modalGrupos.pop();
          renderGruposChips();
          renderSubsLista(_modalSubsBuscaPrev);
        }
      });
      inpGrupo.addEventListener('blur', () => {
        const v = inpGrupo.value.trim().replace(/[,;]+$/, '');
        if (v) { adicionarGrupo(v); inpGrupo.value = ''; }
      });
    }

    // Sugestões clicáveis (chips de grupos do catálogo)
    document.querySelectorAll('#tags-suggest button').forEach(b => {
      b.addEventListener('click', () => adicionarGrupo(b.dataset.grupo));
    });

    document.getElementById('subs-busca')?.addEventListener('input', e => {
      _modalSubsBuscaPrev = e.target.value;
      renderSubsLista(e.target.value);
    });

    // YouTube thumbnail preview
    const fVideo = document.getElementById('f-video');
    const ytLink = document.getElementById('yt-thumb-link');
    const ytImg  = document.getElementById('yt-thumb-img');
    function atualizarThumb(url) {
      const vid = _getYTId(url);
      if (vid) {
        ytImg.src = 'https://img.youtube.com/vi/' + vid + '/mqdefault.jpg';
        ytLink.href = url;
        ytLink.style.display = 'block';
      } else {
        ytLink.style.display = 'none';
        ytImg.src = '';
      }
    }
    fVideo?.addEventListener('input', e => atualizarThumb(e.target.value));
    fVideo?.addEventListener('paste', e => setTimeout(() => atualizarThumb(fVideo.value), 0));
  }, 50);
}

// ─── Tag input: chips de grupos musculares ───────────────────────
function renderGruposChips() {
  const wrap = document.getElementById('tags-grupos');
  const inp  = document.getElementById('f-grupo-input');
  if (!wrap || !inp) return;
  // limpa todos os chips antigos (menos o input)
  [...wrap.querySelectorAll('.tag-chip')].forEach(el => el.remove());
  const frag = document.createDocumentFragment();
  _modalGrupos.forEach((g, i) => {
    const chip = document.createElement('span');
    chip.className = 'tag-chip';
    chip.innerHTML = `${escapeHtml(g)}<button type="button" aria-label="Remover ${escapeAttr(g)}">×</button>`;
    chip.querySelector('button').addEventListener('click', () => removerGrupo(i));
    frag.appendChild(chip);
  });
  wrap.insertBefore(frag, inp);
}

function adicionarGrupo(nome) {
  const limpo = String(nome || '').trim();
  if (!limpo) return;
  // normaliza: primeira letra maiúscula
  const norm = limpo.charAt(0).toUpperCase() + limpo.slice(1).toLowerCase();
  // evita duplicado (case-insensitive)
  if (_modalGrupos.some(g => g.toLowerCase() === norm.toLowerCase())) return;
  _modalGrupos.push(norm);
  renderGruposChips();
  renderSubsLista(_modalSubsBuscaPrev);
}

function removerGrupo(i) {
  _modalGrupos.splice(i, 1);
  renderGruposChips();
  renderSubsLista(_modalSubsBuscaPrev);
}

function renderSubsChips() {
  const wrap = document.getElementById('subs-chips');
  if (!wrap) return;
  if (_modalSubs.length === 0) {
    wrap.innerHTML = `<span style="font-size:12px;color:var(--text-muted);font-style:italic;">Nenhum substituto definido ainda.</span>`;
    return;
  }
  wrap.innerHTML = _modalSubs.map((nome, idx) => {
    return `<span class="pill" style="background:rgba(127,255,0,.12);color:var(--brand);border:1px solid rgba(127,255,0,.3);display:inline-flex;align-items:center;gap:6px;padding:4px 8px;">
      ${escapeHtml(nome)}
      <button type="button" data-sub-idx="${idx}"
        style="background:none;border:none;color:#f87171;cursor:pointer;font-size:14px;line-height:1;padding:0;font-weight:700;">×</button>
    </span>`;
  }).join('');
  wrap.querySelectorAll('button[data-sub-idx]').forEach(btn => {
    btn.addEventListener('click', () => { removerSub(Number(btn.dataset.subIdx)); });
  });
}

function renderSubsLista(termo) {
  const wrap = document.getElementById('subs-lista');
  if (!wrap) return;
  const idAtual = (() => {
    // tentamos descobrir o id do exercício sendo editado pelo botão Salvar
    const btn = document.querySelector('.modal-footer .btn-primary');
    const m = btn?.getAttribute('onclick')?.match(/salvar\((\d+)\)/);
    return m ? Number(m[1]) : null;
  })();
  // grupos do exercício em edição (todos os tags atuais), em minúsculas
  const gruposAtuais = (_modalGrupos || []).map(g => g.toLowerCase());
  const q = (termo || '').trim().toLowerCase();

  let candidatos = exercicios
    .filter(e => Number(e.idexercicio) !== idAtual)         // não pode substituir a si mesmo
    .filter(e => !_modalSubs.includes(e.nmexercicio)); // já selecionados não aparecem

  if (q) {
    candidatos = candidatos.filter(e => {
      const gs = gruposDe(e).join(' ').toLowerCase();
      return (e.nmexercicio || '').toLowerCase().includes(q) ||
             (e.grupo || '').toLowerCase().includes(q) ||
             gs.includes(q);
    });
  } else if (gruposAtuais.length) {
    // sem busca: prioriza candidatos que compartilhem ao menos um grupo
    candidatos = candidatos.filter(e => {
      const gs = gruposDe(e).map(g => g.toLowerCase());
      return gs.some(g => gruposAtuais.includes(g));
    });
  }

  candidatos = candidatos.slice(0, 50);

  if (candidatos.length === 0) {
    const gruposLbl = gruposAtuais.join(', ');
    wrap.innerHTML = `<div style="padding:14px;text-align:center;color:var(--text-muted);font-size:12px;">
      ${q ? 'Nenhum exercício encontrado.' : (gruposLbl ? 'Nenhum exercício dos grupos selecionados para sugerir.' : 'Digite para buscar.')}
    </div>`;
    return;
  }

  const items = candidatos.map(e => {
    const gs = gruposDe(e).join(', ');
    return `
    <div data-nm="${escapeAttr(e.nmexercicio)}"
         style="padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1f1f1f;font-size:13px;"
         onmouseenter="this.style.background='rgba(127,255,0,.06)'"
         onmouseleave="this.style.background='transparent'">
      <span style="color:var(--text);">${escapeHtml(e.nmexercicio || '')}</span>
      <span style="font-size:11px;color:var(--text-muted);">${escapeHtml(gs)}</span>
    </div>`;
  }).join('');
  wrap.innerHTML = items;
  wrap.querySelectorAll('div[data-nm]').forEach(div => {
    div.addEventListener('mousedown', ev => { ev.preventDefault(); adicionarSub(div.dataset.nm); });
  });
}

function adicionarSub(nome) {
  if (nome && !_modalSubs.includes(nome)) _modalSubs.push(nome);
  renderSubsChips();
  renderSubsLista(_modalSubsBuscaPrev);
}

function removerSub(idx) {
  _modalSubs.splice(idx, 1);
  renderSubsChips();
  renderSubsLista(_modalSubsBuscaPrev);
}

async function salvar(id) {
  const nome  = document.getElementById('f-nome').value.trim();
  const desc  = document.getElementById('f-desc').value.trim();
  const video = document.getElementById('f-video').value.trim();
  const obs   = document.getElementById('f-obs').value.trim();
  const gif   = document.getElementById('f-gif').value.trim();

  // Garante que tag pendente no input (sem Enter) também entra
  const inpGrupo = document.getElementById('f-grupo-input');
  if (inpGrupo && inpGrupo.value.trim()) {
    adicionarGrupo(inpGrupo.value.trim());
    inpGrupo.value = '';
  }

  if (!nome) { showToast('Informe o nome do exercício', 'error'); return; }

  // Mantém compat retroativa: 'grupo' (string concatenada) + 'grupos' (array)
  const grupos = [..._modalGrupos];
  const grupo  = grupos.join(', ');

  const payload = {
    nmexercicio:  nome,
    grupo:        grupo || null,
    grupos:       grupos.length ? grupos : null,
    descricao:    desc  || null,
    videoyoutube: video || null,
    observacao:   obs   || null,
    gifexercicio: gif   || null,
    substitutos:  Array.isArray(_modalSubs) ? [..._modalSubs] : [],
  };

  try {
    if (id) {
      await API.editarExercicio(id, payload);
      showToast('Exercício atualizado com sucesso!');
    } else {
      await API.criarExercicio(payload);
      showToast('Exercício criado com sucesso!');
    }
    closeModal();
    await carregar();
    // propagar o nome atualizado para treinos já existentes (para renderizar correto no app)
    propagarParaTreinos(id || null, payload);
  } catch(e) {
    showToast(e.message || 'Erro ao salvar', 'error');
  }
}

// Quando o nome do exercício muda, atualiza "nmexercicio" cacheado
// em intus-treinos — assim o app do aluno continua consistente.
function propagarParaTreinos(id, payload) {
  if (!id) return;
  try {
    const treinos = JSON.parse(localStorage.getItem('intus-treinos') || '[]');
    let mudou = false;
    treinos.forEach(t => {
      if (Number(t.idexercicio) === Number(id)) {
        if (t.nmexercicio !== payload.nmexercicio) { t.nmexercicio = payload.nmexercicio; mudou = true; }
      }
    });
    if (mudou) {
      localStorage.setItem('intus-treinos', JSON.stringify(treinos));
      try { window.dispatchEvent(new Event('intus-treinos-change')); } catch {}
    }
  } catch {}
}

async function excluirEx(id) {
  if (!hasPerm('ex_excluir')) return showToast('Você não tem permissão para excluir.', 'error');
  const ex = exercicios.find(e => Number(e.idexercicio) === Number(id));
  if (!ex) return;
  if (!confirm(`Excluir o exercício "${ex.nmexercicio}"? Essa ação não pode ser desfeita.`)) return;
  try {
    await API.excluirExercicio(id);
    showToast('Exercício excluído.');
    await carregar();
  } catch(e) {
    showToast(e.message || 'Erro ao excluir', 'error');
  }
}

carregar();
</script>
