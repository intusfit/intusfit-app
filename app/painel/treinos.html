<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="icon" href="favicon.ico" type="image/x-icon"/>
  <title>Treinos — Intus</title>
  <script src="_mock.js?v=20261028a"></script>
  <script src="api.js?v=20261027a"></script>
  <script src="kanban.js?v=20261023b"></script>
  <style>
    /* COMBO (autocomplete dropdown) */
    .combo-wrap { position:relative; width:100%; }
    .combo-input { width:100%; cursor:pointer; background:var(--bg2, #1a1a1a); border:1px solid var(--border, #333); color:var(--text, #f0f0f0); }
    .combo-list {
      display:none; position:absolute; top:calc(100% + 4px); left:0; right:0;
      background: var(--bg2, #1a1a1a);
      border:1px solid var(--border, #333); border-radius:10px;
      max-height: 260px; overflow-y:auto; z-index:9999;
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
    }
    .combo-list.open { display:block; }
    .combo-item {
      padding:10px 14px; cursor:pointer; font-size:14px; color:var(--text, #f0f0f0);
      border-bottom:1px solid var(--border, rgba(255,255,255,.05));
    }
    .combo-item:last-child { border-bottom:none; }
    .combo-item:hover, .combo-item.active { background: rgba(127,255,0,.12); }
    .combo-item.selected { background: rgba(127,255,0,.18); color: var(--brand, #7fff00); font-weight:600; }
    .combo-empty { padding:14px; color:var(--text-muted, #888); font-size:13px; text-align:center; }
    .combo-new { padding:10px 14px; cursor:pointer; font-size:13px; color:var(--brand, #7fff00); font-weight:600; border-top:1px solid var(--border, #333); }
    .combo-new:hover { background: rgba(127,255,0,.08); }

    /* TABS */
    .tab-bar { display:flex; gap:4px; border-bottom:1px solid var(--border, #2a2a2a); margin-bottom:16px; }
    .tab-btn {
      padding:10px 18px; font-size:13px; font-weight:700; cursor:pointer;
      background:transparent; border:none; color:var(--text-muted, #888);
      border-bottom:2px solid transparent; font-family:inherit;
      transition: color .15s, border-color .15s;
    }
    .tab-btn:hover { color:var(--text, #fff); }
    .tab-btn.active { color:var(--brand, #7FFF00); border-bottom-color:var(--brand, #7FFF00); }
    .tab-btn .badge { font-size:10px; background:var(--bg3,#333); color:var(--text-muted); padding:2px 6px; border-radius:8px; margin-left:6px; }
    .tab-btn.active .badge { background:rgba(127,255,0,.15); color:var(--brand); }

    /* ICON BUTTON (small) */
    .btn-icon-sm {
      width:30px; height:30px; border-radius:8px; border:1px solid var(--border,#2a2a2a);
      background:var(--bg3,#222); color:var(--text-muted,#888); cursor:pointer;
      display:inline-flex; align-items:center; justify-content:center;
      transition: background .15s, color .15s, border-color .15s;
    }
    .btn-icon-sm:hover { background:rgba(127,255,0,.12); color:var(--brand,#7FFF00); border-color:rgba(127,255,0,.3); }

    /* FICHA CARDS (lista) */
    .ficha-card {
      background:var(--bg2, #1a1a1a); border:1px solid var(--border, #2a2a2a);
      border-radius:14px; padding:16px; margin-bottom:12px; cursor:pointer;
      transition: border-color .15s, transform .08s;
    }
    .ficha-card:hover { border-color:rgba(127,255,0,.4); }
    .ficha-card:active { transform:scale(.995); }
    .ficha-card .title { font-size:16px; font-weight:800; color:var(--text); }
    .ficha-card .sub { font-size:12px; color:var(--text-muted); margin-top:4px; }
    .ficha-card .badges { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }

    /* Modos de visualização da lista de fichas (compacto, miniaturas, lista) */
    .fc-cp, .fc-mini { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; cursor: pointer; transition: border-color .15s, transform .08s; }
    .fc-cp:hover, .fc-mini:hover { border-color: rgba(127,255,0,.4); }
    .fc-cp { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .fc-cp .top { display: flex; align-items: center; gap: 10px; }
    .fc-cp .nm { font-size: 14px; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-cp .fi { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-cp .bd { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
    .fc-pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--bg3); color: var(--text-muted); white-space: nowrap; }
    .fc-pill.v { background: rgba(248,113,113,.14); color: #f87171; } body.theme-light .fc-pill.v { color: #b91c1c; }
    .fc-pill.a { background: rgba(250,204,21,.14); color: #facc15; } body.theme-light .fc-pill.a { color: #92400e; }
    .fc-mini { padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; min-width: 0; }
    .fc-mini .nm { font-size: 12.5px; font-weight: 800; color: var(--text); width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-mini .fi { font-size: 11px; color: var(--text-muted); width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-tab { width: 100%; border-collapse: collapse; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .fc-tab th { text-align: left; font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; padding: 9px 12px; background: var(--bg3); border-bottom: 1px solid var(--border); white-space: nowrap; }
    .fc-tab td { padding: 8px 12px; font-size: 13px; color: var(--text); border-top: 1px solid var(--border); vertical-align: middle; }
    .fc-tab tr.lin { cursor: pointer; } .fc-tab tr.lin:hover td { background: var(--bg3); }
    .fc-tab .num { text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; }
    .fc-nome { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .fc-nome b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
    .fc-nome span { display: block; font-size: 11.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
    /* EXERCÍCIO CARD */
    .ex-card {
      background:var(--bg2, #151515); border:1px solid var(--border, #2a2a2a);
      border-radius:12px; padding:16px; margin-bottom:12px;
      transition: border-color .15s; position:relative; overflow:visible;
    }
    .ex-card:hover { border-color: rgba(127,255,0,.2); }
    .ex-card .ex-header { display:flex; align-items:flex-end; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
    .ex-card .ex-header .combo-wrap { flex:1; min-width:200px; }
    .ex-card .ex-fields { display:grid; grid-template-columns:120px 1fr 1fr; gap:10px; margin-bottom:10px; }
    .ex-card .ex-fields .field-group { display:flex; flex-direction:column; gap:3px; }
    .ex-card .ex-fields .field-group label { font-size:11px; font-weight:700; color:var(--text-muted, #888); text-transform:uppercase; letter-spacing:.3px; }
    .ex-card .ex-fields .field-group input { font-size:13px; padding:6px 8px; background:var(--bg, #111); border:1px solid var(--border, #333); color:var(--text); border-radius:6px; }
    .ex-card .rep-row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .ex-card .rep-pill {
      background:var(--bg, #111); border:1px solid var(--border, #333);
      border-radius:8px; padding:5px 10px; font-size:12px; color:var(--text);
      min-width:50px; text-align:center; cursor:pointer;
    }
    .ex-card .rep-pill:focus { border-color:var(--brand); outline:none; }
    .ex-card .carga-row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .ex-card .carga-pill {
      background:var(--bg, #111); border:1px solid var(--border, #333);
      border-radius:8px; padding:5px 10px; font-size:12px; color:var(--text-muted);
      min-width:50px; text-align:center; cursor:pointer;
    }
    .ex-card .carga-pill:focus { border-color:var(--brand); outline:none; }
    .ex-card .ex-footer { display:flex; align-items:center; gap:10px; }
    .ex-card .ex-footer input[type="text"] { flex:1; font-size:13px; padding:6px 10px; background:var(--bg, #111); border:1px solid var(--border, #333); color:var(--text); border-radius:6px; }
    .ex-card .ex-actions { display:flex; gap:6px; justify-content:flex-end; margin-top:10px; }

    /* ALONGAMENTO CARD */
    .along-card {
      background:var(--bg2, #151515); border:1px solid var(--border, #2a2a2a);
      border-radius:10px; padding:12px 14px; margin-bottom:8px;
    }
    .along-card .along-header { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
    .along-card .along-fields { display:grid; grid-template-columns:80px 120px 1fr; gap:8px; align-items:end; }
    .along-card .along-fields label { font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; display:block; margin-bottom:2px; }
    .along-card .along-fields input { font-size:13px; padding:5px 8px; background:var(--bg, #111); border:1px solid var(--border, #333); color:var(--text); border-radius:6px; }

    /* ALONG COMBOBOX INLINE */
    .along-combo-wrap { position:relative; }
    .along-combo-input { width:100%; font-size:13px; padding:5px 8px; background:var(--bg, #111); border:1px solid var(--border, #333); color:var(--text); border-radius:6px; }
    .along-combo-list {
      display:none; position:absolute; top:calc(100% + 2px); left:0; right:0;
      background:var(--bg2, #1a1a1a); border:1px solid var(--border, #333);
      border-radius:8px; max-height:200px; overflow-y:auto; z-index:9999;
      box-shadow:0 8px 24px rgba(0,0,0,.4);
    }
    .along-combo-list.open { display:block; }

    .add-ex-btn {
      display:flex; align-items:center; justify-content:center; gap:8px; padding:14px;
      border:1px dashed var(--border, #333); border-radius:12px;
      background:transparent; color:var(--text-muted); cursor:pointer;
      font-family:inherit; font-size:14px; font-weight:600; width:100%;
      transition: border-color .15s, color .15s;
    }
    .add-ex-btn:hover { border-color:var(--brand); color:var(--brand); }

    .section-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 16px; background:var(--bg2, #151515);
      border:1px solid var(--border, #2a2a2a); border-radius:10px;
      margin-bottom:12px; cursor:pointer; user-select:none;
    }
    .section-header h3 { font-size:14px; font-weight:800; color:var(--text); margin:0; }
    .section-header .toggle { font-size:18px; color:var(--text-muted); }

    .falha-check { display:flex; align-items:center; gap:5px; }
    .falha-check input[type="checkbox"] { width:14px; height:14px; accent-color:var(--brand, #7fff00); }
    .falha-check label { font-size:11px; color:var(--text-muted); }

    /* LIGHT THEME OVERRIDES */
    body.theme-light .combo-list { background:#fff; border-color:#d1d5db; box-shadow:0 10px 30px rgba(0,0,0,.12); }
    body.theme-light .combo-item { color:#111827; border-bottom-color:#f3f4f6; }
    body.theme-light .combo-item:hover, body.theme-light .combo-item.active { background:rgba(58,153,0,.08); }
    body.theme-light .combo-item.selected { background:rgba(58,153,0,.12); color:#3a9900; }
    body.theme-light .combo-input { background:#fff; border-color:#d1d5db; color:#111827; }
    body.theme-light .combo-new { color:#3a9900; border-top-color:#e5e7eb; }
    body.theme-light .ex-card { background:#fff; border-color:#e5e7eb; }
    body.theme-light .ex-card .ex-fields .field-group input,
    body.theme-light .ex-card .rep-pill,
    body.theme-light .ex-card .carga-pill,
    body.theme-light .ex-card .ex-footer input { background:#f9fafb; border-color:#d1d5db; color:#111827; }
    body.theme-light .along-card { background:#fff; border-color:#e5e7eb; }
    body.theme-light .along-card .along-fields input,
    body.theme-light .along-combo-input { background:#f9fafb; border-color:#d1d5db; color:#111827; }
    body.theme-light .along-combo-list { background:#fff; border-color:#d1d5db; box-shadow:0 8px 20px rgba(0,0,0,.08); }
    body.theme-light .section-header { background:#fff; border-color:#e5e7eb; }
    body.theme-light .ficha-card { background:#fff; border-color:#e5e7eb; }
    body.theme-light .tab-btn { color:#6b7280; }
    body.theme-light .tab-btn:hover { color:#111827; }
    body.theme-light .tab-btn.active { color:#3a9900; border-bottom-color:#3a9900; }

    @media(max-width:768px) {
      .ex-card .ex-fields { grid-template-columns:1fr 1fr; }
      .ex-card .ex-header { flex-wrap:wrap; }
      .along-card .along-fields { grid-template-columns:1fr 1fr; }
    }

    /* ── EDITOR DE FICHA: arrastar, visão ampla e celular do aluno (27/10/2026) ── */
    .ed-wrap { display:flex; flex-direction:column; gap:16px; max-width:900px; margin:0 auto; }
    .ed-wrap.ed-ampla, .ed-wrap.ed-celular { max-width:1560px; }
    .ed-cols { display:block; }
    .ed-wrap.ed-celular .ed-cols { display:grid; grid-template-columns:minmax(0,1fr) 372px; gap:20px; align-items:start; }
    .ed-main { display:flex; flex-direction:column; gap:16px; min-width:0; }
    .ed-top { display:flex; flex-direction:column; gap:16px; }
    .ed-wrap.ed-ampla .ed-top, .ed-wrap.ed-celular .ed-top { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
    .ed-wrap.ed-ampla .ex-card .ex-fields, .ed-wrap.ed-celular .ex-card .ex-fields { grid-template-columns:90px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.25fr); }
    .ed-wrap.ed-ampla .ex-card .rep-pill, .ed-wrap.ed-celular .ex-card .rep-pill,
    .ed-wrap.ed-ampla .ex-card .carga-pill, .ed-wrap.ed-celular .ex-card .carga-pill { width:56px; min-width:0; padding:5px 3px; }
    .ed-wrap.ed-ampla .ex-card select.rep-pill, .ed-wrap.ed-celular .ex-card select.rep-pill { width:calc(50% - 3px); font-size:11px; }
    .ed-wrap.ed-ampla .along-card .along-fields, .ed-wrap.ed-celular .along-card .along-fields { grid-template-columns:90px 160px 1fr; }
    .ed-side { position:sticky; top:72px; align-self:start; }
    @media (max-width:1180px) {
      .ed-wrap.ed-celular .ed-cols { display:block; }
      .ed-wrap.ed-celular .ed-side { display:none; }
      .ed-wrap.ed-ampla .ed-top, .ed-wrap.ed-celular .ed-top { grid-template-columns:1fr; }
    }
    .ed-modos { display:inline-flex; border:1px solid var(--border); border-radius:9px; overflow:hidden; background:var(--bg2); margin-left:auto; }
    .ed-modos button { padding:7px 12px; font-size:12px; font-weight:700; font-family:inherit; border:none; background:transparent; color:var(--text-muted); cursor:pointer; white-space:nowrap; }
    .ed-modos button + button { border-left:1px solid var(--border); }
    .ed-modos button.on { background:var(--green-dim); color:var(--brand); }

    /* alça de arrastar e marcas de destino */
    .dnd-alca { display:inline-flex; align-items:center; justify-content:center; width:26px; height:34px; flex-shrink:0; border-radius:7px; cursor:grab; color:var(--text-muted); font-size:17px; line-height:1; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:none; border:1px dashed transparent; }
    @media (pointer:coarse) { .dnd-alca { width:42px; height:46px; font-size:22px; border-color:var(--border); background:var(--bg3); } }
    .dnd-fantasma { position:fixed; left:0; top:0; z-index:100000; pointer-events:none; max-width:260px; padding:9px 14px; border-radius:10px; background:var(--bg2); color:var(--text); border:1px solid var(--brand); box-shadow:0 12px 30px rgba(0,0,0,.45); font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.95; }
    body.theme-light .dnd-fantasma { box-shadow:0 12px 30px rgba(0,0,0,.2); }
    .dnd-alca:hover { color:var(--brand); border-color:var(--border); background:var(--bg3); }
    .dnd-alca:active { cursor:grabbing; }
    .ex-card .ex-header .dnd-alca { align-self:flex-end; }
    .ex-card.dnd-arrastando, .along-card.dnd-arrastando { opacity:.35; }
    .ex-card.dnd-antes, .along-card.dnd-antes { box-shadow:0 -3px 0 0 var(--brand), var(--prof-painel); }
    .ex-card.dnd-depois, .along-card.dnd-depois { box-shadow:0 3px 0 0 var(--brand), var(--prof-painel); }
    .ex-card .ex-num, .along-card .ex-num { font-size:12px; font-weight:800; color:var(--text-muted); min-width:20px; text-align:center; align-self:flex-end; padding-bottom:9px; }
    .tab-btn.dnd-sobre { outline:2px dashed var(--brand); outline-offset:-3px; }

    /* ── CELULAR DO ALUNO (miniatura) ── */
    .mini-aparelho { width:372px; padding:14px 14px 18px; border-radius:44px; background:#0a0a0a; border:2px solid #3a3a3a; box-shadow:0 18px 40px -10px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.05); position:relative; }
    body.theme-light .mini-aparelho { border-color:#1f2937; box-shadow:0 18px 40px -10px rgba(0,0,0,.35); }
    .mini-aparelho::before { content:''; position:absolute; top:9px; left:50%; width:78px; height:6px; margin-left:-39px; border-radius:4px; background:#262626; }
    .mini-moldura { width:342px; height:640px; overflow:hidden; border-radius:28px; background:#000; margin-top:8px; position:relative; }
    .mini-app { --m-bg:#0f0f0f; --m-txt:#f0f0f0; --m-muted:#888; --m-card:#141414; --m-card-bd:#1e1e1e; --m-det-bd:#2a2a2a; --m-cell:rgba(255,255,255,.03); --m-serie:#0d0d0d; --m-serie-bd:#1a1a1a; --m-input:#111; --m-input-bd:#222; --m-alvo:#ffcf4d; --m-alvo-bg:rgba(255,207,77,.10); --m-alvo-bd:rgba(255,207,77,.28); --m-verde:#7FFF00; --m-link:#7FFF00; --m-along:#121218; --m-along-bd:#1e1e28;
      width:390px; height:730px; transform:scale(.877); transform-origin:0 0; background:var(--m-bg); color:var(--m-txt); font-family:'Inter',sans-serif; font-size:14px; overflow-y:auto; overflow-x:hidden; position:relative; scrollbar-width:none; }
    .mini-app::-webkit-scrollbar { display:none; }
    .mini-app.claro { --m-bg:#f4f4f4; --m-txt:#1a1a1a; --m-muted:#666; --m-card:#fff; --m-card-bd:#e5e5e5; --m-det-bd:#e0e0e0; --m-cell:rgba(0,0,0,.035); --m-serie:#fafafa; --m-serie-bd:#e5e5e5; --m-input:#fff; --m-input-bd:#ddd; --m-alvo:#8a5a00; --m-alvo-bg:rgba(138,90,0,.08); --m-alvo-bd:rgba(138,90,0,.22); --m-verde:#5cb800; --m-link:#2f7d00; --m-along:#fff; --m-along-bd:#e5e5e5; }
    .mini-app * { box-sizing:border-box; }
    .mi-barra { position:sticky; top:0; z-index:3; display:flex; align-items:center; gap:8px; padding:11px 14px; background:var(--m-bg); border-bottom:1px solid var(--m-card-bd); }
    .mi-barra .mi-volta { font-size:13px; color:var(--m-muted); font-weight:600; }
    .mi-barra .mi-tit { flex:1; min-width:0; font-size:13px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .mi-barra .mi-cron { font-size:12px; font-weight:800; color:var(--m-verde); font-variant-numeric:tabular-nums; }
    .mi-corpo { padding:6px 14px 30px; }
    .mi-lista-tit { font-size:12px; font-weight:700; color:var(--m-muted); text-transform:uppercase; letter-spacing:1px; margin:12px 0 10px; }
    .mi-dica { font-size:11px; color:var(--m-muted); margin:-6px 0 10px; }
    .mi-row { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--m-card); border:1.5px solid var(--m-card-bd); border-radius:10px; margin-bottom:6px; cursor:pointer; }
    .mi-row.ativo { border-color:var(--m-verde); }
    .mi-row .mi-num { width:24px; height:24px; border-radius:6px; background:linear-gradient(135deg,#7FFF00,#40c000); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:11px; font-weight:900; color:#000; }
    .mi-row .mi-nome { flex:1; min-width:0; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .mi-row .mi-uni { font-size:9px; background:rgba(96,165,250,.15); color:#60a5fa; padding:1px 5px; border-radius:4px; font-weight:700; vertical-align:middle; margin-left:4px; }
    .mi-row .mi-btn { width:24px; height:24px; border-radius:6px; border:1px solid var(--m-det-bd); background:var(--m-cell); color:var(--m-muted); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; opacity:.45; }
    .mi-det { background:var(--m-card); border:1.5px solid var(--m-verde); border-top:none; border-radius:0 0 10px 10px; margin-top:-8px; margin-bottom:8px; padding:12px; }
    .mi-grade { display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--m-det-bd); border-radius:8px; overflow:hidden; margin-bottom:6px; }
    .mi-grade.c2 { grid-template-columns:repeat(2,1fr); }
    .mi-grade > div { padding:8px 10px; border-right:1px solid var(--m-det-bd); border-bottom:1px solid var(--m-det-bd); font-size:13px; font-weight:700; text-align:center; }
    .mi-grade > div.rot { font-size:10px; font-weight:600; color:var(--m-muted); text-transform:uppercase; letter-spacing:.5px; background:var(--m-cell); padding:6px 10px; }
    .mi-obs { font-size:12px; color:#ffd700; background:rgba(255,215,0,.06); border:1px solid rgba(255,215,0,.25); border-radius:8px; padding:10px 12px; margin-top:8px; font-weight:600; }
    .mini-app.claro .mi-obs { color:#8a6a00; background:rgba(200,160,0,.08); }
    .mi-hist { margin-top:8px; text-align:right; font-size:12px; font-weight:700; color:var(--m-link); text-decoration:underline; text-underline-offset:3px; }
    .mi-serie { display:grid; grid-template-columns:58px 1fr 1fr 44px; gap:7px; align-items:center; background:var(--m-serie); border:1.5px solid var(--m-serie-bd); border-radius:10px; padding:8px; margin-bottom:6px; }
    .mi-serie.atual { border-color:var(--m-verde); }
    .mi-serie .mi-cel { text-align:center; background:var(--m-alvo-bg); border:1px solid var(--m-alvo-bd); border-radius:8px; padding:4px 2px; }
    .mi-serie .mi-s { font-size:9.5px; color:var(--m-muted); font-weight:800; letter-spacing:.06em; }
    .mi-serie .mi-alvo { font-size:19px; color:var(--m-alvo); font-weight:900; line-height:1.05; margin-top:1px; }
    .mi-serie .mi-alvo.longo { font-size:12.5px; line-height:1.15; }
    .mi-serie .mi-un { font-size:8.5px; color:var(--m-muted); font-weight:800; text-transform:uppercase; letter-spacing:.07em; margin-top:1px; }
    .mi-serie .mi-campo { background:var(--m-input); border:1px solid var(--m-input-bd); border-radius:8px; padding:9px 6px; color:var(--m-muted); font-size:13px; font-weight:700; text-align:center; }
    .mi-serie .mi-ok { width:44px; height:44px; border-radius:9px; border:1px solid var(--m-serie-bd); background:var(--m-cell); display:flex; align-items:center; justify-content:center; font-size:17px; }
    .mi-tec { grid-column:1/-1; display:flex; align-items:center; gap:6px; margin-bottom:2px; padding:5px 9px; border-radius:8px; }
    .mi-tec b { font-size:10.5px; font-weight:900; text-transform:uppercase; letter-spacing:.4px; }
    .mi-tec span { flex:1; min-width:0; font-size:10.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .mi-grupo { border:2px solid rgba(127,255,0,.25); border-radius:16px; padding:10px; margin:16px 0 12px; position:relative; }
    .mi-grupo.super { border-color:rgba(255,165,0,.4); } .mi-grupo.triset { border-color:rgba(138,43,226,.4); } .mi-grupo.circuito { border-color:rgba(0,191,255,.4); }
    .mi-grupo .mi-gl { position:absolute; top:-10px; left:16px; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:1px; padding:2px 8px; border-radius:6px; color:#000; }
    .mi-grupo.super .mi-gl { background:#ff9500; } .mi-grupo.triset .mi-gl { background:#9b59ff; color:#fff; } .mi-grupo.circuito .mi-gl { background:#00bfff; }
    .mi-grupo .mi-gd { font-size:11px; color:var(--m-muted); text-align:center; padding:6px 0 4px; font-style:italic; }
    .mi-along { display:flex; align-items:flex-start; gap:12px; padding:14px; background:var(--m-along); border:1px solid var(--m-along-bd); border-radius:12px; margin-bottom:8px; }
    .mi-along.ativo { border-color:#667eea; }
    .mi-along .mi-an { width:32px; height:32px; border-radius:10px; background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; font-size:12px; font-weight:900; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px; }
    .mi-along .mi-ab { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
    .mi-along .mi-at { font-size:14px; font-weight:600; }
    .mi-along .mi-am { display:flex; gap:8px; flex-wrap:wrap; }
    .mi-along .mi-am span { font-size:11px; color:var(--m-muted); background:var(--m-cell); padding:3px 8px; border-radius:6px; }
    .mi-along .mi-ai { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; padding:8px 12px; border-radius:8px; font-size:12px; font-weight:700; white-space:nowrap; align-self:center; }
    .mi-iniciar { margin-top:22px; padding:16px; border-radius:12px; text-align:center; font-size:16px; font-weight:800; color:#000; background:linear-gradient(135deg,#7FFF00,#5fd000); box-shadow:0 4px 20px rgba(127,255,0,.3); }
    .mi-vazio { padding:34px 12px; text-align:center; font-size:13px; color:var(--m-muted); }
    .mini-abas { display:flex; gap:6px; margin-top:12px; }
    .mini-abas button, .mini-tema { flex:1; padding:8px 6px; font-size:12px; font-weight:700; font-family:inherit; border-radius:9px; border:1px solid var(--border); background:var(--bg2); color:var(--text-muted); cursor:pointer; }
    .mini-abas button.on { border-color:var(--brand); color:var(--brand); background:var(--green-dim); }
    .mini-tema { flex:0 0 40px; }
    .mini-aviso { font-size:11.5px; line-height:1.45; color:var(--text-muted); margin-top:10px; }
    .mini-aviso.alerta { color:#f59e0b; font-weight:600; }
    .linha-link:hover { background: rgba(127,255,0,.07); }
    .linha-link:hover > div > div:first-child { color: var(--brand); }
  </style>
</head>
<body>
<script>
requireLogin();
renderLayout('Treinos');

const main = document.getElementById('main-content');
const _isAdm = (() => { try { return isAdmin(); } catch(e) { return false; } })();

let atletas = [], fichas = [], treinos = [], exercicios = [], alongamentos = [];
let mensalidades = [];
// Mesma regra da tela de Inicio e de Clientes (api.js): so e ativo quem tem plano
// vigente ou vencido ha ate 30 dias. Inativo e bloqueado saem da lista de treinos
// ativos — nao adianta prescrever para quem nao tem acesso ao app.
function situacaoDoAluno(a) {
  if (typeof API !== 'undefined' && typeof API.situacaoPlano === 'function') return API.situacaoPlano(a, mensalidades);
  return { estado: 'ativo', ativo: true, inativo: false, bloqueado: a.stbloqueio === 'S', motivo: '', lead: false };
}
function alunoAtivo(a) { const s = situacaoDoAluno(a); return s.ativo; }

// Mesmas predefinicoes das caixas da tela de Inicio: lista inteira com rolagem e
// botao para alternar a ordem. Antes cada caixa mostrava 5 ou 6 itens e escondia
// o resto atras de "+N mais", sem jeito de ver nem reordenar.
const ordemCaixaTreino = {};
function alternarOrdemTreino(chave) {
  ordemCaixaTreino[chave] = (ordemCaixaTreino[chave] === 'asc') ? 'desc' : 'asc';
  render();
}
function _btnOrdem(chave, rotulo) {
  const ord = ordemCaixaTreino[chave] || 'asc';
  return '<button onclick="alternarOrdemTreino(\'' + chave + '\')" title="' + rotulo + '"' +
    ' style="margin-left:auto;border:1px solid var(--border);background:transparent;color:var(--text-muted);' +
    'border-radius:7px;padding:2px 8px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;">' +
    (ord === 'asc' ? '↑' : '↓') + ' ' + rotulo + '</button>';
}
function _ordenar(lista, chave, campoFn) {
  const ord = ordemCaixaTreino[chave] || 'asc';
  return lista.slice().sort((a, b) => {
    const x = campoFn(a), y = campoFn(b);
    const r = (typeof x === 'string') ? String(x).localeCompare(String(y), 'pt-BR') : (x - y);
    return ord === 'asc' ? r : -r;
  });
}
const _CAIXA = 'max-height:230px;overflow-y:auto;';
let view = 'lista';
let editFichaId = null;
let _fichaLink = (function () {
  try { const n = parseInt(new URLSearchParams(location.search).get('ficha'), 10); return n > 0 ? { id: n, feito: false } : null; }
  catch (e) { return null; }
})();

// ── CARREGAMENTO: SEIS CHAMADAS, UMA FALHA, TELA EM BRANCO ──────────────────
// Promise.all rejeita inteiro se UMA das seis falhar. Sem try/catch a excecao
// subia, render() nunca era chamado e a tela ficava permanentemente em branco:
// sem spinner, sem aviso, sem botao. Foi exatamente o que o ranking dos alunos
// fez em 14/08. Agora ha estado de carregando, a falha vira mensagem honesta
// com "Tentar de novo", e as listas em memoria nao sao zeradas por engano.
async function carregar() {
  try { if (main && window.IntusEstado) main.innerHTML = IntusEstado.carregando('Carregando treinos…'); } catch (e) {}

  let as, fs, ts, es, als, ms;
  try {
    [as, fs, ts, es, als, ms] = await Promise.all([
      API.listarAtletas(''),
      API.listarFichas(),
      API.listarTodosTreinos(),
      API.listarExercicios(),
      API.listarAlongamentos(),
      (API.listarMensalidades ? API.listarMensalidades().catch(() => []) : Promise.resolve([])),
    ]);
  } catch (e) {
    const msg = (e && e.message) ? String(e.message) : 'falha na conexão';
    if (main && window.IntusEstado) main.innerHTML = IntusEstado.erro(msg, 'carregar()');
    return;
  }

  mensalidades = Array.isArray(ms) ? ms : [];
  atletas = as || [];
  fichas  = fs || [];
  treinos = ts || [];
  exercicios = es || [];
  alongamentos = als || [];
  // Professor só vê fichas/atletas da sua carteira (admin vê todos incluindo modelos)
  atletas = API.filtrarMeusAtletas(atletas);
  if (!Sessao.atual()?.admin) {
    const _idsVisiveis = new Set(atletas.map(a => Number(a.idatleta)));
    fichas = fichas.filter(f => _idsVisiveis.has(Number(f.idatleta)));
  }
  // Link direto de outra tela (treinos.html?ficha=<idficha>): abre a ficha certa, uma vez so.
  if (_fichaLink && !_fichaLink.feito) {
    _fichaLink.feito = true;
    if (fichas.some(f => Number(f.idficha) === _fichaLink.id)) { editFichaId = _fichaLink.id; view = 'editor'; }
    else showToast('Esse treino não está mais na lista.', 'error');
  }
  render();
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatSeg(s) { s=parseInt(s)||0; return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function parseSeg(v) { v=String(v||'').trim(); if(v.includes(':')){ const[m,s]=v.split(':'); return(parseInt(m)||0)*60+(parseInt(s)||0); } return parseInt(v)||60; }

function calcTempoEstimado(exs) {
  if (!exs || exs.length === 0) return 0;
  const REP_TIME = 3;
  const TRANSICAO = 60;
  let total = 0;
  exs.forEach(ex => {
    const series = parseInt(ex.qtdserie) || 3;
    const repStr = String(ex.repeticoes || ex.qtdrepeticao || '12');
    const reps = parseInt(repStr) || 12;
    const intervalo = ex.tempopausa ? parseInt(ex.tempopausa) : parseSeg(ex.intervalo || '01:00');
    const uni = ex.unilateral ? 2 : 1;
    const tempoExecSerie = reps * REP_TIME * uni;
    total += (tempoExecSerie * series) + (intervalo * (series - 1)) + TRANSICAO;
  });
  return Math.round(total / 60);
}

function formatTempo(min) {
  return min + ' min';
}

function render() {
  if (view === 'editor') return renderEditor();
  if (view === 'lixeira') return renderLixeira();
  if (view === 'historico') return renderHistoricoAluno();
  renderLista();
}

// ═══════════════════════════════════════════════════════════════
// VIEW: LISTA DE FICHAS
// ═══════════════════════════════════════════════════════════════
let filtroAtivo = true;
let buscaTreino = '';
let ordenacaoTreino = 'recentes';
let filtroProfs = [];

// ── Regra de vencimento de ficha ─────────────────────────────────────────
// Após FICHA_GRACE_DIAS dias do vencimento (dtfim), a ficha conta automaticamente
// como INATIVA: o aluno perde acesso no app e ela aparece no filtro "Inativos",
// onde o professor responsável pode encontrá-la e atualizá-la.
const FICHA_GRACE_DIAS = 2;
function fichaFlagAtiva(f) { return f.ativo !== false && f.ativo !== 0 && f.ativo !== '0'; }
function fichaExpirada(f) {
  if (!f.dtfim) return false;
  const d = new Date(); d.setDate(d.getDate() - FICHA_GRACE_DIAS);
  return String(f.dtfim).slice(0,10) < d.toISOString().slice(0,10);
}
function fichaAtivaEfetiva(f) { return fichaFlagAtiva(f) && !fichaExpirada(f); }

function renderLista() {
  const podeIncluir = hasPerm('tr_incluir');
  let fichasComInfo = fichas.map(f => {
    const aluno = atletas.find(a => Number(a.idatleta) === Number(f.idatleta));
    const exs = treinos.filter(t => Number(t.idficha) === Number(f.idficha));
    const divs = API.ordenarDivisoes(exs.map(t => t.divisao || 'A'), f);
    // Ficha vencida há mais de 2 dias conta como inativa automaticamente
    const ativo = fichaAtivaEfetiva(f);
    return { ...f, aluno, exs, divs, ativo };
  }).filter(f => filtroAtivo ? f.ativo : !f.ativo);

  // Filtro por professor
  if (filtroProfs.length > 0) {
    fichasComInfo = fichasComInfo.filter(f => {
      const profs = f.aluno?.professores_responsaveis || [];
      return filtroProfs.some(id => profs.map(Number).includes(Number(id)));
    });
  }

  // Busca
  if (buscaTreino) {
    const q = buscaTreino.toLowerCase();
    fichasComInfo = fichasComInfo.filter(f =>
      (f.nmficha||'').toLowerCase().includes(q) ||
      (f.aluno?.nome||'').toLowerCase().includes(q) ||
      (f.observacao||'').toLowerCase().includes(q)
    );
  }

  // Ordenação
  if (ordenacaoTreino === 'recentes') fichasComInfo.sort((a,b) => (b.dtinicio||'').localeCompare(a.dtinicio||''));
  else if (ordenacaoTreino === 'antigos') fichasComInfo.sort((a,b) => (a.dtinicio||'').localeCompare(b.dtinicio||''));
  else if (ordenacaoTreino === 'nome_aluno') fichasComInfo.sort((a,b) => (a.aluno?.nome||'').localeCompare(b.aluno?.nome||'','pt-BR'));
  else if (ordenacaoTreino === 'nome_ficha') fichasComInfo.sort((a,b) => (a.nmficha||'').localeCompare(b.nmficha||'','pt-BR'));
  else if (ordenacaoTreino === 'exercicios') fichasComInfo.sort((a,b) => b.exs.length - a.exs.length);

  // ── Dashboard insights ──
  const hoje = new Date().toISOString().slice(0,10);
  // Fichas com flag ativa (inclui vencidas ainda não atualizadas pelo professor)
  const flagAtivas = fichas.filter(fichaFlagAtiva);
  // Fichas efetivamente ativas (exclui vencidas há mais de 2 dias)
  const todasAtivas = flagAtivas.filter(f => !fichaExpirada(f));

  // Últimos prescritos (top 5 por dtinicio desc)
  const ultPrescritos = [...todasAtivas].filter(f => f.dtinicio).sort((a,b) => (b.dtinicio||'').localeCompare(a.dtinicio||'')).slice(0,5);

  // Treinos a vencer/vencidos: dtfim <= hoje +7 dias.
  // Só entra na lista se o aluno NÃO tem outro treino ativo válido (treino já atualizado sai da lista).
  const em7dias = new Date(); em7dias.setDate(em7dias.getDate() + 7);
  const limiteStr = em7dias.toISOString().slice(0,10);
  const temTreinoAtualizado = f => todasAtivas.some(g =>
    Number(g.idficha) !== Number(f.idficha) &&
    Number(g.idatleta) === Number(f.idatleta) &&
    (!g.dtfim || g.dtfim > limiteStr));
  const aVencer = flagAtivas
    .filter(f => f.dtfim && f.dtfim <= limiteStr)
    .filter(f => !temTreinoAtualizado(f))
    .sort((a,b) => (b.dtfim||'').localeCompare(a.dtfim||'')); // vencidos há mais tempo ao FINAL da lista

  // Alunos sem treino ativo (fichas vencidas há +2 dias não contam como ativas)
  const atletasComFicha = new Set(todasAtivas.map(f => Number(f.idatleta)));
  // Nao cobra treino de quem esta inativo/bloqueado: sem plano, sem acesso ao app.
  const semTreino = atletas.filter(a => !atletasComFicha.has(Number(a.idatleta))
    && a.email !== 'modelo.masculino@intusfit.local' && a.email !== 'modelo.feminino@intusfit.local'
    && alunoAtivo(a));

  // Fichas prescritas por mes (data de inicio), ultimos 12 meses: dica ao passar o mouse em "Ultimos prescritos".
  const _serie12 = (() => {
    const rot = [], val = [], h = new Date();
    for (let i = 11; i >= 0; i--) {
      const ref = new Date(h.getFullYear(), h.getMonth() - i, 1);
      const chave = ref.getFullYear() + '-' + String(ref.getMonth() + 1).padStart(2, '0');
      rot.push(ref.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '') + '/' + String(ref.getFullYear()).slice(2));
      val.push(fichas.filter(f => String(f.dtinicio || '').slice(0, 7) === chave).length);
    }
    return { rot, val };
  })();
  const _tipPrescritos = Tip.historico({ titulo: 'Fichas prescritas', rotulos: _serie12.rot, valores: _serie12.val, i: 11, sufixo: 'neste mês', anteriores: 5 });

  const modoFichas = VerModo.get('treinos-fichas', 'cartoes');
  main.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
        <div>
          <h1 style="font-size:22px;font-weight:800;color:var(--text);margin:0;">Treinos</h1>
          <p style="font-size:12px;color:var(--text-muted);margin:4px 0 0;">Fichas de treino prescritas para seus clientes.</p>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="btn ${filtroAtivo?'btn-primary':'btn-secondary'} btn-sm" onclick="filtroAtivo=true;render();">Ativos</button>
          <button class="btn ${!filtroAtivo?'btn-primary':'btn-secondary'} btn-sm" onclick="filtroAtivo=false;render();">Inativos</button>
          <button class="btn btn-secondary btn-sm" onclick="view='lixeira';render();" title="Fichas excluídas">🗑️</button>
          ${podeIncluir ? `<button class="btn btn-primary" onclick="novoTreino()">+ Adicionar Treino</button>` : ''}
        </div>
      </div>

      <!-- DASHBOARD INSIGHTS -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;">
        <!-- Últimos prescritos -->
        <div class="card" style="padding:14px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
            <span style="font-size:18px;">📋</span>
            <span${Tip.attr(_tipPrescritos)} style="font-size:12px;font-weight:800;color:var(--text);text-transform:uppercase;letter-spacing:.5px;cursor:help;border-bottom:1px dotted var(--text-dim);">Últimos prescritos</span>
            ${_btnOrdem('ult','data')}
          </div>
          ${ultPrescritos.length === 0 ? '<p style="font-size:12px;color:var(--text-muted);">Nenhuma ficha recente.</p>' : '<div style="'+_CAIXA+'">' + _ordenar(ultPrescritos,'ult',f => f.dtinicio||'').map(f => {
            const al = atletas.find(a => Number(a.idatleta) === Number(f.idatleta));
            return `<div class="linha-link" onclick="abrirFicha(${f.idficha})" title="Abrir este treino" style="display:flex;align-items:center;justify-content:space-between;padding:6px 4px;border-bottom:1px solid var(--border);cursor:pointer;">
              <div style="min-width:0;">
                <div style="font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(al?.nome || '—')}</div>
                <div style="font-size:11px;color:var(--text-muted);">${esc(f.nmficha || 'Ficha')}</div>
              </div>
              <span style="font-size:10px;color:var(--text-muted);flex-shrink:0;margin-left:8px;">${f.dtinicio ? new Date(f.dtinicio+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) : ''}</span>
            </div>`;
          }).join('') + '</div>'}
        </div>

        <!-- Treinos a vencer -->
        <div class="card" style="padding:14px;${aVencer.length > 0 ? 'border-color:rgba(251,146,60,.4);' : ''}">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
            <span style="font-size:18px;">⚠️</span>
            <span style="font-size:12px;font-weight:800;color:var(--text);text-transform:uppercase;letter-spacing:.5px;">Treinos a vencer</span>
            ${aVencer.length > 0 ? `<span style="background:#f87171;color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;font-weight:700;">${aVencer.length}</span>` : ''}
            ${_btnOrdem('venc','vencimento')}
          </div>

// ── Quadro de fichas (só visualização: nada é gravado aqui; clicar abre o editor de sempre) ──
// As colunas seguem as mesmas definições da lista e dos alertas desta tela (fichaFlagAtiva, fichaExpirada, "a vencer" em 7 dias
// sem outro treino atualizado, "sem treino ativo" só para aluno ativo). Mostra todas as fichas, ativas e inativas.
let _quadroFichas = null;
function _classificarFichasQuadro() {
  const info = f => {
    const aluno = atletas.find(a => Number(a.idatleta) === Number(f.idatleta));
    const exs = treinos.filter(t => Number(t.idficha) === Number(f.idficha));
    return { ...f, aluno, exs, divs: API.ordenarDivisoes(exs.map(t => t.divisao || 'A'), f) };
  };
  let lista = fichas.map(info);
  if (filtroProfs.length > 0) lista = lista.filter(f => { const profs = f.aluno?.professores_responsaveis || []; return filtroProfs.some(id => profs.map(Number).includes(Number(id))); });
  if (buscaTreino) { const q = buscaTreino.toLowerCase(); lista = lista.filter(f => (f.nmficha || '').toLowerCase().includes(q) || (f.aluno?.nome || '').toLowerCase().includes(q) || (f.observacao || '').toLowerCase().includes(q)); }
  const hoje = new Date().toISOString().slice(0, 10);
  const lim = new Date(); lim.setDate(lim.getDate() + 7); const limiteStr = lim.toISOString().slice(0, 10);
  const todasAtivas = fichas.filter(fichaFlagAtiva).filter(f => !fichaExpirada(f));
  const temAtualizado = f => todasAtivas.some(g => Number(g.idficha) !== Number(f.idficha) && Number(g.idatleta) === Number(f.idatleta) && (!g.dtfim || g.dtfim > limiteStr));
  const col = f => {
    if (fichaFlagAtiva(f) && f.dtfim && String(f.dtfim).slice(0, 10) <= limiteStr && !temAtualizado(f)) return String(f.dtfim).slice(0, 10) < hoje ? 'vencidas' : 'vencem';
    return fichaAtivaEfetiva(f) ? 'andamento' : 'inativas';
  };
  const cartoes = lista.map(f => ({ ficha: f, coluna: col(f) }));
  // alunos ativos sem nenhuma ficha ativa (mesma regra do alerta da tela)
  const comFicha = new Set(todasAtivas.map(f => Number(f.idatleta)));
  const ehModelo = a => a.email === 'modelo.masculino@intusfit.local' || a.email === 'modelo.feminino@intusfit.local';
  let sem = atletas.filter(a => !comFicha.has(Number(a.idatleta)) && !ehModelo(a) && alunoAtivo(a));
  if (filtroProfs.length > 0) sem = sem.filter(a => { const profs = a.professores_responsaveis || []; return filtroProfs.some(id => profs.map(Number).includes(Number(id))); });
  if (buscaTreino) { const q = buscaTreino.toLowerCase(); sem = sem.filter(a => (a.nome || '').toLowerCase().includes(q)); }
  return { cartoes, sem };
}
function _montarQuadroFichas() {
  const alvo = document.getElementById('fichas-quadro'); if (!alvo) return;
  if (_quadroFichas) { _quadroFichas.destruir(); _quadroFichas = null; }
  const { cartoes, sem } = _classificarFichasQuadro();
  const podeIncluir = hasPerm('tr_incluir');
  const cartaoFicha = f => {
    const nome = f.aluno ? f.aluno.nome : 'Aluno removido';
    return '<div style="display:flex;gap:8px;align-items:center;">' + (f.aluno ? avatarHtml(f.idatleta, nome, 30) : '') +
      '<div style="min-width:0;flex:1;"><div class="kb-cartao-nome">' + esc(nome) + '</div><div class="kb-meta">' + esc(f.nmficha || 'Ficha sem nome') + '</div></div></div>' +
      '<div>' + (f.dtfim ? _fichaSituacao(f) : '<span class="fc-pill">sem prazo</span>') + '<span class="kb-pill">' + f.divs.length + ' divisões</span><span class="kb-pill">' + f.exs.length + ' exercícios</span>' +
      (_profsDe(f) ? '<span class="kb-pill">👤 ' + esc(_profsDe(f)) + '</span>' : '') + '</div>' +
      '<div class="kb-acoes"><button type="button" data-kbf="' + f.idficha + '">Abrir ficha</button><button type="button" data-kbh="' + f.idatleta + '" title="Histórico do aluno">📊</button></div>';
  };
  const cfg = {
    colunas: [
      { id: 'sem', titulo: 'Aluno ativo sem treino', tom: 'verm', soltar: false, dica: 'Precisa de uma ficha nova.' },
      { id: 'vencidas', titulo: 'Fichas vencidas', tom: 'verm', soltar: false, dica: 'Passou do prazo e o aluno não tem outra ficha atualizada.' },
      { id: 'vencem', titulo: 'Vencem em até 7 dias', tom: 'ambar', soltar: false },
      { id: 'andamento', titulo: 'Em andamento', tom: 'verde', soltar: false },
      { id: 'inativas', titulo: 'Inativas', tom: '', soltar: false }],
    cartoes: sem.map(a => ({ id: 'a' + a.idatleta, coluna: 'sem', bloqueado: true,
        html: '<div style="display:flex;gap:8px;align-items:center;">' + avatarHtml(a.idatleta, a.nome, 30) + '<div style="min-width:0;flex:1;"><div class="kb-cartao-nome">' + esc(a.nome) + '</div><div class="kb-meta">nenhuma ficha ativa</div></div></div>' +
          (podeIncluir ? '<div class="kb-acoes"><button type="button" data-kbn="' + a.idatleta + '">Criar ficha</button></div>' : '') }))
      .concat(cartoes.map(c => ({ id: 'f' + c.ficha.idficha, coluna: c.coluna, bloqueado: true, html: cartaoFicha(c.ficha) }))),
    vazio: 'Nenhuma ficha aqui.'
  };
  alvo.classList.add('kb-painel');
  alvo.onclick = ev => {
    const f = ev.target.closest('[data-kbf]'); if (f) { abrirFicha(Number(f.getAttribute('data-kbf'))); return; }
    const h = ev.target.closest('[data-kbh]'); if (h) { verHistorico(Number(h.getAttribute('data-kbh'))); return; }
    const n = ev.target.closest('[data-kbn]'); if (n) novoTreinoParaAluno(Number(n.getAttribute('data-kbn')));
  };
  _quadroFichas = Kanban.montar(alvo, cfg);
}
function _profsDe(f) {
  if (!f.aluno || !f.aluno.professores_responsaveis) return '';
  const allU = JSON.parse(localStorage.getItem('intus-usuarios') || '[]');
  return f.aluno.professores_responsaveis.map(id => { const u = allU.find(x => Number(x.idusuario) === Number(id)); return u ? (u.nome || '').split(' ')[0] : ''; }).filter(Boolean).join(', ');
}
function _fichaSituacao(f) {
  if (!f.dtfim) return '';
  const hoje = new Date().toISOString().slice(0, 10), d = String(f.dtfim).slice(0, 10);
  const dias = Math.round((new Date(d + 'T00:00:00') - new Date(hoje + 'T00:00:00')) / 86400000);
  if (dias < 0) return `<span class="fc-pill v" title="Venceu em ${fmtDataBR(d)}">venceu há ${-dias}d</span>`;
  if (dias <= 7) return `<span class="fc-pill a" title="Vence em ${fmtDataBR(d)}">vence em ${dias}d</span>`;
  return `<span class="fc-pill" title="Vence em ${fmtDataBR(d)}">até ${fmtDataBR(d).slice(0, 5)}</span>`;
}
function fmtDataBR(d) { return d ? new Date(String(d).slice(0, 10) + 'T00:00:00').toLocaleDateString('pt-BR') : ''; }
// Lista de fichas em cada modo; "grande" é o cartão completo de sempre (um por linha).
function _fichasPorModo(lista, modo, podeIncluir, grande) {
  if (modo === 'quadro') return '<div id="fichas-quadro"></div>';
  if (modo === 'compacto') {
    return '<div class="vm-grid m-compacto">' + lista.map(f => {
      const nome = f.aluno ? f.aluno.nome : 'Aluno removido';

          <button class="btn-icon-sm" onclick="event.stopPropagation();verHistorico(${f.idatleta})" title="Histórico do aluno">📊</button></div>
        <div class="bd"><span class="fc-pill">${f.divs.length} divisões</span><span class="fc-pill">${f.exs.length} exercícios</span>${_fichaSituacao(f)}<span style="font-size:11px;color:var(--text-muted);margin-left:auto;">${f.dtinicio ? fmtDataBR(f.dtinicio).slice(0, 5) : ''}</span></div>
      </div>`;
    }).join('') + '</div>';
  }
  if (modo === 'miniaturas') {
    return '<div class="vm-grid m-miniaturas">' + lista.map(f => {
      const nome = f.aluno ? f.aluno.nome : 'Aluno removido';
      return `<div class="fc-mini" onclick="abrirFicha(${f.idficha})" title="${esc(nome)} · ${esc(f.nmficha || 'Ficha')}">
        ${f.aluno ? avatarHtml(f.idatleta, nome, 50) : ''}<div class="nm">${esc(nome)}</div><div class="fi">${esc(f.nmficha || 'Ficha sem nome')}</div>
        <div class="bd" style="display:flex;gap:4px;justify-content:center;flex-wrap:wrap;"><span class="fc-pill">${f.divs.length} div · ${f.exs.length} ex</span>${_fichaSituacao(f)}</div>
      </div>`;
    }).join('') + '</div>';
  }
  if (modo === 'lista') {
    return `<div style="overflow-x:auto;"><table class="fc-tab"><thead><tr><th>Aluno</th><th>Ficha</th><th>Início</th><th>Validade</th><th style="text-align:center;">Divisões</th><th style="text-align:center;">Exercícios</th><th>Professor</th><th></th></tr></thead><tbody>` +
      lista.map(f => {
        const nome = f.aluno ? f.aluno.nome : 'Aluno removido';
        return `<tr class="lin" onclick="abrirFicha(${f.idficha})">
          <td><div class="fc-nome">${f.aluno ? avatarHtml(f.idatleta, nome, 28) : ''}<div style="min-width:0;"><b title="${esc(nome)}">${esc(nome)}</b></div></div></td>
          <td><div class="fc-nome"><div style="min-width:0;"><b title="${esc(f.nmficha || '')}">${esc(f.nmficha || 'Ficha sem nome')}</b>${f.observacao ? `<span title="${esc(f.observacao)}">${esc(f.observacao.slice(0, 60))}</span>` : ''}</div></div></td>
          <td style="white-space:nowrap;color:var(--text-muted);font-size:12px;">${fmtDataBR(f.dtinicio)}</td>
          <td>${_fichaSituacao(f) || '<span style="color:var(--text-muted);font-size:12px;">sem prazo</span>'}</td>
          <td class="num">${f.divs.length}</td><td class="num">${f.exs.length}</td>
          <td style="font-size:12px;color:var(--text-muted);">${esc(_profsDe(f))}</td>
          <td style="text-align:right;white-space:nowrap;"><button class="btn-icon-sm" onclick="event.stopPropagation();verHistorico(${f.idatleta})" title="Histórico do aluno">📊</button>${podeIncluir ? ` <button class="btn-icon-sm" onclick="event.stopPropagation();duplicarFicha(${f.idficha})" title="Duplicar para outro aluno">⧉</button>` : ''}</td>
        </tr>`;
      }).join('') + '</tbody></table></div>';
  }
  return lista.map(grande).join('');
}

function abrirFicha(id) { editFichaId = id; view = 'editor'; render(); }

async function duplicarFicha(id) {
  if (window.__dupFicha) return;
  if (!hasPerm('tr_incluir')) return showToast('Sem permissão para duplicar treinos.', 'error');
  const ficha = fichas.find(f => Number(f.idficha) === Number(id));
  if (!ficha) return showToast('Ficha não encontrada.', 'error');
  const exsOriginal = treinos.filter(t => Number(t.idficha) === Number(id));
  const nomeNovo = (ficha.nmficha || 'Ficha') + ' (cópia)';
  window.__dupFicha = true;
  try {
    const nova = await API.criarFicha({
      idatleta: ficha.idatleta,
      nmficha: nomeNovo,
      dtinicio: new Date().toISOString().slice(0,10),
      dtfim: null,
      observacao: ficha.observacao || '',
      ativo: 1,
      alongamentos: ficha.alongamentos || null,
      // Nomes personalizados das divisoes. Sem esta linha a copia nascia sem eles
      // e a tela caia no rotulo generico A, B, C — o conteudo vinha certo, so o
      // nome da divisao se perdia.  A API espera a chave 'divNomes'.
      divNomes: ficha.divNomes || null,
      divOrdem: ficha.divOrdem || null,
    });
    let _copiado = false;
    try {
      await checarAPI();
      if (USAR_API && !Auth.isLocalToken()) {
        await apiFetch('/treinos.php?action=treinos_replace', {
          method: 'POST',
          body: JSON.stringify({
            idficha: nova.idficha,
            exercicios: exsOriginal.map(ex => ({
              idexercicio: ex.idexercicio, nmexercicio: ex.nmexercicio,
              divisao: ex.divisao || 'A', qtdserie: ex.qtdserie || 4, qtdrepeticao: ex.qtdrepeticao || 12,
              repeticoes: ex.repeticoes || '', tempopausa: ex.tempopausa || 60, intervalo: ex.intervalo || '',
              metodo: ex.metodo || '', observacao: ex.observacao || '',
              unilateral: ex.unilateral || false, substitutos: ex.substitutos,
            })),
          }),
        });
        _copiado = true;
      }
    } catch (e) {
      if (e && e.status === 403) throw e;
    }
    if (!_copiado) {
      for (const ex of exsOriginal) {
        await API.adicionarExercicioFicha({
          idficha: nova.idficha, idexercicio: ex.idexercicio, nmexercicio: ex.nmexercicio,
          divisao: ex.divisao || 'A', qtdserie: ex.qtdserie || 4, qtdrepeticao: ex.qtdrepeticao || 12,
          repeticoes: ex.repeticoes || '', tempopausa: ex.tempopausa || 60, intervalo: ex.intervalo || '',
          metodo: ex.metodo || '', observacao: ex.observacao || '', tut: ex.tut || '',
          falha: ex.falha || false, unilateral: ex.unilateral || false, cargas: ex.cargas || [], reps_por_serie: ex.reps_por_serie || [], intervalos_por_serie: ex.intervalos_por_serie || [], tecnicas_por_serie: ex.tecnicas_por_serie || [],
          substitutos: ex.substitutos,
        });
      }
    }
    showToast(`Ficha duplicada! Abra "${nomeNovo}" para atribuir a outro aluno.`);
    await carregar();
  } catch (e) { showToast(e.message || 'Erro ao duplicar.', 'error'); }
  finally { window.__dupFicha = false; }
}

// ═══════════════ EVOLUÇÃO DO ALUNO — VISÃO DO PROFESSOR ═══════════════
// A tela de histórico do professor era só uma tabela de sessões: data, divisão,
// duração e quantidade de exercícios. Não dava para responder a pergunta que o
// professor precisa responder toda semana — "este aluno progrediu no supino nos
// últimos três meses?". Agora usa o mesmo módulo de gráficos da tela do aluno,
// então os dois olham exatamente para os mesmos números.
let _evoProf = { escala: 'sessao', idex: null };

function trocarEscalaEvoProf(e) { _evoProf.escala = e; renderHistoricoAluno(); }
function trocarExercicioEvoProf(id) { _evoProf.idex = id; renderHistoricoAluno(); }

function _blocoEvolucaoProf(sessoes) {
  if (typeof IntusEvolucao === 'undefined') return '';
  const isLight = document.body.classList.contains('theme-light');
  const lista = IntusEvolucao.exercicios(sessoes);
  if (!lista.length && !(sessoes || []).length) return '';

  let html = '<div class="card"><div class="card-header"><span class="card-title">📈 Evolução</span></div>' +
    '<div style="padding:0 2px 4px;">' +
    '<p style="font-size:12px;color:var(--text-muted);margin:0 0 10px;line-height:1.5;">' +
      'A escala de tempo vale para todos os gráficos abaixo.</p>' +
    IntusEvolucao.barraEscala(_evoProf.escala, 'trocarEscalaEvoProf', isLight);

  // Volume por divisão saiu em 22/08/2026. Comparava dia de perna com dia de
  // braço: a divisão de perna sempre ganha, porque agachamento carrega mais
  // peso que rosca direta, e a linha mais baixa não significava descuido
  // nenhum. No lugar entram duas coisas que se sustentam sozinhas: com que
  // frequência o cliente treinou, e o quanto cada exercício evoluiu.
  const _hj = new Date(); _hj.setHours(0, 0, 0, 0);
  const _domA = new Date(_hj); _domA.setDate(_domA.getDate() - _hj.getDay());
  const _sem = [];
  for (let w = 11; w >= 0; w--) {
    const ini = new Date(_domA); ini.setDate(ini.getDate() - w * 7);
    const fim = new Date(ini); fim.setDate(fim.getDate() + 6); fim.setHours(23, 59, 59, 999);
    const n = (sessoes || []).filter(s => {
      if (s.nao_contar) return false;
      const d = new Date(String(s.dtsessao).slice(0, 10) + 'T00:00:00');
      return d >= ini && d <= fim;
    }).length;
    _sem.push({ rotulo: String(ini.getDate()).padStart(2,'0') + '/' + String(ini.getMonth()+1).padStart(2,'0'), valor: n, atual: w === 0 });
  }
  html += IntusEvolucao.barras({
    id: 'pev-freq', isLight, meta: 0,
    titulo: 'Treinos por semana',
    sub: 'Últimas 12 semanas, de domingo a sábado. A última ainda está em andamento.',
    itens: _sem, altura: 140, pxPorItem: 34,
  });

  // Começou → hoje, por exercício.
  const _comp = [];
  IntusEvolucao.exercicios(sessoes).forEach(e => {
    const pts = IntusEvolucao.historicoExercicio(sessoes, e.id).filter(p => p.media > 0);
    if (pts.length < 2) return;
    _comp.push({ nome: e.nome, de: Math.round(pts[0].media * 10) / 10, para: Math.round(pts[pts.length-1].media * 10) / 10 });
  });
  _comp.sort((a, b) => ((b.para - b.de) / (b.de || 1)) - ((a.para - a.de) / (a.de || 1)));
  if (_comp.length) {
    html += '<div style="margin-top:12px;">' + IntusEvolucao.comecouAgora({
      id: 'pev-dumb', isLight,
      titulo: 'Começou com quanto, está com quanto',
      sub: 'Carga média da primeira sessão contra a da última, exercício por exercício. Cada linha tem a sua própria escala.',
      itens: _comp.slice(0, 12),
    }) + '</div>';
  }

  if (lista.length) {
    let atual = _evoProf.idex;
    if (!atual || !lista.some(e => String(e.id) === String(atual))) atual = lista[0].id;

    html += '<div style="margin-top:14px;">' +
      '<label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:6px;">Exercício</label>' +
      '<select onchange="trocarExercicioEvoProf(this.value)" style="width:100%;max-width:420px;min-height:42px;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:14px;font-family:inherit;">' +
      lista.map(e => '<option value="' + esc(e.id) + '"' + (String(e.id) === String(atual) ? ' selected' : '') + '>' + esc(e.nome) + ' (' + e.sessoes + ')</option>').join('') +
      '</select></div>';

    const pontos = IntusEvolucao.historicoExercicio(sessoes, atual);
    const dados = IntusEvolucao.agrupar(pontos, _evoProf.escala);
    const rots = dados.map(p => p.rotulo);
    const dets = dados.map(p => p.detalhe);

    let maxS = 0;
    dados.forEach(p => { if (p.series && p.series.length > maxS) maxS = p.series.length; });
    const seriesGraf = [];
    for (let i = 0; i < Math.min(maxS, 6); i++) {
      seriesGraf.push({
        nome: 'Série ' + (i + 1),
        valores: dados.map(p => (p.series && p.series[i]) ? p.series[i].peso : null),
      });
    }
    const sufixo = _evoProf.escala === 'sessao' ? 'sessão a sessão'
                 : _evoProf.escala === 'mes' ? 'média de cada mês' : 'média de cada ano';

    html += '<div style="display:flex;flex-direction:column;gap:12px;margin-top:12px;">' +
      IntusEvolucao.grafico({
        id: 'pev-series', isLight, titulo: 'Carga de cada série',
        sub: 'kg em cada série, ' + sufixo + '. A última série é a que denuncia fadiga e carga mal ajustada.',
        rotulos: rots, detalhes: dets, series: seriesGraf, unidade: 'kg', altura: 220,
      }) +
      IntusEvolucao.grafico({
        id: 'pev-maxmed', isLight, titulo: 'Carga máxima × carga média',
        sub: 'Pico subindo com média parada = a carga subiu em uma série só.',
        rotulos: rots, detalhes: dets, unidade: 'kg', altura: 190,
        series: [
          { nome: 'Máxima', valores: dados.map(p => p.max) },
          { nome: 'Média',  valores: dados.map(p => p.media) },
        ],
      }) +
      IntusEvolucao.grafico({
        id: 'pev-vol', isLight, titulo: 'Volume do exercício',
        sub: 'Carga × repetições somando todas as séries.',
        rotulos: rots, detalhes: dets, unidade: 'kg', altura: 170, casas: 0,
        series: [{ nome: 'Volume', valores: dados.map(p => p.volume) }],
      }) +
    '</div>';
  }

  return html + '</div></div>';
}

async function renderHistoricoAluno() {
  const aluno = atletas.find(a => Number(a.idatleta) === Number(historicoAtletaId));
  const nome = aluno ? aluno.nome : 'Aluno';

  main.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px;max-width:900px;margin:0 auto;">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="btn btn-secondary btn-sm" onclick="view='lista';render();">← Voltar</button>
        <h1 style="font-size:20px;font-weight:800;color:var(--text);margin:0;">📊 Histórico — ${esc(nome)}</h1>
      </div>
      <div class="card" style="padding:40px;text-align:center;color:var(--text-muted);">Carregando...</div>
    </div>`;

  // "catch { = [] }" transformava falha de rede em "nenhuma sessao registrada".
  // O professor concluia que o aluno nao treinou. Agora a falha tem cara de
  // falha, e so quem voltou 200 com lista vazia pode dizer "nao treinou".
  let _erroHist = null;
  try { historicoSessoes = await API.listarSessoes(historicoAtletaId); }
  catch (e) { historicoSessoes = []; _erroHist = (e && e.message) ? String(e.message) : 'falha na conexão'; }

  if (_erroHist || !historicoSessoes.length) {
    const miolo = _erroHist
      ? `<div style="font-size:40px;margin-bottom:12px;">⚠️</div>
         <p style="color:var(--text);font-weight:700;">Não consegui carregar o histórico.</p>
         <p style="font-size:12.5px;margin-top:6px;">${esc(_erroHist)}</p>
         <p style="font-size:12.5px;margin-top:6px;">Isto não significa que o aluno não treinou — os dados não chegaram.</p>
         <button class="btn btn-primary btn-sm" style="margin-top:14px;" onclick="renderHistoricoAluno()">Tentar de novo</button>`
      : `<div style="font-size:40px;margin-bottom:12px;">📊</div>
         <p>Nenhuma sessão registrada para este aluno.</p>`;
    main.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:16px;max-width:900px;margin:0 auto;">
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="btn btn-secondary btn-sm" onclick="view='lista';render();">← Voltar</button>
          <h1 style="font-size:20px;font-weight:800;color:var(--text);margin:0;">📊 Histórico — ${esc(nome)}</h1>
        </div>
        <div class="card" style="padding:50px 20px;text-align:center;color:var(--text-muted);">
          ${miolo}
        </div>
      </div>`;
    return;
  }

  const totalTreinos = historicoSessoes.length;
  const totalMin = historicoSessoes.reduce((s, x) => s + Math.floor((x.duracao_seg||0)/60), 0);

  let rows = historicoSessoes.map(s => {
    const data = s.dtsessao ? new Date(s.dtsessao + 'T00:00:00').toLocaleDateString('pt-BR') : '—';
    const durMin = Math.floor((s.duracao_seg||0)/60);
    const nExs = (s.itens||[]).length;
    return `<tr>
      <td class="td-date">${data}</td>
      <td>Divisão ${esc(s.divisao)}</td>
      <td>${durMin} min</td>
      <td>${nExs} exercícios</td>
      <td>${s.nao_contar ? '⏱️ Teste' : s.marcado_como_feito ? '☑️ Marcado' : '✅ Completo'}</td>
      <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-muted);font-size:12px;">${esc(s.comentario||'')}</td>
      <td style="text-align:right;">
        <button class="btn btn-danger btn-sm" onclick="excluirSessao(${s.idsessao})" title="Excluir sessão">✕</button>
      </td>
    </tr>`;
  }).join('');

  main.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px;max-width:900px;margin:0 auto;">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="btn btn-secondary btn-sm" onclick="view='lista';render();">← Voltar</button>
        <h1 style="font-size:20px;font-weight:800;color:var(--text);margin:0;">📊 Histórico — ${esc(nome)}</h1>
      </div>
      <div style="display:flex;gap:12px;">
        <div class="card" style="flex:1;padding:16px;text-align:center;">
          <div style="font-size:24px;font-weight:900;color:var(--brand);">${totalTreinos}</div>
          <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;">Sessões</div>
        </div>
        <div class="card" style="flex:1;padding:16px;text-align:center;">
          <div style="font-size:24px;font-weight:900;color:var(--brand);">${totalMin}</div>
          <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;">Minutos totais</div>
        </div>
      </div>
      ${_blocoEvolucaoProf(historicoSessoes)}
      <div class="card">
        <div class="card-header">
          <span class="card-title">Sessões Registradas</span>
          <button class="btn btn-danger btn-sm" onclick="excluirTodoHistorico()">Excluir tudo</button>
        </div>
        <div style="overflow-x:auto;">
        <table class="data-table">
          <thead><tr>
            <th>Data</th><th>Divisão</th><th>Duração</th><th>Exercícios</th><th>Status</th><th>Comentário</th><th style="width:60px;"></th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
        </div>
      </div>
    </div>`;
  try { IntusEvolucao.ativar(main); } catch (e) {}
}

async function excluirSessao(id) {
  if (!confirm('Excluir esta sessão do histórico?')) return;
  try {
    await API.excluirSessao(id);
    showToast('Sessão excluída.');
    renderHistoricoAluno();
  } catch (e) { showToast(e.message || 'Erro ao excluir.', 'error'); }
}

async function excluirTodoHistorico() {
  if (!confirm('Excluir TODO o histórico deste aluno? Esta ação não pode ser desfeita.')) return;
  try {
    for (const s of historicoSessoes) await API.excluirSessao(s.idsessao);
    showToast('Histórico limpo.');
    renderHistoricoAluno();
  } catch (e) { showToast(e.message || 'Erro ao excluir.', 'error'); }
}
