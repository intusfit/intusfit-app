<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="icon" href="favicon.ico" type="image/x-icon"/>
  <title>Tráfego e Captação — Intus</title>
  <script src="_mock.js?v=20261023a"></script>
  <script src="api.js?v=20261021b"></script>
  <style>
    .tf-topo { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .tf-topo h1 { font-size:20px; margin:0; color:var(--text); }
    .tf-sub { font-size:12.5px; color:var(--text-muted); margin-top:2px; }
    .tf-chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
    .tf-chip { padding:7px 12px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--text-muted); font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; }
    .tf-chip.on { background:var(--green); border-color:var(--green); color:#000; }
    body.theme-light .tf-chip.on { color:#fff; }
    .tf-sel, .tf-in { padding:7px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg2); color:var(--text); font-size:12.5px; font-family:inherit; }
    .tf-vivo { display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text-muted); }
    .tf-vivo i { width:9px; height:9px; border-radius:50%; background:#4ade80; box-shadow:0 0 0 0 rgba(74,222,128,.6); animation:tfPulso 1.8s infinite; }
    @keyframes tfPulso { 70% { box-shadow:0 0 0 9px rgba(74,222,128,0); } 100% { box-shadow:0 0 0 0 rgba(74,222,128,0); } }
    .tf-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
    .tf-kpi { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
    .tf-kpi .r { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--text-muted); }
    .tf-kpi .v { font-size:28px; font-weight:800; margin:4px 0 2px; font-variant-numeric:tabular-nums; color:var(--text); }
    .tf-kpi .d { font-size:11.5px; font-weight:700; }
    .tf-kpi .d.up { color:#4ade80; } .tf-kpi .d.down { color:#f87171; } .tf-kpi .d.eq { color:var(--text-muted); }
    .tf-kpi.dest { border-color:var(--green); }
    a.tf-kpi-link { text-decoration:none; color:inherit; display:block; cursor:pointer; transition:transform .12s, box-shadow .12s; }
    a.tf-kpi-link:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.25); }
    .tf-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:16px; margin-bottom:16px; }
    .tf-card { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:16px 18px; min-width:0; }
    .tf-card.larga { grid-column:1 / -1; }
    .tf-card h2 { font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--text); margin:0 0 3px; }
    .tf-card .nota { font-size:12px; color:var(--text-muted); margin:0 0 12px; line-height:1.5; }
    .tf-tab { width:100%; border-collapse:collapse; font-size:12.5px; }
    .tf-tab th { text-align:right; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; color:var(--text-muted); padding:6px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
    .tf-tab th:first-child, .tf-tab td:first-child { text-align:left; }
    .tf-tab td { padding:8px; border-bottom:1px solid var(--border); text-align:right; font-variant-numeric:tabular-nums; color:var(--text); }
    .tf-tab td:first-child { word-break:break-word; }
    .tf-tab tr:last-child td { border-bottom:none; }
    .tf-tab .sub { display:block; font-size:11px; color:var(--text-muted); font-weight:500; }
    .tf-wrap { overflow-x:auto; }
    .tf-barra { display:grid; grid-template-columns:minmax(90px,150px) 1fr auto; gap:10px; align-items:center; padding:5px 0; font-size:12.5px; }
    .tf-barra .n { color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tf-barra .b { height:10px; background:var(--border); border-radius:6px; overflow:hidden; }
    .tf-barra .b u { display:block; height:100%; background:var(--green); border-radius:6px; }
    .tf-barra .v { font-weight:700; font-variant-numeric:tabular-nums; color:var(--text); text-align:right; white-space:nowrap; }
    .tf-barra .v small { color:var(--text-muted); font-weight:500; margin-left:4px; }
    .tf-funil .tf-barra .b { height:18px; } .tf-funil .tf-barra .b u { background:linear-gradient(90deg,var(--green),#06b6d4); }
    .tf-vazio { padding:18px 6px; font-size:12.5px; color:var(--text-muted); text-align:center; }
    .tf-aviso { padding:14px 16px; border-radius:12px; border:1px solid rgba(251,191,36,.4); background:rgba(251,191,36,.08); color:var(--text); font-size:13px; line-height:1.55; margin-bottom:16px; }
    .tf-form { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-bottom:10px; }
    .tf-form label { display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; color:var(--text-muted); margin-bottom:4px; }
    .tf-form .tf-sel, .tf-form .tf-in { width:100%; box-sizing:border-box; }
    .tf-link { display:flex; gap:8px; align-items:stretch; }
    .tf-link code { flex:1; padding:10px 12px; border-radius:8px; border:1px dashed var(--border); background:var(--bg); font-size:12px; word-break:break-all; color:var(--text); }
    .tf-btn { padding:9px 16px; border-radius:8px; border:none; background:var(--green); color:#000; font-weight:800; font-size:12.5px; cursor:pointer; font-family:inherit; }
    body.theme-light .tf-btn { color:#fff; }
    .tf-btn.sec { background:transparent; border:1px solid var(--border); color:var(--text); }
    .tf-btn.perigo { background:transparent; border:1px solid rgba(248,113,113,.6); color:#f87171; }
    body.theme-light .tf-btn.sec { color:var(--text); }
    body.theme-light .tf-btn.perigo { color:#dc2626; border-color:rgba(220,38,38,.55); }
    .tf-btn.cheio { background:#dc2626; border-color:#dc2626; color:#fff; }
    body.theme-light .tf-btn.cheio { color:#fff; }
    .tf-btn[disabled] { opacity:.4; cursor:not-allowed; }
    .tf-modal { position:fixed; inset:0; z-index:100001; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; padding:16px; }
    .tf-modal > div { background:var(--bg2); color:var(--text); border:1px solid var(--border); border-radius:14px; padding:22px; width:100%; max-width:520px; max-height:92vh; overflow:auto; font-size:13.5px; line-height:1.6; }
    .tf-modal h3 { margin:0 0 10px; font-size:17px; }
    .tf-modal ul { margin:8px 0 12px 18px; padding:0; }
    .tf-modal .alerta { padding:12px 14px; border-radius:10px; border:1px solid rgba(220,38,38,.5); background:rgba(220,38,38,.1); margin:12px 0; }
    .tf-modal label.ck { display:flex; gap:10px; align-items:flex-start; margin:12px 0; cursor:pointer; }
    .tf-modal .acoes { display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; margin-top:16px; }
    .tf-modal .big { font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; }
    .tf-svg { width:100%; height:auto; display:block; }
    .tf-card.fina { padding:12px 16px 10px; }
    .tf-cab { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:4px; }
    .tf-cab h2 { margin:0; }
    .tf-cab .tf-leg { margin:0; }
    .tf-serie { width:100%; height:112px; }
    .tf-serie svg { display:block; overflow:visible; }
    .tf-serie .d rect.b { opacity:.88; transition:opacity .12s, filter .12s; }
    .tf-serie .d:hover rect.b { opacity:1; filter:brightness(1.18); }
    .tf-att { font-size:11.5px; color:var(--text-dim); }
    .tf-avancado { margin:34px 0 8px; font-size:12px; }
    .tf-avancado > summary { cursor:pointer; list-style:none; color:var(--text-dim); opacity:.6; padding:4px 0; width:max-content; }
    .tf-avancado > summary::-webkit-details-marker { display:none; }
    .tf-avancado > summary:hover { opacity:1; }
    .tf-avancado[open] > summary { opacity:1; }
    .tf-leg { display:flex; gap:14px; font-size:11.5px; color:var(--text-muted); margin-bottom:8px; flex-wrap:wrap; }
    .tf-leg i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
    @media (max-width:640px) { .tf-grid { grid-template-columns:1fr; } .tf-kpi .v { font-size:24px; } .tf-barra { grid-template-columns:90px 1fr auto; } }
  </style>
</head>
<body>
<script>
requireLogin();
renderLayout('Tráfego e Captação');
const main = document.getElementById('main-content');

// Números da operação inteira (de onde vem quem se cadastra): só administrador. O servidor confere de novo.
if (!(Sessao.atual() && Sessao.atual().admin)) {
  main.innerHTML = '<div class="card" style="padding:40px;text-align:center;color:var(--text-muted);"><div style="font-size:40px;margin-bottom:8px;">🔒</div><div style="font-weight:700;color:var(--text);margin-bottom:4px;">Acesso restrito</div><div style="font-size:13px;">Esta tela é só do administrador.</div></div>';
  throw new Error('sem permissao');
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const nf = v => Number(v || 0).toLocaleString('pt-BR');
const pc = v => Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
function iso(d) { return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function hojeISO() { return iso(new Date()); }
function somaDias(s, n) { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); }
function fmtDia(s) { return s ? s.slice(8, 10) + '/' + s.slice(5, 7) : ''; }
function fmtDiaCompleto(s) { return s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : ''; }

const NOMES_PAGINA = { '/': 'Site (página inicial)', '/teste-gratis.html': 'Teste grátis', '/app/painel/login.html': 'Login do app', '/cdd/': 'CDD (Código da Definição)', '/app/painel/termos.html': 'Termos de uso', '/app/painel/privacidade.html': 'Privacidade' };
const nomePagina = p => NOMES_PAGINA[p] || p;
const NOMES_CANAL = { direto: 'Direto (digitou ou salvou o link)', indicacao: 'Link de indicação de aluno', instagram: 'Instagram', whatsapp: 'WhatsApp', facebook: 'Facebook', google: 'Google', busca: 'Outras buscas', youtube: 'YouTube', tiktok: 'TikTok', email: 'E-mail', sms: 'SMS', qrcode: 'QR code', twitter: 'X / Twitter', 'outros sites': 'Outros sites' };
const nomeCanal = c => NOMES_CANAL[c] || c;
const NOMES_EVENTO = { whatsapp: 'Clique no WhatsApp', acessar_app: 'Clique para abrir o app / login', cta: 'Clique em "Quero meu acesso"', form_inicio: 'Começou a preencher o formulário', etapa1_ok: 'Passou da 1ª etapa do formulário', conta_criada: 'Criou o acesso grátis', lead_enviado: 'Deixou só o contato (sem conta)', email_ja_cadastrado: 'Tentou criar conta com e-mail já cadastrado' };
const nomeEvento = e => NOMES_EVENTO[e] || e;

let periodo = '30', de = '', ate = '', pagina = '', dados = null, carregando = false;
function limites() {
  const h = hojeISO();
  if (periodo === 'custom') return { de: de || h, ate: ate || h };
  if (periodo === '0') return { de: h, ate: h };
  return { de: somaDias(h, -(Number(periodo) - 1)), ate: h };
}
async function chamar(qs) {
  const tk = (typeof Auth !== 'undefined' && Auth.getToken) ? (Auth.getToken() || '') : (localStorage.getItem('mx-token') || '');
  const r = await fetch(API_BASE + '/trafego.php?' + qs, { headers: { 'Authorization': 'Bearer ' + tk }, cache: 'no-store' });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('erro ' + r.status));
  return j;
}
async function carregar() {
  if (carregando) return; carregando = true;
  const l = limites();
  try {
    dados = await chamar('action=relatorio&de=' + l.de + '&ate=' + l.ate + (pagina ? '&pagina=' + encodeURIComponent(pagina) : ''));
    desenhar();
  } catch (e) {
    main.innerHTML = '<div class="tf-aviso">Não consegui carregar os números agora: ' + esc(e.message) + '. <button class="tf-btn sec" onclick="carregar()">Tentar de novo</button></div>';
  } finally { carregando = false; }
}
function setPeriodo(p) { periodo = p; carregar(); }
function setCustom() { de = document.getElementById('tf-de').value; ate = document.getElementById('tf-ate').value; if (de && ate) { periodo = 'custom'; carregar(); } }
function setPagina(v) { pagina = v; carregar(); }

function delta(atual, antes, sufixo) {
  if (!antes && !atual) return '<span class="d eq">sem dados antes</span>';
  if (!antes) return '<span class="d up">novo</span>';
  const p = Math.round((atual - antes) * 100 / antes);
  if (p === 0) return '<span class="d eq">igual ao período anterior</span>';
  return '<span class="d ' + (p > 0 ? 'up' : 'down') + '">' + (p > 0 ? '▲ +' : '▼ ') + p + '% vs período anterior</span>';
}
function kpi(rot, v, d, dest, href) { return (href ? '<a class="tf-kpi tf-kpi-link' + (dest ? ' dest' : '') + '" href="' + href + '" title="Ver quem são">' : '<div class="tf-kpi' + (dest ? ' dest' : '') + '">') + '<div class="r">' + rot + '</div><div class="v">' + v + '</div>' + d + (href ? '<div class="d" style="color:var(--green);margin-top:3px">ver quem são →</div></a>' : '</div>'); }
function barras(lista, nomeFn, campo, extra) {
  if (!lista || !lista.length) return '<div class="tf-vazio">Sem dados neste período.</div>';
  const max = Math.max(1, ...lista.map(x => x[campo] || 0));
  return lista.map(x => '<div class="tf-barra"><div class="n" title="' + esc(nomeFn(x)) + '">' + esc(nomeFn(x)) + '</div><div class="b"><u style="width:' + Math.max(2, Math.round((x[campo] || 0) * 100 / max)) + '%"></u></div><div class="v">' + nf(x[campo]) + (extra ? '<small>' + extra(x) + '</small>' : '') + '</div></div>').join('');
}

function graficoSerie() { return '<div id="tf-serie" class="tf-serie"></div>'; }
// Desenha com a largura REAL da caixa (sem esticar o SVG), então o texto e os círculos ficam nítidos em qualquer tela.
function pintarSerie() {
  const box = document.getElementById('tf-serie');
  if (!box || !dados) return;
  const serie = dados.serie, n = serie.length;
  const temConv = serie.some(s => s.conversoes > 0);
  const W = Math.max(260, box.clientWidth), H = 112, pe = 26, pd = temConv ? 26 : 6, pt = 8, pb = 17, w = W - pe - pd, h = H - pt - pb;
  const maxV = Math.max(1, ...serie.map(s => s.visitantes)), maxC = Math.max(1, ...serie.map(s => s.conversoes));
  const passo = w / n, bw = Math.max(2, Math.min(16, passo * 0.6)), rx = Math.min(4, bw / 2);
  const X = i => pe + passo * (i + .5), YV = v => pt + h - h * v / maxV, YC = v => pt + h - h * v / maxC;
  let g = '<defs><linearGradient id="tfg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FFF00" stop-opacity=".95"/><stop offset="1" stop-color="#3a9900" stop-opacity=".35"/></linearGradient></defs>';
  [0, .5, 1].forEach(f => { const y = pt + h - h * f; g += '<line x1="' + pe + '" x2="' + (W - pd) + '" y1="' + y + '" y2="' + y + '" stroke="var(--border)" stroke-width="1"' + (f ? ' stroke-dasharray="3 4"' : '') + '/>'; });
  g += '<text x="' + (pe - 6) + '" y="' + (pt + 3) + '" text-anchor="end" font-size="9" fill="var(--text-muted)">' + nf(maxV) + '</text><text x="' + (pe - 6) + '" y="' + (pt + h + 3) + '" text-anchor="end" font-size="9" fill="var(--text-muted)">0</text>';
  if (temConv) g += '<text x="' + (W - pd + 6) + '" y="' + (pt + 3) + '" font-size="9" fill="#06b6d4">' + nf(maxC) + '</text>';
  let barras = '', hits = '';
  serie.forEach((sv, i) => {
    const bh = sv.visitantes ? Math.max(3, h * sv.visitantes / maxV) : 0;
    const tip = '<div class="tip-t">' + esc(fmtDiaCompleto(sv.dia)) + '</div><div class="tip-v">' + nf(sv.visitantes) + '<small>visitantes</small></div><div class="tip-n">' + nf(sv.visitas) + ' visitas · ' + nf(sv.conversoes) + ' captadas</div>';
    barras += '<g class="d">' + (bh ? '<rect class="b" x="' + (X(i) - bw / 2) + '" y="' + (pt + h - bh) + '" width="' + bw + '" height="' + bh + '" rx="' + rx + '" fill="url(#tfg)"/>' : '') + '<rect x="' + (X(i) - passo / 2) + '" y="' + pt + '" width="' + passo + '" height="' + h + '" fill="transparent"' + Tip.attr(tip) + '/></g>';
  });
  // linha suave (curva de Catmull-Rom) das pessoas captadas
  let linha = '';
  if (temConv) {
    const P = serie.map((sv, i) => [X(i), YC(sv.conversoes)]);
    let d = 'M' + P[0][0].toFixed(1) + ',' + P[0][1].toFixed(1);
    for (let i = 0; i < P.length - 1; i++) {
      const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2, t = 0.18;
      const y1 = Math.min(pt + h, Math.max(pt, p1[1] + (p2[1] - p0[1]) * t)), y2 = Math.min(pt + h, Math.max(pt, p2[1] - (p3[1] - p1[1]) * t));
      d += 'C' + (p1[0] + (p2[0] - p0[0]) * t).toFixed(1) + ',' + y1.toFixed(1) + ' ' + (p2[0] - (p3[0] - p1[0]) * t).toFixed(1) + ',' + y2.toFixed(1) + ' ' + p2[0].toFixed(1) + ',' + p2[1].toFixed(1);
    }
    linha = '<path d="' + d + '" fill="none" stroke="#06b6d4" stroke-width="1.8" stroke-linecap="round" pointer-events="none"/>' +
      P.map((q, i) => serie[i].conversoes > 0 ? '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="3" fill="#06b6d4" stroke="var(--bg2)" stroke-width="1.5" pointer-events="none"/>' : '').join('');
  }
  const ticks = n <= 8 ? serie.map((_, i) => i) : [0, 1, 2, 3, 4, 5].map(k => Math.round(k * (n - 1) / 5));
  const eixo = [...new Set(ticks)].map(i => '<text x="' + X(i) + '" y="' + (H - 3) + '" text-anchor="' + (i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle') + '" font-size="9" fill="var(--text-muted)">' + fmtDia(serie[i].dia) + '</text>').join('');
  box.innerHTML = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' + g + barras + linha + eixo + '</svg>';
}
let _rzT = null;
window.addEventListener('resize', () => { clearTimeout(_rzT); _rzT = setTimeout(pintarSerie, 150); });

function graficoHoras(horas) {
  const max = Math.max(1, ...horas), W = 760, H = 110, bw = W / 24;
  return '<svg class="tf-svg" viewBox="0 0 ' + W + ' ' + (H + 18) + '">' + horas.map((v, i) => {
    const bh = Math.max(v ? 2 : 0, (H - 6) * v / max);
    return '<rect x="' + (i * bw + 3) + '" y="' + (H - bh) + '" width="' + (bw - 6) + '" height="' + bh + '" rx="2" fill="var(--green)" opacity=".8"' + Tip.attr('<div class="tip-t">' + i + 'h (Brasília)</div><div class="tip-v">' + nf(v) + '<small>visitas</small></div>') + '/><text x="' + (i * bw + bw / 2) + '" y="' + (H + 13) + '" text-anchor="middle" font-size="9" fill="var(--text-muted)">' + (i % 3 === 0 ? i + 'h' : '') + '</text>';
  }).join('') + '</svg>';
}

function desenhar() {
  const d = dados, k = d.kpis, a = d.kpis_anterior, p = d.periodo;
  const semDados = !k.visitas && !a.visitas;
  const optsPag = ['<option value="">Todas as páginas</option>'].concat((d.paginas || []).map(x => '<option value="' + esc(x.pagina) + '"' + (pagina === x.pagina ? ' selected' : '') + '>' + esc(nomePagina(x.pagina)) + '</option>')).join('');
  const chips = [['0', 'Hoje'], ['7', '7 dias'], ['30', '30 dias'], ['90', '90 dias'], ['365', '12 meses']].map(([v, t]) => '<button class="tf-chip' + (periodo === v ? ' on' : '') + '" onclick="setPeriodo(\'' + v + '\')">' + t + '</button>').join('');
  let h = '<div class="tf-topo"><div><h1>Tráfego e Captação</h1><div class="tf-sub">De onde vêm as visitas das páginas públicas e quantas viram cadastro · ' + fmtDiaCompleto(p.de) + ' a ' + fmtDiaCompleto(p.ate) + (p.pagina ? ' · só ' + esc(nomePagina(p.pagina)) : '') + '</div></div>' +
    '<div class="tf-chips">' + chips + '<input type="date" class="tf-in" id="tf-de" value="' + p.de + '" onchange="setCustom()"><span style="color:var(--text-muted)">a</span><input type="date" class="tf-in" id="tf-ate" value="' + p.ate + '" onchange="setCustom()">' +

function conferenciaHtml(d) {
  const k = d.kpis, b = d.banco || {};
  const linha = (rot, v, nota) => '<div style="display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)"><div>' + rot + (nota ? '<div style="font-size:11.5px;color:var(--text-muted);margin-top:2px;line-height:1.45">' + nota + '</div>' : '') + '</div><div style="font-weight:800;font-size:18px;font-variant-numeric:tabular-nums">' + v + '</div></div>';
  let h = '<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);margin:2px 0 2px">O que as páginas avisaram</div>' +
    linha('Contas de teste grátis criadas', nf(k.contas_criadas), 'Aparecem em <b>Clientes</b>, não na tabela de leads.') +
    linha('Contatos deixados sem conta', nf(k.contatos_sem_conta), 'Quando o cadastro completo falha, a página guarda só o contato.');
  h += '<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);margin:14px 0 2px">O que existe no banco</div>';
  if (b.leads == null) return h + '<div class="tf-vazio">Não consegui ler a tabela de leads.</div>';
  const landing = (b.leads_por_origem || []).filter(o => /landing/i.test(o.origem)).reduce((s, o) => s + o.n, 0);
  h += linha('Contatos na tabela de leads (todas as origens)', nf(b.leads)) + linha('Destes, vindos da página de teste grátis', nf(landing), 'Esta é a parte que deve bater com "contatos deixados sem conta" acima.');
  const dif = landing - (k.contatos_sem_conta || 0);
  const veredito = dif === 0 ? ['#4ade80', 'Batem. A medição está vendo todos os contatos deste período.']
    : dif > 0 ? ['#fbbf24', 'O banco tem ' + nf(dif) + ' contato(s) a mais do que a medição viu. Pode ser de antes de 19/10/2026 (quando a medição começou), de gente com o navegador bloqueando a medição, ou de um cadastro feito fora da página.']
    : ['#fbbf24', 'A medição viu ' + nf(-dif) + ' contato(s) a mais do que o banco guardou. Se isso se repetir, avise: pode ser um cadastro que não chegou a gravar.'];
  return h + '<div style="margin-top:12px;padding:10px 12px;border-radius:10px;border:1px solid ' + veredito[0] + ';font-size:12.5px;line-height:1.5">' + veredito[1] + '</div>';

function armazenadoHtml(a) {

    '<p class="nota">Só vale a pena apagar quando o volume ficar grande demais para a tela abrir rápido, o que deve levar anos. Apagar tira <b>somente</b> estas medições. Clientes, leads, matrículas, treinos e tudo o mais ficam intactos. O sistema <b>nunca</b> apaga nada com menos de 12 meses, e exige várias confirmações.</p>' +
    '<button class="tf-btn perigo" onclick="abrirLimpeza()">Apagar medições antigas...</button>';

let _lp = { meses: 12, previa: null };

async function limpezaPasso2() {

function limpezaPasso3() {
  const p = _lp.previa;
  document.getElementById('tf-modal-c').innerHTML = '<h3>Passo 3 de 4: confirme que entendeu</h3>' +
    '<label class="ck"><input type="checkbox" id="lp-c1" onchange="limpezaChecar()"><span>Entendo que vou apagar <b>' + nf(p.total) + '</b> registro(s) de medição e que <b>não dá para desfazer</b>.</span></label>' +
    '<label class="ck"><input type="checkbox" id="lp-c2" onchange="limpezaChecar()"><span>Entendo que isso só afeta as medições de visitas e cliques, e que os gráficos e comparações destes períodos antigos vão ficar vazios.</span></label>' +

    '<div class="acoes"><button class="tf-btn sec" onclick="fecharLimpeza()">Cancelar</button><button class="tf-btn perigo" id="lp-prox" disabled onclick="limpezaPasso4()">Continuar</button></div>';
}
function limpezaChecar() {
  const ok = document.getElementById('lp-c1').checked && document.getElementById('lp-c2').checked && document.getElementById('lp-txt').value.trim() === 'APAGAR';
  document.getElementById('lp-prox').disabled = !ok;

function limpezaPasso4() {
  const p = _lp.previa; let seg = 8;
  document.getElementById('tf-modal-c').innerHTML = '<h3>Passo 4 de 4: última chance</h3>' +
    '<div class="alerta">Você vai apagar <b>' + nf(p.visitas) + ' visita(s)</b> e <b>' + nf(p.eventos) + ' clique(s)</b> anteriores a <b>' + fmtDiaCompleto(p.corte) + '</b>. Isto não pode ser desfeito.</div>' +

  _lp.timer = setInterval(() => {

async function limpezaExecutar() {
  const p = _lp.previa, c = document.getElementById('tf-modal-c');
  c.innerHTML = '<div class="tf-vazio">Apagando...</div>';
  try {
    const tk = (Auth.getToken() || '');
    const r = await fetch(API_BASE + '/trafego.php?action=limpar&dias=' + p.dias + '&confirmo=APAGAR&esperadas=' + p.total, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + tk } });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('erro ' + r.status));
    c.innerHTML = '<h3>Pronto</h3><p>' + nf(j.apagadas) + ' registro(s) apagado(s).</p><div class="acoes"><button class="tf-btn" onclick="fecharLimpeza();carregar()">Fechar</button></div>';
  } catch (e) { c.innerHTML = '<h3>Nada foi apagado</h3><p>' + esc(e.message) + '</p><div class="acoes"><button class="tf-btn" onclick="fecharLimpeza()">Fechar</button></div>'; }
}
function ultimasHtml(l) {

    return '<tr><td>' + esc(quando) + (Number(v.novo) ? '<span class="sub">novo visitante</span>' : '') + '</td><td>' + esc(nomePagina(v.pagina)) + '</td><td>' + esc(nomeCanal(v.canal)) + (v.utm_campaign ? '<span class="sub">' + esc(v.utm_campaign) + '</span>' : '') + '</td><td>' + esc([v.cidade, v.aparelho].filter(Boolean).join(' · ')) + '</td></tr>';
  }).join('') + '</table></div>';
}

  const op = (l, sel) => l.map(([v, t]) => '<option value="' + esc(v) + '">' + esc(t) + '</option>').join('');
  return '<div class="tf-form"><div><label>Página de destino</label><select class="tf-sel" id="g-base" onchange="gerarLink()">' + op(BASES) + '</select></div>' +
    '<div><label>Onde vai divulgar</label><select class="tf-sel" id="g-src" onchange="gerarLink()">' + op([['instagram', 'Instagram'], ['whatsapp', 'WhatsApp'], ['facebook', 'Facebook'], ['youtube', 'YouTube'], ['tiktok', 'TikTok'], ['google', 'Google'], ['email', 'E-mail'], ['qrcode', 'QR code'], ['outro', 'Outro']]) + '</select></div>' +
    '<div><label>Formato</label><select class="tf-sel" id="g-med" onchange="gerarLink()">' + op([['stories', 'Stories'], ['bio', 'Link da bio'], ['post', 'Post'], ['reels', 'Reels'], ['mensagem', 'Mensagem direta'], ['anuncio', 'Anúncio pago'], ['impresso', 'Impresso / QR'], ['outro', 'Outro']]) + '</select></div>' +
    '<div><label>Nome da campanha</label><input class="tf-in" id="g-camp" placeholder="ex.: teste-gratis-outubro" oninput="gerarLink()"></div>' +
    '<div><label>Qual arte ou versão (opcional)</label><input class="tf-in" id="g-cont" placeholder="ex.: story-a5 ou foto-troféus" oninput="gerarLink()"></div></div>' +
    '<div class="tf-link"><code id="g-url"></code><button class="tf-btn" onclick="copiarLink()">Copiar</button></div>';
}
function slug(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60); }
function gerarLink() {
  const g = id => (document.getElementById(id) || {}).value || '';
  if (!document.getElementById('g-url')) return;
  const p = new URLSearchParams();
  p.set('utm_source', g('g-src')); p.set('utm_medium', g('g-med'));
  if (slug(g('g-camp'))) p.set('utm_campaign', slug(g('g-camp')));
  if (slug(g('g-cont'))) p.set('utm_content', slug(g('g-cont')));
  document.getElementById('g-url').textContent = g('g-base') + '?' + p.toString();
}
function copiarLink() {
  const t = document.getElementById('g-url').textContent;
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Link copiado'), () => { const r = document.createRange(); r.selectNode(document.getElementById('g-url')); getSelection().removeAllRanges(); getSelection().addRange(r); toast('Selecionei o link: copie com Ctrl+C'); });
}
function toast(m) { const el = document.createElement('div'); el.textContent = m; el.style.cssText = 'position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--bg2);color:var(--text);border:1px solid var(--border);padding:10px 16px;border-radius:10px;z-index:99999;font-size:13px;'; document.body.appendChild(el); setTimeout(() => el.remove(), 2200); }

// ── ATUALIZAÇÃO AUTOMÁTICA: a tela inteira (números, gráfico, funil, últimas visitas) se renova a cada minuto, sozinha ──
const INTERVALO_ATUALIZACAO_MS = 60000;
let _ultimaAtualizacao = 0;
function marcarAtualizacao() {
  _ultimaAtualizacao = Date.now();
  const el = document.getElementById('tf-att');
  if (el) el.textContent = 'atualiza sozinho a cada minuto · última às ' + new Date().toLocaleTimeString('pt-BR');
}
const CAMPOS_GERADOR = ['g-base', 'g-src', 'g-med', 'g-camp', 'g-cont'];
function guardarEstado() {
  const campos = {}; CAMPOS_GERADOR.forEach(id => { const e = document.getElementById(id); if (e) campos[id] = e.value; });
  const av = document.getElementById('tf-avancado');
  return { y: window.scrollY, campos, avancado: !!(av && av.open), foco: document.activeElement && document.activeElement.id || '' };
}
function restaurarEstado(e) {
  CAMPOS_GERADOR.forEach(id => { const el = document.getElementById(id); if (el && e.campos[id] != null) el.value = e.campos[id]; });
  gerarLink();
  const av = document.getElementById('tf-avancado'); if (av && e.avancado) av.open = true;
  if (e.foco && CAMPOS_GERADOR.includes(e.foco)) { const f = document.getElementById(e.foco); if (f) { f.focus(); try { f.setSelectionRange(f.value.length, f.value.length); } catch (x) {} } }
  window.scrollTo(0, e.y);
}
// Não atrapalha quem está usando a tela: pula a rodada se a aba está escondida, se o passo a passo de apagar está aberto ou se a pessoa está digitando no gerador de link.
async function atualizarSilencioso(forcar) {
  if (carregando || !dados) return;
  if (!forcar && document.hidden) return;
  if (document.getElementById('tf-modal')) return;
  const ae = document.activeElement;
  if (!forcar && ae && (ae.id === 'g-camp' || ae.id === 'g-cont')) return;
  const l = limites();
  let novo;
  try { novo = await chamar('action=relatorio&de=' + l.de + '&ate=' + l.ate + (pagina ? '&pagina=' + encodeURIComponent(pagina) : '')); } catch (e) { return; }
  if (carregando || document.getElementById('tf-modal')) return;
  const estado = guardarEstado();
  dados = novo; desenhar(); restaurarEstado(estado);
}
setInterval(() => atualizarSilencioso(false), INTERVALO_ATUALIZACAO_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - _ultimaAtualizacao >= INTERVALO_ATUALIZACAO_MS) atualizarSilencioso(false); });
main.innerHTML = '<div class="tf-vazio" style="padding:60px">Carregando os números...</div>';
carregar();
</script>
