<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="icon" href="favicon.ico" type="image/x-icon"/>
  <title>Nutrição — Intus</title>
  <script src="_mock.js?v=20261008c"></script>
  <script src="api.js?v=20261008d"></script>
  <script src="alimentos-db.js?v=20261008a"></script>
  <style>
    .modal-box.wide { max-width: 820px; }
    .modal-box.full { max-width: 95vw; width: 1100px; }
    .form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-3col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .form-4col { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .form-5col { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .modal-section-title {
      font-size: 12px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.8px;
      padding: 4px 0; border-bottom: 1px solid var(--border); margin: 14px 0 8px;
    }
    .filtros-bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--bg3);
    }
    .filtros-bar select.input { width: auto; min-width: 160px; font-size: 14px; }
    .empty-state { text-align: center; padding: 48px 20px; color: var(--text-dim); font-size: 15px; }
    .nt-tabs { display: flex; gap: 8px; padding: 12px 20px 0; border-bottom: 1px solid var(--border); }
    .nt-tab { padding: 9px 18px; border: none; background: none; color: var(--text-muted); font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .nt-tab.on { color: var(--green); border-bottom-color: var(--green); }
    .nt-wrap { padding: 20px; max-width: 1100px; margin: 0 auto; }
    .nt-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
    @media (max-width: 760px) { .nt-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .nt-kpi { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
    .nt-kpi b { display: block; font-size: 26px; font-weight: 800; color: var(--text); line-height: 1.1; }
    .nt-kpi span { font-size: 12px; color: var(--text-muted); }
    .nt-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .nt-tools input[type=text] { flex: 1; min-width: 180px; padding: 8px 14px; border-radius: 99px; border: 1px solid var(--border); background: var(--bg2); color: var(--text); font-size: 13px; font-family: inherit; }
    .nt-chip { padding: 7px 14px; border-radius: 99px; border: 1px solid var(--border); background: var(--bg2); color: var(--text-muted); font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .nt-chip.on { border-color: var(--green); color: var(--green); }
    .nt-tab-wrap { overflow-x: auto; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; }
    .nt-tb { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
    .nt-tb th { text-align: left; font-weight: 700; font-size: 11.5px; color: var(--text-muted); padding: 10px 12px; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: .4px; }
    .nt-tb td { padding: 10px 12px; border-top: 1px solid var(--border); vertical-align: middle; color: var(--text); }
    .nt-tb tr.lin { cursor: pointer; }
    .nt-tb tr.lin:hover td { background: var(--bg3); }
    .nt-barra { width: 90px; height: 7px; border-radius: 4px; background: var(--bg3); overflow: hidden; display: inline-block; vertical-align: middle; }
    .nt-barra i { display: block; height: 100%; }
    .nt-pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 99px; margin: 2px 4px 2px 0; white-space: nowrap; }
    .nt-pill.alto { background: rgba(239,68,68,.14); color: #ef4444; }
    .nt-pill.medio { background: rgba(245,158,11,.14); color: #f59e0b; }
    .nt-pill.info { background: rgba(96,165,250,.14); color: #60a5fa; }
    .nt-grid14 { border-collapse: separate; border-spacing: 3px; font-size: 10.5px; color: var(--text-muted); }
    .nt-grid14 td { width: 22px; height: 20px; border-radius: 4px; text-align: center; padding: 0; }
    .nt-reg { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); align-items: flex-start; }
    .nt-reg img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; cursor: pointer; flex-shrink: 0; }
    .nt-reg input { flex: 1; min-width: 0; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg3); color: var(--text); font-size: 12px; font-family: inherit; }
    .plano-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
      padding: 18px 20px; margin-bottom: 14px; transition: border-color .15s; cursor: pointer;
    }
    .plano-card:hover { border-color: var(--green); }
    .plano-card.inativo { opacity: .55; }
    .plano-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .plano-title { font-size: 17px; font-weight: 700; color: var(--text); }
    .plano-subtitle { font-size: 14px; color: var(--text-muted); margin-top: 2px; }
    .plano-status { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
    .plano-status.ativo { background: rgba(127,255,0,.12); color: #7FFF00; }
    .plano-status.inativo { background: rgba(248,113,113,.12); color: #f87171; }
    .macros-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
    .macro-chip {
      display: flex; align-items: center; gap: 6px;
      background: var(--bg3); border-radius: 8px; padding: 6px 12px;
    }
    .macro-chip-value { font-size: 16px; font-weight: 700; color: var(--text); }
    .macro-chip-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
    .macro-chip.cal .macro-chip-value { color: #facc15; }
    .macro-chip.prot .macro-chip-value { color: #60a5fa; }
    .macro-chip.carb .macro-chip-value { color: #7FFF00; }
    .macro-chip.gord .macro-chip-value { color: #f87171; }
    .refeicao-block { background: var(--bg3); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
    .refeicao-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .refeicao-nome { font-size: 15px; font-weight: 700; color: var(--text); }
    .refeicao-horario { font-size: 13px; color: var(--text-muted); }
    .refeicao-itens { font-size: 14px; color: var(--text); line-height: 1.8; }
    .ref-editor {
      margin-bottom: 14px; padding: 14px; background: var(--bg3); border-radius: 10px;
      border: 1px solid var(--border); transition: border-color .2s, opacity .2s;
    }
    .ref-editor.drag-over { border-color: #7FFF00 !important; }
    .ref-editor.dragging { opacity: 0.5; }
    .ref-editor-header { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .ref-editor-header input { flex: 1; }
    .ref-remove { background: none; border: none; color: #f87171; font-size: 16px; cursor: pointer; padding: 4px; }

    /* Drag handle */
    .drag-handle {
      cursor: grab; user-select: none; font-size: 14px; color: var(--text-muted);
      padding: 4px 6px; line-height: 1; letter-spacing: -1px;
    }
    .drag-handle:active { cursor: grabbing; }

    /* Collapse/expand */
    .ref-collapse-toggle { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px; flex: 1; }
    .ref-collapse-arrow { transition: transform .2s; font-size: 12px; color: var(--text-muted); }
    .ref-collapse-arrow.collapsed { transform: rotate(-90deg); }
    .ref-body { overflow: visible; transition: max-height .3s ease; }
    .ref-body.collapsed { max-height: 0 !important; padding: 0; overflow: hidden; }
    .ref-header-macros { font-size: 12px; color: var(--text-muted); margin-left: 10px; }
    .ref-header-macros span { margin-right: 8px; }
    .ref-header-macros .kcal { color: #facc15; }
    .ref-header-macros .prot { color: #60a5fa; }
    .ref-header-macros .carb { color: #7FFF00; }
    .ref-header-macros .gord { color: #f87171; }

    /* Move arrows */
    .ref-move-btn {
      background: none; border: none; color: var(--text-muted); cursor: pointer;
      font-size: 14px; padding: 2px 4px; transition: color .15s;
    }
    .ref-move-btn:hover { color: var(--text); }
    .ref-move-btn:disabled { opacity: .3; cursor: not-allowed; }

    /* Food search */
    .food-search-wrap { position: relative; margin-bottom: 8px; }
    .food-search-input { width: 100%; padding: 8px 12px; font-size: 14px; }
    .food-results {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 9999;
      background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
      max-height: 260px; overflow-y: auto; display: none; box-shadow: 0 12px 32px rgba(0,0,0,.5);
    }
    .food-results.show { display: block; }
    .food-result-item {
      padding: 8px 12px; cursor: pointer; font-size: 14px; color: var(--text);
      border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
    }
    .food-result-item:last-child { border-bottom: none; }
    .food-result-item:hover { background: var(--bg3); }
    .food-result-item .food-cat { font-size: 11px; color: var(--text-muted); }
    .food-result-item .food-kcal { font-size: 11px; color: #facc15; font-weight: 600; }

    /* Meal item row */
    .meal-item-row {
      display: grid; grid-template-columns: 24px 1fr 70px 130px 50px 50px 50px 50px 78px;
      gap: 4px; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.05);
      font-size: 14px; transition: opacity .2s, background .15s;
    }
    .meal-item-row.dragging { opacity: 0.4; }
    .meal-item-row.drag-over-item { background: rgba(127,255,0,.08); border-bottom: 2px solid #7FFF00; }
    .meal-item-row.header {
      font-weight: 700; color: var(--text-muted); font-size: 11px; text-transform: uppercase;
      border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 4px;
    }
    .meal-item-name { color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meal-item-val { text-align: center; color: var(--text-muted); }
    .meal-item-val.kcal { color: #facc15; }
    .meal-item-val.prot { color: #60a5fa; }
    .meal-item-val.carb { color: #7FFF00; }
    .meal-item-val.gord { color: #f87171; }
    .meal-item-remove { background: none; border: none; color: #f87171; cursor: pointer; font-size: 14px; padding: 2px; }
    .meal-item-qty { width: 100%; text-align: center; padding: 4px; font-size: 14px; }
    .meal-item-measure { width: 100%; font-size: 13px; padding: 4px; }
    .meal-item-actions { display: flex; gap: 2px; align-items: center; }

    /* Substitutos button */
    .btn-subst {
      background: none; border: none; color: var(--text-muted); cursor: pointer;
      font-size: 13px; padding: 2px 4px; transition: color .15s;
    }
    .btn-subst:hover { color: #60a5fa; }

    /* Substitutos panel */
    .subst-panel {
      grid-column: 1 / -1; background: var(--bg2); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px; margin: 4px 0 8px;
    }
    .subst-panel h5 { font-size: 13px; font-weight: 700; color: var(--text-muted); margin: 0 0 8px; text-transform: uppercase; }
    .subst-list { margin-bottom: 8px; }
    .subst-item {
      display: flex; align-items: center; gap: 8px; padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,.04); font-size: 14px; color: var(--text);
    }
    .subst-item:last-child { border: none; }
    .subst-item .subst-remove { background: none; border: none; color: #f87171; cursor: pointer; font-size: 12px; padding: 2px; }
    .subst-add-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .subst-add-row input { flex: 1; min-width: 120px; }
    .subst-suggestion { font-size: 13px; color: var(--text-muted); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }
    .subst-suggestion span { cursor: pointer; margin-right: 10px; padding: 2px 6px; border-radius: 4px; background: var(--bg3); }
    .subst-suggestion span:hover { background: var(--border); color: var(--text); }

    /* Portion equivalence */
    .portion-equiv { font-size: 12px; color: var(--text-muted); grid-column: 4; }

    /* Meus Alimentos */
    .custom-food-list { max-height: 50vh; overflow-y: auto; }
    .custom-food-card {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 8px; margin-bottom: 8px; transition: border-color .15s;
    }
    .custom-food-card:hover { border-color: var(--green); }
    .custom-food-info { flex: 1; min-width: 0; }
    .custom-food-name { font-size: 15px; font-weight: 600; color: var(--text); }
    .custom-food-macros { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
    .custom-food-macros span { margin-right: 10px; }
    .custom-food-macros .kcal { color: #facc15; }
    .custom-food-macros .prot { color: #60a5fa; }
    .custom-food-macros .carb { color: #7FFF00; }
    .custom-food-macros .gord { color: #f87171; }
    .custom-food-actions { display: flex; gap: 6px; margin-left: 12px; }
    .custom-food-badge { font-size: 10px; font-weight: 700; background: rgba(127,255,0,.12); color: #7FFF00; padding: 2px 6px; border-radius: 4px; margin-left: 8px; }

    .meal-totals {
      display: grid; grid-template-columns: 24px 1fr 70px 130px 50px 50px 50px 50px 78px;
      gap: 4px; padding: 8px 0 4px; border-top: 1px solid var(--border); margin-top: 6px;
      font-size: 14px; font-weight: 700;
    }
    .meal-totals .lbl { color: var(--text-muted); }

    /* GEB/GET calculator */
    .calc-card {
      background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
      padding: 16px; margin-bottom: 14px;
    }
    .calc-card h4 { font-size: 15px; font-weight: 700; color: var(--text); margin: 0 0 12px; }
    .calc-result { font-size: 24px; font-weight: 700; color: #7FFF00; margin-top: 8px; }
    .calc-result small { font-size: 14px; color: var(--text-muted); font-weight: 400; }
    .calc-result-secondary { font-size: 15px; font-weight: 600; color: var(--text); margin-top: 6px; }
    .calc-info-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px;
      background: var(--bg2); border-radius: 8px; padding: 12px;
    }
    .calc-info-item { font-size: 14px; }
    .calc-info-item .label { color: var(--text-muted); font-size: 11px; text-transform: uppercase; }
    .calc-info-item .value { color: var(--text); font-weight: 600; margin-top: 2px; }

    /* Tabs inside plan editor */
    .plan-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
    .plan-tab {
      padding: 8px 16px; font-size: 14px; font-weight: 600; color: var(--text-muted);
      border-bottom: 2px solid transparent; cursor: pointer; transition: all .15s;
    }
    .plan-tab.active { color: #7FFF00; border-bottom-color: #7FFF00; }
    .plan-tab:hover { color: var(--text); }
    .plan-tab-content { display: none; }
    .plan-tab-content.active { display: block; }

    /* Macro dist bar */
    .macro-dist-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 8px; }
    .macro-dist-bar .seg-prot { background: #60a5fa; }
    .macro-dist-bar .seg-carb { background: #7FFF00; }
    .macro-dist-bar .seg-gord { background: #f87171; }
    .macro-dist-legend { display: flex; gap: 14px; margin-top: 6px; font-size: 12px; color: var(--text-muted); }
    .macro-dist-legend span { display: flex; align-items: center; gap: 4px; }
    .macro-dist-legend .dot { width: 8px; height: 8px; border-radius: 50%; }

    /* Equivalence panel */
    .equiv-panel { background: var(--bg3); border-radius: 8px; padding: 10px 12px; margin-top: 8px; font-size: 14px; }
    .equiv-panel h5 { font-size: 12px; font-weight: 700; color: var(--text-muted); margin: 0 0 6px; text-transform: uppercase; }

    /* Micronutrient panel */
    .micro-panel {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 16px; margin-top: 12px;
    }
    .micro-panel h5 {
      font-size: 13px; font-weight: 700; color: var(--text-muted); margin: 0 0 10px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .micro-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px;
    }
    .micro-item {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 4px 8px; border-radius: 6px; background: var(--bg3);
    }
    .micro-item .micro-label { font-size: 12px; color: var(--text-muted); }
    .micro-item .micro-value { font-size: 13px; font-weight: 600; color: var(--text); }
    .equiv-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,.04); }
    .equiv-item:last-child { border: none; }

    .toolbar-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    .toolbar-row .btn-sm { font-size: 11px; padding: 4px 10px; }

    /* View substitutes */
    .view-substitutos { font-size: 13px; color: var(--text-muted); padding: 2px 0 2px 28px; line-height: 1.5; }
    .view-substitutos::before { content: '↔ '; color: #60a5fa; }

    /* Responsive */
    @media (max-width: 768px) {
      .form-2col, .form-3col, .form-4col, .form-5col { grid-template-columns: 1fr; }
      .meal-item-row {
        grid-template-columns: 20px 1fr 50px 90px 40px 40px 40px 40px 66px;
        font-size: 12px; gap: 2px;
      }
      .meal-item-row.header { font-size: 10px; }
      .meal-totals {
        grid-template-columns: 20px 1fr 50px 90px 40px 40px 40px 40px 66px;
        font-size: 12px; gap: 2px;
      }
      .calc-info-grid { grid-template-columns: 1fr; }
      .micro-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
      .filtros-bar { padding: 10px 12px; }
      .ref-editor { padding: 10px; }
    }
  </style>
</head>
<body>
<script>
requireLogin();
renderLayout('Nutrição');

const main = document.getElementById('main-content');

let planos = [];
let atletas = [];
let filtroAtleta = 0;
let filtroPlanoAtivo = true;   // lista de Planos: Ativos (padrão) ou Inativos, como em Treinos
function planoAtivo(pl) { return Number(pl && pl.ativo) === 1; }
let loading = true;
let dbReady = false;
let aba = 'dashboard';     // 'dashboard' | 'planos'
let painel = null;         // resposta de nutri_painel (planos ativos, registros, água, pesos da carteira)
let painelCarregando = false, painelErro = false;
let buscaPainel = '', soAlerta = false;

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d) { return d ? new Date(d+'T00:00:00').toLocaleDateString('pt-BR') : '—'; }

AlimentosDB.load().then(() => { dbReady = true; });

async function carregar() {
  loading = true;
  render();
  try {
    const [listaP, listaA] = await Promise.all([
      API.listarPlanosNutricionais(),
      API.listarAtletas('')
    ]);
    planos = Array.isArray(listaP) ? listaP : [];
    const todosAtletas = Array.isArray(listaA) ? listaA : [];
    const usr = Sessao.atual();
    if (usr?.admin || hasPerm('nt_incluir') || hasPerm('nt_editar')) {
      atletas = todosAtletas;
    } else {
      atletas = API.filtrarMeusAtletas(todosAtletas);
      const ids = new Set(atletas.map(a => Number(a.idatleta)));
      planos = planos.filter(pl => ids.has(Number(pl.idatleta)));
    }
  } catch (e) {
    console.error('[Nutrição] Erro ao carregar:', e);
  } finally {
    loading = false;
    render();
  }
}

function getNomeAtleta(id) {
  const a = atletas.find(x => Number(x.idatleta) === Number(id));
  return a ? a.nome : 'Aluno #' + id;
}

function getAtletaDados(id) {
  return atletas.find(x => Number(x.idatleta) === Number(id)) || null;
}

function abasHtml() {
  return `<div class="nt-tabs"><button class="nt-tab ${aba === 'dashboard' ? 'on' : ''}" onclick="trocarAba('dashboard')">Dashboard</button><button class="nt-tab ${aba === 'planos' ? 'on' : ''}" onclick="trocarAba('planos')">Planos</button></div>`;
}
function trocarAba(a) { aba = a; if (a === 'dashboard') carregarPainel(); render(); }

function render() {
  if (loading) {
    main.innerHTML = `<div class="empty-state"><p>Carregando planos...</p></div>`;
    return;
  }
  if (aba === 'dashboard') { main.innerHTML = abasHtml() + dashboardHtml(); return; }

  let lista = [...planos].sort((a, b) => {
    if (a.ativo !== b.ativo) return b.ativo - a.ativo;
    return (b.dtinicio || '').localeCompare(a.dtinicio || '');
  });
  if (filtroAtleta > 0) lista = lista.filter(pl => Number(pl.idatleta) === filtroAtleta);
  const nAtivos = lista.filter(planoAtivo).length, nInativos = lista.length - nAtivos;
  lista = lista.filter(pl => planoAtivo(pl) === filtroPlanoAtivo);

  main.innerHTML = abasHtml() + `
    <div class="filtros-bar">
      <select class="input" onchange="filtroAtleta=Number(this.value);render();">
        <option value="0">Todos os alunos</option>
        ${atletas.sort((a,b) => (a.nome||'').localeCompare(b.nome||'')).map(a =>
          `<option value="${a.idatleta}" ${Number(a.idatleta)===filtroAtleta?'selected':''}>${esc(a.nome)}</option>`
        ).join('')}
      </select>
      <button class="btn ${filtroPlanoAtivo ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="filtroPlanoAtivo=true;render();">Ativos (${nAtivos})</button>
      <button class="btn ${!filtroPlanoAtivo ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="filtroPlanoAtivo=false;render();">Inativos (${nInativos})</button>
      ${hasPerm('nt_incluir') ? `<button class="btn btn-primary" onclick="abrirModalNovo()">+ Novo Plano</button>` : ''}
      <button class="btn btn-secondary" onclick="abrirMeusAlimentos()" style="margin-left:auto;">🍎 Meus Alimentos</button>
      <button class="btn btn-secondary" onclick="abrirCalculadoraGET()">Calculadora GEB/GET</button>
    </div>

    <div style="padding:20px;">
      ${lista.length === 0 ? `
        <div class="empty-state">
          <div style="font-size:40px;margin-bottom:12px;">🥗</div>
          <p>${filtroPlanoAtivo ? 'Nenhum plano nutricional ativo' : 'Nenhum plano nutricional inativo'}${filtroAtleta > 0 ? ' para este aluno' : ''}.</p>
          <p style="margin-top:8px;">${filtroPlanoAtivo ? 'Crie um plano alimentar com refeições estruturadas e metas de macros.' : 'Planos inativos ficam aqui e o aluno não os vê no app. Dá para ativar de novo quando quiser.'}</p>
        </div>
      ` : lista.map(pl => renderPlanoCard(pl)).join('')}
    </div>
  `;
}

function renderPlanoCard(pl) {
  const nome = getNomeAtleta(pl.idatleta);
  const nRef = pl.refeicoes ? pl.refeicoes.length : 0;

  return `
    <div class="plano-card ${planoAtivo(pl) ? '' : 'inativo'}" onclick="verPlano(${pl.idplano})">
      <div class="plano-header">
        <div>
          <div class="plano-title">${esc(pl.titulo)}</div>
          <div class="plano-subtitle">${esc(nome)} ${pl.objetivo ? '· ' + esc(pl.objetivo) : ''}</div>
        </div>
        <div style="text-align:right;">
          <span class="plano-status ${planoAtivo(pl) ? 'ativo' : 'inativo'}">${planoAtivo(pl) ? 'Ativo' : 'Inativo'}</span>
          ${pl.dtinicio ? `<div style="font-size:10px;color:var(--text-muted);margin-top:4px;">${fmtDate(pl.dtinicio)}${pl.dtfim ? ' → ' + fmtDate(pl.dtfim) : ''}</div>` : ''}
          ${hasPerm('nt_editar') ? `<button class="btn btn-secondary btn-sm" style="margin-top:6px;" onclick="alternarAtivoPlano(${pl.idplano}, event)">${planoAtivo(pl) ? 'Inativar' : 'Ativar'}</button>` : ''}
        </div>
      </div>
      <div class="macros-bar">
        ${pl.calorias ? `<div class="macro-chip cal"><span class="macro-chip-value">${pl.calorias}</span><span class="macro-chip-label">kcal</span></div>` : ''}
        ${pl.proteina ? `<div class="macro-chip prot"><span class="macro-chip-value">${pl.proteina}g</span><span class="macro-chip-label">Prot</span></div>` : ''}
        ${pl.carboidrato ? `<div class="macro-chip carb"><span class="macro-chip-value">${pl.carboidrato}g</span><span class="macro-chip-label">Carb</span></div>` : ''}
        ${pl.gordura ? `<div class="macro-chip gord"><span class="macro-chip-value">${pl.gordura}g</span><span class="macro-chip-label">Gord</span></div>` : ''}
        ${nRef > 0 ? `<div class="macro-chip"><span class="macro-chip-value">${nRef}</span><span class="macro-chip-label">Refeições</span></div>` : ''}
      </div>
    </div>
  `;
}

// ── View Plan ──

function verPlano(id) {
  const pl = planos.find(x => Number(x.idplano) === Number(id));
  if (!pl) return;

  const nome = getNomeAtleta(pl.idatleta);
  // Monta a tabela de alimentos (linhas + total) — reaproveitada pra
  // refeição principal e pra cada refeição substituta, mesmo formato nos
  // dois casos, sem repetir a montagem de linha duas vezes.
  const montarItensHtml = (itens, rotuloTotal) => {
    if (!itens || itens.length === 0) return '';
    let html = `<div class="meal-item-row header">
      <span></span><span>Alimento</span><span>Qtd</span><span>Medida</span>
      <span style="text-align:center">Kcal</span><span style="text-align:center">P</span><span style="text-align:center">C</span><span style="text-align:center">G</span><span></span>
    </div>` + itens.map(it => {
      const n = it.nutrientes || {};
      let substHtml = '';
      if (it.substitutos && it.substitutos.length > 0) {
        substHtml = it.substitutos.map(s => {
          const sn = s.nutrientes || null;
          const qtd = s.medida_id ? API.nutri.rotuloQtd(s) : (s.quantidade ? s.quantidade + ' ' + (s.medida || 'g') : '');
          return `<div class="view-substitutos">${esc(s.nome)}${qtd ? ' · ' + esc(qtd) : ''}${sn ? ' <span style="color:#facc15;">' + (sn.energia_kcal || 0) + ' kcal</span> · P ' + (sn.proteina_g || 0) + ' · C ' + (sn.carboidrato_g || 0) + ' · G ' + (sn.lipidio_g || 0) : ''}</div>`;
        }).join('');
      }
      return `<div class="meal-item-row">
        <span></span>
        <span class="meal-item-name">${esc(it.nome)}</span>
        <span class="meal-item-val" style="grid-column:span 2;text-align:left;">${esc(API.nutri.rotuloQtd(it))}${it.medida_id && it.medida_id !== 'g' && it.gramas ? ' <span style="font-size:10px;">(' + it.gramas + ' g)</span>' : ''}</span>
        <span class="meal-item-val kcal">${n.energia_kcal || 0}</span>
        <span class="meal-item-val prot">${n.proteina_g || 0}</span>
        <span class="meal-item-val carb">${n.carboidrato_g || 0}</span>
        <span class="meal-item-val gord">${n.lipidio_g || 0}</span>
        <span></span>
      </div>${substHtml}`;
    }).join('');
    const totals = calcTotaisRefeicao(itens);
    html += `<div class="meal-totals">
      <span></span><span class="lbl">${rotuloTotal}</span><span></span><span></span>
      <span class="meal-item-val kcal">${totals.kcal}</span>
      <span class="meal-item-val prot">${totals.prot}g</span>
      <span class="meal-item-val carb">${totals.carb}g</span>
      <span class="meal-item-val gord">${totals.gord}g</span>
      <span></span>
    </div>`;
    return html;
  };

  let refHtml = '';
  if (pl.refeicoes && pl.refeicoes.length > 0) {
    refHtml = `
      <div class="modal-section-title">Refeições</div>
      ${pl.refeicoes.map(r => {
        const itens = r.itens_estruturados || [];
        const itensLegacy = r.itens || '';
        let itensHtml = '';
        if (itens.length > 0) {
          itensHtml = montarItensHtml(itens, 'Total');
          itensHtml += renderMicroPanel(calcTotaisRefeicao(itens), 'Micronutrientes da refeição');
        } else if (itensLegacy) {
          itensHtml = `<div class="refeicao-itens">${esc(itensLegacy)}</div>`;
        }
        // Refeição substituta completa (opção alternativa inteira) —
        // ver renderSubstituicoes no editor. Sem painel de micronutrientes
        // aqui, pra não pesar a tela com uma opção alternativa.
        const substsHtml = (r.refeicoes_substitutas || []).map(s => `
          <div style="margin-top:10px;padding:10px;border:1px dashed var(--border);border-radius:8px;background:var(--bg2);">
            <div style="font-size:11px;color:#60a5fa;font-weight:700;margin-bottom:6px;">↔ SUBSTITUIÇÃO — ${esc(s.nome || '')}</div>
            ${montarItensHtml(s.itens_estruturados || [], 'Total da opção')}
          </div>
        `).join('');
        return `
          <div class="refeicao-block">
            <div class="refeicao-header">
              <span class="refeicao-nome">${esc(r.nome)}</span>
              ${r.horario ? `<span class="refeicao-horario">${esc(r.horario)}</span>` : ''}
            </div>
            ${itensHtml}
            ${substsHtml}
          </div>
        `;
      }).join('')}
    `;
  }

  openModal(`
    <div class="modal-header">
      <div class="modal-title">${esc(pl.titulo)}</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" style="max-height:75vh;overflow-y:auto;">
      <div style="margin-bottom:10px;">
        <span style="font-size:13px;color:var(--text-muted);">${esc(nome)}</span>
        <span class="plano-status ${planoAtivo(pl) ? 'ativo' : 'inativo'}" style="margin-left:8px;">${planoAtivo(pl) ? 'Ativo' : 'Inativo'}</span>
      </div>
      ${pl.objetivo ? `<div style="font-size:13px;color:var(--text);margin-bottom:8px;"><strong>Objetivo:</strong> ${esc(pl.objetivo)}</div>` : ''}
      ${pl.dtinicio ? `<div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">Período: ${fmtDate(pl.dtinicio)}${pl.dtfim ? ' → ' + fmtDate(pl.dtfim) : ' (sem fim definido)'}</div>` : ''}

      <div class="macros-bar" style="margin-bottom:14px;">
        ${pl.calorias ? `<div class="macro-chip cal"><span class="macro-chip-value">${pl.calorias}</span><span class="macro-chip-label">kcal/dia</span></div>` : ''}
        ${pl.proteina ? `<div class="macro-chip prot"><span class="macro-chip-value">${pl.proteina}g</span><span class="macro-chip-label">Proteína</span></div>` : ''}
        ${pl.carboidrato ? `<div class="macro-chip carb"><span class="macro-chip-value">${pl.carboidrato}g</span><span class="macro-chip-label">Carboidrato</span></div>` : ''}
        ${pl.gordura ? `<div class="macro-chip gord"><span class="macro-chip-value">${pl.gordura}g</span><span class="macro-chip-label">Gordura</span></div>` : ''}
      </div>

      ${pl.calorias || pl.proteina || pl.carboidrato || pl.gordura ? renderMacroDistBar(pl.proteina, pl.carboidrato, pl.gordura) : ''}

      ${pl.comentario_inicio ? `
        <div class="modal-section-title">Orientações Iniciais</div>
        <div style="font-size:14px;color:var(--text);white-space:pre-wrap;line-height:1.5;margin-bottom:14px;padding:12px 14px;background:var(--bg3);border-radius:8px;border-left:3px solid var(--green);">${esc(pl.comentario_inicio)}</div>
      ` : ''}

      ${refHtml}

      ${(() => {
        if (!pl.refeicoes || pl.refeicoes.length === 0) return '';
        const allItens = pl.refeicoes.flatMap(r => r.itens_estruturados || []);
        if (allItens.length === 0) return '';
        const dailyTotals = calcTotaisRefeicao(allItens);
        return renderMicroPanel(dailyTotals, 'Micronutrientes — Total Diário');
      })()}

      ${pl.comentario_fim ? `
        <div class="modal-section-title">Observações Finais</div>
        <div style="font-size:14px;color:var(--text);white-space:pre-wrap;line-height:1.5;margin-bottom:14px;padding:12px 14px;background:var(--bg3);border-radius:8px;border-left:3px solid #60a5fa;">${esc(pl.comentario_fim)}</div>
      ` : ''}

      ${pl.observacao ? `
        <div class="modal-section-title">Observação</div>
        <div style="font-size:14px;color:var(--text);white-space:pre-wrap;line-height:1.5;">${esc(pl.observacao)}</div>
      ` : ''}
    </div>
    <div class="modal-footer">
      ${hasPerm('nt_excluir') ? `<button class="btn btn-danger" onclick="excluirPlano(${pl.idplano})">Excluir</button>` : ''}
      <button class="btn btn-secondary" onclick="imprimirPlano(${pl.idplano})" title="Abre uma versão para imprimir ou salvar em PDF">🖨 Imprimir / PDF</button>
      ${hasPerm('nt_incluir') ? `<button class="btn btn-secondary" onclick="abrirDuplicarPlano(${pl.idplano})" title="Cria uma cópia deste plano para outro aluno">⧉ Duplicar para outro aluno</button>` : ''}
      ${hasPerm('nt_editar') ? `<button class="btn btn-secondary" onclick="alternarAtivoPlano(${pl.idplano})">${planoAtivo(pl) ? '⛔ Inativar plano' : '✅ Ativar plano'}</button>` : ''}
      ${hasPerm('nt_editar') ? `<button class="btn btn-primary" onclick="closeModal();abrirModalForm(${pl.idplano})">Editar</button>` : ''}
      <button class="btn btn-secondary" onclick="closeModal()">Fechar</button>
    </div>
  `, 'wide');
}

// ── Duplicar plano para outro aluno ──
// A cópia leva todas as refeições, quantidades, substitutos e metas, e nasce INATIVA por padrão: o aluno só vê quando a nutri revisar e ativar.
function abrirDuplicarPlano(idplano) {
  const pl = planos.find(x => Number(x.idplano) === Number(idplano));
  if (!pl) return;
  const lista = atletas.slice().sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt'));
  closeModal();
  openModal(`
    <div class="modal-header">
      <div class="modal-title">Duplicar plano para outro aluno</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">Cria uma cópia de "${esc(pl.titulo)}" com todas as refeições, quantidades e substitutos. Depois é só ajustar o que muda para o novo aluno.</p>
      <div class="form-group"><label class="label">Aluno que vai receber a cópia *</label>
        <select id="dup-atleta" class="input"><option value="">Selecione...</option>${lista.map(a => `<option value="${a.idatleta}">${esc(a.nome)}</option>`).join('')}</select></div>
      <div class="form-group"><label class="label">Título</label><input id="dup-titulo" class="input" value="${esc((pl.titulo || 'Plano Alimentar') + ' (cópia)')}"/></div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;"><input id="dup-inativo" type="checkbox" checked/> Criar inativo (o aluno só vê depois que eu ativar)</label>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal();verPlano(${pl.idplano})">Voltar</button>
      <button class="btn btn-primary" onclick="duplicarPlano(${pl.idplano})">Duplicar</button>
    </div>
  `);
}
async function duplicarPlano(idplano) {
  const pl = planos.find(x => Number(x.idplano) === Number(idplano));
  const idatleta = Number(document.getElementById('dup-atleta')?.value);
  if (!pl) return;
  if (!idatleta) return showToast('Escolha o aluno que vai receber a cópia', 'error');
  const inativo = !!document.getElementById('dup-inativo')?.checked;
  const copia = JSON.parse(JSON.stringify(pl.refeicoes || []));
  try {
    await API.criarPlanoNutricional({
      idatleta, titulo: document.getElementById('dup-titulo')?.value?.trim() || (pl.titulo + ' (cópia)'), objetivo: pl.objetivo || '',
      calorias: pl.calorias, proteina: pl.proteina, carboidrato: pl.carboidrato, gordura: pl.gordura, refeicoes: copia,
      observacao: pl.observacao || '', comentario_inicio: pl.comentario_inicio || '', comentario_fim: pl.comentario_fim || '',
      ativo: inativo ? 0 : 1, dtinicio: new Date().toISOString().slice(0, 10), dtfim: null,
    });
    showToast('Plano duplicado' + (inativo ? ' (inativo)' : '') + ' para ' + getNomeAtleta(idatleta));
    closeModal();
    await carregar();
  } catch (e) {
    showToast('Erro ao duplicar: ' + e.message, 'error');
  }
}

// ── Imprimir / salvar em PDF ──
function imprimirPlano(idplano) {
  const pl = planos.find(x => Number(x.idplano) === Number(idplano));
  if (!pl) return;
  const w = window.open('', '_blank');
  if (!w) return showToast('O navegador bloqueou a janela de impressão. Libere pop-ups para este site.', 'error');
  const linhasItens = (itens) => (itens || []).map(it => {
    const n = it.nutrientes || {};
    const qtd = API.nutri.rotuloQtd(it) + (it.medida_id && it.medida_id !== 'g' && it.gramas ? ' (' + Math.round(it.gramas) + ' g)' : '');
    const subs = (it.substitutos || []).map(sb => esc(sb.nome) + (sb.medida_id ? ' (' + esc(API.nutri.rotuloQtd(sb)) + ')' : (sb.quantidade ? ' (' + esc(String(sb.quantidade)) + ' ' + esc(sb.medida || 'g') + ')' : ''))).join(' · ');
    return `<tr><td>${esc(it.nome)}${subs ? `<div class="sub">pode trocar por: ${subs}</div>` : ''}</td><td>${esc(qtd)}</td><td class="n">${Math.round(n.energia_kcal || 0)}</td><td class="n">${n.proteina_g || 0}</td><td class="n">${n.carboidrato_g || 0}</td><td class="n">${n.lipidio_g || 0}</td></tr>`;
  }).join('');
  const tabela = (itens, rot) => {
    const t = calcTotaisRefeicao(itens || []);
    return `<table><thead><tr><th>Alimento</th><th>Quantidade</th><th class="n">kcal</th><th class="n">P</th><th class="n">C</th><th class="n">G</th></tr></thead><tbody>${linhasItens(itens)}<tr class="tot"><td colspan="2">${rot}</td><td class="n">${t.kcal}</td><td class="n">${t.prot}</td><td class="n">${t.carb}</td><td class="n">${t.gord}</td></tr></tbody></table>`;
  };
  const refs = (pl.refeicoes || []).map(r => `<div class="ref"><h3>${esc(r.horario || '')} ${esc(r.nome || '')}</h3>${(r.itens_estruturados || []).length ? tabela(r.itens_estruturados, 'Total da refeição') : `<p>${esc(r.itens || '')}</p>`}
    ${(r.refeicoes_substitutas || []).filter(x => (x.itens_estruturados || []).length).map(sb => `<h4>Opção: ${esc(sb.nome || 'Substituição')}</h4>${tabela(sb.itens_estruturados, 'Total da opção')}`).join('')}</div>`).join('');
  const todos = (pl.refeicoes || []).flatMap(r => r.itens_estruturados || []);
  const dia = calcTotaisRefeicao(todos);
  w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(pl.titulo)}</title><style>
    body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:24px;font-size:13px}h1{font-size:22px;margin:0 0 2px}h3{font-size:15px;margin:18px 0 6px;border-bottom:2px solid #7FFF00;padding-bottom:3px}h4{font-size:13px;margin:12px 0 4px;color:#2563eb}
    .meta{color:#555;margin-bottom:10px}.macros{display:flex;gap:10px;margin:10px 0}.macros span{border:1px solid #ccc;border-radius:8px;padding:6px 10px}
    table{width:100%;border-collapse:collapse;margin-bottom:4px}th,td{border-bottom:1px solid #ddd;padding:5px 6px;text-align:left}th{font-size:11px;text-transform:uppercase;color:#555}.n{text-align:right;white-space:nowrap}.tot td{font-weight:700;border-top:2px solid #999}.sub{font-size:11px;color:#2563eb;margin-top:2px}
    .box{background:#f4f4f4;border-left:3px solid #7FFF00;padding:8px 12px;margin:10px 0;white-space:pre-wrap}.ref{page-break-inside:avoid}@media print{body{margin:10mm}}</style></head><body>
    <h1>${esc(pl.titulo)}</h1><div class="meta">${esc(getNomeAtleta(pl.idatleta))}${pl.objetivo ? ' · ' + esc(pl.objetivo) : ''}${pl.dtinicio ? ' · desde ' + fmtDate(pl.dtinicio) : ''}${pl.dtfim ? ' até ' + fmtDate(pl.dtfim) : ''}</div>
    <div class="macros">${pl.calorias ? `<span><b>${pl.calorias}</b> kcal/dia</span>` : ''}${pl.proteina ? `<span>Proteína <b>${pl.proteina} g</b></span>` : ''}${pl.carboidrato ? `<span>Carboidrato <b>${pl.carboidrato} g</b></span>` : ''}${pl.gordura ? `<span>Gordura <b>${pl.gordura} g</b></span>` : ''}</div>
    ${pl.comentario_inicio ? `<div class="box">${esc(pl.comentario_inicio)}</div>` : ''}${refs}
    <h3>Total do dia (refeições principais)</h3><div class="macros"><span><b>${dia.kcal}</b> kcal</span><span>P <b>${dia.prot} g</b></span><span>C <b>${dia.carb} g</b></span><span>G <b>${dia.gord} g</b></span><span>Fibra <b>${dia.fibra} g</b></span></div>
    ${pl.comentario_fim ? `<div class="box">${esc(pl.comentario_fim)}</div>` : ''}${pl.observacao ? `<p>${esc(pl.observacao)}</p>` : ''}
    <p style="color:#888;font-size:11px;margin-top:20px">Intus Fit · valores da TACO e de alimentos cadastrados pela equipe. As porções são individualizadas conforme este plano.</p>
    <script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script></body></html>`);
  w.document.close();
}

function renderMacroDistBar(prot, carb, gord) {
  const p = (prot || 0) * 4;
  const c = (carb || 0) * 4;
  const g = (gord || 0) * 9;
  const total = p + c + g || 1;
  const pp = Math.round(p / total * 100);
  const cp = Math.round(c / total * 100);
  const gp = Math.round(g / total * 100);
  return `
    <div class="macro-dist-bar">
      <div class="seg-prot" style="width:${pp}%"></div>
      <div class="seg-carb" style="width:${cp}%"></div>
      <div class="seg-gord" style="width:${gp}%"></div>
    </div>
    <div class="macro-dist-legend">
      <span><span class="dot" style="background:#60a5fa;"></span>Prot ${pp}%</span>
      <span><span class="dot" style="background:#7FFF00;"></span>Carb ${cp}%</span>
      <span><span class="dot" style="background:#f87171;"></span>Gord ${gp}%</span>
    </div>
  `;
}

function calcTotaisRefeicao(itens) {
  let kcal = 0, prot = 0, carb = 0, gord = 0;
  let fibra = 0, sodio = 0, calcio = 0, ferro = 0, potassio = 0, magnesio = 0;
  let fosforo = 0, zinco = 0, vitC = 0, colesterol = 0;
  let saturados = 0, monoinsaturados = 0, poliinsaturados = 0;
  let tiamina = 0, riboflavina = 0, niacina = 0;
  for (const it of itens) {
    const n = it.nutrientes || {};
    kcal += n.energia_kcal || 0;
    prot += n.proteina_g || 0;
    carb += n.carboidrato_g || 0;
    gord += n.lipidio_g || 0;
    fibra += n.fibra_g || 0;
    sodio += n.sodio_mg || 0;
    calcio += n.calcio_mg || 0;
    ferro += n.ferro_mg || 0;
    potassio += n.potassio_mg || 0;
    magnesio += n.magnesio_mg || 0;
    fosforo += n.fosforo_mg || 0;
    zinco += n.zinco_mg || 0;
    vitC += n.vitamina_c_mg || 0;
    colesterol += n.colesterol_mg || 0;
    saturados += n.saturados_g || 0;
    monoinsaturados += n.monoinsaturados_g || 0;
    poliinsaturados += n.poliinsaturados_g || 0;
    tiamina += n.tiamina_mg || 0;
    riboflavina += n.riboflavina_mg || 0;
    niacina += n.niacina_mg || 0;
  }
  return {
    kcal: Math.round(kcal), prot: Math.round(prot * 10) / 10,
    carb: Math.round(carb * 10) / 10, gord: Math.round(gord * 10) / 10,
    fibra: Math.round(fibra * 10) / 10, sodio: Math.round(sodio * 10) / 10,
    calcio: Math.round(calcio * 10) / 10, ferro: Math.round(ferro * 10) / 10,
    potassio: Math.round(potassio * 10) / 10, magnesio: Math.round(magnesio * 10) / 10,
    fosforo: Math.round(fosforo * 10) / 10, zinco: Math.round(zinco * 10) / 10,
    vitC: Math.round(vitC * 10) / 10, colesterol: Math.round(colesterol * 10) / 10,
    saturados: Math.round(saturados * 10) / 10, monoinsaturados: Math.round(monoinsaturados * 10) / 10,
    poliinsaturados: Math.round(poliinsaturados * 10) / 10,
    tiamina: Math.round(tiamina * 100) / 100, riboflavina: Math.round(riboflavina * 100) / 100,
    niacina: Math.round(niacina * 10) / 10,
  };
}

function renderMicroPanel(totals, titulo) {
  const micros = [
    { label: 'Fibra', value: totals.fibra, unit: 'g' },
    { label: 'Sódio', value: totals.sodio, unit: 'mg' },
    { label: 'Cálcio', value: totals.calcio, unit: 'mg' },
    { label: 'Ferro', value: totals.ferro, unit: 'mg' },
    { label: 'Potássio', value: totals.potassio, unit: 'mg' },
    { label: 'Magnésio', value: totals.magnesio, unit: 'mg' },
    { label: 'Fósforo', value: totals.fosforo, unit: 'mg' },
    { label: 'Zinco', value: totals.zinco, unit: 'mg' },
    { label: 'Vitamina C', value: totals.vitC, unit: 'mg' },
    { label: 'Colesterol', value: totals.colesterol, unit: 'mg' },
    { label: 'Saturados', value: totals.saturados, unit: 'g' },
    { label: 'Monoinsaturados', value: totals.monoinsaturados, unit: 'g' },
    { label: 'Poliinsaturados', value: totals.poliinsaturados, unit: 'g' },
    { label: 'Tiamina (B1)', value: totals.tiamina, unit: 'mg' },
    { label: 'Riboflavina (B2)', value: totals.riboflavina, unit: 'mg' },
    { label: 'Niacina (B3)', value: totals.niacina, unit: 'mg' },
  ];
  const hasAny = micros.some(m => m.value > 0);
  if (!hasAny) return '';
  return `
    <div class="micro-panel">
      <h5>${titulo || 'Micronutrientes'}</h5>
      <div class="micro-grid">
        ${micros.filter(m => m.value > 0).map(m =>
          `<div class="micro-item"><span class="micro-label">${m.label}</span><span class="micro-value">${m.value} ${m.unit}</span></div>`
        ).join('')}
      </div>
    </div>
  `;
}

  document.querySelectorAll('.plan-tab').forEach((el, i) => {

  });
  document.querySelectorAll('.plan-tab-content').forEach(el => el.classList.remove('active'));
  document.getElementById('ptab-' + tab)?.classList.add('active');
  if (tab === 'refeicoes') recalcTotaisDiarios();
}

function updateMetasDist() {
  const p = parseFloat(document.getElementById('nt-proteina')?.value) || 0;
  const c = parseFloat(document.getElementById('nt-carboidrato')?.value) || 0;
  const g = parseFloat(document.getElementById('nt-gordura')?.value) || 0;
  const el = document.getElementById('metas-dist-preview');
  if (el) {
    if (p + c + g === 0) { el.innerHTML = ''; }
    else {
      const totalKcal = (p * 4) + (c * 4) + (g * 9);
      el.innerHTML = `
        ${renderMacroDistBar(p, c, g)}
        <div style="font-size:12px;color:var(--text-muted);margin-top:6px;">Total calculado: <strong style="color:var(--text);">${Math.round(totalKcal)} kcal</strong></div>
      `;
    }
  }
  // A meta mudou — o comparativo no topo da aba Refeições precisa acompanhar,
  // mesmo que essa aba não esteja visível agora (o valor fica pronto pra
  // quando o nutricionista voltar pra lá).
  recalcTotaisDiarios();
}

// ── Itens do plano: alimento + quantidade + medida caseira ───────────────────────────────────────
// Cada item guarda o que precisa para se recalcular sozinho: gramas, medida_g (gramas de 1 medida) e, para "Meus
// alimentos" (que outro profissional não enxerga), a tabela de 100 g (por100). A quantidade pode estar em gramas ou
// numa medida caseira do alimento (2 unidades de ovo, 1 fatia de pão...). As medidas vêm de AlimentosDB.getMedidasAlimento.
const ANTIGAS_G = { colher_sopa: 15, colher_cha: 5, colher_sobremesa: 10, colher_cafe: 2.5, colher_servir: 30, xicara: 240, xicara_cafe: 50,
  copo_americano: 165, copo_requeijao: 250, copo_duplo: 350, unidade: 100, fatia: 30, concha: 120, concha_media: 100, escumadeira: 80, pegador: 60 };
const MEDIDAS_GENERICAS_ANTIGAS = ['unidade', 'fatia', 'concha', 'escumadeira', 'pegador'];
const r1 = v => Math.round((Number(v) || 0) * 10) / 10;
let _equivModo = 'kcal';       // o que o substituto mantém igual ao original
let _ultimoTermo = '';         // termo digitado na busca (para "cadastrar como novo"), sem passar por atributo HTML

function _medidasDoItem(it) {
  const f = AlimentosDB.resolver(it);
  const lista = f ? AlimentosDB.getMedidasAlimento(f.id).slice() : [];
  if (it.medida_id && it.medida_id !== 'g' && !lista.some(m => m.id === it.medida_id) && it.medida_g > 0) {
    lista.push({ id: it.medida_id, nome: it.medida_nome || it.medida_id, gramas: it.medida_g, antiga: true });
  }
  return lista;
}

function _recalcItem(it) {
  const q = parseFloat(it.quantidade) || 0;
  it.gramas = r1(it.medida_id && it.medida_id !== 'g' ? q * (it.medida_g || 0) : q);
  if (it.por100) it.nutrientes = AlimentosDB.escalar(it.por100, it.gramas);
  return it;
}

// Item novo a partir de um alimento da base: já entra na medida caseira mais comum dele (ex.: ovo = 2 unidades).
function _novoItem(food) {
  const u = AlimentosDB.getUnidadePadrao(food.id);
  const it = { food_id: food.id, nome: food.description, por100: AlimentosDB.nutrientesPor100(food), substitutos: [], _ok: true };
  if (u) { it.quantidade = u.quantidade; it.medida_id = u.medida_id; it.medida_nome = u.medida_nome; it.medida_g = u.medida_g; }
  else { it.quantidade = 100; it.medida_id = 'g'; it.medida_nome = 'gramas'; it.medida_g = 1; }
  return _recalcItem(it);
}

// Prepara um item vindo de um plano já salvo: acha o alimento certo, recupera quanto vale 1 medida (pelo que foi
// calculado na época) e marca com ⚠ a medida antiga que não bate com a tabela de medidas atual.
function _hidratarItem(it) {
  if (!it || it._ok) return it;
  const f = AlimentosDB.resolver(it);
  if (f) it.food_id = f.id;
  if (!it.por100 && f) it.por100 = AlimentosDB.nutrientesPor100(f);
  const q = parseFloat(it.quantidade) || 0;
  if (!it.medida_id || it.medida_id === 'g') {
    it.medida_id = 'g'; it.medida_nome = 'gramas'; it.medida_g = 1; it.gramas = q;
  } else {
    if (!(it.medida_g > 0)) {
      let g = 0;
      if (it.por100 && it.nutrientes && it.por100.energia_kcal > 0 && it.nutrientes.energia_kcal > 0 && q > 0) {
        g = (it.nutrientes.energia_kcal / it.por100.energia_kcal * 100) / q;
      }
      if (!(g > 0)) { const m = _medidasDoItem(it).find(x => x.id === it.medida_id); g = m ? m.gramas : (ANTIGAS_G[it.medida_id] || 0); }
      it.medida_g = r1(g);
    }
    it.gramas = r1(q * it.medida_g);
    const cat = f ? AlimentosDB.getMedidasAlimento(f.id).find(m => m.id === it.medida_id) : null;
    if (cat) { if (Math.abs(cat.gramas - it.medida_g) > Math.max(2, cat.gramas * 0.15)) it._revisar = cat.gramas; }
    else if (MEDIDAS_GENERICAS_ANTIGAS.indexOf(it.medida_id) >= 0) it._revisar = -1;
  }
  if (!it.por100 && it.nutrientes && it.gramas > 0) {
    it.por100 = {};
    Object.keys(it.nutrientes).forEach(k => { it.por100[k] = Math.round((Number(it.nutrientes[k]) || 0) / it.gramas * 10000) / 100; });
  }
  (it.substitutos || []).forEach(_hidratarSubst);
  it._ok = true;
  return it;
}

// Substituto de alimento: formato novo = item completo; formato antigo = só nome, quantidade e texto da medida.
function _hidratarSubst(s) {
  if (!s || s._ok) return s;
  if (s.manual) { s._ok = true; return s; }
  if (s.por100 || s.medida_id) { _hidratarItem(s); return s; }
  const f = AlimentosDB.resolver({ food_id: s.food_id, nome: s.nome });
  const q = Number(s.quantidade) || 0;
  if (f && q > 0 && (!s.medida || s.medida === 'g' || s.medida === 'gramas')) {
    s.food_id = f.id; s.por100 = AlimentosDB.nutrientesPor100(f);
    s.medida_id = 'g'; s.medida_nome = 'gramas'; s.medida_g = 1; s.quantidade = q;
    _recalcItem(s);
  } else if (f) {
    s.food_id = f.id;
  }
  if (!s.por100) s.manual = true;   // sem tabela nutricional: fica como texto
  s._ok = true;
  return s;
}

function _hidratarPlano() {
  _formRefeicoes.forEach(r => {
    (r.itens_estruturados || []).forEach(_hidratarItem);
    (r.refeicoes_substitutas || []).forEach(sb => (sb.itens_estruturados || []).forEach(_hidratarItem));
  });
}

// Item pronto para gravar: sem campos de tela (_algo) e sem a tabela de 100 g quando o alimento é da TACO (todos resolvem).
function _limparItem(it) {
  if (it.manual) return { nome: it.nome, quantidade: it.quantidade, medida: it.medida || 'g', food_id: it.food_id || null, manual: true };
  const f = AlimentosDB.resolver(it);
  const o = {
    food_id: f ? f.id : (it.food_id || null), nome: it.nome, quantidade: it.quantidade,
    medida_id: it.medida_id || 'g', medida_nome: it.medida_nome || 'gramas', medida_g: it.medida_g || 1, gramas: it.gramas || 0,
    nutrientes: it.nutrientes || null,
  };
  if (it.medida && !it.medida_id) o.medida = it.medida;
  if (it.por100 && (!f || f.custom)) o.por100 = it.por100;
  if (it.substitutos && it.substitutos.length) o.substitutos = it.substitutos.map(_limparItem);
  else o.substitutos = [];
  return o;
}

function _lista(refIdx, substIdx) {
  const r = _formRefeicoes[refIdx]; if (!r) return null;
  if (substIdx == null || substIdx < 0) return (r.itens_estruturados = r.itens_estruturados || []);
  const s = (r.refeicoes_substitutas || [])[substIdx]; if (!s) return null;
  return (s.itens_estruturados = s.itens_estruturados || []);
}
function _redesenhar(refIdx, substIdx) {
  if (substIdx == null || substIdx < 0) {
    const el = document.getElementById('ref-itens-' + refIdx); if (el) el.innerHTML = renderItensRefeicao(refIdx);
    const sb = document.getElementById('ref-subst-' + refIdx); if (sb && (_formRefeicoes[refIdx].refeicoes_substitutas || []).length) sb.innerHTML = renderSubstituicoes(refIdx);
  } else {
    const el = document.getElementById('ref-subst-itens-' + refIdx + '-' + substIdx); if (el) el.innerHTML = renderItensSubstituicao(refIdx, substIdx);
  }
  recalcTotaisDiarios();
}

// Porção padrão de um alimento: a medida caseira mais comum dele (ex.: 2 unidades de ovo = 100 g) ou, sem medida, 100 g.
function _porcaoPadrao(f) {
  const u = AlimentosDB.getUnidadePadrao(f.id);
  const gramas = u ? r1(u.quantidade * u.medida_g) : 100;
  const rotulo = u ? API.nutri.rotuloQtd({ quantidade: u.quantidade, medida_id: u.medida_id, medida_nome: u.medida_nome }) + ' (' + gramas + ' g)' : '100 g';
  return { gramas, rotulo, nut: AlimentosDB.calcNutrientes(f.id, gramas) || {} };
}
function _resultadoBuscaHtml(f, js) {
  const p = _porcaoPadrao(f), n = p.nut, fm = v => String(Math.round((v || 0) * 10) / 10).replace('.', ',');
  return `<div class="food-result-item" onclick="${js}">
    <div style="min-width:0;">
      <div>${esc(f.description)}${f.custom ? '<span class="custom-food-badge">MEU</span>' : ''}</div>
      <div class="food-cat">${esc(f.category || '')}</div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">Porção: ${esc(p.rotulo)}</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;text-align:right;flex-shrink:0;">
      <div><div class="food-kcal">${Math.round(n.energia_kcal || 0)} kcal</div>
        <div style="font-size:10.5px;color:var(--text-muted);white-space:nowrap;"><span style="color:#60a5fa;">P ${fm(n.proteina_g)}</span> · <span style="color:#7FFF00;">C ${fm(n.carboidrato_g)}</span> · <span style="color:#f87171;">G ${fm(n.lipidio_g)}</span></div></div>
      <span onclick="event.stopPropagation();verTabelaAlimento(${f.id})" title="Tabela nutricional" style="cursor:pointer;color:var(--text-muted);">ℹ</span>
    </div>
  </div>`;
}

const _CAB_ITENS = `<div class="meal-item-row header">
    <span></span><span>Alimento</span><span>Qtd</span><span>Medida</span>
    <span style="text-align:center">Kcal</span><span style="text-align:center">P</span><span style="text-align:center">C</span><span style="text-align:center">G</span><span></span>
  </div>`;

// Uma linha editável (alimento principal ou de uma refeição substituta).
function _linhaItemHtml(it, refIdx, substIdx, itemIdx, comArrastar, comSubst) {
  const n = it.nutrientes || {};
  const medidas = _medidasDoItem(it);
  const a = refIdx + ',' + substIdx + ',' + itemIdx;
  const emMedida = it.medida_id && it.medida_id !== 'g';
  const aviso = it._revisar
    ? `<span title="${it._revisar > 0 ? 'Medida salva: 1 ' + esc(it.medida_nome) + ' = ' + it.medida_g + ' g. Na tabela atual vale ' + it._revisar + ' g. Toque para revisar.' : 'Medida genérica: confira o peso. Toque para revisar.'}" onclick="itemRevisar(${a})" style="color:#f59e0b;cursor:pointer;margin-right:4px;">⚠</span>` : '';
  const drag = comArrastar ? ` draggable="true" data-ref="${refIdx}" data-item="${itemIdx}" ondragstart="onItemDragStart(event,${refIdx},${itemIdx})" ondragend="onItemDragEnd(event)" ondragover="onItemDragOver(event,${refIdx},${itemIdx})" ondragleave="onItemDragLeave(event)" ondrop="onItemDrop(event,${refIdx},${itemIdx})"` : '';
  let h = `<div class="meal-item-row"${drag}>
      <span class="drag-handle" title="${comArrastar ? 'Arrastar' : ''}">${comArrastar ? '⋮⋮' : ''}</span>
      <span class="meal-item-name" title="${esc(it.nome)}">${aviso}${esc(it.nome)}</span>
      <span><input class="meal-item-qty input" type="number" min="0" step="${emMedida ? 0.5 : 5}" value="${it.quantidade || ''}" onchange="itemQtd(${a},this.value)"/></span>
      <span><select class="meal-item-measure input" onchange="itemMedida(${a},this.value)">
        <option value="g" ${!emMedida ? 'selected' : ''}>gramas</option>
        ${medidas.map(m => `<option value="${esc(m.id)}" ${it.medida_id === m.id ? 'selected' : ''}>${esc(m.nome)} (${m.gramas}g)</option>`).join('')}
        <option value="__nova__">+ Definir outra medida...</option>
      </select></span>
      <span class="meal-item-val kcal">${n.energia_kcal || 0}</span>
      <span class="meal-item-val prot">${n.proteina_g || 0}</span>
      <span class="meal-item-val carb">${n.carboidrato_g || 0}</span>
      <span class="meal-item-val gord">${n.lipidio_g || 0}</span>
      <span class="meal-item-actions">
        ${comSubst ? `<button class="btn-subst" onclick="toggleSubstPanel(${refIdx},${itemIdx})" title="Substitutos deste alimento">↔${(it.substitutos || []).length ? '<sup style="font-size:9px;">' + it.substitutos.length + '</sup>' : ''}</button>` : ''}
        <button class="btn-subst" onclick="verTabelaItem(${a})" title="Tabela nutricional">ℹ</button>
        <button class="meal-item-remove" onclick="itemRemover(${a})" title="Remover">✕</button>
      </span>
    </div>`;
  if (emMedida && it.gramas) h += `<div class="portion-equiv" style="padding-left:28px;font-size:10px;color:var(--text-muted);">≈ ${it.gramas}g</div>`;
  else if (!emMedida && it.gramas) {
    const f = AlimentosDB.resolver(it), u = f ? AlimentosDB.getUnidadePadrao(f.id) : null;
    if (u && u.medida_g > 0) {
      const q = Math.round(it.gramas / u.medida_g * 10) / 10;
      h += `<div class="portion-equiv" style="padding-left:28px;font-size:10px;color:var(--text-muted);">≈ ${String(q).replace('.', ',')} ${API.nutri.pluralMedida(u.medida_nome, q)} · <a href="#" onclick="itemUsarUnidade(${a});return false;" style="color:#60a5fa;">usar ${API.nutri.pluralMedida(u.medida_nome, 2)}</a></div>`;
    }
  }
  return h;
}

function _totaisHtml(rotulo, itens) {
  const t = calcTotaisRefeicao(itens);
  return `<div class="meal-totals">
    <span></span><span class="lbl">${rotulo}</span><span></span><span></span>
    <span class="meal-item-val kcal">${t.kcal}</span><span class="meal-item-val prot">${t.prot}g</span>
    <span class="meal-item-val carb">${t.carb}g</span><span class="meal-item-val gord">${t.gord}g</span><span></span></div>`;
}

function renderItensRefeicao(refIdx) {
  const itens = _formRefeicoes[refIdx].itens_estruturados || [];
  if (itens.length === 0) return `<div style="font-size:11px;color:var(--text-muted);padding:6px 0;">Nenhum alimento adicionado. Use a busca abaixo.</div>`;
  let html = _CAB_ITENS;
  itens.forEach((it, itemIdx) => {
    html += _linhaItemHtml(it, refIdx, -1, itemIdx, true, true);
    if (_openSubstPanel && _openSubstPanel.refIdx === refIdx && _openSubstPanel.itemIdx === itemIdx) html += renderSubstPanel(refIdx, itemIdx, it);
  });
  return html + _totaisHtml('Total refeição', itens);
}

// ── Ações sobre um item (principal ou de refeição substituta) ──
function itemQtd(refIdx, substIdx, itemIdx, value) {
  const it = (_lista(refIdx, substIdx) || [])[itemIdx]; if (!it) return;
  it.quantidade = Math.max(0, parseFloat(String(value).replace(',', '.')) || 0);
  delete it._revisar;
  _recalcItem(it);
  _redesenhar(refIdx, substIdx);
}
// Medida própria do item (ex.: "concha" de 80 g, "pote" de 170 g) para qualquer alimento, mesmo sem medida no catálogo.
function _perguntarMedida(it) {
  const nome = (prompt('Nome da medida (ex.: concha, pote, scoop):') || '').trim();
  if (!nome) return false;
  const g = parseFloat(String(prompt('Quantos gramas pesa 1 ' + nome.toLowerCase() + '?') || '').replace(',', '.'));
  if (!(g > 0)) { showToast('Informe um peso em gramas maior que zero.', 'error'); return false; }
  it.medida_id = 'pers_' + nome.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g, '_');
  it.medida_nome = nome.charAt(0).toUpperCase() + nome.slice(1);
  it.medida_g = g;
  it.quantidade = 1;
  return true;
}
// Converte um item em gramas para a medida padrão do alimento (ex.: 100 g de ovo = 2 unidades), arredondando em meia unidade.
function _usarUnidadePadrao(it) {
  const f = AlimentosDB.resolver(it), u = f ? AlimentosDB.getUnidadePadrao(f.id) : null;
  if (!u || !(u.medida_g > 0) || !(it.gramas > 0)) return false;
  const q = Math.max(0.5, Math.round(it.gramas / u.medida_g * 2) / 2);
  it.medida_id = u.medida_id; it.medida_nome = u.medida_nome; it.medida_g = u.medida_g; it.quantidade = q;
  return true;
}
function itemUsarUnidade(refIdx, substIdx, itemIdx) {
  const it = (_lista(refIdx, substIdx) || [])[itemIdx]; if (!it) return;
  const antes = it.gramas;
  if (!_usarUnidadePadrao(it)) return;
  _recalcItem(it);
  _redesenhar(refIdx, substIdx);
  if (Math.abs(it.gramas - antes) > 0.5) showToast('Convertido para ' + API.nutri.rotuloQtd(it) + ' (' + it.gramas + ' g, eram ' + antes + ' g). As calorias foram recalculadas.');
}
// Passa para unidade todos os itens em gramas cujo peso é múltiplo exato de meia unidade; os demais ficam como estão.
function converterTodosParaUnidade() {
  let n = 0;
  const tenta = (it) => {
    if (!it || (it.medida_id && it.medida_id !== 'g') || !(it.gramas > 0)) return;
    const f = AlimentosDB.resolver(it), u = f ? AlimentosDB.getUnidadePadrao(f.id) : null;
    if (!u || !(u.medida_g > 0)) return;
    const q = it.gramas / u.medida_g;
    if (Math.abs(q * 2 - Math.round(q * 2)) > 0.02 || q < 0.5) return;
    if (_usarUnidadePadrao(it)) { _recalcItem(it); n++; }
  };
  _formRefeicoes.forEach(r => {
    (r.itens_estruturados || []).forEach(it => { tenta(it); (it.substitutos || []).forEach(tenta); });
    (r.refeicoes_substitutas || []).forEach(sb => (sb.itens_estruturados || []).forEach(tenta));
  });
  document.getElementById('refeicoes-editor').innerHTML = renderRefeicaoEditors();
  recalcTotaisDiarios();
  showToast(n ? n + (n === 1 ? ' item passou' : ' itens passaram') + ' para unidade, sem mudar calorias nem macros.' : 'Nenhum item em gramas fecha em meia unidade exata. Use o link "usar unidades" em cada item.');
}

function itemMedida(refIdx, substIdx, itemIdx, medidaId) {
  const it = (_lista(refIdx, substIdx) || [])[itemIdx]; if (!it) return;
  const antes = it.gramas || 0;
  if (medidaId === '__nova__') {
    if (!_perguntarMedida(it)) { _redesenhar(refIdx, substIdx); return; }
    delete it._revisar; _recalcItem(it); _redesenhar(refIdx, substIdx); return;
  }
  if (medidaId === 'g') {
    it.medida_id = 'g'; it.medida_nome = 'gramas'; it.medida_g = 1; it.quantidade = antes > 0 ? Math.round(antes) : 100;
  } else {
    const m = _medidasDoItem(it).find(x => x.id === medidaId); if (!m) return;
    it.medida_id = m.id; it.medida_nome = m.nome; it.medida_g = m.gramas;
    const q = antes / m.gramas;
    it.quantidade = (q > 0 && Math.abs(q * 2 - Math.round(q * 2)) < 0.01) ? q : 1;
  }
  delete it._revisar;
  _recalcItem(it);
  _redesenhar(refIdx, substIdx);
}
function itemRemover(refIdx, substIdx, itemIdx) {
  const lista = _lista(refIdx, substIdx); if (!lista) return;
  lista.splice(itemIdx, 1);
  if (_openSubstPanel && _openSubstPanel.refIdx === refIdx && (substIdx < 0 && _openSubstPanel.itemIdx >= itemIdx)) _openSubstPanel = null;
  _redesenhar(refIdx, substIdx);
}
function itemRevisar(refIdx, substIdx, itemIdx) {
  const it = (_lista(refIdx, substIdx) || [])[itemIdx]; if (!it || !it._revisar) return;
  if (it._revisar > 0) {
    if (!confirm('A medida salva neste item vale 1 ' + it.medida_nome.toLowerCase() + ' = ' + it.medida_g + ' g, e a tabela de medidas atual diz ' + it._revisar + ' g.\n\nAtualizar para ' + it._revisar + ' g? As calorias e macros do item mudam junto.')) { delete it._revisar; _redesenhar(refIdx, substIdx); return; }
    it.medida_g = it._revisar;
  } else {
    if (!confirm('"' + it.medida_nome + '" é uma medida genérica e o peso dela muda de alimento para alimento (' + it.medida_g + ' g neste item).\n\nConverter o item para gramas, mantendo ' + it.gramas + ' g? As calorias e macros não mudam.')) { delete it._revisar; _redesenhar(refIdx, substIdx); return; }
    it.medida_id = 'g'; it.medida_nome = 'gramas'; it.medida_g = 1; it.quantidade = Math.round(it.gramas);
  }
  delete it._revisar;
  _recalcItem(it);
  _redesenhar(refIdx, substIdx);
}

// ── Tabela nutricional (rótulo) ──
const _ROTULO = [
  ['Valor energético', 'energia_kcal', 'kcal', 0], ['Carboidratos', 'carboidrato_g', 'g', 0], ['Proteínas', 'proteina_g', 'g', 0], ['Gorduras totais', 'lipidio_g', 'g', 0],
  ['Gorduras saturadas', 'saturados_g', 'g', 1], ['Gorduras monoinsaturadas', 'monoinsaturados_g', 'g', 1], ['Gorduras poliinsaturadas', 'poliinsaturados_g', 'g', 1],
  ['Colesterol', 'colesterol_mg', 'mg', 0], ['Fibra alimentar', 'fibra_g', 'g', 0], ['Sódio', 'sodio_mg', 'mg', 0], ['Cálcio', 'calcio_mg', 'mg', 0],
  ['Ferro', 'ferro_mg', 'mg', 0], ['Potássio', 'potassio_mg', 'mg', 0], ['Magnésio', 'magnesio_mg', 'mg', 0], ['Fósforo', 'fosforo_mg', 'mg', 0],
  ['Zinco', 'zinco_mg', 'mg', 0], ['Vitamina C', 'vitamina_c_mg', 'mg', 0], ['Tiamina (B1)', 'tiamina_mg', 'mg', 0], ['Riboflavina (B2)', 'riboflavina_mg', 'mg', 0], ['Niacina (B3)', 'niacina_mg', 'mg', 0],
];
function _abrirRotulo(titulo, subtitulo, por100, gramas) {
  const fmt = v => (Math.round((Number(v) || 0) * 100) / 100).toString().replace('.', ',');
  const porPorcao = AlimentosDB.escalar(por100, gramas);
  const linhas = _ROTULO.map(r => `<tr style="border-top:1px solid var(--border);"><td style="padding:5px 0 5px ${r[3] ? 16 : 0}px;${r[3] ? 'color:var(--text-muted);' : ''}">${r[0]}</td><td style="text-align:right;">${fmt(por100[r[1]])} ${r[2]}</td><td style="text-align:right;font-weight:700;">${fmt(porPorcao[r[1]])} ${r[2]}</td></tr>`).join('');
  const antigo = document.getElementById('nt-rotulo'); if (antigo) antigo.remove();
  const d = document.createElement('div');
  d.id = 'nt-rotulo';
  d.style.cssText = 'position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;';
  d.onclick = e => { if (e.target === d) d.remove(); };
  d.innerHTML = `<div style="background:var(--bg2,#1a1a1a);color:var(--text);border:1px solid var(--border);border-radius:12px;width:100%;max-width:460px;max-height:86vh;overflow:auto;padding:16px 18px;">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:4px;"><div style="font-size:15px;font-weight:800;line-height:1.3;">${esc(titulo)}</div><button class="modal-close" onclick="document.getElementById('nt-rotulo').remove()" style="flex-shrink:0;">×</button></div>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">${esc(subtitulo)}</div>
    <table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr style="color:var(--text-muted);font-size:11px;text-transform:uppercase;"><th style="text-align:left;padding-bottom:4px;">Informação nutricional</th><th style="text-align:right;">100 g</th><th style="text-align:right;">Porção (${fmt(gramas)} g)</th></tr></thead><tbody>${linhas}</tbody></table>
    <div style="font-size:11px;color:var(--text-muted);margin-top:10px;">Valores da TACO ou do que foi cadastrado em Meus Alimentos. Item sem valor aparece como 0.</div></div>`;
  document.body.appendChild(d);
}
function verTabelaItem(refIdx, substIdx, itemIdx, si) {
  // substIdx -2 = substituto de um alimento (si = posição do substituto)
  const it = substIdx === -2 ? ((_itemOrig(refIdx, itemIdx) || {}).substitutos || [])[si] : (_lista(refIdx, substIdx) || [])[itemIdx];
  if (!it) return;
  if (!it.por100) return showToast('Este item não tem tabela nutricional guardada.', 'error');
  _abrirRotulo(it.nome, 'Porção do plano: ' + API.nutri.rotuloQtd(it) + (it.medida_id !== 'g' ? ' (' + it.gramas + ' g)' : ''), it.por100, it.gramas || 100);
}
function verTabelaAlimento(foodId) {
  const f = AlimentosDB.getById(foodId); if (!f) return;
  const u = AlimentosDB.getUnidadePadrao(foodId);
  _abrirRotulo(f.description, u ? 'Porção sugerida: ' + u.quantidade + ' ' + API.nutri.pluralMedida(u.medida_nome, u.quantidade) + ' (' + r1(u.quantidade * u.medida_g) + ' g)' : 'Porção de 100 g', AlimentosDB.nutrientesPor100(f), u ? u.quantidade * u.medida_g : 100);
}

// ── Refeições substitutas (opção completa alternativa) ──

  const r = _formRefeicoes[refIdx], s = (r.refeicoes_substitutas || [])[substIdx];

// ── Meal Collapse/Expand ──

function toggleMealCollapse(idx) {
  if (_collapsedMeals.has(idx)) {
    _collapsedMeals.delete(idx);
  } else {
    _collapsedMeals.add(idx);
  }
  document.getElementById('refeicoes-editor').innerHTML = renderRefeicaoEditors();
}

// ── Move meals up/down ──

function moveMeal(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= _formRefeicoes.length) return;
  const temp = _formRefeicoes[idx];
  _formRefeicoes[idx] = _formRefeicoes[newIdx];
  _formRefeicoes[newIdx] = temp;
  // Update collapsed set
  const newCollapsed = new Set();
  for (const c of _collapsedMeals) {
    if (c === idx) newCollapsed.add(newIdx);
    else if (c === newIdx) newCollapsed.add(idx);
    else newCollapsed.add(c);
  }
  _collapsedMeals = newCollapsed;
  document.getElementById('refeicoes-editor').innerHTML = renderRefeicaoEditors();
  recalcTotaisDiarios();
}

// ── Duplicate meal ──

function duplicarRefeicao(idx) {
  const copy = JSON.parse(JSON.stringify(_formRefeicoes[idx]));
  copy.nome = (copy.nome || '') + ' (cópia)';
  _formRefeicoes.splice(idx + 1, 0, copy);
  document.getElementById('refeicoes-editor').innerHTML = renderRefeicaoEditors();
  recalcTotaisDiarios();
  showToast('Refeição duplicada');
}

// ── Drag-and-Drop: Meals ──

let _dragMealIdx = null;

function onMealDragStart(e, idx) {
  // Only start drag if from handle
  if (!e.target.closest('.drag-handle') && e.target.className !== 'ref-editor') {
    e.preventDefault();
    return;
  }
  _dragMealIdx = idx;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', 'meal:' + idx);
  setTimeout(() => {
    const el = document.getElementById('ref-editor-' + idx);
    if (el) el.classList.add('dragging');
  }, 0);
}

function onMealDragEnd(e, idx) {
  _dragMealIdx = null;
  document.querySelectorAll('.ref-editor').forEach(el => {
    el.classList.remove('dragging', 'drag-over');
  });
}

function onMealDragOver(e, idx) {
  if (_dragMealIdx === null || _dragMealIdx === idx) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.getElementById('ref-editor-' + idx)?.classList.add('drag-over');
}

function onMealDragLeave(e, idx) {
  document.getElementById('ref-editor-' + idx)?.classList.remove('drag-over');
}

function onMealDrop(e, targetIdx) {
  e.preventDefault();
  document.querySelectorAll('.ref-editor').forEach(el => el.classList.remove('drag-over'));
  if (_dragMealIdx === null || _dragMealIdx === targetIdx) return;

  const moved = _formRefeicoes.splice(_dragMealIdx, 1)[0];
  _formRefeicoes.splice(targetIdx, 0, moved);
  _dragMealIdx = null;
  _collapsedMeals = new Set(); // Reset collapse state on reorder
  document.getElementById('refeicoes-editor').innerHTML = renderRefeicaoEditors();
  recalcTotaisDiarios();
}

  e.preventDefault();
  e.stopPropagation();
  document.querySelectorAll('.meal-item-row').forEach(el => el.classList.remove('drag-over-item'));
  if (!_dragItem) return;

  const srcRef = _dragItem.refIdx;
  const srcItem = _dragItem.itemIdx;
  _dragItem = null;

  if (srcRef === targetRefIdx && srcItem === targetItemIdx) return;

  const item = _formRefeicoes[srcRef].itens_estruturados.splice(srcItem, 1)[0];

  // Adjust target index if same meal and target is after source
  let adjustedTarget = targetItemIdx;
  if (srcRef === targetRefIdx && srcItem < targetItemIdx) {
    adjustedTarget--;
  }

  _formRefeicoes[targetRefIdx].itens_estruturados.splice(adjustedTarget, 0, item);

  // Re-render affected meals
  document.getElementById('ref-itens-' + srcRef).innerHTML = renderItensRefeicao(srcRef);
  if (srcRef !== targetRefIdx) {
    document.getElementById('ref-itens-' + targetRefIdx).innerHTML = renderItensRefeicao(targetRefIdx);
  }
  recalcTotaisDiarios();
}

// ── Busca e inclusão de alimentos ──
function _idsBusca(refIdx, substIdx) {
  const suf = (substIdx != null && substIdx >= 0) ? refIdx + '-s' + substIdx : String(refIdx);
  return { busca: 'food-search-' + suf, res: 'food-results-' + suf };
}

function buscarAlimento(input, refIdx, substIdx) {
  clearTimeout(_searchTimeout);
  const termo = input.value.trim();
  const si = (substIdx == null) ? -1 : substIdx;
  const resultsEl = document.getElementById(_idsBusca(refIdx, si).res);
  if (!resultsEl) return;

  if (termo.length < 2) { resultsEl.classList.remove('show'); return; }

  _searchTimeout = setTimeout(async () => {
    if (!AlimentosDB.isLoaded()) {
      resultsEl.innerHTML = `<div class="food-result-item" style="color:var(--text-muted);">Carregando banco de alimentos...</div>`;
      resultsEl.classList.add('show');
      await AlimentosDB.load();
    }
    _ultimoTermo = termo;
    const foods = AlimentosDB.buscar(termo, 15);
    // Não achou? Em vez de um beco sem saída, oferece cadastrar na hora, sem abandonar a refeição.
    const cadastrarNovo = `<div class="food-result-item" style="color:var(--green);font-weight:700;" onclick="_iniciarCadastroRapido(${refIdx}, ${si})">+ Cadastrar "${esc(termo)}" como novo alimento</div>`;
    // A TACO não tem produto de marca (whey, barrinha, suplemento): busca ao vivo no Open Food Facts só quando o profissional pedir.
    const buscarMarca = `<div class="food-result-item" style="color:var(--text-muted);font-style:italic;" onclick="_buscarOnlineAlimento(${refIdx}, ${si})">🌐 Buscar em produtos de marca (Open Food Facts)</div>`;
    if (foods.length === 0) {
      resultsEl.innerHTML = `<div class="food-result-item" style="color:var(--text-muted);">Nenhum alimento encontrado</div>` + cadastrarNovo + buscarMarca;
    } else {
      resultsEl.innerHTML = foods.map(f => _resultadoBuscaHtml(f, `addAlimento(${refIdx}, ${f.id}, ${si})`)).join('') + cadastrarNovo + buscarMarca;
    }
    resultsEl.classList.add('show');
  }, 200);
}

// ── Busca online (Open Food Facts) sob demanda ─────────────────────────────
async function _buscarOnlineAlimento(refIdx, substIdx) {
  const resultsEl = document.getElementById(_idsBusca(refIdx, substIdx).res);
  if (!resultsEl) return;
  const termo = _ultimoTermo;
  resultsEl.innerHTML = `<div class="food-result-item" style="color:var(--text-muted);">Buscando em produtos de marca...</div>`;
  resultsEl.classList.add('show');
  const online = await AlimentosDB.buscarOnline(termo, 8);
  if (!online.length) {
    resultsEl.innerHTML = `<div class="food-result-item" style="color:var(--text-muted);">Nada encontrado em produtos de marca. Tente "+ Cadastrar" com os valores do rótulo.</div>
      <div class="food-result-item" style="color:var(--green);font-weight:700;" onclick="_iniciarCadastroRapido(${refIdx}, ${substIdx})">+ Cadastrar "${esc(termo)}" como novo alimento</div>`;
    return;
  }
  resultsEl.innerHTML = online.map((f, i) => `
    <div class="food-result-item" onclick="_adicionarAlimentoOnline(${refIdx}, ${substIdx}, ${i})">
      <div>
        <div>${esc(f.description)}<span class="custom-food-badge" style="background:rgba(96,165,250,.15);color:#60a5fa;">MARCA</span></div>
        <div class="food-cat">${esc(f.category)}</div>
      </div>
      <div class="food-kcal">${Math.round(f.energy_kcal)} kcal/100g</div>
    </div>
  `).join('');
  resultsEl.classList.add('show');
  window._offResultadosTemp = online;
}

// O produto do Open Food Facts vira um "Meu alimento" normal ao ser escolhido: a partir daí funciona como qualquer outro.
async function _adicionarAlimentoOnline(refIdx, substIdx, idx) {
  const item = (window._offResultadosTemp || [])[idx];
  if (!item) return;
  try {
    const novo = await AlimentosDB.addCustomFood({
      description: item.description, category: item.category, energy_kcal: item.energy_kcal, protein_g: item.protein_g,
      carbohydrate_g: item.carbohydrate_g, lipid_g: item.lipid_g, fiber_g: item.fiber_g, sodium_mg: item.sodium_mg, saturated_g: item.saturated_g,
    });
    showToast('Produto adicionado ao seu banco de alimentos!');
    addAlimento(refIdx, novo.id, substIdx);
  } catch (e) {
    showToast('Não consegui salvar no servidor: ' + e.message, 'error');
  }
}

function addAlimento(refIdx, foodId, substIdx) {
  const si = (substIdx == null) ? -1 : substIdx;
  const food = AlimentosDB.getById(foodId);
  if (!food) return;
  const lista = _lista(refIdx, si);
  if (!lista) return;
  lista.push(_novoItem(food));
  const ids = _idsBusca(refIdx, si);
  const searchInput = document.getElementById(ids.busca);
  const resultsEl = document.getElementById(ids.res);
  if (searchInput) searchInput.value = '';
  if (resultsEl) resultsEl.classList.remove('show');
  _redesenhar(refIdx, si);
}
