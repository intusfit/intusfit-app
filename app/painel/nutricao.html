async function _salvarCadastroRapido(refIdx, substIdx) {
  const k = refIdx + '-' + substIdx;
  const v = id => parseFloat(document.getElementById(id + '-' + k)?.value) || 0;
  const nome = document.getElementById('qc-nome-' + k)?.value?.trim();
  if (!nome) return showToast('Informe o nome do alimento', 'error');
  const prot = v('qc-prot'), carb = v('qc-carb'), gord = v('qc-gord');
  const kcal = v('qc-kcal') || Math.round((prot * 4 + carb * 4 + gord * 9) * 10) / 10;
  const medNome = document.getElementById('qc-medida-' + k)?.value?.trim() || '', medG = v('qc-medg');
  try {
    const novo = await AlimentosDB.addCustomFood({
      description: nome, category: 'Meus Alimentos', energy_kcal: kcal, protein_g: prot, carbohydrate_g: carb, lipid_g: gord,
      fiber_g: v('qc-fibra'), sodium_mg: v('qc-sodio'),
      medida_padrao: (medNome && medG > 0) ? medNome : 'g', porcao_padrao: (medNome && medG > 0) ? medG : 100,
    });
    showToast('Alimento cadastrado e adicionado à refeição!');
    addAlimento(refIdx, novo.id, substIdx);
  } catch (e) {
    showToast('Não consegui salvar no servidor: ' + e.message, 'error');
  }
}

// Barrinha comparando o total já montado com a meta digitada na aba "Metas &
// Cálculos" — sem isso o nutricionista tinha que decorar a meta e fazer conta
// de cabeça pra saber se 850kcal de refeições já é muito ou pouco perto de
// 2200kcal de meta.
function _barraMeta(label, atual, meta, cor, unidade) {
  if (!meta) return '';
  const pct = Math.min(100, Math.round((atual / meta) * 100));
  return `
    <div style="margin-bottom:8px;">
      <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;">
        <span style="font-weight:700;color:var(--text-muted);">${label}</span>
        <span style="font-weight:700;">${atual}${unidade} <span style="color:var(--text-muted);font-weight:400;">/ ${meta}${unidade}</span></span>
      </div>
      <div style="height:6px;border-radius:99px;background:var(--border);overflow:hidden;">
        <div style="height:100%;width:${pct}%;background:${cor};border-radius:99px;"></div>
      </div>
    </div>
  `;
}

function recalcTotaisDiarios() {
  const el = document.getElementById('totais-diarios');
  if (!el) return;

  const allItens = _formRefeicoes.flatMap(r => r.itens_estruturados || []);
  const totals = calcTotaisRefeicao(allItens);

  if (totals.kcal === 0) { el.innerHTML = ''; return; }

  const metaKcal = parseFloat(document.getElementById('nt-calorias')?.value) || 0;
  const metaProt = parseFloat(document.getElementById('nt-proteina')?.value) || 0;
  const metaCarb = parseFloat(document.getElementById('nt-carboidrato')?.value) || 0;
  const metaGord = parseFloat(document.getElementById('nt-gordura')?.value) || 0;
  const temMeta = metaKcal || metaProt || metaCarb || metaGord;

  el.innerHTML = `
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;">
      <div style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;">Totais do dia ${temMeta ? '× meta' : '(calculados)'}</div>
      ${temMeta ? `
        ${_barraMeta('Calorias', totals.kcal, metaKcal, '#facc15', '')}
        ${_barraMeta('Proteína', totals.prot, metaProt, '#60a5fa', 'g')}
        ${_barraMeta('Carboidrato', totals.carb, metaCarb, '#7FFF00', 'g')}
        ${_barraMeta('Gordura', totals.gord, metaGord, '#f87171', 'g')}
      ` : `
        <div class="macros-bar">
          <div class="macro-chip cal"><span class="macro-chip-value">${totals.kcal}</span><span class="macro-chip-label">kcal</span></div>
          <div class="macro-chip prot"><span class="macro-chip-value">${totals.prot}g</span><span class="macro-chip-label">Prot</span></div>
          <div class="macro-chip carb"><span class="macro-chip-value">${totals.carb}g</span><span class="macro-chip-label">Carb</span></div>
          <div class="macro-chip gord"><span class="macro-chip-value">${totals.gord}g</span><span class="macro-chip-label">Gord</span></div>
        </div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:6px;">Defina metas em "Metas &amp; Cálculos" pra ver o comparativo aqui.</div>
      `}
      ${renderMacroDistBar(totals.prot, totals.carb, totals.gord)}
      <details style="margin-top:8px;">
        <summary style="cursor:pointer;font-size:11px;font-weight:700;color:var(--text-muted);">▸ Micronutrientes</summary>
        ${renderMicroPanel(totals, '')}
      </details>
    </div>
  `;
}

// ── GEB/GET Calculator (expanded) ──

function preencherDadosAtleta() {
  const idAtleta = document.getElementById('nt-atleta')?.value;
  if (!idAtleta) return showToast('Selecione um aluno primeiro', 'error');
  const at = getAtletaDados(idAtleta);
  if (!at) return;

  if (at.peso) document.getElementById('calc-peso').value = at.peso;
  if (at.altura) document.getElementById('calc-altura').value = at.altura;
  if (at.data_nascimento) {
    const age = Math.floor((Date.now() - new Date(at.data_nascimento).getTime()) / 31557600000);
    document.getElementById('calc-idade').value = age;
  }
  if (at.genero) document.getElementById('calc-sexo').value = at.genero === 'F' ? 'F' : 'M';
  if (at.percentual_gordura) document.getElementById('calc-gordura-pct').value = at.percentual_gordura;
  calcGEBGET();
}

function calcGEBGET() {
  const peso = parseFloat(document.getElementById('calc-peso')?.value) || 0;
  const altura = parseFloat(document.getElementById('calc-altura')?.value) || 0;
  const idade = parseInt(document.getElementById('calc-idade')?.value) || 0;
  const sexo = document.getElementById('calc-sexo')?.value || 'M';
  const fator = parseFloat(document.getElementById('calc-atividade')?.value) || 1.2;
  const formula = document.getElementById('calc-formula')?.value || 'harris-benedict';
  const populacao = document.getElementById('calc-populacao')?.value || 'adulto';
  const gorduraPct = parseFloat(document.getElementById('calc-gordura-pct')?.value) || 0;

  const el = document.getElementById('calc-resultado');
  if (!el) return;
  if (!peso) { el.innerHTML = ''; return; }

  let geb = 0;
  let formulaLabel = '';

  switch (formula) {
    case 'harris-benedict':
      if (!altura || !idade) { el.innerHTML = ''; return; }
      geb = AlimentosDB.calcGEB(peso, altura, idade, sexo);
      formulaLabel = 'Harris-Benedict';
      break;
    case 'mifflin':
      if (!altura || !idade) { el.innerHTML = ''; return; }
      geb = AlimentosDB.calcGEB_MifflinStJeor ? AlimentosDB.calcGEB_MifflinStJeor(peso, altura, idade, sexo) : 0;
      formulaLabel = 'Mifflin-St Jeor';
      break;
    case 'katch-mcardle':
      if (!gorduraPct) { el.innerHTML = '<div style="font-size:12px;color:var(--text-muted);margin-top:8px;">Informe o % de gordura para Katch-McArdle</div>'; return; }
      geb = AlimentosDB.calcGEB_KatchMcArdle ? AlimentosDB.calcGEB_KatchMcArdle(peso, gorduraPct) : 0;
      formulaLabel = 'Katch-McArdle';
      break;
    case 'fao':
      if (!idade) { el.innerHTML = ''; return; }
      geb = AlimentosDB.calcGEB_FAO ? AlimentosDB.calcGEB_FAO(peso, idade, sexo) : 0;
      formulaLabel = 'FAO/OMS';
      break;
    case 'schofield':
      if (!idade) { el.innerHTML = ''; return; }
      geb = AlimentosDB.calcGEB_Schofield ? AlimentosDB.calcGEB_Schofield(peso, idade, sexo) : 0;
      formulaLabel = 'Schofield';
      break;
  }

  if (!geb) { el.innerHTML = ''; return; }

  // Population adjustment
  let ajuste = 0;
  if (AlimentosDB.POPULACAO_AJUSTES && AlimentosDB.POPULACAO_AJUSTES[populacao]) {
    ajuste = AlimentosDB.POPULACAO_AJUSTES[populacao];
  }

  const get = Math.round((geb + ajuste) * fator);
  const gebFinal = Math.round(geb);

  // IMC calculation
  let imcHtml = '';
  if (altura) {
    const imcResult = AlimentosDB.calcIMC ? AlimentosDB.calcIMC(peso, altura) : null;
    if (imcResult) {
      imcHtml = `<div class="calc-info-item"><div class="label">IMC</div><div class="value">${imcResult.imc} — ${esc(imcResult.classificacao)}</div></div>`;
    }
  }

  // Water intake
  let waterHtml = '';
  if (AlimentosDB.calcWaterIntake) {
    const nivelAtividade = fator >= 1.7 ? 'alto' : fator >= 1.4 ? 'moderado' : 'baixo';
    const water = AlimentosDB.calcWaterIntake(peso, nivelAtividade);
    if (water) {
      waterHtml = `<div class="calc-info-item"><div class="label">Água recomendada</div><div class="value">${water} L/dia</div></div>`;
    }
  }

  // Protein target
  let protHtml = '';
  if (AlimentosDB.calcProteinTarget) {
    const objetivo = document.getElementById('sugestao-objetivo')?.value || 'manutencao';
    const protTarget = AlimentosDB.calcProteinTarget(peso, objetivo);
    if (protTarget) {
      protHtml = `<div class="calc-info-item"><div class="label">Proteína recomendada</div><div class="value">${protTarget.min}g — ${protTarget.max}g/dia</div></div>`;
    }
  }

  el.innerHTML = `
    <div class="calc-result">
      ${gebFinal} <small>kcal/dia (GEB — ${formulaLabel})</small> → ${get} <small>kcal/dia (GET)</small>
    </div>
    ${ajuste ? `<div style="font-size:11px;color:var(--text-muted);margin-top:4px;">Ajuste populacional (${populacao}): +${ajuste} kcal</div>` : ''}
    <div class="calc-info-grid">
      ${imcHtml}
      ${waterHtml}
      ${protHtml}
      <div class="calc-info-item"><div class="label">GET final</div><div class="value">${get} kcal/dia</div></div>
    </div>
    <div style="font-size:11px;color:var(--text-muted);margin-top:10px;">
      <button class="btn btn-sm" onclick="document.getElementById('nt-calorias').value=${get};updateMetasDist();" style="font-size:11px;padding:3px 8px;">Usar ${get} kcal como meta →</button>
    </div>
  `;
}

function calcGET2() {
  const peso = parseFloat(document.getElementById('calc2-peso')?.value) || 0;
  const altura = parseFloat(document.getElementById('calc2-altura')?.value) || 0;
  const idade = parseInt(document.getElementById('calc2-idade')?.value) || 0;
  const sexo = document.getElementById('calc2-sexo')?.value || 'M';
  const fator = parseFloat(document.getElementById('calc2-atividade')?.value) || 1.2;
  const formula = document.getElementById('calc2-formula')?.value || 'harris-benedict';
  const populacao = document.getElementById('calc2-populacao')?.value || 'adulto';
  const gorduraPct = parseFloat(document.getElementById('calc2-gordura-pct')?.value) || 0;

  if (!peso) return showToast('Preencha pelo menos o peso', 'error');

  let geb = 0;
  switch (formula) {
    case 'harris-benedict':
      if (!altura || !idade) return showToast('Harris-Benedict requer peso, altura e idade', 'error');
      geb = AlimentosDB.calcGEB(peso, altura, idade, sexo);
      break;
    case 'mifflin':
      if (!altura || !idade) return showToast('Mifflin requer peso, altura e idade', 'error');
      geb = AlimentosDB.calcGEB_MifflinStJeor ? AlimentosDB.calcGEB_MifflinStJeor(peso, altura, idade, sexo) : 0;
      break;
    case 'katch-mcardle':
      if (!gorduraPct) return showToast('Katch-McArdle requer % de gordura', 'error');
      geb = AlimentosDB.calcGEB_KatchMcArdle ? AlimentosDB.calcGEB_KatchMcArdle(peso, gorduraPct) : 0;
      break;
    case 'fao':
      if (!idade) return showToast('FAO/OMS requer peso e idade', 'error');
      geb = AlimentosDB.calcGEB_FAO ? AlimentosDB.calcGEB_FAO(peso, idade, sexo) : 0;
      break;
    case 'schofield':
      if (!idade) return showToast('Schofield requer peso e idade', 'error');
      geb = AlimentosDB.calcGEB_Schofield ? AlimentosDB.calcGEB_Schofield(peso, idade, sexo) : 0;
      break;
  }

  if (!geb) return showToast('Não foi possível calcular com esses dados', 'error');

  let ajuste = 0;
  if (AlimentosDB.POPULACAO_AJUSTES && AlimentosDB.POPULACAO_AJUSTES[populacao]) {
    ajuste = AlimentosDB.POPULACAO_AJUSTES[populacao];
  }

  const get = Math.round((geb + ajuste) * fator);
  const gebFinal = Math.round(geb);

  // IMC
  let imcLine = '';
  if (altura && AlimentosDB.calcIMC) {
    const imcResult = AlimentosDB.calcIMC(peso, altura);
    if (imcResult) imcLine = `IMC: <strong>${imcResult.imc}</strong> (${esc(imcResult.classificacao)}) · `;
  }

  // Water
  let waterLine = '';
  if (AlimentosDB.calcWaterIntake) {
    const nivelAtividade = fator >= 1.7 ? 'alto' : fator >= 1.4 ? 'moderado' : 'baixo';
    const water = AlimentosDB.calcWaterIntake(peso, nivelAtividade);
    if (water) waterLine = `Água: <strong>${water} L/dia</strong> · `;
  }

  document.getElementById('calc2-resultado').innerHTML = `
    <div class="calc-result">${gebFinal} <small>kcal GEB</small> → ${get} <small>kcal GET</small></div>
    ${ajuste ? `<div style="font-size:11px;color:var(--text-muted);margin-top:4px;">Ajuste (${populacao}): +${ajuste} kcal</div>` : ''}
    <div style="font-size:12px;color:var(--text-muted);margin-top:8px;">
      ${imcLine}${waterLine}
    </div>
    <div style="font-size:12px;color:var(--text-muted);margin-top:6px;">
      Cutting leve (-15%): <strong>${Math.round(get * 0.85)} kcal</strong> ·
      Cutting (-20%): <strong>${Math.round(get * 0.8)} kcal</strong> ·
      Manutenção: <strong>${get} kcal</strong> ·
      Bulking (+15%): <strong>${Math.round(get * 1.15)} kcal</strong> ·
      Bulking agressivo (+25%): <strong>${Math.round(get * 1.25)} kcal</strong>
    </div>
  `;
}

function sugerirMacros() {
  const calInput = document.getElementById('nt-calorias');
  let kcalBase = parseFloat(calInput?.value) || 0;
  if (!kcalBase) return showToast('Defina as calorias primeiro (use a calculadora GEB/GET)', 'error');

  const objetivo = document.getElementById('sugestao-objetivo')?.value || 'manutencao';

  // Try AlimentosDB.calcMacrosByGoal first
  let prot, carb, gord, kcal;
  if (AlimentosDB.calcMacrosByGoal) {
    const result = AlimentosDB.calcMacrosByGoal(kcalBase, objetivo);
    if (result) {
      kcal = result.kcal || kcalBase;
      prot = result.proteina || result.prot || 0;
      carb = result.carboidrato || result.carb || 0;
      gord = result.gordura || result.gord || 0;
    }
  }

  // Fallback calculation
  if (!prot) {
    kcal = kcalBase;
    switch (objetivo) {
      case 'cutting_leve':
        kcal = Math.round(kcalBase * 0.85);
        prot = Math.round(kcal * 0.33 / 4);
        carb = Math.round(kcal * 0.37 / 4);
        gord = Math.round(kcal * 0.30 / 9);
        break;
      case 'cutting':
        kcal = Math.round(kcalBase * 0.80);
        prot = Math.round(kcal * 0.35 / 4);
        carb = Math.round(kcal * 0.35 / 4);
        gord = Math.round(kcal * 0.30 / 9);
        break;
      case 'cutting_agressivo':
        kcal = Math.round(kcalBase * 0.70);
        prot = Math.round(kcal * 0.40 / 4);
        carb = Math.round(kcal * 0.30 / 4);
        gord = Math.round(kcal * 0.30 / 9);
        break;
      case 'bulking':
        kcal = Math.round(kcalBase * 1.15);
        prot = Math.round(kcal * 0.25 / 4);
        carb = Math.round(kcal * 0.50 / 4);
        gord = Math.round(kcal * 0.25 / 9);
        break;
      case 'bulking_limpo':
        kcal = Math.round(kcalBase * 1.10);
        prot = Math.round(kcal * 0.30 / 4);
        carb = Math.round(kcal * 0.45 / 4);
        gord = Math.round(kcal * 0.25 / 9);
        break;
      case 'bulking_agressivo':
        kcal = Math.round(kcalBase * 1.25);
        prot = Math.round(kcal * 0.22 / 4);
        carb = Math.round(kcal * 0.53 / 4);
        gord = Math.round(kcal * 0.25 / 9);
        break;
      case 'endurance':
        prot = Math.round(kcal * 0.20 / 4);
        carb = Math.round(kcal * 0.55 / 4);
        gord = Math.round(kcal * 0.25 / 9);
        break;
      case 'cetogenica':
        prot = Math.round(kcal * 0.20 / 4);
        carb = Math.round(kcal * 0.05 / 4);
        gord = Math.round(kcal * 0.75 / 9);
        break;
      default: // manutencao
        prot = Math.round(kcal * 0.30 / 4);
        carb = Math.round(kcal * 0.45 / 4);
        gord = Math.round(kcal * 0.25 / 9);
    }
  }

  document.getElementById('sugestao-resultado').innerHTML = `
    <div style="background:var(--bg3);border-radius:8px;padding:12px;margin-top:10px;">
      <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px;">Sugestão (${objetivo}): ${kcal} kcal/dia</div>
      <div class="macros-bar">
        <div class="macro-chip prot"><span class="macro-chip-value">${prot}g</span><span class="macro-chip-label">Prot</span></div>
        <div class="macro-chip carb"><span class="macro-chip-value">${carb}g</span><span class="macro-chip-label">Carb</span></div>
        <div class="macro-chip gord"><span class="macro-chip-value">${gord}g</span><span class="macro-chip-label">Gord</span></div>
      </div>
      ${renderMacroDistBar(prot, carb, gord)}
      <button class="btn btn-sm btn-primary" style="margin-top:10px;" onclick="aplicarSugestao(${kcal},${prot},${carb},${gord})">Aplicar ao plano</button>
    </div>
  `;
}

function aplicarSugestao(kcal, prot, carb, gord) {
  document.getElementById('nt-calorias').value = kcal;
  document.getElementById('nt-proteina').value = prot;
  document.getElementById('nt-carboidrato').value = carb;

async function salvarPlano(idplano) {
  const idatleta = Number(document.getElementById('nt-atleta')?.value);
  if (!idatleta) return showToast('Selecione um aluno', 'error');

  const titulo = document.getElementById('nt-titulo')?.value || 'Plano Alimentar';
  const objetivo = document.getElementById('nt-objetivo')?.value || '';
  const dtinicio = document.getElementById('nt-dtinicio')?.value || null;
  const dtfim = document.getElementById('nt-dtfim')?.value || null;
  const ativo = document.getElementById('nt-ativo')?.value === '0' ? 0 : 1;
  const calorias = document.getElementById('nt-calorias')?.value ? parseInt(document.getElementById('nt-calorias').value) : null;
  const proteina = document.getElementById('nt-proteina')?.value ? parseFloat(document.getElementById('nt-proteina').value) : null;
  const carboidrato = document.getElementById('nt-carboidrato')?.value ? parseFloat(document.getElementById('nt-carboidrato').value) : null;
  const gordura = document.getElementById('nt-gordura')?.value ? parseFloat(document.getElementById('nt-gordura').value) : null;
  const observacao = document.getElementById('nt-obs')?.value || '';
  const comentario_inicio = document.getElementById('nt-comentario-inicio')?.value || '';
  const comentario_fim = document.getElementById('nt-comentario-fim')?.value || '';

  // Mesmo formato para os itens da refeição principal, de cada refeição substituta e de cada substituto de alimento
  // (ver _limparItem). Guarda gramas, medida caseira e a tabela nutricional do que foi prescrito.
  const limparItens = (lista) => (lista || []).map(_limparItem);

  const refeicoes = _formRefeicoes.filter(r => r.nome || (r.itens_estruturados && r.itens_estruturados.length > 0)).map(r => {
    const itensClean = limparItens(r.itens_estruturados);
    const legacyText = itensClean.map(it => `${it.nome} — ${it.quantidade}${it.medida_id === 'g' ? 'g' : ' ' + it.medida_nome}`).join('\n');
    return {
      nome: r.nome,
      horario: r.horario,
      itens: legacyText || r.itens || '',
      itens_estruturados: itensClean,
      // Refeição substituta completa (opção alternativa inteira) — ver
      // renderSubstituicoes. Só entra quem tiver alimento de verdade.
      refeicoes_substitutas: (r.refeicoes_substitutas || [])
        .filter(s => s.itens_estruturados && s.itens_estruturados.length > 0)
        .map(s => ({ nome: s.nome, itens_estruturados: limparItens(s.itens_estruturados) })),
    };
  });

  const data = { idatleta, titulo, objetivo, calorias, proteina, carboidrato, gordura, refeicoes, observacao, comentario_inicio, comentario_fim, ativo, dtinicio, dtfim };

  try {
    if (idplano > 0) {
      await API.editarPlanoNutricional(idplano, data);
      showToast('Plano atualizado!');
    } else {
      await API.criarPlanoNutricional(data);
      showToast('Plano criado!');
    }
    closeModal();
    await carregar();
  } catch (e) {
    showToast('Erro: ' + e.message, 'error');
  }
}

// Visual do seletor Ativo / Inativo do editor (mesmo desenho de Treinos).
function ntSetAtivo(v) {
  const h = document.getElementById('nt-ativo'); if (h) h.value = v ? 1 : 0;
  const on = (el, cor, fundo, ativo) => { if (!el) return; el.style.border = '1.5px solid ' + (ativo ? cor : 'var(--border)'); el.style.background = ativo ? fundo : 'transparent'; el.style.color = ativo ? cor : 'var(--text-muted)'; };
  on(document.getElementById('nt-ativo-sim'), '#22c55e', 'rgba(34,197,94,.14)', !!v);
  on(document.getElementById('nt-ativo-nao'), '#f87171', 'rgba(248,113,113,.14)', !v);
}

// Ativar ou inativar sem abrir o editor (a edição parcial só muda o campo "ativo").
async function alternarAtivoPlano(id, ev) {
  if (ev) ev.stopPropagation();
  const pl = planos.find(x => Number(x.idplano) === Number(id));
  if (!pl) return;
  const novo = planoAtivo(pl) ? 0 : 1;
  if (!novo && !confirm('Inativar este plano? O aluno deixa de ver o plano no app e ele sai da lista de Ativos. Dá para ativar de novo depois.')) return;
  try {
    await API.editarPlanoNutricional(id, { ativo: novo });
    showToast(novo ? 'Plano ativado' : 'Plano inativado');
    closeModal();
    await carregar();
  } catch (e) {
    showToast('Erro: ' + e.message, 'error');
  }
}

async function excluirPlano(id) {
  if (!confirm('Excluir este plano nutricional? Essa ação não pode ser desfeita.')) return;
  try {
    await API.excluirPlanoNutricional(id);
    showToast('Plano excluído');
    closeModal();
    await carregar();
  } catch (e) {
    showToast('Erro: ' + e.message, 'error');
  }
}

    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="abrirMeusAlimentos()">← Voltar</button>
      <button class="btn btn-primary" onclick="salvarAlimentoCustom(${editId || 0})">${isEdit ? 'Salvar' : 'Cadastrar'}</button>
    </div>
  `, 'wide');
}

function salvarAlimentoCustom(editId) {
  const nome = document.getElementById('cf-nome')?.value?.trim();
  if (!nome) return showToast('Informe o nome do alimento', 'error');

  const dados = {
    description: nome,
    category: document.getElementById('cf-categoria')?.value?.trim() || 'Meus Alimentos',
    energy_kcal: parseFloat(document.getElementById('cf-kcal')?.value) || 0,
    protein_g: parseFloat(document.getElementById('cf-prot')?.value) || 0,
    carbohydrate_g: parseFloat(document.getElementById('cf-carb')?.value) || 0,
    lipid_g: parseFloat(document.getElementById('cf-gord')?.value) || 0,
    fiber_g: parseFloat(document.getElementById('cf-fibra')?.value) || 0,
    sodium_mg: parseFloat(document.getElementById('cf-sodio')?.value) || 0,
    calcium_mg: parseFloat(document.getElementById('cf-calcio')?.value) || 0,
    iron_mg: parseFloat(document.getElementById('cf-ferro')?.value) || 0,
    potassium_mg: parseFloat(document.getElementById('cf-potassio')?.value) || 0,
    magnesium_mg: parseFloat(document.getElementById('cf-magnesio')?.value) || 0,
    phosphorus_mg: parseFloat(document.getElementById('cf-fosforo')?.value) || 0,
    zinc_mg: parseFloat(document.getElementById('cf-zinco')?.value) || 0,
    vitaminC_mg: parseFloat(document.getElementById('cf-vitc')?.value) || 0,
    cholesterol_mg: parseFloat(document.getElementById('cf-colesterol')?.value) || 0,
    saturated_g: parseFloat(document.getElementById('cf-saturados')?.value) || 0,
    monounsaturated_g: parseFloat(document.getElementById('cf-mono')?.value) || 0,
    polyunsaturated_g: parseFloat(document.getElementById('cf-poli')?.value) || 0,
    thiamine_mg: parseFloat(document.getElementById('cf-tiamina')?.value) || 0,
    riboflavin_mg: parseFloat(document.getElementById('cf-riboflavina')?.value) || 0,
    niacin_mg: parseFloat(document.getElementById('cf-niacina')?.value) || 0,
    // Medida caseira: só vale se tiver nome E peso; senão o alimento fica só em gramas.
    porcao_padrao: ((document.getElementById('cf-medida')?.value?.trim()) && parseFloat(document.getElementById('cf-porcao')?.value) > 0) ? parseFloat(document.getElementById('cf-porcao').value) : 100,
    medida_padrao: ((document.getElementById('cf-medida')?.value?.trim()) && parseFloat(document.getElementById('cf-porcao')?.value) > 0) ? document.getElementById('cf-medida').value.trim() : 'g',
  };

  (async () => {
    try {
      if (editId) {
        await AlimentosDB.editCustomFood(editId, dados);
        showToast('Alimento atualizado!');
      } else {
        await AlimentosDB.addCustomFood(dados);
        showToast('Alimento cadastrado!');
      }
      abrirMeusAlimentos();
    } catch (e) {
      showToast('Não consegui salvar no servidor: ' + e.message, 'error');
    }
  })();
}

async function excluirAlimentoCustom(id) {
  if (!confirm('Excluir este alimento personalizado?')) return;
  try {
    await AlimentosDB.deleteCustomFood(id);
    showToast('Alimento excluído');
    abrirMeusAlimentos();
  } catch (e) {
    showToast('Não consegui excluir no servidor: ' + e.message, 'error');
  }
}

// ═══════════════ DASHBOARD DA NUTRI ═══════════════
// Aderência, alertas e lista vêm de API.nutri (api.js): a mesma regra que o aluno vê no app.
async function carregarPainel() {
  if (painelCarregando) return;
  painelCarregando = true;
  try { painel = await API.nutriPainel(); painelErro = false; } catch (e) { painelErro = true; }
  painelCarregando = false;
  if (aba === 'dashboard') render();
}

function alunosPainel() {
  if (!painel) return [];
  const regsPor = {}, pesosPor = {};
  (painel.registros || []).forEach(r => { (regsPor[r.idatleta] = regsPor[r.idatleta] || []).push(r); });
  (painel.pesos || []).forEach(p => { (pesosPor[p.idatleta] = pesosPor[p.idatleta] || []).push({ peso: p.peso, dtavaliacao: p.dtavaliacao }); });
  return (painel.planos || []).map(pl => {
    const regs = regsPor[pl.idatleta] || [];
    const ad = API.nutri.aderencia(pl, regs);
    const al = API.nutri.alertas(pl, regs, pesosPor[pl.idatleta] || []);
    const ultimo = regs.length ? regs.map(r => String(r.data).slice(0, 10)).sort().pop() : null;
    return { pl, nome: (painel.atletas || {})[pl.idatleta] || ('Aluno #' + pl.idatleta), regs, ad, al, ultimo, nAlto: al.filter(a => a.nivel === 'alto').length };
  });
}
function corAderencia(m) { return m == null ? 'var(--bg3)' : (m >= 0.8 ? '#22c55e' : (m >= 0.5 ? '#f59e0b' : '#ef4444')); }
function quandoReg(d) {
  if (!d) return 'nunca';
  const n = Math.round((new Date(API.nutri.hojeIso() + 'T12:00:00') - new Date(d + 'T12:00:00')) / 86400000);
  return n <= 0 ? 'hoje' : (n === 1 ? 'ontem' : 'há ' + n + ' dias');
}

function dashboardHtml() {
  if (painelCarregando && !painel) return `<div class="nt-wrap"><div class="empty-state"><p>Carregando o painel...</p></div></div>`;
  if (painelErro || !painel) return `<div class="nt-wrap"><div class="empty-state"><p>Não consegui carregar o painel agora.</p><button class="btn btn-secondary" style="margin-top:12px;" onclick="carregarPainel()">Tentar de novo</button></div></div>`;
  const todos = alunosPainel();
  const comMedia = todos.filter(x => x.ad.media != null);
  const media = comMedia.length ? comMedia.reduce((t, x) => t + x.ad.media, 0) / comMedia.length : null;
  const semReg = todos.filter(x => x.al.some(a => a.tipo === 'sem_registro')).length;
  const vence = todos.filter(x => x.al.some(a => a.tipo === 'vencendo' || a.tipo === 'vencido')).length;
  const termo = buscaPainel.trim().toLowerCase();
  let lista = todos.filter(x => !termo || x.nome.toLowerCase().includes(termo));
  if (soAlerta) lista = lista.filter(x => x.al.length);
  lista.sort((a, b) => (b.nAlto - a.nAlto) || ((a.ad.media == null ? 2 : a.ad.media) - (b.ad.media == null ? 2 : b.ad.media)) || a.nome.localeCompare(b.nome, 'pt'));
  const semPlano = (painel.sem_plano || []).map(id => ({ id, nome: (painel.atletas || {})[id] || ('Aluno #' + id) })).filter(x => !termo || x.nome.toLowerCase().includes(termo)).sort((a, b) => a.nome.localeCompare(b.nome, 'pt'));
  const linhas = lista.map(x => `<tr class="lin" onclick="abrirAluno(${x.pl.idatleta})">
    <td><b>${esc(x.nome)}</b><div style="font-size:11.5px;color:var(--text-muted);">${esc(x.pl.titulo || 'Plano')}</div></td>
    <td><span class="nt-barra"><i style="width:${x.ad.media == null ? 0 : Math.round(x.ad.media * 100)}%;background:${corAderencia(x.ad.media)};"></i></span> <span style="font-size:12px;">${x.ad.media == null ? 'sem dados' : Math.round(x.ad.media * 100) + '%'}</span></td>
    <td>${quandoReg(x.ultimo)}</td>
    <td>${x.al.length ? x.al.map(a => `<span class="nt-pill ${a.nivel}">${esc(a.texto)}</span>`).join('') : '<span style="color:var(--text-muted);font-size:12px;">Tudo certo</span>'}</td>
  </tr>`).join('');
  return `<div class="nt-wrap">
    <div class="nt-kpis">
      <div class="nt-kpi"><b>${todos.length}</b><span>alunos com plano ativo</span></div>
      <div class="nt-kpi"><b>${media == null ? '—' : Math.round(media * 100) + '%'}</b><span>aderência média (7 dias)</span></div>
      <div class="nt-kpi"><b style="color:${semReg ? '#ef4444' : 'var(--text)'};">${semReg}</b><span>sem registro há 3 dias ou mais</span></div>
      <div class="nt-kpi"><b style="color:${vence ? '#f59e0b' : 'var(--text)'};">${vence}</b><span>planos vencendo em 15 dias</span></div>
    </div>
    <div class="nt-tools">
      <input type="text" id="nt-busca" placeholder="Buscar aluno" value="${esc(buscaPainel)}" oninput="buscaPainel=this.value;renderPainelLista();"/>
      <button class="nt-chip ${soAlerta ? 'on' : ''}" onclick="soAlerta=!soAlerta;render();">${soAlerta ? '✓ ' : ''}Só com alerta</button>
      <button class="nt-chip" onclick="painel=null;carregarPainel();render();">Atualizar</button>
    </div>
    <div class="nt-tab-wrap"><table class="nt-tb"><tr><th>Aluno</th><th>Aderência 7 dias</th><th>Último registro</th><th>Alertas</th></tr>${linhas || `<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:24px;">Nenhum aluno para os filtros escolhidos.</td></tr>`}</table></div>
    <div style="font-size:11.5px;color:var(--text-muted);margin:8px 2px 18px;">A aderência conta feito como 100%, parcial como 50% e refeição sem registro como 0. Toque num aluno para ver os registros, as fotos e responder.</div>
    ${semPlano.length ? `<div style="font-weight:700;font-size:13px;margin-bottom:8px;">Sem plano ativo (${semPlano.length})</div><div>${semPlano.map(x => `<span class="nt-pill info">${esc(x.nome)}</span>`).join('')}</div>` : ''}
  </div>`;
}
// Busca digitando: redesenha só a tabela (mantém o foco no campo).
function renderPainelLista() {
  const foco = document.getElementById('nt-busca');
  const pos = foco ? foco.selectionStart : 0;
  main.innerHTML = abasHtml() + dashboardHtml();
  const n = document.getElementById('nt-busca');
  if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }
}

function abrirAluno(idatleta) {
  const x = alunosPainel().find(a => Number(a.pl.idatleta) === Number(idatleta));
  if (!x) return;
  const N = API.nutri, hoje = N.hojeIso();
  const refs = N.refeicoes(x.pl);
  const dias = []; for (let k = 13; k >= 0; k--) dias.push(N.addDias(hoje, -k));
  const ini = x.pl.dtinicio ? String(x.pl.dtinicio).slice(0, 10) : null;
  const letra = d => 'DSTQQSS'[new Date(d + 'T12:00:00').getDay()];
  const cor = st => ({ feito: ['rgba(34,197,94,.25)', '#22c55e', '✓'], parcial: ['rgba(245,158,11,.25)', '#f59e0b', '◐'], fora: ['rgba(239,68,68,.25)', '#ef4444', '✕'] }[st]);
  const grade = `<table class="nt-grid14"><tr><td style="width:auto;"></td>${dias.map(d => `<td style="color:${d === hoje ? 'var(--green)' : 'inherit'};">${letra(d)}</td>`).join('')}</tr>` +
    refs.map(r => `<tr><td style="width:auto;text-align:left;padding-right:8px;white-space:nowrap;">${esc(r.nome || 'Refeição')}</td>${dias.map(d => {
      const g = x.regs.find(q => String(q.data).slice(0, 10) === d && q.refeicao === r.chave), c = g ? cor(g.status) : null;
      return `<td style="${c ? 'background:' + c[0] + ';color:' + c[1] + ';' : 'border:1px dashed var(--border);'}${ini && d < ini ? 'opacity:.35;' : ''}" title="${d}">${c ? c[2] : ''}</td>`;
    }).join('')}</tr>`).join('') + `</table>`;
  const regs = x.regs.slice().sort((a, b) => String(b.data).localeCompare(String(a.data)) || (b.idregistro - a.idregistro)).filter(r => r.foto || r.obs || r.resposta_nutri).slice(0, 30);
  const regsHtml = regs.length ? regs.map(r => `<div class="nt-reg">
      ${r.foto ? `<img src="${esc(r.foto)}" alt="" onclick="window.open('${esc(r.foto)}','_blank')"/>` : ''}
      <div style="flex:1;min-width:0;">
        <div style="font-size:12.5px;"><b>${esc(String(r.data).slice(5, 10).split('-').reverse().join('/'))}</b> · ${esc(String(r.refeicao).split('|').slice(1).join('|') || r.refeicao)} · <span style="color:${cor(r.status)[1]};font-weight:700;">${{ feito: 'Feito', parcial: 'Parcial', fora: 'Fora do plano' }[r.status]}</span></div>
        ${r.obs ? `<div style="font-size:12px;color:var(--text-muted);margin-top:2px;">“${esc(r.obs)}”</div>` : ''}
        <div style="display:flex;gap:6px;margin-top:6px;"><input type="text" id="nt-resp-${r.idregistro}" maxlength="300" placeholder="Responder ao aluno" value="${esc(r.resposta_nutri || '')}"/><button class="btn btn-secondary" onclick="responderRegistro(${r.idregistro})">Enviar</button>${r.foto ? `<button class="btn btn-secondary" title="Remover a foto" onclick="removerFotoRegistro(${r.idregistro})">Remover foto</button>` : ''}</div>
      </div></div>`).join('') : `<div style="font-size:12.5px;color:var(--text-muted);padding:8px 0;">Nenhuma foto ou observação nos últimos 14 dias.</div>`;
  const pesos = (painel.pesos || []).filter(p => Number(p.idatleta) === Number(idatleta)).slice(-8);
  let pesoHtml = '';
  if (pesos.length >= 2) {
    const mn = Math.min(...pesos.map(p => p.peso)), mx = Math.max(...pesos.map(p => p.peso)), amp = (mx - mn) || 1;
    const pts = pesos.map((p, k) => (k / (pesos.length - 1) * 300).toFixed(1) + ',' + (4 + (1 - (p.peso - mn) / amp) * 32).toFixed(1)).join(' ');
    pesoHtml = `<div style="margin-top:14px;"><div class="modal-section-title">Peso nas avaliações</div><svg width="100%" height="44" viewBox="0 0 300 40" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#60a5fa" stroke-width="2"/></svg><div style="font-size:12px;color:var(--text-muted);">${String(pesos[0].peso).replace('.', ',')} kg → ${String(pesos[pesos.length - 1].peso).replace('.', ',')} kg</div></div>`;
  }
  const agua = (painel.agua || []).filter(a => Number(a.idatleta) === Number(idatleta));
  const aguaMedia = agua.length ? Math.round(agua.reduce((t, a) => t + a.agua_ml, 0) / agua.length) : 0;
  openModal(`
    <div class="modal-header"><div class="modal-title">${esc(x.nome)}</div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body" style="max-height:75vh;overflow-y:auto;">
      <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:10px;">${esc(x.pl.titulo || 'Plano')} · aderência 7 dias: <b style="color:var(--text);">${x.ad.media == null ? 'sem dados' : Math.round(x.ad.media * 100) + '%'}</b>${aguaMedia ? ' · água média: <b style="color:var(--text);">' + (aguaMedia / 1000).toFixed(1).replace('.', ',') + ' L</b>' : ''}</div>
      <div>${x.al.map(a => `<span class="nt-pill ${a.nivel}">${esc(a.texto)}</span>`).join('')}</div>
      <div class="modal-section-title">Últimos 14 dias</div>
      <div style="overflow-x:auto;">${grade}</div>
      <div class="modal-section-title">Fotos e observações do aluno</div>
      ${regsHtml}
      ${pesoHtml}
      <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;">
        <button class="btn btn-secondary" onclick="closeModal();aba='planos';render();verPlano(${x.pl.idplano})">Abrir plano</button>
        <a class="btn btn-secondary" href="mensagens.html" style="text-decoration:none;">Mandar mensagem</a>
        ${hasPerm('nt_editar') ? `<button class="btn btn-secondary" onclick="closeModal();aba='planos';render();abrirModalForm(${x.pl.idplano})">Editar ou renovar plano</button>` : ''}
      </div>
    </div>`, 'wide');
}

async function responderRegistro(id) {
  const campo = document.getElementById('nt-resp-' + id);
  const texto = (campo && campo.value || '').trim();
  try {
    await API.nutriResponder(id, texto);
    const r = (painel.registros || []).find(g => Number(g.idregistro) === Number(id));
    if (r) r.resposta_nutri = texto;
    showToast(texto ? 'Resposta enviada. O aluno é avisado no app.' : 'Resposta removida.', 'success');
  } catch (e) { showToast('Não consegui enviar a resposta.', 'error'); }
}
async function removerFotoRegistro(id) {
  if (!confirm('Remover esta foto? O aluno deixa de vê-la no registro.')) return;
  try {
    await apiFetch('/catalogo.php?action=nutri_registro', { method: 'POST', body: JSON.stringify({ subacao: 'remover_foto', idregistro: id }) });
    const r = (painel.registros || []).find(g => Number(g.idregistro) === Number(id));
    if (r) r.foto = null;
    const x = (painel.registros || []).find(g => Number(g.idregistro) === Number(id));
    closeModal(); if (r) abrirAluno(r.idatleta);
    showToast('Foto removida.', 'success');
  } catch (e) { showToast('Não consegui remover a foto.', 'error'); }
}

carregar();
carregarPainel();

document.addEventListener('visibilitychange', () => { if (!document.hidden) { carregar(); if (aba === 'dashboard') carregarPainel(); } });
</script>
