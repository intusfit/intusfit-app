<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>Vídeo</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}</style>
</head>
<body>
<script>
// Player do YouTube para o app das lojas. Dentro do app a página é capacitor://localhost e o YouTube recusa essa origem (erro 153: "erro de
// configuração do player"). Esta página é servida de https://intusfit.com.br: o app a coloca num <iframe> e ela embute o YouTube com uma origem
// válida. Só aceita um id de vídeo de 11 caracteres (nada de URL livre), e só embute o YouTube.
(function () {
  var q = new URLSearchParams(location.search);
  var id = q.get('v') || '';
  if (!/^[A-Za-z0-9_-]{11}$/.test(id)) return;
  var f = document.createElement('iframe');
  f.src = 'https://www.youtube.com/embed/' + id + '?rel=0&playsinline=1&origin=' + encodeURIComponent(location.origin) + (q.get('auto') === '1' ? '&autoplay=1' : '');
  f.allow = 'accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen';
  f.allowFullscreen = true;
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  document.body.appendChild(f);
})();
</script>
</body>
</html>
