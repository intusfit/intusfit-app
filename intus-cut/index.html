<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Intus Cut</title>
<link rel="icon" href="/app/painel/logo-icon-light.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500;600;800&family=Montserrat:wght@700;800&family=Poppins:wght@700;800&family=Roboto+Condensed:wght@700;800&family=Oswald:wght@600;700&family=Anton&family=Bebas+Neue&family=Archivo+Black&family=Playfair+Display:wght@700;800&family=Permanent+Marker&family=Lobster&display=swap" rel="stylesheet">
<script src="vendor/mp4-muxer.js?v=5.1.3"></script>
<style>
/* Estrutura de editor de vídeo (CapCut/Premiere): ferramentas à esquerda, prévia no centro,
   propriedades do item selecionado à direita e linha do tempo em faixas embaixo.
   No celular: prévia em cima, linha do tempo, barra de ferramentas embaixo e painéis em gaveta. */
:root{
  --chao:#0a0b09; --mesa:#121410; --painel:#181b15; --painel2:#20241c; --linha:#2b3126; --linha2:#3a4233;
  --texto:#eef1ea; --suave:#a1ab99; --fraco:#6f786a;
  --verde:#7fff00; --verde-esc:#16240b; --amarelo:#ffd60a; --vermelho:#ff6b6b; --azul:#5cc8ff;
  --f-marca:'Sora','Inter',system-ui,sans-serif; --f-ui:'Inter',system-ui,-apple-system,sans-serif; --f-tempo:'JetBrains Mono',ui-monospace,monospace;
  --alt-tl:300px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--chao);color:var(--texto);font:13.5px/1.4 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--verde);outline-offset:1px}
select,input[type=text],input[type=number],textarea{background:var(--painel2);border:1px solid var(--linha);border-radius:7px;padding:6px 9px;min-width:0}
input[type=color]{width:34px;height:28px;padding:2px;background:var(--painel2);border:1px solid var(--linha);border-radius:7px}
input[type=range]{accent-color:var(--verde);width:100%;margin:2px 0}
textarea{resize:vertical;width:100%}

.app{display:grid;height:100%;grid-template-columns:52px minmax(0,var(--larg-painel,310px)) minmax(0,1fr) minmax(0,320px);grid-template-rows:46px minmax(0,1fr) var(--alt-tl);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.app.sem-painel{--larg-painel:0px}
.app.sem-painel #painel{display:none}
header{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--linha);background:var(--mesa);min-width:0;overflow-x:auto;scrollbar-width:none}
header::-webkit-scrollbar{display:none}
.marca{font:800 17px var(--f-marca);display:flex;align-items:center;gap:7px;white-space:nowrap;margin-right:4px}
.marca i{width:18px;height:18px;display:inline-block;background:linear-gradient(135deg,var(--verde) 0 50%,transparent 50%);border:2px solid var(--verde);border-radius:3px}
.marca b{color:var(--verde)}
.esp{flex:1}
.pilula{font:600 11.5px var(--f-ui);color:var(--suave);padding:3px 9px;border:1px solid var(--linha);border-radius:999px;white-space:nowrap}
.pilula.ok{color:var(--verde);border-color:#3a5a1a}
.pilula.erro{color:var(--vermelho);border-color:#5a2a2a}
.btn{background:var(--painel2);border:1px solid var(--linha);border-radius:7px;padding:5px 10px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--linha2)}
a.btn{text-decoration:none;color:var(--texto)}
.btn.pri{background:var(--verde);color:#0a0b09;border-color:var(--verde)}
.btn.peq{padding:3px 8px;font-size:12.5px}
.btn.on{border-color:var(--verde);color:var(--verde)}
.btn.ico{padding:5px 7px}
.btn:disabled{opacity:.4;cursor:default}
.btn svg,.rail svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.rail{grid-column:1;grid-row:2;display:flex;flex-direction:column;gap:2px;padding:6px 4px;border-right:1px solid var(--linha);background:var(--mesa);overflow-y:auto}
.rail button{background:none;border:0;border-radius:8px;padding:7px 2px 5px;color:var(--suave);display:flex;flex-direction:column;align-items:center;gap:3px;font:600 9.5px var(--f-ui)}
.rail button svg{width:19px;height:19px}
.rail button[aria-selected=true]{background:var(--painel2);color:var(--verde)}
.rail button:hover{color:var(--texto)}
#painel{grid-column:2;grid-row:2;border-right:1px solid var(--linha);background:var(--mesa);display:flex;flex-direction:column;min-height:0;min-width:0}
.cab{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--linha);font:700 12px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);min-height:37px}
.rolagem{overflow:auto;min-height:0;flex:1;padding:12px;display:flex;flex-direction:column;gap:12px}
.palco{grid-column:3;grid-row:2;display:flex;flex-direction:column;min-height:0;min-width:0;background:#060706}
.visor{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;position:relative}
.tela{position:relative;height:100%;max-width:100%;aspect-ratio:var(--ar,9/16);background:#000;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--linha)}
.tela.largo{height:auto;width:100%;max-height:100%}
.tela canvas{width:100%;height:100%;display:block;position:absolute;inset:0}
#guia{touch-action:none}
.vazio-tela{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--suave)}
.faixa-ia{position:absolute;left:10px;right:10px;top:10px;z-index:2;background:rgba(20,34,10,.94);border:1px solid #4f7a24;border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.transporte{display:flex;gap:6px;align-items:center;justify-content:center;padding:6px 10px;border-top:1px solid var(--linha);background:var(--mesa);flex-wrap:wrap}
.tc{font:600 12.5px var(--f-tempo);color:var(--suave);font-variant-numeric:tabular-nums;min-width:128px;text-align:center}
#insp{grid-column:4;grid-row:2;border-left:1px solid var(--linha);background:var(--mesa);display:flex;flex-direction:column;min-height:0;min-width:0}

/* linha do tempo em faixas */
.tl{grid-column:1/-1;grid-row:3;border-top:1px solid var(--linha);background:var(--mesa);display:flex;flex-direction:column;min-height:0;position:relative}
.tl-puxa{position:absolute;top:-4px;left:0;right:0;height:8px;cursor:ns-resize;z-index:5}
.tl-barra{display:flex;align-items:center;gap:5px;padding:5px 10px;border-bottom:1px solid var(--linha);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.tl-barra::-webkit-scrollbar{display:none}
.tl-barra .sep{width:1px;height:20px;background:var(--linha);margin:0 4px;flex:none}
.tl-barra input[type=range]{width:110px;flex:none}
.tl-corpo{flex:1;display:grid;grid-template-columns:86px minmax(0,1fr);min-height:0}
.tl-rot{border-right:1px solid var(--linha);overflow:hidden;font:600 11px var(--f-ui);color:var(--suave)}
.tl-rot div{display:flex;align-items:center;padding:0 8px;border-bottom:1px solid #1a1d17;gap:6px}
.tl-rolo{overflow:auto;position:relative;min-height:0}
.tl-int{position:relative;min-height:100%}
.regua{height:22px;border-bottom:1px solid var(--linha);position:sticky;top:0;background:var(--mesa);z-index:3;cursor:pointer}
.regua span{position:absolute;top:4px;font:500 10px var(--f-tempo);color:var(--fraco);transform:translateX(3px)}
.regua i{position:absolute;bottom:0;width:1px;height:6px;background:var(--linha2)}
.faixa{position:relative;border-bottom:1px solid #1a1d17}
.faixa.video{height:54px}
.clip{position:absolute;top:4px;bottom:4px;border:1px solid;border-radius:6px;overflow:hidden;cursor:grab;touch-action:none;font:600 10.5px var(--f-ui);color:#e8f5d8}
.clip .rot{position:absolute;left:8px;right:8px;top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.clip .sub{position:absolute;left:8px;right:8px;bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.75;font-weight:500;pointer-events:none}
.clip.sel{box-shadow:0 0 0 2px var(--verde) inset}
.clip.sel::before,.clip.sel::after{content:"";position:absolute;top:0;bottom:0;width:6px;background:var(--verde)}
.clip.sel::before{left:0}.clip.sel::after{right:0}
.clip.fim{background:#2a2a33;border-color:#4a4a5a;cursor:default}
.clip.leg{background:#23281e;border-color:#353c2e;color:var(--suave);cursor:default;font-weight:500}
.cabeca{position:absolute;top:0;bottom:0;width:2px;background:var(--verde);pointer-events:none;z-index:4}
.cabeca::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top:8px solid var(--verde)}
.insere{position:absolute;top:22px;bottom:0;width:3px;margin-left:-1px;background:var(--amarelo);z-index:4;pointer-events:none}
.mais{position:absolute;top:8px;width:38px;height:38px;border-radius:9px;border:1px dashed var(--verde);background:var(--verde-esc);color:var(--verde);font:700 22px/1 var(--f-ui);display:flex;align-items:center;justify-content:center;z-index:3}
.mais:hover{background:#21380e}

/* componentes dos painéis */
.grupo{display:flex;flex-direction:column;gap:7px}
.grupo h3{margin:0;font:700 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
.cartao{background:var(--painel);border:1px solid var(--linha);border-radius:9px;padding:9px 11px;display:flex;flex-direction:column;gap:7px}
.cartao.sel{border-color:var(--verde)}
.cartao>.topo{display:flex;align-items:center;gap:8px;justify-content:space-between}
.cartao>.topo b{font:700 13px var(--f-ui)}
.grade2{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px 10px}
.linha{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.linha label,label.chk{color:var(--suave);font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.campo{display:flex;flex-direction:column;gap:3px;min-width:0}
.campo span{font-size:11.5px;color:var(--suave)}
.nota-ajuda{color:var(--fraco);font-size:12px;margin:0}
.lista{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:var(--painel);border:1px solid var(--linha);border-radius:8px;padding:6px 8px}
.item.ativo{border-color:#4f7a24;background:var(--verde-esc)}
.item .t,.t{font:500 11.5px var(--f-tempo);color:var(--suave);font-variant-numeric:tabular-nums;white-space:nowrap}
.palavras{display:flex;flex-wrap:wrap;gap:4px}
.palavras input{width:auto;min-width:3ch;padding:2px 6px;font-size:12.5px;border-radius:5px}
.palavras input.agora{border-color:var(--verde);color:var(--verde)}
.palavras input.fora{opacity:.35}
.frases{display:flex;flex-direction:column;gap:6px}
.frase{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:start;border:1px solid var(--borda,#2a2a2a);border-radius:8px;padding:5px}
.frase textarea{resize:none;overflow:hidden;min-height:30px;font-size:14px;line-height:1.35;padding:4px 6px;width:100%}
.frase .tempo,.frase .apaga{font-size:11.5px;padding:4px 7px;border-radius:6px;white-space:nowrap}
.frase.agora{border-color:var(--verde)}
.frase.fora{opacity:.45}
.frase.vazia textarea{border-style:dashed}
.fonte-ve{position:relative;width:100%;background:#000;border-radius:7px;overflow:hidden;border:1px solid var(--linha);cursor:grab;touch-action:none}
.fonte-ve canvas{width:100%;height:100%;display:block}
.fonteb{position:relative;height:20px;background:var(--painel);border-radius:5px;overflow:hidden;cursor:pointer}
.fonteb .k{position:absolute;top:0;bottom:0}
.fonteb .g{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#2a2f26 0 6px,#20241d 6px 12px)}
.fonteb .g.sel{outline:2px solid var(--amarelo);outline-offset:-2px}
.fonteb .cabeca{background:var(--amarelo)}
.fonteb .cabeca::before{display:none}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{background:var(--painel2);border:1px solid var(--linha);border-radius:999px;padding:4px 10px;font-weight:600;font-size:12.5px;color:var(--suave)}
.chips button[aria-pressed=true]{border-color:var(--verde);color:var(--verde);background:var(--verde-esc)}
.bib{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
.bib .cel{background:var(--painel);border:1px solid var(--linha);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.bib .mini{aspect-ratio:16/10;background:repeating-conic-gradient(#1f231b 0 25%,#171a14 0 50%) 0 0/14px 14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bib .mini img,.bib .mini video{max-width:100%;max-height:100%;object-fit:contain;display:block}
.bib .info{padding:5px 7px;display:flex;flex-direction:column;gap:4px}
.bib .info b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bib .acoes{display:flex;gap:3px;flex-wrap:wrap}
.hist{display:flex;flex-direction:column;gap:4px}
.hist button{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--painel);border:1px solid var(--linha);border-radius:7px;padding:6px 9px}
.hist button.atual{border-color:var(--verde);background:var(--verde-esc)}
.hist button.futuro{opacity:.5}
.prog{height:6px;background:var(--painel2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--verde);width:0;transition:width .4s linear}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.caixa{background:var(--mesa);border:1px solid var(--linha);border-radius:12px;padding:16px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.caixa h2{margin:0;font:700 17px var(--f-marca)}
.so-celular{display:none}

/* celular e janelas estreitas */
@media (max-width:1100px){ .app{grid-template-columns:52px minmax(0,var(--larg-painel,290px)) minmax(0,1fr) minmax(0,0px)} #insp{display:none} .app.insp-no-painel #insp{display:flex} }
@media (max-width:820px){
  :root{--alt-tl:190px}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:44px minmax(0,1fr) var(--alt-tl) 56px}
  .rail{grid-column:1;grid-row:4;flex-direction:row;border-right:0;border-top:1px solid var(--linha);padding:4px;overflow-x:auto;overflow-y:hidden;justify-content:flex-start}
  .rail button{min-width:58px;flex:1}
  .palco{grid-column:1;grid-row:2}
  .tl{grid-column:1;grid-row:3}
  #painel,#insp{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));height:min(62vh,560px);z-index:20;border:1px solid var(--linha);border-radius:14px 14px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.5);display:flex}
  .app.sem-painel #painel{display:none}
  #insp{display:none}
  .app.insp-aberto #insp{display:flex}
  .app.insp-aberto #painel{display:none}
  .so-celular{display:inline-flex}
  .tl-corpo{grid-template-columns:56px minmax(0,1fr)}
  .esconde-celular{display:none}
  .marca span{display:none}
  .txt-painel{display:none}
  #b-exp{position:sticky;right:0;box-shadow:-10px 0 10px var(--mesa)}
  #sel-proj{min-width:120px;max-width:38vw} #sel-formato{min-width:92px;max-width:30vw}
}
/* celular: tela inteira do Safari (a barra do navegador não cobre a barra de ferramentas), as 10 ferramentas à vista e campos sem zoom */
@supports (height:100dvh){ .app{height:100dvh} }
.mais-lista{display:flex;flex-direction:column;gap:8px}
@media (max-width:820px){
  :root{--alt-tl:150px}
  .app{grid-template-rows:44px minmax(0,1fr) var(--alt-tl) calc(98px + env(safe-area-inset-bottom,0px))}
  .rail{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;overflow:hidden;padding:3px 4px calc(3px + env(safe-area-inset-bottom,0px))}
  .rail button{min-width:0;padding:5px 0 3px;font-size:10.5px}
  #painel,#insp{bottom:calc(98px + env(safe-area-inset-bottom,0px));height:min(58dvh,560px)}
  #b-rec,#sel-formato{display:none}
  input:not([type=range]):not([type=checkbox]):not([type=color]),select,textarea{font-size:16px}
  input[type=range]{min-height:30px}
  html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.btn.rec{background:#b3261e;border-color:#b3261e;color:#fff}
#carga{color:var(--verde,#7fff00)}
.estudio{position:fixed;inset:0;z-index:900;background:#050605;display:flex;gap:0}
.est-area{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;min-width:0;min-height:0}
.est-tela{height:100%;max-height:calc(100vh - 24px);max-width:100%;background:#000;border-radius:10px;overflow:hidden}
.est-tela.largo{height:auto;width:100%}
.est-tela canvas{width:100%;height:100%;display:block;touch-action:none}
.est-lado{width:340px;max-width:100%;overflow:auto;padding:12px;background:var(--painel,#181b15);border-left:1px solid var(--linha,#2b3126);display:flex;flex-direction:column;gap:10px}
.est-rec{font:600 22px "JetBrains Mono",monospace;padding:6px 0}
.est-tempo.rec{color:#ff5449}.est-tempo.rec::before{content:"● "}
.est-tempo.fim{color:#ffb020}
@media (max-width:820px){.estudio{flex-direction:column}.est-area{flex:1 1 55%;padding:6px}.est-tela{max-height:100%}.est-lado{width:100%;flex:1 1 45%;border-left:0;border-top:1px solid var(--linha,#2b3126)}#b-rec{padding:6px 9px}}
</style>

<div class="app" id="app">
  <header>
    <div class="marca"><i aria-hidden="true"></i><span>Intus <b>Cut</b></span></div>
    <a class="btn" id="b-painel" href="/app/painel/index.html" title="Volta ao painel da Intus Fit"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg><span class="txt-painel">Painel Intus Fit</span></a>
    <select id="sel-proj" aria-label="Projeto"></select>
    <button class="btn ico" id="b-desf" type="button" title="Desfazer (Ctrl+Z)" aria-label="Desfazer"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="btn ico" id="b-ref" type="button" title="Refazer (Ctrl+Shift+Z)" aria-label="Refazer"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <select id="sel-formato" aria-label="Formato do vídeo" title="Formato do vídeo"></select>
    <span class="esp"></span>
    <span class="pilula" id="carga" hidden></span>
    <span class="pilula esconde-celular" id="estado">Carregando</span>
    <button class="btn rec" id="b-rec" type="button" title="Gravar react ou explicação com a câmera">● Gravar</button>
    <button class="btn esconde-celular" id="b-dup" type="button">Duplicar</button>
    <button class="btn esconde-celular" id="b-novo" type="button">Novo com vídeo</button>
    <button class="btn esconde-celular" id="b-capa" type="button" title="Baixa o quadro atual como imagem">Quadro PNG</button>
    <button class="btn so-celular" id="b-mais" type="button" aria-label="Mais opções" title="Mais opções">⋯ Mais</button>
    <button class="btn pri" id="b-exp" type="button">Exportar</button>
  </header>

  <nav class="rail" role="tablist" aria-label="Ferramentas">
    <button role="tab" data-aba="midia" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>Mídia</button>
    <button role="tab" data-aba="biblioteca"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Biblioteca</button>

  <aside id="painel"><div class="cab"><span id="painel-tit">Mídia</span><button class="btn peq ico" id="b-fecha-painel" type="button" aria-label="Fechar painel" title="Esconder painel"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button></div><div class="rolagem" id="conteudo"></div></aside>

  <main class="palco">
    <div class="visor" id="visor">
      <div class="tela" id="telabox">
        <canvas id="tela" width="1080" height="1920" aria-label="Prévia do vídeo"></canvas>
        <canvas id="guia" width="1080" height="1920" aria-label="Arraste os elementos da prévia"></canvas>
        <div class="vazio-tela" id="vazio" hidden>Nenhum projeto ainda. Crie um com "Novo com vídeo" ou peça ao Claude para preparar os cortes de uma entrevista.</div>
      </div>
      <div class="faixa-ia" id="faixa-ia" hidden></div>
    </div>
    <div class="transporte">
      <button class="btn ico" id="b-ini" type="button" aria-label="Voltar ao início" title="Início"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 6l-9 6 9 6z"/></svg></button>
      <button class="btn peq" id="b-q-" type="button" aria-label="Quadro anterior">−1q</button>
      <button class="btn pri" id="b-play" type="button">Reproduzir</button>
      <button class="btn peq" id="b-q+" type="button" aria-label="Próximo quadro">+1q</button>
      <span class="tc" id="tc">00:00.00 / 00:00.00</span>
      <button class="btn peq" id="b-ig" type="button" title="Mostra onde o Instagram cobre o vídeo (não sai no arquivo)">Área do app</button>
    </div>
  </main>

  <aside id="insp"><div class="cab"><span id="insp-tit">Propriedades</span><button class="btn peq so-celular" id="b-fecha-insp" type="button">Fechar</button></div><div class="rolagem" id="insp-corpo"></div></aside>

  <section class="tl" aria-label="Linha do tempo">
    <div class="tl-puxa" id="tl-puxa" title="Arraste para aumentar ou diminuir a linha do tempo"></div>
    <div class="tl-barra">
      <button class="btn peq" id="t-div" type="button" title="Dividir no cursor (S)">✂ Dividir</button>
      <button class="btn peq" id="t-cop" type="button" title="Copiar (Ctrl+C)">Copiar</button>
      <button class="btn peq" id="t-col" type="button" title="Colar depois do selecionado (Ctrl+V)">Colar</button>
      <button class="btn peq" id="t-colc" type="button" title="Colar no cursor (Ctrl+Shift+V)">Colar no cursor</button>
      <button class="btn peq" id="t-dup" type="button" title="Duplicar (Ctrl+D)">Duplicar</button>
      <button class="btn peq" id="t-del" type="button" title="Apagar (Delete)">Apagar</button>
      <span class="sep"></span>
      <button class="btn peq ico" id="t-zm" type="button" aria-label="Diminuir zoom da linha do tempo">−</button>
      <input type="range" id="t-zoom" min="1" max="12" step="0.1" value="1" aria-label="Zoom da linha do tempo">
      <button class="btn peq ico" id="t-zp" type="button" aria-label="Aumentar zoom da linha do tempo">+</button>
      <button class="btn peq" id="t-fit" type="button">Caber</button>
      <span class="sep"></span>
      <span class="t" id="dur-rotulo"></span>
    </div>
    <div class="tl-corpo">
      <div class="tl-rot" id="tl-rot"></div>
      <div class="tl-rolo" id="rolo"><div class="tl-int" id="tlint"></div></div>
    </div>
  </section>
</div>

<div class="modal" id="modal" hidden><div class="caixa" id="caixa"></div></div>
