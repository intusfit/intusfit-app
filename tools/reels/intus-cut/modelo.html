<title>Intus Cut</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<style>
/* Ilha de edição escura: prévia 9:16 à esquerda (arrastável), ferramentas em abas à direita,
   linha do tempo embaixo. O verde da Intus só marca o que está ativo ou selecionado. */
:root{
  --chao:#0b0d0a; --mesa:#131611; --painel:#1a1e17; --painel2:#222720; --linha:#2d3328;
  --texto:#eef1ea; --suave:#9aa493; --fraco:#6c7466;
  --verde:#7fff00; --verde-esc:#14210a; --amarelo:#ffd60a; --vermelho:#ff5c5c;
  --f-marca:'Sora','Inter',system-ui,sans-serif; --f-ui:'Inter',system-ui,-apple-system,sans-serif; --f-tempo:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--chao);color:var(--texto);font:14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;gap:12px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.marca{font:800 20px var(--f-marca);letter-spacing:-.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.marca i{width:22px;height:22px;display:inline-block;background:linear-gradient(135deg,var(--verde) 0 50%,transparent 50%);border:2px solid var(--verde);border-radius:3px}
.marca b{color:var(--verde);font-weight:800}
select,input[type=text],input[type=number],textarea{background:var(--painel2);border:1px solid var(--linha);border-radius:8px;padding:7px 10px;min-width:0}
input[type=color]{width:40px;height:32px;padding:2px;background:var(--painel2);border:1px solid var(--linha);border-radius:8px}
textarea{resize:vertical;width:100%}
.esp{flex:1}
.pilula{font:600 12px var(--f-ui);color:var(--suave);padding:4px 10px;border:1px solid var(--linha);border-radius:999px;white-space:nowrap}
.pilula.ok{color:var(--verde);border-color:#3a5a1a}
.pilula.erro{color:var(--vermelho);border-color:#5a2a2a}
.btn{background:var(--painel2);border:1px solid var(--linha);border-radius:8px;padding:7px 12px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#46503f}
.btn.pri{background:var(--verde);color:#0b0d0a;border-color:var(--verde)}
.btn.peq{padding:4px 9px;font-size:12.5px}
.btn.on{border-color:var(--verde);color:var(--verde)}
.btn:disabled{opacity:.45;cursor:default}
.meio{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:12px;min-height:0}
.palco{display:flex;flex-direction:column;gap:8px;min-height:0;align-items:center}
.tela{position:relative;height:100%;min-height:0;aspect-ratio:9/16;max-width:100%;background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--linha)}
.tela canvas{width:100%;height:100%;display:block;position:absolute;inset:0}
#guia{cursor:grab;touch-action:none}
.vazio-tela{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--suave)}
.transporte{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.tc{font:600 13px var(--f-tempo);color:var(--suave);font-variant-numeric:tabular-nums;min-width:120px;text-align:center}
.painel{background:var(--mesa);border:1px solid var(--linha);border-radius:12px;display:flex;flex-direction:column;min-height:0;min-width:0}
.abas{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--linha);flex-wrap:wrap}
.abas button{background:none;border:0;border-radius:7px;padding:7px 11px;color:var(--suave);font-weight:600}
.abas button[aria-selected=true]{background:var(--painel2);color:var(--texto)}
.conteudo{padding:14px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:14px}
.grupo{display:flex;flex-direction:column;gap:8px}
.grupo h3{margin:0;font:700 11.5px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
.cartao{background:var(--painel);border:1px solid var(--linha);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.cartao.sel{border-color:var(--verde);box-shadow:0 0 0 1px var(--verde) inset}
.cartao>.topo{display:flex;align-items:center;gap:8px;justify-content:space-between}
.cartao>.topo b{font:700 13.5px var(--f-ui)}
.grade2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 12px}
.linha{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linha label,label.chk{color:var(--suave);font-size:13px;display:inline-flex;gap:6px;align-items:center}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo span{font-size:12px;color:var(--suave)}
input[type=range]{accent-color:var(--verde);width:100%}
.nota-ajuda{color:var(--fraco);font-size:12.5px;margin:0;max-width:64ch}
.lista{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:var(--painel);border:1px solid var(--linha);border-radius:8px;padding:6px 8px}
.item.ativo{border-color:#4f7a24;background:var(--verde-esc)}
.item .t{font:500 12px var(--f-tempo);color:var(--suave);font-variant-numeric:tabular-nums;white-space:nowrap}
.palavras{display:flex;flex-wrap:wrap;gap:5px}
.palavras input{width:auto;min-width:3ch;padding:3px 6px;font-size:13px;border-radius:6px}
.palavras input.agora{border-color:var(--verde);color:var(--verde)}
.palavras input.fora{opacity:.35}
.fonte-ve{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;border:1px solid var(--linha);cursor:grab;touch-action:none}
.fonte-ve canvas{width:100%;height:100%;display:block}
.tempo{background:var(--mesa);border:1px solid var(--linha);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.trilha{position:relative;height:46px;background:var(--painel);border-radius:8px;overflow:hidden;cursor:pointer;touch-action:none}
.trilha .bloco{position:absolute;top:6px;bottom:6px;background:#2c3d1c;border:1px solid #4f7a24;border-radius:6px;overflow:hidden}
.trilha .bloco.sel{background:#3f5a20;border-color:var(--verde)}
.trilha .bloco.fim{background:#2a2a33;border-color:#4a4a5a}
.trilha .bloco span{position:absolute;left:6px;top:3px;font:600 11px var(--f-tempo);color:#cfe8b0;white-space:nowrap}
.trilha .cabeca{position:absolute;top:0;bottom:0;width:2px;background:var(--verde);pointer-events:none}
.fonteb{position:relative;height:22px;background:var(--painel);border-radius:6px;overflow:hidden;cursor:pointer}
.fonteb .k{position:absolute;top:0;bottom:0;background:#4f7a24}
.fonteb .g{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#2a2f26 0 6px,#20241d 6px 12px)}
.fonteb .g.sel{outline:2px solid var(--amarelo);outline-offset:-2px}
.fonteb .cabeca{position:absolute;top:0;bottom:0;width:2px;background:var(--amarelo)}
.rotulo-tl{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--fraco)}
.prog{height:6px;background:var(--painel2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--verde);width:0}
.hist{display:flex;flex-direction:column;gap:4px}
.hist button{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--painel);border:1px solid var(--linha);border-radius:8px;padding:7px 10px}
.hist button.atual{border-color:var(--verde);background:var(--verde-esc)}
.hist button.futuro{opacity:.5}
.hist .t{font:500 12px var(--f-tempo);color:var(--suave)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.caixa{background:var(--mesa);border:1px solid var(--linha);border-radius:12px;padding:18px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:12px}
.caixa h2{margin:0;font:700 18px var(--f-marca)}
@media (max-width:900px){
  .meio{grid-template-columns:1fr}
  .tela{height:auto;width:min(100%,360px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <div class="marca"><i aria-hidden="true"></i>Intus <b>Cut</b></div>
    <select id="sel-proj" aria-label="Projeto"></select>
    <button class="btn peq" id="b-dup" type="button">Duplicar</button>
    <button class="btn peq" id="b-novo" type="button">Novo com vídeo</button>
    <button class="btn peq" id="b-desf" type="button" title="Desfazer (Ctrl+Z)">↶ Desfazer</button>
    <button class="btn peq" id="b-ref" type="button" title="Refazer (Ctrl+Shift+Z)">↷ Refazer</button>
    <span class="esp"></span>
    <span class="pilula" id="estado">Carregando</span>
    <button class="btn peq" id="b-capa" type="button" title="Baixa o quadro atual como imagem">Baixar quadro (PNG)</button>
    <button class="btn" id="b-hq" type="button" title="O Claude renderiza a partir do vídeo original da TV">Pedir versão em alta</button>
    <button class="btn pri" id="b-exp" type="button">Exportar MP4</button>
  </header>

  <div class="meio">
    <div class="palco">
      <div class="tela">
        <canvas id="tela" width="1080" height="1920" aria-label="Prévia do reel"></canvas>
        <canvas id="guia" width="1080" height="1920" aria-label="Arraste os elementos da prévia"></canvas>
        <div class="vazio-tela" id="vazio" hidden>Nenhum projeto ainda. Crie um com "Novo com vídeo" ou peça ao Claude para preparar os cortes de uma entrevista.</div>
      </div>
      <div class="transporte">
        <button class="btn peq" id="b-ini" type="button" aria-label="Voltar ao início">⏮</button>
        <button class="btn peq" id="b-q-" type="button" aria-label="Quadro anterior">−1q</button>
        <button class="btn pri" id="b-play" type="button">Reproduzir</button>
        <button class="btn peq" id="b-q+" type="button" aria-label="Próximo quadro">+1q</button>
        <span class="tc" id="tc">00:00.00 / 00:00.00</span>
        <button class="btn peq" id="b-ig" type="button" title="Mostra onde o Instagram põe curtidas, comentários e legenda (não sai no vídeo)">Área do Instagram</button>
      </div>
    </div>

    <section class="painel" aria-label="Ferramentas">
      <div class="abas" role="tablist">
        <button role="tab" data-aba="cortes" aria-selected="true">Cortes</button>
        <button role="tab" data-aba="quadro">Enquadramento</button>
        <button role="tab" data-aba="elementos">Elementos</button>
        <button role="tab" data-aba="legenda">Legendas</button>
        <button role="tab" data-aba="textos">Textos</button>
        <button role="tab" data-aba="audio">Áudio</button>
        <button role="tab" data-aba="historico">Histórico</button>
      </div>
      <div class="conteudo" id="conteudo"></div>
    </section>
  </div>

  <div class="tempo">
    <div class="rotulo-tl"><span>Reel (o que fica no vídeo final)</span><span id="dur-rotulo"></span></div>
    <div class="trilha" id="trilha" aria-label="Linha do tempo do reel"></div>
    <div class="rotulo-tl"><span>Gravação original: verde entra, listrado fica de fora (clique num trecho listrado para trazer de volta)</span></div>
    <div class="fonteb" id="fonteb" aria-label="Gravação original"></div>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="caixa" id="caixa"></div></div>

<video id="v" muted playsinline preload="auto" crossorigin="anonymous" hidden></video>
<audio id="a-voz" preload="auto" hidden></audio>
<audio id="a-mus" preload="auto" hidden></audio>

<script>
(function(){
'use strict';
// ---------- constantes do reel ----------
var W = 1080, H = 1920, FPS = 30, SRC_H = 780, SRC_H_TARJA = 1080, ORIG_W = 1920;
var T_GANCHO_PADRAO = 2.6, T_FIM = 2.8;
var COR = { amarelo:'#ffd60a', verde:'#7fff00', branco:'#f5f5f5', vermelho:'#ff4d4d', fundo:'#0f0f0f' };
// Posições de fábrica de cada elemento, no quadro 1080x1920. O projeto guarda só o que foi mexido.
var LAYOUT_PADRAO = {
  geral:   { fundo:'#0f0f0f', brilho:1, contraste:1, saturacao:1 },
  janela:  { y:230, h:1350, preencher:'desfoque', alinhar:-110 },
  legenda: { visivel:true, dx:0, dy:0, borda:7, fundo:false },
  gancho:  { visivel:true, x:540, y:118, escala:1, cor:'#7fff00' },
  gancho_grande: { visivel:true, dx:0, dy:0, escala:1, escurecer:.47 },
  arrobas: { visivel:true, x:540, y:1660, escala:1, texto:'@luiznunest   ·   @intusfit', cor:'#c8c8c8' },
  logo:    { visivel:true, x:540, y:1740, largura:240 },
  notas:   { dx:0, dy:0, escala:1 },
  barra:   { visivel:true, cor:'#7fff00', altura:10, embaixo:true },
  sombra:  { visivel:true, altura:200, opacidade:.45 }
};
var NOMES = { janela:'Vídeo', legenda:'Legenda', gancho:'Título do topo', gancho_grande:'Gancho grande', arrobas:'@ do rodapé', logo:'Logo', notas:'Marcação', barra:'Barra de progresso', texto:'Texto' };
var LOGO = new Image(); LOGO.src = 'data:image/png;base64,__LOGO__';
var $ = function(id){ return document.getElementById(id); };
var tela = $('tela'), ctx = tela.getContext('2d'), guia = $('guia'), gctx = guia.getContext('2d');
var V = $('v'), AV = $('a-voz'), AM = $('a-mus');

// ---------- estado ----------
var db = null, assets = null, downloads = null;
var projetos = {}, P = null, T = 0, tocando = false, selTrecho = 0, aba = 'cortes', salvarTimer = null, lacunaSel = null;
var CAIXAS = [], selEl = null, mostrarIG = true;
try { mostrarIG = localStorage.getItem('intuscut-ig') !== '0'; } catch (e) {}

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function fmt(t){ t = Math.max(0, t || 0); var m = Math.floor(t / 60), s = t - m * 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s.toFixed(2); }
function estado(txt, tipo){ var e = $('estado'); e.textContent = txt; e.className = 'pilula' + (tipo ? ' ' + tipo : ''); }
function lay(k){ P.layout = P.layout || {}; var base = LAYOUT_PADRAO[k], o = P.layout[k] || {};
  for (var c in base) if (!(c in o)) o[c] = base[c]; P.layout[k] = o; return o; }
function cor(x){ return COR[x] || x || COR.branco; }
function srcH(pl){ return pl && pl.tarja ? SRC_H_TARJA : SRC_H; }

// ---------- linha do tempo (a ordem da lista é a ordem do reel) ----------
function trechos(){ return (P && P.trechos) || []; }
function emOrdem(){ return trechos().slice().sort(function(a, b){ return a.ini - b.ini; }); }
function mapa(){ var o = 0; return trechos().map(function(s){ var r = { ini:s.ini, fim:s.fim, o:o }; o += s.fim - s.ini; return r; }); }
function durFala(){ return mapa().reduce(function(a, m){ return a + m.fim - m.ini; }, 0); }
function dur(){ return durFala() + (P && P.final && P.final.ativo ? T_FIM : 0); }
function fonteEm(t){ var M = mapa(); for (var i = 0; i < M.length; i++){ var m = M[i]; if (t < m.o + m.fim - m.ini - 1e-6) return { i:i, ts:m.ini + t - m.o }; } return null; }
function reelEmM(ts){ var M = mapa(); for (var i = 0; i < M.length; i++){ var m = M[i]; if (ts >= m.ini && ts <= m.fim) return { r:m.o + ts - m.ini, m:m }; } return null; }
function reelEm(ts){ var a = reelEmM(ts); return a ? a.r : null; }
function plano(ts){
  var ps = P.planos || [], melhor = null;
  for (var i = 0; i < ps.length; i++){ if (ts >= ps[i].ini && ts < ps[i].fim) return ps[i]; if (!melhor || Math.abs(ps[i].ini - ts) < Math.abs(melhor.ini - ts)) melhor = ps[i]; }
  return melhor || { ini:0, fim:1e9, cx:960, larg:1250, y:0 };
}
function grupos(){
  var est = P.estilo || {}, max = est.palavras_por_grupo || 3, ws = [];
  (P.palavras || []).forEach(function(w){ var a = reelEmM(w.i); if (!a || !String(w.p).trim()) return;
    ws.push({ p:String(w.p).trim(), ri:a.r, rf:a.r + Math.max(.05, Math.min(w.f, a.m.fim) - w.i) }); });
  ws.sort(function(a, b){ return a.ri - b.ri; });
  var gs = [], g = [];
  ws.forEach(function(w){
    if (g.length && (g.length >= max || (g.concat([w]).map(function(x){ return x.p; }).join(' ').length > 18) || w.ri - g[g.length - 1].rf > .35)){ gs.push(g); g = []; }
    g.push(w); if (/[.?!,]$/.test(w.p)){ gs.push(g); g = []; }
  });
  if (g.length) gs.push(g); return gs;
}

// ---------- desenho (prévia e exportação usam o mesmo; caixas só na prévia) ----------
var aux = document.createElement('canvas'), auxc = aux.getContext('2d');
function fonte(tam, peso){ return (peso || 800) + ' ' + Math.round(tam) + 'px Inter, system-ui, sans-serif'; }
function texto(c, t, x, y, tam, peso, cr, borda, alin){
  c.font = fonte(tam, peso); c.textAlign = alin || 'left'; c.textBaseline = 'top';
  if (borda){ c.lineJoin = 'round'; c.lineWidth = borda * 2; c.strokeStyle = '#000'; c.strokeText(t, x, y); }
  c.fillStyle = cr; c.fillText(t, x, y); return c.measureText(t).width;
}
function quebra(c, txt, tam, larg){ c.font = fonte(tam); var ls = [], at = '';
  txt.split(/\s+/).forEach(function(p){ var t = (at + ' ' + p).trim(); if (c.measureText(t).width > larg && at){ ls.push(at); at = p; } else at = t; });
  return ls.concat([at]); }
function caixa(reg, id, x, y, w, h){ if (reg) reg.push({ id:id, x:x, y:y, w:w, h:h }); }
function pill(c, x, y, w, h, r, cr){ c.fillStyle = cr; c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); c.fill(); }

function desenha(c, t, video, reg){
  var G = lay('geral');
  c.fillStyle = G.fundo; c.fillRect(0, 0, W, H);
  var DF = durFala();
  if (t >= DF && P.final && P.final.ativo){ desenhaFim(c, t - DF); return; }
  var f = fonteEm(Math.min(t, DF - 1e-3)); if (!f) return;
  var J = lay('janela'), pl = plano(f.ts), sH = srcH(pl), sw = Math.min(Math.max(pl.larg, 300), ORIG_W);
  var sh = Math.min(sH, sw * J.h / W);
  var cx = Math.min(Math.max(pl.cx, sw / 2), ORIG_W - sw / 2), y0 = Math.min(Math.max(pl.y || 0, 0), sH - sh);
  var k = video.videoWidth ? video.videoWidth / ORIG_W : 1, jh = Math.round(sh * W / sw), jy = J.y, cheio = jh >= J.h - 4;
  if (!cheio) jy = Math.round(Math.max(J.y, J.y + (J.h - jh) / 2 + J.alinhar));
  if (video.readyState >= 2){
    var filtro = 'brightness(' + G.brilho + ') contrast(' + G.contraste + ') saturate(' + G.saturacao + ')';
    if (!cheio && J.preencher === 'desfoque'){
      var bw = Math.min(ORIG_W, sH * W / J.h), bx = Math.min(Math.max(cx, bw / 2), ORIG_W - bw / 2);
      aux.width = 36; aux.height = Math.max(8, Math.round(36 * J.h / W));
      auxc.drawImage(video, (bx - bw / 2) * k, 0, bw * k, sH * k, 0, 0, aux.width, aux.height);
      c.imageSmoothingEnabled = true; c.filter = filtro; c.drawImage(aux, 0, J.y, W, J.h); c.filter = 'none';
      c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(0, J.y, W, J.h);
    }
    c.filter = filtro; c.drawImage(video, (cx - sw / 2) * k, y0 * k, sw * k, sh * k, 0, jy, W, jh); c.filter = 'none';
  }
  caixa(reg, 'janela', 0, jy, W, jh);
  var L = lay('legenda'), S = lay('sombra'), yLeg;
  if (cheio){
    if (S.visivel){ var gr = c.createLinearGradient(0, J.y + J.h - S.altura, 0, J.y + J.h); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,' + S.opacidade + ')');
      c.fillStyle = gr; c.fillRect(0, J.y + J.h - S.altura, W, S.altura); }
    yLeg = J.y + J.h - 175;
