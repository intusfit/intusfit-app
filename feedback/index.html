<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intus Fit · Feedback do seu professor</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta property="og:title" content="Feedback em vídeo · Intus Fit">
<meta property="og:description" content="Seu professor gravou um feedback pra você.">
<meta property="og:image" content="https://intusfit.com.br/og-image.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none !important}
:root{--bg:#0f0f0f;--card:#1a1a1a;--borda:#2a2a2a;--texto:#f0f0f0;--muted:#aeaeae;--accent:#7FFF00}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--texto);line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 40px}
.logo{height:26px;display:block;margin:4px 0 20px}
.kicker{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
h1{font-size:22px;font-weight:800;line-height:1.25;margin-bottom:6px}
.meta{font-size:13px;color:var(--muted);margin-bottom:16px}
video{width:100%;max-height:78vh;background:#000;border-radius:14px;display:block}
.recado{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:14px 16px;margin-top:16px;font-size:15px;white-space:pre-wrap}
.estado{text-align:center;padding:80px 10px;color:var(--muted);font-size:15px}
.rodape{margin-top:28px;font-size:12px;color:#828282;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <img src="/app/painel/logo-intus-dark.png" alt="Intus Fit" class="logo" onerror="this.style.display='none'">
  <div id="estado" class="estado">Carregando o vídeo...</div>
  <div id="conteudo" hidden>
    <div class="kicker">Feedback em vídeo</div>
    <h1 id="titulo"></h1>
    <p class="meta" id="meta"></p>
    <video id="video" controls playsinline preload="metadata"></video>
    <div class="recado" id="recado" hidden></div>
  </div>
  <p class="rodape">Intus Fit · consultoria online de treino e nutrição</p>
</div>
<script>
(function(){
  'use strict';
  var token = new URLSearchParams(location.search).get('v') || '';
  var estado = document.getElementById('estado');
  if (!/^[0-9a-f]{32}$/.test(token)) { estado.textContent = 'Link incompleto. Peça ao seu professor para mandar de novo.'; return; }

  // Se quem abriu é da equipe (mesmo navegador do painel), manda o login junto
  // para o servidor não marcar como "aluno assistiu".
  var headers = {};
  try {
    var u = JSON.parse(localStorage.getItem('mx-user') || 'null');
    var t = localStorage.getItem('mx-token');
    if (t && u && u.tipo !== 'aluno') headers.Authorization = 'Bearer ' + t;
  } catch (e) {}

  fetch('/app/api/feedbacks.php?action=ver&v=' + token, { headers: headers })
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (!data.ok) { estado.textContent = data.erro || 'Este feedback não está mais disponível.'; return; }
      var f = data.feedback;
      document.title = f.titulo + ' · Intus Fit';
      document.getElementById('titulo').textContent = f.titulo;
      var d = new Date(String(f.criado_em).replace(' ', 'T'));
      document.getElementById('meta').textContent =
        (f.aluno_nome ? f.aluno_nome + ', ' : '') + 'feedback' + (f.professor_nome ? ' de ' + f.professor_nome : '') +
        ' · ' + d.toLocaleDateString('pt-BR');
      if (f.descricao) { var r = document.getElementById('recado'); r.textContent = f.descricao; r.hidden = false; }
      var v = document.getElementById('video');
      // WebM gravado no navegador vem sem duração no cabeçalho; pular pro fim uma vez corrige a barra.
      v.addEventListener('loadedmetadata', function f1(){
        v.removeEventListener('loadedmetadata', f1);
        if (v.duration === Infinity) {
          v.currentTime = 1e101;
          v.addEventListener('timeupdate', function g(){ v.removeEventListener('timeupdate', g); v.currentTime = 0; });
        }
      });
      v.addEventListener('error', function(){
        estado.textContent = 'Não consegui tocar o vídeo neste aparelho. Tente abrir o link no Chrome.';
        estado.hidden = false;
      });
      v.src = f.video_url;
      estado.hidden = true;
      document.getElementById('conteudo').hidden = false;
    })
    .catch(function(){ estado.textContent = 'Sem conexão. Confira a internet e abra o link de novo.'; });
})();
</script>
</body>
</html>
