<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Central de Conteúdo · Intus</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/marca/icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/marca/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
(function(){
  var t = null; try { t = localStorage.getItem('mx-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  document.documentElement.setAttribute('data-tema', t);
})();
</script>
<style>
:root{
  color-scheme:dark;
  --bg:#0d0d0d; --card:#1a1a1a; --card2:#222; --borda:#2a2a2a; --borda2:#444; --texto:#f0f0f0; --muted:#b4b4b4;
  --accent:#7FFF00; --accent-ink:#0c1a00; --warn:#ffb84d; --erro:#ff6b6b; --ok:#7FFF00; --info:#7cc4ff;
  --accent-bd:#2f4d12; --accent-bg:#16240a; --prev-bg:#0f1a07;
  --warn-bd:#5a4318; --warn-bg:#2a2112; --warn-tx:#ffd9a0;
  --erro-bd:#5c1a1a; --erro-bg:#2b0f0f; --erro-tx:#ffb3b3;
  --info-bd:#1f4864; --campo-bg:#141414; --codigo-bg:#101010; --topo-bg:rgba(13,13,13,.94);
  --toast-bg:#f0f0f0; --toast-tx:#111; --grade:#2a2a2a; --eixo:#b4b4b4;
  --serie1:#7FFF00; --serie2:#7cc4ff; --serie3:#ffb84d;
  --r:12px;
}
:root[data-tema="light"]{
  color-scheme:light;
  --bg:#f4f5f7; --card:#ffffff; --card2:#eef0f3; --borda:#dcdfe4; --borda2:#b8bec8; --texto:#111827; --muted:#4b5563;
  --accent:#2d7a00; --accent-ink:#ffffff; --warn:#8a5200; --erro:#c0262d; --ok:#2d7a00; --info:#0b6aa8;
  --accent-bd:#9ccf72; --accent-bg:#eaf6dc; --prev-bg:#eef8e2;
  --warn-bd:#e3c27a; --warn-bg:#fdf4e0; --warn-tx:#6b4200;
  --erro-bd:#efb3b3; --erro-bg:#fdeaea; --erro-tx:#8f1d1d;
  --info-bd:#9cc7e6; --campo-bg:#f6f7f9; --codigo-bg:#f3f4f6; --topo-bg:rgba(244,245,247,.94);
  --toast-bg:#111827; --toast-tx:#ffffff; --grade:#dcdfe4; --eixo:#4b5563;
  --serie1:#2d7a00; --serie2:#0b6aa8; --serie3:#b36b00;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--texto);font:400 15px/1.55 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
h1,h2,h3,h4,p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}

/* login */
#tela-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:28px}
.login-box img{height:34px;display:block;margin:0 auto 18px}
.login-box h1{font-size:18px;text-align:center;margin-bottom:4px}
.login-box .sub{color:var(--muted);text-align:center;font-size:13px;margin-bottom:18px}
.campo{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.campo label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--borda);border-radius:10px;padding:10px 12px;min-height:42px}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.erro-msg{color:var(--erro);font-size:13px;min-height:18px;margin-top:4px}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--borda);background:var(--card2);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;color:var(--texto);text-decoration:none}
.btn:hover{border-color:var(--borda2)}
.btn.primario{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.perigo{color:var(--erro)}
.btn.mini{min-height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linha{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.espaco{flex:1}

/* topo */
.topo{position:sticky;top:0;z-index:20;background:var(--topo-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--borda);margin:0 -16px 20px;padding:12px 16px 0}
.topo-linha{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.topo img{height:26px}
.topo h1{font-size:16px;font-weight:700}
.topo .sub{font-size:12px;color:var(--muted)}
.abas{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.aba{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 14px;font-weight:600;cursor:pointer;font-size:14px}
.aba[aria-selected=true]{color:var(--texto);border-bottom-color:var(--accent)}
.aba .n{display:inline-block;margin-left:6px;font-size:11px;background:var(--card2);border-radius:99px;padding:1px 7px;color:var(--muted)}

/* blocos */
.card{background:var(--card);border:1px solid var(--borda);border-radius:var(--r);padding:16px}
.card + .card{margin-top:14px}
.secao-titulo{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.dica{color:var(--muted);font-size:13px}
.aviso{border-radius:10px;padding:10px 14px;font-size:13px;border:1px solid var(--borda);background:var(--card2)}
.aviso.warn{border-color:var(--warn-bd);background:var(--warn-bg);color:var(--warn-tx)}
.aviso.erro{border-color:var(--erro-bd);background:var(--erro-bg);color:var(--erro-tx)}
.aviso.ok{border-color:var(--accent-bd);background:var(--accent-bg)}
.grade{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grade > *{min-width:0}
@media (max-width:760px){.g2,.g3{grid-template-columns:1fr}}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:99px;padding:2px 9px;background:var(--card2);color:var(--muted);border:1px solid var(--borda)}
.badge.verde{color:var(--accent);border-color:var(--accent-bd)}
.badge.ambar{color:var(--warn);border-color:var(--warn-bd)}
.badge.azul{color:var(--info);border-color:var(--info-bd)}
.badge.verm{color:var(--erro);border-color:var(--erro-bd)}

/* painel */
.kpi{background:var(--card);border:1px solid var(--borda);border-radius:var(--r);padding:14px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .v.vazio{font-size:15px;font-weight:600;color:var(--muted);line-height:1.7}
.kpi .l{font-size:12px;color:var(--muted);margin-top:4px}
.kpi .s{font-size:11px;color:var(--muted);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--borda);text-align:left;vertical-align:top}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tabela-rolar{overflow-x:auto}
.barra{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.barra > i{display:block;height:100%;background:var(--accent)}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-tx);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:99;max-width:calc(100% - 32px)}
.carregando{color:var(--muted);padding:30px 0;text-align:center}

/* topo: voltar e tema */
.topo-acoes{display:flex;gap:8px;align-items:center}
.topo-linha{flex-wrap:nowrap;min-width:0}
.topo-linha > div:first-of-type{min-width:0}
@media (max-width:560px){.topo .sub{display:none}.so-largo{display:none}.topo h1{font-size:15px;line-height:1.2}.logo-topo{height:22px}.topo-linha{gap:8px}}
.btn-tema{width:40px;padding:0;font-size:16px}
.logo-topo{height:26px}
/* cores dos perfis (6 posições, editáveis em Ajustes) */
:root{--m1:#7FFF00;--m2:#7cc4ff;--m3:#ff8fb1;--m4:#ffb84d;--m5:#c39bff;--m6:#5eead4}
:root[data-tema="light"]{--m1:#2d7a00;--m2:#0b6aa8;--m3:#b02a5b;--m4:#8a5200;--m5:#6b3fb0;--m6:#0f766e}
.m1{--mc:var(--m1)}.m2{--mc:var(--m2)}.m3{--mc:var(--m3)}.m4{--mc:var(--m4)}.m5{--mc:var(--m5)}.m6{--mc:var(--m6)}
.m0{--mc:var(--muted)}
.marca{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--mc);white-space:nowrap}
.marca::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--mc);display:inline-block}

/* painel */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi.clic{cursor:pointer}.kpi.clic:hover{border-color:var(--borda2)}
.kpi .v.verm{color:var(--erro)}.kpi .v.ambar{color:var(--warn)}
.agenda-item{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--borda);cursor:pointer}
.agenda-item:last-child{border-bottom:0}
.agenda-item .dia{font-weight:700;font-size:13px}
.agenda-item .dia small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.agenda-item .tit{font-weight:600;overflow-wrap:anywhere}
.agenda-item.evento .tit::before{content:'◆ ';color:var(--muted)}
.cad{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.cad .cartao{background:var(--card);border:1px solid var(--borda);border-left:4px solid var(--mc);border-radius:var(--r);padding:12px}
.cad .nome{font-weight:700}.cad .handle{font-size:12px;color:var(--muted)}
.cad .linha-cad{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;margin-top:8px}
.cad .barra{margin-top:4px}
.cad .barra > i{background:var(--mc)}
.etapas-fluxo{display:flex;flex-wrap:wrap;gap:6px}
.etapa-btn{background:var(--card2);border:1px solid var(--borda);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--texto)}
.etapa-btn b{margin-left:4px;color:var(--accent)}
.lista-atencao{display:flex;flex-direction:column}
.at-item{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--borda);cursor:pointer;font-size:13px}
.at-item:last-child{border-bottom:0}
.mix-linha{display:grid;grid-template-columns:140px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:13px;margin:5px 0}

/* filtros */
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filtros select,.filtros input{width:auto;min-width:130px;min-height:36px;padding:6px 10px}
.filtros input[type=search]{min-width:200px;background:var(--bg);border:1px solid var(--borda);border-radius:10px;padding:6px 12px}

/* quadro */
.quadro{display:flex;gap:10px;overflow-x:auto;align-items:flex-start;padding-bottom:10px}
.coluna{flex:0 0 250px;background:var(--card2);border:1px solid var(--borda);border-radius:var(--r);padding:8px;min-height:120px}
.coluna.alvo{border-color:var(--accent);background:var(--accent-bg)}
.coluna h3{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:4px 6px 8px;display:flex;justify-content:space-between}
.kcard{background:var(--card);border:1px solid var(--borda);border-left:4px solid var(--mc);border-radius:10px;padding:9px 10px;margin-bottom:8px;cursor:pointer}
.kcard:hover{border-color:var(--borda2);border-left-color:var(--mc)}
.kcard.arrasta{opacity:.45}
.kcard .t{font-weight:600;font-size:13px;overflow-wrap:anywhere;margin-bottom:5px}
.kcard .m{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:11px;color:var(--muted)}
.kcard .mov{display:flex;gap:6px;margin-top:7px}
.kcard .mov button{background:var(--card2);border:1px solid var(--borda);border-radius:7px;font-size:12px;padding:2px 9px;cursor:pointer}
.pend{font-size:11px;font-weight:700}
.pend.e{color:var(--erro)}.pend.a{color:var(--warn)}.pend.ok{color:var(--accent)}

/* calendário */
.cal-topo{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.cal-topo h2{font-size:17px;min-width:150px;text-align:center}
.cal-grade{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--borda);border-radius:var(--r);overflow:hidden;background:var(--card)}
.cal-sem{background:var(--card2);padding:6px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;text-align:center;border-bottom:1px solid var(--borda)}
.cal-dia{min-height:104px;border-right:1px solid var(--borda);border-bottom:1px solid var(--borda);padding:4px;cursor:pointer;min-width:0}
.cal-dia:nth-child(7n+14){border-right:0}
.cal-dia.fora{opacity:.45}
.cal-dia.hoje{background:var(--accent-bg)}
.cal-dia:hover{background:var(--card2)}
.cal-dia .n{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:3px}
.cal-dia.hoje .n{color:var(--accent)}
.chip-cal{display:block;font-size:11px;line-height:1.25;border-left:3px solid var(--mc);background:var(--card2);border-radius:5px;padding:2px 5px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.chip-cal.evento{border-left-style:dashed;background:transparent;border:1px dashed var(--borda2);border-left:3px dashed var(--mc)}
.chip-cal.pub{opacity:.6}
.chip-cal.atr{outline:1px solid var(--erro)}
.cal-lista{display:none}
.cal-lista .dia-bloco{margin-bottom:12px}
.cal-lista h4{font-size:13px;color:var(--muted);margin:0 0 4px}
@media (max-width:760px){.cal-grade{display:none}.cal-lista{display:block}}

/* editor */
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;justify-content:flex-end}
.gaveta{width:min(760px,100%);background:var(--bg);border-left:1px solid var(--borda);height:100%;overflow-y:auto;display:flex;flex-direction:column}
.gaveta-topo{position:sticky;top:0;z-index:2;background:var(--topo-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--borda);padding:12px 16px;display:flex;gap:10px;align-items:center}
.gaveta-topo h2{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gaveta-corpo{padding:16px;flex:1}
.gaveta-rodape{position:sticky;bottom:0;background:var(--topo-bg);backdrop-filter:blur(8px);border-top:1px solid var(--borda);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bloco{border:1px solid var(--borda);border-radius:var(--r);background:var(--card);padding:14px;margin-bottom:12px}
.bloco > h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 12px}
@media (max-width:640px){.f2,.f3{grid-template-columns:1fr}}
.contador{font-size:11px;color:var(--muted);text-align:right}
.contador.estoura{color:var(--erro)}
.pessoa-linha{display:grid;grid-template-columns:minmax(0,1fr) 170px auto;gap:8px;margin-bottom:6px}
@media (max-width:640px){.pessoa-linha{grid-template-columns:1fr 1fr auto}}
.arq-lista{max-height:180px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.arq-lista label{display:flex;gap:8px;align-items:center;background:var(--card2);border:1px solid var(--borda);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
.arq-lista input{accent-color:var(--accent)}
.hist{font-size:12px;color:var(--muted);max-height:160px;overflow:auto}
.hist div{padding:3px 0;border-bottom:1px dashed var(--borda)}
.pendencias .item{display:flex;gap:8px;font-size:13px;padding:5px 0}
.pendencias .item.erro{color:var(--erro-tx)}.pendencias .item.aviso{color:var(--warn-tx)}
:root[data-tema="light"] .pendencias .item.erro{color:var(--erro)}
.centro{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.caixa{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:18px;width:min(460px,100%);max-height:90vh;overflow:auto}
.caixa h3{font-size:16px;margin-bottom:8px}
.tabela-edicao td{padding:6px 6px}
.tabela-edicao input,.tabela-edicao select{min-height:36px;padding:6px 8px}
.rotulo-grupo{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.link-linha{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--borda)}
.link-linha:last-child{border-bottom:0}
.link-linha .t{font-weight:600;overflow-wrap:anywhere}
.fila-item{background:var(--card);border:1px solid var(--borda);border-left:4px solid var(--mc);border-radius:var(--r);padding:14px;margin-bottom:10px}
.fila-item .texto{white-space:pre-wrap;background:var(--prev-bg);border:1px solid var(--accent-bd);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px;overflow-wrap:anywhere;max-height:220px;overflow:auto}
.vazio{color:var(--muted);padding:18px 0;text-align:center;font-size:14px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;border-radius:8px;padding:3px 9px;border:1px solid var(--borda);background:var(--card2)}
.chip.erro{color:var(--erro);border-color:var(--erro-bd)}
.chip.aviso{color:var(--warn);border-color:var(--warn-bd)}
.chip.ok{color:var(--accent);border-color:var(--accent-bd)}
.marcar{display:flex;flex-wrap:wrap;gap:6px}
.marcar label{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--borda);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
.marcar input,.check-pill input{accent-color:var(--accent)}
.check-pill{display:inline-flex;gap:8px;align-items:center;background:var(--card2);border:1px solid var(--borda);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
</style>
</head>
<body>

<div id="tela-login" hidden>
  <form class="login-box" id="form-login">
    <img class="logo-tema" src="/app/painel/logo-intus-dark.png" alt="Intus Fit" onerror="this.style.display='none'">
    <h1>Central de Conteúdo</h1>
    <p class="sub">Área da equipe. Entre com o mesmo login do painel.</p>
    <div class="campo"><label for="login-email">E-mail</label><input type="email" id="login-email" autocomplete="username" required></div>
    <div class="campo"><label for="login-senha">Senha</label><input type="password" id="login-senha" autocomplete="current-password" required></div>
    <button class="btn primario" type="submit" id="btn-login" style="width:100%">Entrar</button>
    <p class="erro-msg" id="login-erro" role="alert"></p>
    <p style="text-align:center;margin-top:10px"><a href="/app/painel/index.html">&larr; Voltar ao painel</a></p>
  </form>
</div>

<div id="app" hidden>
<div class="wrap">
  <div class="topo">
    <div class="topo-linha">
      <img class="logo-topo logo-tema" src="/app/painel/logo-intus-dark.png" alt="Intus Fit" onerror="this.style.display='none'">
      <div><h1>Central de Conteúdo</h1><div class="sub">Posts e vídeos da Intus Fit, do Luiz e do Código da Definição</div></div>
      <span class="espaco"></span>
      <div class="topo-acoes"><a class="btn mini" href="/intus-cut/" title="Abre o editor de vídeo">Intus Cut</a><button class="btn mini btn-tema" id="btn-tema" type="button" aria-label="Alternar entre tema claro e escuro" title="Alternar tema"></button><a class="btn mini" href="/app/painel/index.html">&larr; <span class="so-largo">Voltar ao </span>painel</a></div>
    </div>

      <button class="aba" role="tab" data-aba="quadro">Quadro</button>

      <button class="aba" role="tab" data-aba="fila">Pronto para postar <span class="n" id="n-fila">0</span></button>
      <button class="aba" role="tab" data-aba="reciclar">Reciclar <span class="n" id="n-reciclar">0</span></button>
      <button class="aba" role="tab" data-aba="ofertas">Ofertas e links</button>
      <button class="aba" role="tab" data-aba="ajustes">Ajustes</button>
    </div>
  </div>
  <div id="conteudo"><div class="carregando">Carregando...</div></div>
</div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
var API = '/app/api/conteudo.php';
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function ler(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function num(v) { return Number(v || 0).toLocaleString('pt-BR'); }
function debounce(fn, ms) { var t; return function () { var a = arguments, c = this; clearTimeout(t); t = setTimeout(function () { fn.apply(c, a); }, ms); }; }
var toastT;
function toast(msg) { var el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { el.hidden = true; }, 4200); }

/* ---------- tema (mesma chave do painel) ---------- */
function temaAtual() { return document.documentElement.getAttribute('data-tema') === 'light' ? 'light' : 'dark'; }
function aplicarTema(t) {
  document.documentElement.setAttribute('data-tema', t);
  $$('.logo-tema').forEach(function (i) { i.src = '/app/painel/logo-intus-' + (t === 'light' ? 'light' : 'dark') + '.png'; });
  var b = $('#btn-tema'); if (b) { b.textContent = t === 'light' ? '☾' : '☀'; b.title = t === 'light' ? 'Mudar para o tema escuro' : 'Mudar para o tema claro'; }
}
$('#btn-tema').addEventListener('click', function () { var t = temaAtual() === 'light' ? 'dark' : 'light'; guardar('mx-theme', t); aplicarTema(t); });
window.addEventListener('storage', function (ev) { if (ev.key === 'mx-theme' && (ev.newValue === 'light' || ev.newValue === 'dark')) aplicarTema(ev.newValue); });
aplicarTema(temaAtual());

/* ---------- sessão e chamadas ---------- */
function getToken() { return ler('mx-token') || ''; }
function limparSessao() { try { localStorage.removeItem('mx-token'); localStorage.removeItem('mx-user'); } catch (e) {} }
function mostrarLogin(msg) { $('#app').hidden = true; $('#tela-login').hidden = false; $('#login-erro').textContent = msg || ''; }
function mostrarApp() { $('#tela-login').hidden = true; $('#app').hidden = false; }
function api(action, corpo, qs) {
  var url = API + '?action=' + encodeURIComponent(action) + (qs || '');
  var opts = { headers: { 'Authorization': 'Bearer ' + getToken() } };
  if (corpo !== undefined && corpo !== null) { opts.method = 'POST'; opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(corpo); }
  return fetch(url, opts).then(function (r) {
    if (r.status === 401) { limparSessao(); mostrarLogin('Sessão expirada. Entre de novo.'); throw new Error('sessão'); }
    return r.json().catch(function () { throw new Error('Resposta inválida do servidor (HTTP ' + r.status + ').'); }).then(function (j) {
      if (!j.ok && r.status >= 400) { var e = new Error(j.erro || ('Erro ' + r.status)); e.status = r.status; e.dados = j; throw e; }
      return j;
    });
  });
}
function falha(e) { if (e && e.message !== 'sessão') toast(e.message || 'Algo deu errado.'); }
$('#form-login').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var b = $('#btn-login'); b.disabled = true; b.textContent = 'Entrando...';
  fetch('/app/api/usuarios.php?action=validar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: $('#login-email').value.trim(), senha: $('#login-senha').value }) })
    .then(function (r) { return r.json(); }).then(function (d) {
      b.disabled = false; b.textContent = 'Entrar';
      if (!d.ok || !d.usuario || !d.usuario.server_token) { $('#login-erro').textContent = d.erro || 'E-mail ou senha inválidos.'; return; }
      guardar('mx-token', d.usuario.server_token); try { localStorage.setItem('mx-user', JSON.stringify(d.usuario)); } catch (e) {}
      iniciar();
    }).catch(function () { b.disabled = false; b.textContent = 'Entrar'; $('#login-erro').textContent = 'Falha de conexão. Tente de novo.'; });
});

/* ---------- estado ---------- */
var S = { d: null, aba: 'painel', f: { marca: '', tipo: '', resp: '', busca: '', todosPub: false }, mes: null, fila: null, drag: null, ed: null };
function hojeStr() { return S.d ? S.d.hoje : new Date().toISOString().slice(0, 10); }
function achar(lista, id) { for (var i = 0; i < lista.length; i++) if (lista[i].id === id) return lista[i]; return null; }
function marcaDe(id) { return achar(S.d.cfg.marcas, id); }
function corDe(id) { var m = marcaDe(id); return 'm' + (m ? m.cor : 0); }
function nomeMarca(id) { var m = marcaDe(id); return m ? m.nome : '(sem perfil)'; }
function nomeDe(lista, id) { var x = achar(lista, id); return x ? x.nome : (id || ''); }
function nomeStatus(id) { return nomeDe(S.d.status, id); }
function fmtDia(d) { if (!d) return ''; var p = d.split('-'); return p[2] + '/' + p[1]; }
var SEM = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
function diaSem(d) { var p = d.split('-'); return SEM[new Date(+p[0], +p[1] - 1, +p[2]).getDay()]; }
function marcaHtml(id) { return '<span class="marca ' + corDe(id) + '">' + esc(nomeMarca(id)) + '</span>'; }
function opcoes(lista, sel, vazio) {
  return (vazio != null ? '<option value="">' + esc(vazio) + '</option>' : '') + lista.map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === sel ? ' selected' : '') + '>' + esc(x.nome) + '</option>'; }).join('');
}
function copiar(txt) {
  var ok = function () { toast('Copiado.'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, function () { toast('Não consegui copiar. Selecione e copie à mão.'); });
  else { var t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('Não consegui copiar.'); } t.remove(); }
}
function baixar(nome, texto) {
  var b = new Blob([texto], { type: 'application/json' }); var a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
}

/* ---------- carga ---------- */
function iniciar() {
  if (!getToken()) { mostrarLogin(''); return; }
  $('#conteudo').innerHTML = '<div class="carregando">Carregando...</div>';
  mostrarApp();
  api('inicio').then(function (d) {
    S.d = d; if (!S.mes) S.mes = d.hoje.slice(0, 7);
    pintar();
  }).catch(function (e) {
    if (e.status === 403) { $('#conteudo').innerHTML = '<div class="aviso warn">' + esc(e.message) + '</div>'; return; }
    if (e.message !== 'sessão') $('#conteudo').innerHTML = '<div class="aviso erro">' + esc(e.message) + ' <button class="btn mini" data-act="recarregar">Tentar de novo</button></div>';
  });
}
function recarregar(depois) {
  return api('inicio').then(function (d) { S.d = d; S.fila = null; pintar(); if (depois) depois(); }).catch(falha);
}

/* ---------- abas ---------- */
var ABAS = ['painel', 'quadro', 'calendario', 'fila', 'reciclar', 'ofertas', 'ajustes'];
function pintar() {
  $$('#abas .aba').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.aba === S.aba ? 'true' : 'false'); });
  var n = S.d.pecas.filter(function (p) { return p.status === 'agendado'; }).length;
  $('#n-fila').textContent = n; $('#n-reciclar').textContent = S.d.reciclagem.marcadas.filter(function (x) { return x.pronta; }).length;
  var el = $('#conteudo');
  var f = { painel: pintarPainel, quadro: pintarQuadro, calendario: pintarCalendario, fila: pintarFila, reciclar: pintarReciclar, ofertas: pintarOfertas, ajustes: pintarAjustes }[S.aba] || pintarPainel;
  f(el);
}
$('#abas').addEventListener('click', function (ev) { var b = ev.target.closest('.aba'); if (!b) return; S.aba = b.dataset.aba; guardar('cont-aba', S.aba); pintar(); window.scrollTo(0, 0); });

/* ---------- painel ---------- */
function irQuadro(filtro) { S.aba = 'quadro'; if (filtro) { S.f.busca = ''; } pintar(); }
function pintarPainel(el) {
  var p = S.d.painel, ps = p.por_status, n = S.d.negocio;
  var pub30 = 0; Object.keys(p.por_marca).forEach(function (k) { pub30 += p.por_marca[k].publicadas_30d; });
  var producao = ps.roteiro + ps.gravacao + ps.edicao + ps.revisao + ps.aprovado;
  var recPronta = S.d.reciclagem.marcadas.filter(function (x) { return x.pronta; }).length;
  var h = '';
  if (p.alertas.length) h += '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px">' + p.alertas.map(function (a) { return '<div class="aviso warn">' + esc(a) + '</div>'; }).join('') + '</div>';
  h += '<div class="kpis">' +
    kpi('Ideias', ps.ideia, 'no banco de ideias', 'quadro') + kpi('Em produção', producao, 'roteiro até aprovado', 'quadro') +
    kpi('Agendadas', ps.agendado, 'prontas para postar', 'fila') + kpi('Publicadas', pub30, 'nos últimos 30 dias', 'quadro') +
    kpi('Atrasadas', p.atrasadas.length, 'dia de postar já passou', 'quadro', p.atrasadas.length ? 'verm' : '') +
    kpi('Para reciclar', recPronta, 'já passou o prazo', 'reciclar', recPronta ? 'ambar' : '') + '</div>';

  h += '<div class="grade g2" style="margin-bottom:14px"><div class="card"><div class="secao-titulo">Hoje e próximos 14 dias</div>';
  if (!p.agenda.length) h += '<div class="vazio">Nada marcado. Crie uma peça ou um evento no calendário.</div>';
  else h += p.agenda.map(function (a) {
    return '<div class="agenda-item ' + (a.tipo === 'evento' ? 'evento' : '') + '" data-act="' + (a.tipo === 'evento' ? 'abrir-evento' : 'abrir') + '" data-id="' + esc(a.id) + '"><div class="dia">' + fmtDia(a.data) + '<small>' + diaSem(a.data) + (a.hora ? ' ' + esc(a.hora) : '') + '</small></div><div class="tit">' + esc(a.titulo) + '</div><div>' +
      (a.marca ? marcaHtml(a.marca) : '') + ' <span class="badge">' + esc(a.tipo === 'evento' ? nomeDe(S.d.tipos_evento, a.status) : nomeStatus(a.status)) + '</span></div></div>';
  }).join('');
  h += '</div><div class="card"><div class="secao-titulo">Onde o fluxo está parado</div>';
  var blocos = [['Atrasadas', p.atrasadas, 'verm'], ['Aprovadas sem dia marcado', p.sem_data, 'ambar'], ['Sem vídeo ou imagem', p.sem_midia, 'ambar'], ['Esperando autorização de imagem', p.bloqueadas, 'ambar'], ['Paradas há mais de ' + S.d.cfg.parado_dias + ' dias na mesma etapa', p.paradas, 'ambar']];
  var tem = false;
  blocos.forEach(function (b) {
    if (!b[1].length) return; tem = true;
    h += '<div class="rotulo-grupo" style="margin-top:6px">' + esc(b[0]) + ' (' + b[1].length + ')</div><div class="lista-atencao">' + b[1].slice(0, 6).map(function (x) {
      return '<div class="at-item" data-act="abrir" data-id="' + esc(x.id) + '"><span>' + esc(x.titulo) + '</span><span>' + marcaHtml(x.marca) + ' <span class="badge ' + (b[2] === 'verm' ? 'verm' : 'ambar') + '">' + esc(x.data ? fmtDia(x.data) : nomeStatus(x.status)) + '</span></span></div>';
    }).join('') + '</div>';
  });
  if (!tem) h += '<div class="vazio">Nada parado. O fluxo está andando.</div>';
  h += '</div></div>';

  h += '<div class="card" style="margin-bottom:14px"><div class="secao-titulo">Cadência por perfil (semana de domingo a sábado)</div><div class="cad">';
  S.d.cfg.marcas.forEach(function (m) {
    var c = p.cadencia[m.id], pm = p.por_marca[m.id], meta = c.meta || 0;
    var pct = meta ? Math.min(100, Math.round(100 * c.atual.planejadas / meta)) : 0, pct2 = meta ? Math.min(100, Math.round(100 * c.proxima.planejadas / meta)) : 0;
    h += '<div class="cartao m' + m.cor + '"><div class="nome">' + esc(m.nome) + '</div><div class="handle">' + esc(m.handle) + '</div>' +
      '<div class="linha-cad"><span>Esta semana</span><b>' + c.atual.planejadas + (meta ? ' de ' + meta : '') + '</b></div><div class="barra"><i style="width:' + pct + '%"></i></div>' +
      '<div class="linha-cad"><span>Semana que vem</span><b>' + c.proxima.planejadas + (meta ? ' de ' + meta : '') + '</b></div><div class="barra"><i style="width:' + pct2 + '%"></i></div>' +
      '<div class="linha-cad dica"><span>' + pm.ativas + ' em produção</span><span>' + pm.publicadas_30d + ' publicadas em 30 dias</span></div></div>';
  });
  h += '</div></div>';

  h += '<div class="card" style="margin-bottom:14px"><div class="secao-titulo">Fluxo de produção</div><div class="etapas-fluxo">' + S.d.status.filter(function (s) { return s.id !== 'arquivado'; }).map(function (s) {
    return '<button class="etapa-btn" data-act="ir-quadro">' + esc(s.nome) + '<b>' + (ps[s.id] || 0) + '</b></button>';
  }).join('') + '</div></div>';

  h += '<div class="grade g2"><div class="card"><div class="secao-titulo">Tipos de post nos últimos 30 dias</div>';
  var tipos = Object.keys(p.mix_30d), tot = 0; tipos.forEach(function (t) { tot += p.mix_30d[t]; });
  if (!tot) h += '<div class="vazio">Ainda não há posts agendados ou publicados neste período.</div>';
  else h += tipos.map(function (t) { var q = p.mix_30d[t], pc = Math.round(100 * q / tot); return '<div class="mix-linha"><span>' + esc(nomeDe(S.d.cfg.tipos, t) || '(sem tipo)') + '</span><div class="barra"><i style="width:' + pc + '%"></i></div><b>' + pc + '%</b></div>'; }).join('') +
    '<div class="dica" style="margin-top:8px">Posts de venda: <b>' + p.venda_pct + '%</b> (limite ' + S.d.cfg.venda_max_pct + '%)</div>';
  h += '</div><div class="card"><div class="secao-titulo">O que o conteúdo alimenta (30 dias)</div><div class="kpis" style="margin:0">' +
    kpi('Leads do teste grátis', n.leads_intus, 'Intus Fit') + kpi('Leads do CDD', n.leads_cdd, 'formulário do CDD') + kpi('Vendas do CDD', n.vendas_cdd, 'faturas pagas') +
    kpi('Receita do CDD', n.receita_cdd == null ? null : 'R$ ' + num(Math.round(n.receita_cdd)), 'bruto, Eduzz') + '</div>' +
    '<div class="dica" style="margin-top:8px">Mesmos números da Central de atendimento e do painel do CDD. Quando a peça publicada tiver o link e as métricas, dá para comparar.</div></div></div>';
  el.innerHTML = h;
}
function kpi(l, v, s, ir, cor) {
  var vazio = v == null;
  return '<div class="kpi' + (ir ? ' clic' : '') + '"' + (ir ? ' data-act="ir-aba" data-aba="' + ir + '"' : '') + '><div class="v ' + (vazio ? 'vazio' : (cor || '')) + '">' + (vazio ? 'sem dado' : (typeof v === 'number' ? num(v) : esc(v))) + '</div><div class="l">' + esc(l) + '</div><div class="s">' + esc(s || '') + '</div></div>';
}

/* ---------- quadro ---------- */
function filtrar(lista) {
  var f = S.f, q = (f.busca || '').toLowerCase();
  return lista.filter(function (p) {
    if (f.marca && p.marca !== f.marca) return false;
    if (f.tipo && p.tipo !== f.tipo) return false;
    if (f.resp && p.responsavel !== f.resp) return false;
    if (q && (p.titulo + ' ' + (p.gancho || '') + ' ' + (p.etiquetas || []).join(' ')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}
function filtrosHtml(comTipo) {
  var resp = []; S.d.pecas.forEach(function (p) { if (p.responsavel && resp.indexOf(p.responsavel) < 0) resp.push(p.responsavel); });
  return '<div class="filtros"><select data-filtro="marca" aria-label="Perfil">' + opcoes(S.d.cfg.marcas, S.f.marca, 'Todos os perfis') + '</select>' +
    (comTipo ? '<select data-filtro="tipo" aria-label="Tipo de post">' + opcoes(S.d.cfg.tipos, S.f.tipo, 'Todos os tipos') + '</select>' : '') +
    '<select data-filtro="resp" aria-label="Responsável"><option value="">Todos os responsáveis</option>' + resp.map(function (r) { return '<option' + (r === S.f.resp ? ' selected' : '') + '>' + esc(r) + '</option>'; }).join('') + '</select>' +
    '<input type="search" data-filtro="busca" placeholder="Buscar peça" value="' + esc(S.f.busca) + '" aria-label="Buscar">' +
    '<span class="espaco"></span><button class="btn primario" data-act="nova">+ Nova peça</button></div>';
}
function pintarQuadro(el) {
  var pecas = filtrar(S.d.pecas), h = filtrosHtml(true), hoje = hojeStr();
  var lim = new Date(hoje + 'T00:00:00'); lim.setDate(lim.getDate() - 30); var limS = lim.toISOString().slice(0, 10);
  h += '<div class="quadro">';
  S.d.status.forEach(function (s) {
    if (s.id === 'arquivado' && !S.f.todosPub) return;
    var col = pecas.filter(function (p) { return p.status === s.id; });
    if (s.id === 'publicado' && !S.f.todosPub) col = col.filter(function (p) { return (p.publicado_em || p.data || '') >= limS; });
    col.sort(function (a, b) { return (a.data || '9999') + (a.hora || '') < (b.data || '9999') + (b.hora || '') ? -1 : 1; });
    h += '<div class="coluna" data-status="' + s.id + '"><h3><span>' + esc(s.nome) + '</span><span>' + col.length + '</span></h3>' + col.map(cartaoHtml).join('') + '</div>';
  });
  h += '</div><div class="linha"><label class="check-pill"><input type="checkbox" id="ver-todos"' + (S.f.todosPub ? ' checked' : '') + '> Mostrar publicadas antigas e arquivadas</label></div>';
  el.innerHTML = h;
}
function cartaoHtml(p) {
  var i = achar(S.d.status, p.status) ? S.d.status.indexOf(achar(S.d.status, p.status)) : 0;
  var ant = i > 0 ? S.d.status[i - 1] : null, prox = i < S.d.status.length - 2 ? S.d.status[i + 1] : null;
  if (p.status === 'publicado' || p.status === 'arquivado') { ant = p.status === 'publicado' ? S.d.status[i - 1] : null; prox = null; }
  var atrasada = p.data && p.data < hojeStr() && p.status !== 'publicado' && p.status !== 'arquivado';
  return '<div class="kcard ' + corDe(p.marca) + '" draggable="true" data-act="abrir" data-id="' + esc(p.id) + '"><div class="t">' + esc(p.titulo) + '</div><div class="m">' +
    (p.formato ? '<span>' + esc(nomeDe(S.d.cfg.formatos, p.formato)) + '</span>' : '') +
    (p.data ? '<span' + (atrasada ? ' style="color:var(--erro);font-weight:700"' : '') + '>' + fmtDia(p.data) + (p.hora ? ' ' + esc(p.hora) : '') + '</span>' : '') +
    (p.erros ? '<span class="pend e" title="Falta algo para esta etapa">' + p.erros + ' pend.</span>' : '') + (p.avisos ? '<span class="pend a">' + p.avisos + ' aviso</span>' : '') +
    (p.responsavel ? '<span>' + esc(p.responsavel) + '</span>' : '') + '</div>' +
    '<div class="mov">' + (ant ? '<button data-act="mover" data-id="' + esc(p.id) + '" data-para="' + ant.id + '" title="Voltar para ' + esc(ant.nome) + '">‹</button>' : '') +
    (prox ? '<button data-act="mover" data-id="' + esc(p.id) + '" data-para="' + prox.id + '" title="Avançar para ' + esc(prox.nome) + '">› ' + esc(prox.nome) + '</button>' : '') + '</div></div>';

function mover(id, para, forcar) {

function itensDoDia(d) {

  S.d.eventos.forEach(function (e) { var f = e.data_fim || e.data; if (d >= e.data && d <= f) out.push({ t: 'evento', e: e }); });
  out.sort(function (a, b) { return ((a.p || a.e).hora || '99') < ((b.p || b.e).hora || '99') ? -1 : 1; });
  return out;
}

/** Salva os campos na etapa atual e, se a pessoa pediu outra etapa, tenta mover em seguida (assim nada digitado se perde quando a etapa pede mais). */

  var corpo = coletar(), atual = S.ed.p;
  if (!corpo.titulo.trim()) { toast('Dê um título à peça.'); $('#e-titulo').focus(); return; }
  var alvo = statusAlvo || $('#e-status').value;
  corpo.id = atual.id || undefined;
  corpo.status = atual.id ? atual.status : 'ideia';
  var btns = $$('.gaveta-rodape .btn'); btns.forEach(function (b) { b.disabled = true; });
  api('peca_salvar', { peca: corpo }).then(function (r) {
    var id = r.peca.id;
    if (alvo && alvo !== r.peca.status) {
      return api('peca_salvar', { peca: { id: id, status: alvo } }).then(function (r2) { return { r: r2, id: id }; }).catch(function (e) {
        if (e.status === 422 && e.dados) { S.ed = { p: r.peca, pend: e.dados.pendencias || [] }; toast('Salvei os campos, mas a peça ainda não pode ir para ' + nomeStatus(alvo) + '.'); desenharEditor(); return null; }
        throw e;

    }
    return { r: r, id: id };
  }).then(function (x) {

  }).catch(function (e) { falha(e); btns.forEach(function (b) { b.disabled = false; }); });
}

  'of-novo': function () { var b = $('#t-ofertas tbody'); var d = document.createElement('tbody'); d.innerHTML = ofertaLinha({ id: '', nome: '', marca: '', preco: '', link: '', cupom: '', ativo: true, obs: '' }, true); b.appendChild(d.firstChild); },
  'of-del': function (el) { el.closest('tr').remove(); },
  'of-salvar': function () { api('ofertas_salvar', { itens: lerTabela('#t-ofertas') }).then(function () { toast('Ofertas salvas.'); return recarregar(); }).catch(falha); },
  'lk-novo': function () { var b = $('#t-links tbody'); var d = document.createElement('tbody'); d.innerHTML = linkLinha({ id: '', grupo: 'Links', nome: '', url: '', obs: '' }); b.appendChild(d.firstChild); },
  'lk-del': function (el) { el.closest('tr').remove(); },
  'lk-salvar': function () { api('links_salvar', { itens: lerTabela('#t-links') }).then(function () { toast('Links salvos.'); return recarregar(); }).catch(falha); },
  'aj-novo': function (el) { var t = $((el.dataset.t[0] === '#' ? el.dataset.t : '#' + el.dataset.t) + ' tbody'); if (!t) t = $('#aj-marcas tbody'); var mol = t.querySelector('tr');
    if (!mol) { var x = document.createElement('tbody'); x.innerHTML = '<tr><td><input type="text" data-k="nome"></td><td><select data-k="papel">' + opcoes(S.d.papeis, 'apresentador') + '</select></td><td><button class="btn mini perigo" data-act="aj-del">✕</button><input type="hidden" data-k="id" value=""></td></tr>'; t.appendChild(x.firstChild); return; }
    var cl = mol.cloneNode(true); $$('[data-k]', cl).forEach(function (i) { if (i.type === 'checkbox') i.checked = false; else if (i.type !== 'number' && i.tagName !== 'SELECT') i.value = ''; }); t.appendChild(cl); },
  'aj-del': function (el) { var tb = el.closest('tbody'); if (tb.children.length <= 1 && tb.parentNode.id !== 'aj-pessoas') { toast('Precisa ficar pelo menos um.'); return; } el.closest('tr').remove(); },
  'aj-salvar': function () { salvarAjustes(); },
  'aj-restaurar': function () { if (!confirm('Voltar perfis, formatos, tipos, funil, pessoas e prazos ao padrão? As peças não mudam.')) return; api('cfg_restaurar', {}).then(function () { toast('Padrão restaurado.'); return recarregar(); }).catch(falha); }
};
function dialogoDia(d) {
  var h = '<div class="centro" id="dlg-dia"><div class="caixa"><h3>' + diaSem(d) + ', ' + fmtDia(d) + '</h3><div class="linha"><button class="btn primario" data-act="nova" data-d="' + d + '" data-fechar="dlg-dia">+ Peça neste dia</button><button class="btn" data-act="novo-evento" data-d="' + d + '" data-fechar="dlg-dia">+ Evento neste dia</button><button class="btn" data-act="fechar" data-alvo="dlg-dia">Cancelar</button></div></div></div>';
  var x = document.createElement('div'); x.innerHTML = h; document.body.appendChild(x.firstChild);
}
function abrirEvento(id, dia) {
  var e = id ? achar(S.d.eventos, id) : { id: '', titulo: '', tipo: 'gravacao', marca: '', data: dia || hojeStr(), data_fim: '', hora: '', local: '', pessoas: '', notas: '' };
  var h = '<div class="centro" id="dlg-ev"><div class="caixa"><h3>' + (id ? 'Evento' : 'Novo evento') + '</h3>' + campo('Nome', '<input type="text" id="v-titulo" maxlength="120" value="' + esc(e.titulo) + '" placeholder="Ex.: Gravação LDA, Copa Oeste, reunião">') +
    '<div class="f2">' + campo('Tipo', '<select id="v-tipo">' + opcoes(S.d.tipos_evento, e.tipo) + '</select>') + campo('Perfil', '<select id="v-marca">' + opcoes(S.d.cfg.marcas, e.marca, '(geral)') + '</select>') + '</div>' +
    '<div class="f3">' + campo('Dia', '<input type="date" id="v-data" value="' + esc(e.data) + '">') + campo('Até (opcional)', '<input type="date" id="v-fim" value="' + esc(e.data_fim) + '">') + campo('Hora', '<input type="time" id="v-hora" value="' + esc(e.hora) + '">') + '</div>' +
    campo('Local', '<input type="text" id="v-local" maxlength="120" value="' + esc(e.local) + '">') + campo('Quem participa', '<input type="text" id="v-pessoas" maxlength="160" value="' + esc(e.pessoas) + '">') + campo('Notas', '<textarea id="v-notas" rows="3" maxlength="1000">' + esc(e.notas) + '</textarea>') +
    '<div class="linha"><button class="btn primario" data-act="ev-salvar" data-id="' + esc(id || '') + '">Salvar</button>' + (id ? '<button class="btn perigo" data-act="ev-excluir" data-id="' + esc(id) + '">Excluir</button>' : '') + '<button class="btn" data-act="fechar" data-alvo="dlg-ev">Cancelar</button></div></div></div>';
  var x = document.createElement('div'); x.innerHTML = h; document.body.appendChild(x.firstChild);
}
ACOES['ev-salvar'] = function (el) {
  var e = { id: el.dataset.id || undefined, titulo: $('#v-titulo').value, tipo: $('#v-tipo').value, marca: $('#v-marca').value, data: $('#v-data').value, data_fim: $('#v-fim').value, hora: $('#v-hora').value, local: $('#v-local').value, pessoas: $('#v-pessoas').value, notas: $('#v-notas').value };
  api('evento_salvar', { evento: e }).then(function () { var d = $('#dlg-ev'); if (d) d.remove(); return recarregar().then(function () { toast('Evento salvo.'); }); }).catch(falha);
};
ACOES['ev-excluir'] = function (el) { if (!confirm('Excluir este evento?')) return; api('evento_excluir', { id: el.dataset.id }).then(function () { var d = $('#dlg-ev'); if (d) d.remove(); return recarregar().then(function () { toast('Evento excluído.'); }); }).catch(falha); };

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]'); if (!el) {
    var f = $('#gaveta-fundo'); if (f && ev.target === f && f.dataset.fora === '1') fecharEditor(); return;
  }
  var a = ACOES[el.dataset.act]; if (!a) return;
  if (el.dataset.fechar && el.dataset.act !== 'abrir') { var d = $('#' + el.dataset.fechar); if (d) d.remove(); }
  a(el, ev);
});
document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.dataset && t.dataset.filtro) { S.f[t.dataset.filtro] = t.value; pintar(); }
  if (t.id === 'ver-todos') { S.f.todosPub = t.checked; pintar(); }
});
document.addEventListener('input', function (ev) { var t = ev.target; if (t.dataset && t.dataset.filtro === 'busca') { S.f.busca = t.value; var pos = t.selectionStart; var c = $('#conteudo'); pintar(); var n = $('[data-filtro=busca]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } } });
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') { var d = $('.centro'); if (d) d.remove(); else if ($('#gaveta-fundo')) fecharEditor(); } });

S.aba = ABAS.indexOf(ler('cont-aba')) >= 0 ? ler('cont-aba') : 'painel';
iniciar();

</script>
</body>
</html>
